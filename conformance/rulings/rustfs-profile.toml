# The rulings ledger for `conformance run --profile rustfs` against the RustFS preset
# (rustfs/backlog#2757). One row per case the run leaves failed for a reviewed reason; `issue`
# names the review that tolerates the difference, and `expires` is the day the ruling lapses.
#
# Provenance: originally classified from `run --profile rustfs --endpoint <compat-sut>
# --allow-external-fixtures --exclude-slow` on 2026-10-07 against `compat/sut` at the
# rustfs/gateway#1393 preset, then reconciled across `#1418`/`#1464` (35 missing-header rows
# retired), `#1406` (16 in-process-only harness rows removed), and `rustfs/gateway#1631` (6
# now-passing rows retired: c-bucketconfig-0023, c-cors-0012, c-cors-0025, c-location-0002,
# c-sig-0583, c-sig-0584; all remaining rows re-attributed against live `compat-sut` observations).
# Cases the harness itself cannot measure (a pinned `clock.fixed` without `--endpoint-fixed-time`,
# fixtures the external path does not establish, operations the launcher does not register,
# authored HTTP/2 frames, or `IN_PROCESS_ONLY` hook/injected-fault cases) are deliberately not
# ruled here: a ruling is a claim about the target, and those are claims about the harness.
#
# Every row is a claim, not a record: read `conformance/README.md` before adding one.
# Human maintainer sign-off is owed on merge for every row reconciled in rustfs/gateway#1631.

