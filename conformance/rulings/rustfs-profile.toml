# The rulings ledger for `conformance run --profile rustfs` against the RustFS preset
# (rustfs/backlog#2757). One row per case the run leaves failed for a reviewed reason; `issue`
# names the review that tolerates the difference, and `expires` is the day the ruling lapses.
#
# Provenance: the failed set of `run --profile rustfs --endpoint <compat-sut> --allow-external-fixtures
# --exclude-slow` on 2026-10-07 against `compat/sut` at the rustfs/gateway#1393 preset, classified
# by hand against rustfs/backlog#2684, rustfs/gateway#1349 and `docs/rustfs-profile.md`. Cases the
# harness itself cannot measure (a pinned `clock.fixed`, fixtures the external path does not
# establish, operations the launcher does not register, authored HTTP/2 frames) are deliberately
# not ruled here: a ruling is a claim about the target, and those are claims about the harness.
#
# Every row is a claim, not a record: read `conformance/README.md` before adding one.

