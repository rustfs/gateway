# Exact profile layouts; unmapped references retain their default golden.
# ACL reference capture: https://github.com/rustfs/gateway/issues/1436#issuecomment-6117268048
[rustfs]
"goldens/c-acl-0001.xml" = "goldens/rustfs/c-acl-0001.xml"

# Complete RustFS 1.0.5 responses, also served by the native backend and compat-sut.
"goldens/c-bucketconfig-0023.xml" = "goldens/rustfs/c-bucketconfig-0023.xml"
"goldens/c-location-0002.xml" = "goldens/rustfs/c-location-0002.xml"

# Empty bucket configuration responses captured from RustFS 1.0.5.
"goldens/c-bucketconfig-0024.xml" = "goldens/rustfs/c-bucketconfig-0024.xml"
"goldens/c-bucketconfig-0025.xml" = "goldens/rustfs/c-bucketconfig-0025.xml"
"goldens/c-bucketconfig-0026.xml" = "goldens/rustfs/c-bucketconfig-0026.xml"
"goldens/c-bucketconfig-0027.xml" = "goldens/rustfs/c-bucketconfig-0027.xml"

# RustFS 1.0.5 versioning and lifecycle documents read after a successful write.
"goldens/c-bucketconfig-0002.xml" = "goldens/rustfs/c-bucketconfig-0002.xml"
"goldens/c-lifecycle-0008.xml" = "goldens/rustfs/c-lifecycle-0008.xml"
"goldens/c-lifecycle-0038.xml" = "goldens/rustfs/c-lifecycle-0038.xml"

# R10 identifies a RustFS error with RequestId alone.
"goldens/c-cors-0012.xml" = "goldens/rustfs/c-cors-0012.xml"
"goldens/c-cors-0025.xml" = "goldens/rustfs/c-cors-0025.xml"

# RustFS 1.0.5 CORS configuration read after PutBucketCors.
"goldens/c-cors-0002.xml" = "goldens/rustfs/c-cors-0002.xml"
"goldens/c-cors-0003.xml" = "goldens/rustfs/c-cors-0003.xml"
"goldens/c-cors-0004.xml" = "goldens/rustfs/c-cors-0004.xml"
"goldens/c-cors-0005.xml" = "goldens/rustfs/c-cors-0005.xml"
"goldens/c-cors-0009.xml" = "goldens/rustfs/c-cors-0009.xml"

# Tagging reads use the RustFS XML declaration layout.
"goldens/c-tagging-0011.xml" = "goldens/rustfs/c-tagging-0011.xml"
"goldens/c-tagging-0023.xml" = "goldens/rustfs/c-tagging-0023.xml"
