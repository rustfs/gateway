# c-sig-0423 — Presigned URL with unsigned x-amz-* header must be rejected.
#
# Schema dimensions exercised: presigned.unsigned_amz_header (negative), signature.presigned

[case]
id = "c-sig-0423"
schema_version = 1
title = "A presigned request with an unsigned x-amz-copy-source header must be rejected"
rationale = """
P2: Any x-amz-* header present but NOT in SignedHeaders must be rejected. This prevents \
an attacker from appending unsigned semantic headers (x-amz-copy-source, x-amz-acl, \
x-amz-tagging, SSE-C headers) to a presigned request. (S-5)"""
polarity = "negative"
operation = "PutObject"
tags = ["signature", "presigned", "sigv4", "security", "injection"]
timeout_ms = 15000

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/sigv4-query-string-auth.html"
summary = "SignedHeaders defines which headers are covered by the signature."
kind = "aws-doc"

[clock]
fixed = "2026-01-02T03:04:05Z"
request_time = "2026-01-02T03:04:05Z"

[[setup.buckets]]
name = "conf-sig"

[[setup.objects]]
bucket = "conf-sig"
key = "presigned-unsigned-header"
absent = true

[request]
method = "PUT"
target = "/conf-sig/presigned-unsigned-header"
headers = { "content-type" = "application/octet-stream", "x-amz-copy-source" = "conf-sig/other-key" }

[request.sign]
mode = "sigv4_presigned"
service = "s3"
region = "us-east-1"
credential = "valid"
expires = 3600
payload_hash = "computed"
# Note: x-amz-copy-source is NOT in signed_headers

[[request.chunks]]
utf8 = "body"

[expect]
kind = "response"
status = 403
connection_after = "closed"

[expect.error]
code = "AccessDenied"
request_id_present = true
