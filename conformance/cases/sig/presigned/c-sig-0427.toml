# c-sig-0427 — Presigned + STREAMING-AWS4-HMAC-SHA256-PAYLOAD must return NotImplemented.
#
# Schema dimensions exercised: presigned.streaming (negative), signature.presigned

[case]
id = "c-sig-0427"
schema_version = 1
title = "A presigned request with STREAMING-AWS4-HMAC-SHA256-PAYLOAD must return 501"
rationale = """
P4: Presigned + STREAMING-* must return NotImplemented (501), aligned with MinIO. \
Presigned URLs with aws-chunked streaming are not supported because the chunk signature \
chain cannot be verified in the presigned flow."""
polarity = "negative"
operation = "PutObject"
tags = ["signature", "presigned", "sigv4", "security", "streaming"]
timeout_ms = 15000

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/sigv4-query-string-auth.html"
summary = "Presigned URLs use UNSIGNED-PAYLOAD or a real hash, not streaming modes."
kind = "aws-doc"

[clock]
fixed = "2026-01-02T03:04:05Z"
request_time = "2026-01-02T03:04:05Z"

[[setup.buckets]]
name = "conf-sig"

[[setup.objects]]
bucket = "conf-sig"
key = "presigned-streaming"
absent = true

[request]
method = "PUT"
target = "/conf-sig/presigned-streaming"
headers = { "content-type" = "application/octet-stream", "x-amz-content-sha256" = "STREAMING-AWS4-HMAC-SHA256-PAYLOAD", "x-amz-decoded-content-length" = "12" }

[request.sign]
mode = "sigv4_presigned"
service = "s3"
region = "us-east-1"
credential = "valid"
expires = 3600
payload_hash = "literal:STREAMING-AWS4-HMAC-SHA256-PAYLOAD"

[[request.chunks]]
utf8 = "body content"

[expect]
kind = "response"
status = 501
connection_after = "closed"

[expect.error]
code = "NotImplemented"
request_id_present = true
