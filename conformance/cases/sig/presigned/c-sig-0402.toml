# c-sig-0402 — Valid presigned PUT URL with body hash.
#
# Schema dimensions exercised: presigned.put.hash (positive), signature.presigned

[case]
id = "c-sig-0402"
schema_version = 1
title = "A valid presigned PUT URL with matching body hash returns 200"
rationale = """
Presigned PUT URLs must verify the body hash when x-amz-content-sha256 is present and \
signed. This case verifies that a correctly signed presigned PUT with a matching body hash \
is accepted. (s3s#622 baseline)"""
polarity = "positive"
operation = "PutObject"
tags = ["signature", "presigned", "sigv4", "security", "body-hash"]
timeout_ms = 15000

[[case.evidence]]
url = "https://github.com/s3s-project/s3s/pull/622"
summary = "Presigned PUT body hash was silently discarded, allowing body replacement."
kind = "s3s-pr"

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/sigv4-query-string-auth.html"
summary = "AWS documentation for presigned URL authentication."
kind = "aws-doc"

[clock]
fixed = "2026-01-02T03:04:05Z"
request_time = "2026-01-02T03:04:05Z"

[[setup.buckets]]
name = "conf-sig"

[[setup.objects]]
bucket = "conf-sig"
key = "presigned-put"
absent = true

[request]
method = "PUT"
target = "/conf-sig/presigned-put"
headers = { "content-type" = "application/octet-stream" }

[request.sign]
mode = "sigv4_presigned"
service = "s3"
region = "us-east-1"
credential = "valid"
expires = 3600
payload_hash = "computed"

[[request.chunks]]
utf8 = "presigned body content"

[expect]
kind = "response"
status = 200
