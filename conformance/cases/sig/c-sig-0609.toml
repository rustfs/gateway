# c-sig-0609 — query X-Amz-S3session-Token beside a header signature is malformed.

[case]
id = "c-sig-0609"
schema_version = 1
title = "A query X-Amz-S3session-Token paired with a header signature is refused"
rationale = """
The query spelling X-Amz-S3session-Token is valid only on a presigned query signature. Sending it \
in the query string alongside an Authorization header splits the credential across two surfaces \
and must be refused as malformed."""
polarity = "negative"
operation = "GetObject"
tags = ["signature", "sigv4", "security"]
timeout_ms = 10000
quirks = []

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-express-security-iam.html"
summary = "Header-authenticated S3 Express requests carry x-amz-s3session-token in the request headers, not the query."
kind = "aws-doc"

[clock]
fixed = "2026-01-02T03:04:05Z"
request_time = "2026-01-02T03:04:05Z"

[[setup.buckets]]
name = "conf-sig"

[[setup.objects]]
bucket = "conf-sig"
key = "s3express-query-with-header-sig"
body = { utf8 = "protected" }

[request]
method = "GET"
target = "/conf-sig/s3express-query-with-header-sig?X-Amz-S3session-Token=express-token"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 403
connection_after = "open"

[expect.error]
code = "AccessDenied"
request_id_present = true
