# c-sig-0601 — gateway issue #1239.

[case]
id = "c-sig-0601"
schema_version = 1
title = "A header-signed upload covers its payload digest without naming the header twice"
rationale = "The digest is signed as HashedPayload even when SignedHeaders contains only host and the timestamp. A valid upload must reach the handler."
polarity = "positive"
operation = "PutObject"
tags = ["signature", "sigv4", "security"]
timeout_ms = 10000
quirks = []

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/developerguide/sig-v4-header-based-auth.html"
summary = "Header authentication covers the payload declaration through HashedPayload; other semantic headers remain covered."
kind = "aws-doc"

[clock]
fixed = "2026-01-02T03:04:05Z"
request_time = "2026-01-02T03:04:05Z"

[[setup.buckets]]
name = "conf-sig"

[request]
method = "PUT"
target = "/conf-sig/header-payload-line"
body = { utf8 = "payload covered once" }
[request.sign]
mode = "sigv4_header"
credential = "valid"
service = "s3"
region = "us-east-1"
signed_headers = ["host", "x-amz-date"]
payload_hash = "computed"
[expect]
kind = "response"
status = 200

[expect.headers_present]
etag = "*"
x-amz-request-id = "*"
