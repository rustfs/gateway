# c-sig-0591 — a presigned URL past its lifetime is expired, not skewed.

[case]
id = "c-sig-0591"
schema_version = 1
title = "A presigned URL signed two hours ago with a one-hour lifetime is refused as expired"
rationale = """
Once the skew window no longer bounds a presigned URL's age, its lifetime must: a URL used after \
X-Amz-Date plus X-Amz-Expires is refused with the AccessDenied code S3 and MinIO answer for an \
expired request, never admitted and never reported as a clock disagreement."""
polarity = "negative"
operation = "GetObject"
tags = ["signature", "sigv4", "presigned", "security"]
timeout_ms = 10000
quirks = []

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/sigv4-query-string-auth.html"
summary = "AWS measures a SigV4 presigned URL's validity from X-Amz-Date for X-Amz-Expires seconds, at most seven days."
kind = "aws-doc"

[[case.evidence]]
url = "https://github.com/rustfs/gateway/issues/723"
summary = "A MinIO black-box probe answered 403 AccessDenied for a presigned GET signed two hours earlier with a one-hour lifetime."
kind = "observed"

[clock]
fixed = "2026-01-02T05:04:05Z"
request_time = "2026-01-02T03:04:05Z"

[[setup.buckets]]
name = "conf-sig"

[[setup.objects]]
bucket = "conf-sig"
key = "presigned-lifetime.txt"
content_type = "text/plain"
body = { utf8 = "expired" }

[request]
method = "GET"
target = "/conf-sig/presigned-lifetime.txt"
headers = {}
sign = { mode = "presigned_v4", service = "s3", region = "us-east-1", credential = "valid", expires_s = 3600 }

[expect]
kind = "response"
status = 403
connection_after = "open"

[expect.error]
code = "AccessDenied"
