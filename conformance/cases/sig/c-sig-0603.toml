# c-sig-0603 — gateway issue #1239.

[case]
id = "c-sig-0603"
schema_version = 1
title = "Changing an unlisted payload declaration invalidates the header signature"
rationale = "Changing the declaration from the signed empty digest to UNSIGNED-PAYLOAD changes HashedPayload. A declaration outside the header list is still inside the HMAC."
polarity = "negative"
operation = "ListBuckets"
tags = ["signature", "sigv4", "security"]
timeout_ms = 10000
quirks = []

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/developerguide/sig-v4-header-based-auth.html"
summary = "Header authentication covers the payload declaration through HashedPayload; other semantic headers remain covered."
kind = "aws-doc"

[clock]
fixed = "2026-01-02T03:04:05Z"
request_time = "2026-01-02T03:04:05Z"

[request]
method = "GET"
target = "/"

[request.sign]
mode = "sigv4_header"
credential = "valid"
service = "s3"
region = "us-east-1"
signed_headers = ["host", "x-amz-date"]
payload_hash = "literal"
payload_hash_literal = "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"

[request.sign.tamper]
component = "payload_hash"
new_value = "UNSIGNED-PAYLOAD"
[expect]
kind = "response"
status = 403
[expect.error]
code = "SignatureDoesNotMatch"
request_id_present = true
