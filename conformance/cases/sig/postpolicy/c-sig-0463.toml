# c-sig-0463 — POST with undeclared field must be rejected.
#
# Schema dimensions exercised: post_policy.undeclared_field (negative), signature.post_policy

[case]
id = "c-sig-0463"
schema_version = 1
title = "A POST with a policy-undeclared x-amz-acl field must be rejected"
rationale = """
Q2: Except for the fixed exempt list, any form field not covered by a policy condition \
must be rejected. This prevents an attacker from adding x-amz-acl: public-read to a \
form when the policy didn't authorize it. (s3s#510/#608)"""
polarity = "negative"
operation = "PostObject"
tags = ["signature", "post-policy", "sigv4", "security", "field-enforcement"]
timeout_ms = 15000

[[case.evidence]]
url = "https://github.com/s3s-project/s3s/pull/510"
summary = "Undeclared form fields in POST were not rejected."
kind = "s3s-pr"

[[case.evidence]]
url = "https://github.com/s3s-project/s3s/pull/608"
summary = "POST policy field enforcement improvements."
kind = "s3s-pr"

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/sigv4-HTTPPOSTConstructPolicy.html"
summary = "Every submitted form field must be covered by a policy condition."
kind = "aws-doc"

[clock]
fixed = "2026-01-02T03:04:05Z"
request_time = "2026-01-02T03:04:05Z"

[[setup.buckets]]
name = "conf-sig"

[request]
method = "POST"
target = "/conf-sig"
content_type = "multipart/form-data"

[request.form]
key = "uploads/test"
bucket = "conf-sig"
success_action_status = "201"
x-amz-algorithm = "AWS4-HMAC-SHA256"
x-amz-credential = "AKIAIOSFODNN7EXAMPLE/20260102/us-east-1/s3/aws4_request"
x-amz-date = "20260102T030405Z"
# This field is NOT in the policy conditions!
x-amz-acl = "public-read"

[request.form.policy]
expiration = "2026-01-02T04:04:05Z"
conditions = [
    ["eq", "$bucket", "conf-sig"],
    ["starts-with", "$key", "uploads/"],
    ["eq", "$success_action_status", "201"]
]

[request.sign]
mode = "post_policy"
credential = "valid"

[request.body]
utf8 = "body"

[expect]
kind = "response"
status = 403
connection_after = "closed"

[expect.error]
code = "AccessDenied"
request_id_present = true
