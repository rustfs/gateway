# c-sig-0440 — Valid POST Object with policy and SigV4 signature.
#
# Schema dimensions exercised: post_policy.valid (positive), signature.post_policy

[case]
id = "c-sig-0440"
schema_version = 1
title = "A valid POST Object with policy and SigV4 signature returns 204"
rationale = """
POST Object is the browser-upload flow. A correctly formed POST with a valid policy \
and SigV4 signature must be accepted. This case verifies the basic POST policy flow. \
(s3s#415/#470)"""
polarity = "positive"
operation = "PostObject"
tags = ["signature", "post-policy", "sigv4", "security"]
timeout_ms = 15000

[[case.evidence]]
url = "https://github.com/s3s-project/s3s/pull/415"
summary = "POST Object was split into a separate route with policy validation."
kind = "s3s-pr"

[[case.evidence]]
url = "https://github.com/s3s-project/s3s/pull/470"
summary = "POST Object policy validation implementation."
kind = "s3s-pr"

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/RESTObjectPOST.html"
summary = "AWS documentation for POST Object."
kind = "aws-doc"

[clock]
fixed = "2026-01-02T03:04:05Z"
request_time = "2026-01-02T03:04:05Z"

[[setup.buckets]]
name = "conf-sig"

[request]
method = "POST"
target = "/conf-sig"
content_type = "multipart/form-data"

[request.form]
key = "uploads/post-policy-test"
bucket = "conf-sig"
success_action_status = "201"
x-amz-algorithm = "AWS4-HMAC-SHA256"
x-amz-credential = "AKIAIOSFODNN7EXAMPLE/20260102/us-east-1/s3/aws4_request"
x-amz-date = "20260102T030405Z"

[request.form.policy]
expiration = "2026-01-02T04:04:05Z"
conditions = [
    ["eq", "$bucket", "conf-sig"],
    ["starts-with", "$key", "uploads/"],
    ["eq", "$success_action_status", "201"]
]

[request.sign]
mode = "post_policy"
credential = "valid"

[request.body]
utf8 = "post policy body"

[expect]
kind = "response"
status = 201

[expect.body]
contains_utf8 = ["<Key>uploads/post-policy-test</Key>"]
