# c-sig-0478 — POST with javascript: success_action_redirect must be rejected.
#
# Schema dimensions exercised: post_policy.redirect_scheme (negative), signature.post_policy

[case]
id = "c-sig-0478"
schema_version = 1
title = "A POST with javascript: success_action_redirect must be rejected"
rationale = """
Q7: success_action_redirect must only allow http:// and https:// schemes. A javascript: \
URL in the Location header would execute arbitrary code in the user's browser. Validation \
failure returns 400 and never falls back to success_action_status. (s3s#425)"""
polarity = "negative"
operation = "PostObject"
tags = ["signature", "post-policy", "sigv4", "security", "redirect", "xss"]
timeout_ms = 15000

[[case.evidence]]
url = "https://github.com/s3s-project/s3s/pull/425"
summary = "success_action_redirect allowed javascript: URLs, enabling XSS."
kind = "s3s-pr"

[[case.evidence]]
url = "https://github.com/s3s-project/s3s/pull/467"
summary = "Redirect URL validation improvements."
kind = "s3s-pr"

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/RESTObjectPOST.html"
summary = "success_action_redirect must be a valid HTTP(S) URL."
kind = "aws-doc"

[clock]
fixed = "2026-01-02T03:04:05Z"
request_time = "2026-01-02T03:04:05Z"

[[setup.buckets]]
name = "conf-sig"

[request]
method = "POST"
target = "/conf-sig"
content_type = "multipart/form-data"

[request.form]
key = "uploads/redirect-test"
bucket = "conf-sig"
success_action_redirect = "javascript:alert(1)"
x-amz-algorithm = "AWS4-HMAC-SHA256"
x-amz-credential = "AKIAIOSFODNN7EXAMPLE/20260102/us-east-1/s3/aws4_request"
x-amz-date = "20260102T030405Z"

[request.form.policy]
expiration = "2026-01-02T04:04:05Z"
conditions = [
    ["eq", "$bucket", "conf-sig"],
    ["starts-with", "$key", "uploads/"],
    ["eq", "$success_action_redirect", "javascript:alert(1)"]
]

[request.sign]
mode = "post_policy"
credential = "valid"

[request.body]
utf8 = "body"

[expect]
kind = "response"
status = 400
connection_after = "closed"

# No Location header must be present.
[expect.headers_absent]
location = true

# Must NOT fall back to success_action_status.
[expect.not_status]
status = 201
