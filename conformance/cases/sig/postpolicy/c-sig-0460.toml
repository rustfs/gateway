# c-sig-0460 — POST with path traversal in filename must be rejected.
#
# Schema dimensions exercised: post_policy.filename_traversal (negative), signature.post_policy

[case]
id = "c-sig-0460"
schema_version = 1
title = "A POST with path traversal in ${filename} must be sanitized or rejected"
rationale = """
Q1: ${filename} substitution must sanitize the filename (strip path separators, .., NUL, \
control characters). After substitution, the final key must be re-checked against all key \
conditions. This prevents a policy specifying starts-with $key uploads/ from being bypassed \
by filename="../../victim/obj". (S-11)"""
polarity = "negative"
operation = "PostObject"
tags = ["signature", "post-policy", "sigv4", "security", "path-traversal"]
timeout_ms = 15000

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/sigv4-HTTPPOSTConstructPolicy.html"
summary = "The ${filename} variable is replaced with the uploaded file's name."
kind = "aws-doc"

[clock]
fixed = "2026-01-02T03:04:05Z"
request_time = "2026-01-02T03:04:05Z"

[[setup.buckets]]
name = "conf-sig"

[request]
method = "POST"
target = "/conf-sig"
content_type = "multipart/form-data"

[request.form]
key = "uploads/${filename}"
bucket = "conf-sig"
success_action_status = "201"
x-amz-algorithm = "AWS4-HMAC-SHA256"
x-amz-credential = "AKIAIOSFODNN7EXAMPLE/20260102/us-east-1/s3/aws4_request"
x-amz-date = "20260102T030405Z"

[request.form.policy]
expiration = "2026-01-02T04:04:05Z"
conditions = [
    ["eq", "$bucket", "conf-sig"],
    ["starts-with", "$key", "uploads/"],
    ["eq", "$success_action_status", "201"]
]

[request.sign]
mode = "post_policy"
credential = "valid"

# The filename contains path traversal.
[request.file]
filename = "../../victim/obj"
content_type = "application/octet-stream"
body = "malicious content"

[expect]
kind = "response"
status = 403
connection_after = "closed"

[expect.error]
code = "AccessDenied"
request_id_present = true

# The object must NOT be written outside uploads/.
[expect.object]
bucket = "conf-sig"
key = "victim/obj"
absent = true
