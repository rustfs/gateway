# c-sig-0582 — a real SigV2 header signature reaches the assembled service.

[case]
id = "c-sig-0582"
schema_version = 1
title = "A valid SigV2 header request reaches the registered handler"
rationale = "A 200 from an operation that refuses anonymous callers proves the runner produced a SigV2 signature the real floor and authenticator accepted; a pure signer test cannot establish that wiring."
polarity = "positive"
operation = "ListBuckets"
tags = ["signature", "sigv2", "security"]
timeout_ms = 10000
quirks = []

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/RESTAuthentication.html"
summary = "S3 Signature Version 2 sends standard-base64 HMAC-SHA1 in an Authorization header over the canonical request fields."
kind = "aws-doc"

[clock]
fixed = "2026-01-02T03:04:05Z"
request_time = "2026-01-02T03:04:05Z"

[request]
method = "GET"
target = "/"
headers = { "date" = "Fri, 02 Jan 2026 03:04:05 GMT" }
sign = { mode = "sigv2_header", credential = "valid" }

[expect]
kind = "response"
status = 200
connection_after = "open"

[expect.headers_present]
"content-type" = "application/xml"

[expect.body]
contains_utf8 = ["<ListAllMyBucketsResult"]
