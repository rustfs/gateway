# c-sig-0608 — x-amz-s3session-token requires the s3express signing scope, refusing s3.

[case]
id = "c-sig-0608"
schema_version = 1
title = "A request carrying x-amz-s3session-token signed with service s3 is refused"
rationale = """
When a request presents x-amz-s3session-token, the security floor seals the expected credential \
scope service to s3express. A signature scoped to s3 must be refused at the scope cross-check so \
that ordinary S3 signatures cannot be replayed with an S3 Express session token."""
polarity = "negative"
operation = "GetObject"
tags = ["signature", "sigv4", "security"]
timeout_ms = 10000
quirks = []

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-express-security-iam.html"
summary = "Requests authenticated with an S3 Express session token must sign under the s3express service scope."
kind = "aws-doc"

[clock]
fixed = "2026-01-02T03:04:05Z"
request_time = "2026-01-02T03:04:05Z"

[[setup.buckets]]
name = "conf-sig"

[[setup.objects]]
bucket = "conf-sig"
key = "s3express-wrong-scope"
body = { utf8 = "protected" }

[request]
method = "GET"
target = "/conf-sig/s3express-wrong-scope"
headers = { "x-amz-s3session-token" = "express-token" }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 400
connection_after = "open"

[expect.error]
code = "AuthorizationHeaderMalformed"
request_id_present = true
