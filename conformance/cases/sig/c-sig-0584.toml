# c-sig-0584 — a real SigV2 request naming an unknown access key is refused uniformly.

[case]
id = "c-sig-0584"
schema_version = 1
title = "An unknown SigV2 access key cannot become anonymous"
rationale = "This is the unknown-key control for c-sig-0583: both requests must produce the same public refusal shape even though one key exists, and neither may reach the anonymously forbidden handler."
polarity = "negative"
operation = "ListBuckets"
tags = ["signature", "sigv2", "security"]
timeout_ms = 10000
quirks = []

[[case.evidence]]
url = "https://github.com/rustfs/rustfs/security/advisories/GHSA-3p3x-734c-h5vx"
summary = "A uniform authentication failure prevents callers from using the response to enumerate configured access keys."
kind = "other"

[clock]
fixed = "2026-01-02T03:04:05Z"
request_time = "2026-01-02T03:04:05Z"

[request]
method = "GET"
target = "/"
headers = { "date" = "Fri, 02 Jan 2026 03:04:05 GMT" }
sign = { mode = "sigv2_header", credential = "unknown_access_key" }

[expect]
kind = "response"
status = 403
connection_after = "open"

[expect.error]
code = "InvalidAccessKeyId"
request_id_present = true

[expect.headers_present]
"content-type" = "application/xml"

[expect.body]
redact = ["RequestId", "HostId"]
not_contains_utf8 = ["AKIAI44QH8DHBEXAMPLE", "StringToSign", "SignatureProvided"]
