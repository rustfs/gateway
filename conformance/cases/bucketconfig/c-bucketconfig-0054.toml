[case]
id = "c-bucketconfig-0054"
schema_version = 3
title = "A policy body that is valid JSON but not an object is refused"
rationale = """
A policy is a document with a version and a statement list. A JSON array is well formed and is not one, and storing it would put a value in the policy slot that no evaluator can read. The code is the same MalformedPolicy as every other policy refusal, deliberately: a finer code would tell a caller which of the checks it tripped, which is the disclosure the constant messages exist to prevent moved into the Code element."""
polarity = "negative"
operation = "PutBucketPolicy"
tags = ["bucketconfig", "error-shape", "security"]
timeout_ms = 10000
quirks = ["q-pol-0008"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutBucketPolicy.html"
summary = "The write reference documents a JSON policy body, the Content-MD5 header and MalformedPolicy as the refusal."
kind = "aws-doc"


[[setup.buckets]]
name = "conf-bucketconfig"
[request]
method = "PUT"
target = "/conf-bucketconfig?policy"
headers = { "content-type" = "application/json" }
content_md5 = "computed"
body = { utf8 = '["not","a","policy"]' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 400
connection_after = "open"

[expect.error]
code = "MalformedPolicy"
request_id_present = true
