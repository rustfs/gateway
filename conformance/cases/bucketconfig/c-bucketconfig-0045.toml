[case]
id = "c-bucketconfig-0045"
schema_version = 3
title = "A Payer outside the documented pair is refused"
rationale = """
The payer is a required member, so an unknown value has no reading of the document to fall back to — unlike an unknown notification event, which is stored. The refusal is InvalidArgument rather than MalformedXML because the document is well formed and the value is the problem."""
polarity = "negative"
operation = "PutBucketRequestPayment"
tags = ["bucketconfig", "xml", "error-shape"]
timeout_ms = 10000
quirks = ["q-rqp-0002"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutBucketRequestPayment.html"
summary = "The write reference declares the payer as required with two valid values and documents Content-MD5."
kind = "aws-doc"


[[setup.buckets]]
name = "conf-bucketconfig"
[request]
method = "PUT"
target = "/conf-bucketconfig?requestPayment"
headers = { "content-type" = "application/xml" }
content_md5 = "computed"
body = { utf8 = '<RequestPaymentConfiguration><Payer>Nobody</Payer></RequestPaymentConfiguration>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 400
connection_after = "open"

[expect.error]
code = "InvalidArgument"
request_id_present = true
