[case]
id = "c-bucketconfig-0056"
schema_version = 1
title = "A policy read on a bucket that does not exist is NoSuchBucket, not the family 404"
rationale = """
The bucket is resolved before the subresource, so a missing bucket and a bucket with no policy are two different answers. Collapsing them would tell a caller tearing down configuration that the bucket still exists when it does not, or the reverse."""
polarity = "negative"
operation = "GetBucketPolicy"
tags = ["bucketconfig", "error-shape", "routing"]
timeout_ms = 10000
quirks = []

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_GetBucketPolicy.html"
summary = "The read reference documents a JSON policy document as the response body and NoSuchBucketPolicy as the unconfigured error."
kind = "aws-doc"


[[setup.buckets]]
name = "conf-bucketconfig-absent"
absent = true
[request]
method = "GET"
target = "/conf-bucketconfig-absent?policy"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 404
connection_after = "open"

[expect.error]
code = "NoSuchBucket"
request_id_present = true
