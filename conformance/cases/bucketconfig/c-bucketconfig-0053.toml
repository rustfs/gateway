[case]
id = "c-bucketconfig-0053"
schema_version = 3
title = "A policy nested past the depth limit is refused rather than crashing"
rationale = """
The depth is counted in a loop and never by recursion, so the limit is a refusal instead of a stack overflow. A recursive validator would be the denial of service the limit exists to prevent, and the observation that separates the two is that the connection stays open and the answer is an error document."""
polarity = "negative"
operation = "PutBucketPolicy"
tags = ["bucketconfig", "dos", "security"]
timeout_ms = 10000
quirks = ["q-pol-0007"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/userguide/bucket-policies.html"
summary = "The bucket-policy guide states a 20 KB size limit for a bucket policy document."
kind = "aws-doc"

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutBucketPolicy.html"
summary = "The write reference documents a JSON policy body, the Content-MD5 header and MalformedPolicy as the refusal."
kind = "aws-doc"


[[setup.buckets]]
name = "conf-bucketconfig"
[request]
method = "PUT"
target = "/conf-bucketconfig?policy"
headers = { "content-type" = "application/json" }
