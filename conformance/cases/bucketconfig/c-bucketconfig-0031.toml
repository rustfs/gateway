[case]
id = "c-bucketconfig-0031"
schema_version = 1
title = "A bucket with no public-access block answers 404 NoSuchPublicAccessBlockConfiguration"
rationale = """
The third distinct 404 literal. The three are not interchangeable and this is the one whose confusion is most dangerous: a client that reads the wrong code may conclude public access is blocked when nothing is blocking it."""
polarity = "negative"
operation = "GetPublicAccessBlock"
tags = ["bucketconfig", "error-shape", "security"]
timeout_ms = 10000
quirks = ["q-pab-0001"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_GetPublicAccessBlock.html"
summary = "The read reference documents NoSuchPublicAccessBlockConfiguration for a bucket with no block."
kind = "aws-doc"


[[setup.buckets]]
name = "conf-bucketconfig"
[request]
method = "GET"
target = "/conf-bucketconfig?publicAccessBlock"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 404
connection_after = "open"

[expect.error]
code = "NoSuchPublicAccessBlockConfiguration"
request_id_present = true
