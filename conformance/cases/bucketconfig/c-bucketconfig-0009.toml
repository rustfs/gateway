[case]
id = "c-bucketconfig-0009"
schema_version = 3
title = "A logging destination reads back inside a LoggingEnabled element"
rationale = """
The presence of the LoggingEnabled child is the whole difference between logging and not logging, and c-bucketconfig-0026 is the same root without it. Byte comparison also pins the element order, which the read reference fixes as target bucket before prefix, and the empty <TargetGrants> wrapper a document with no grants carries — the wrapper is written whether or not the list has entries, which is the same rule the operation-level lists follow and the reason a wrapped list is distinguishable from an absent one at all. c-bucketconfig-0058 is the same document with a grant in it."""
polarity = "positive"
operation = "GetBucketLogging"
tags = ["bucketconfig", "xml", "wire-bytes"]
timeout_ms = 10000
quirks = ["q-log-0001", "q-log-0003"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_GetBucketLogging.html"
summary = "The read reference shows the logging element as absent when a bucket is not logging."
kind = "aws-doc"


[[setup.buckets]]
name = "conf-bucketconfig"
[[exchanges]]
name = "write"

[exchanges.request]
method = "PUT"
target = "/conf-bucketconfig?logging"
headers = { "content-type" = "application/xml" }
content_md5 = "computed"
body = { utf8 = '<BucketLoggingStatus><LoggingEnabled><TargetBucket>conf-log-target</TargetBucket><TargetPrefix>access/</TargetPrefix></LoggingEnabled></BucketLoggingStatus>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[[exchanges]]
name = "read-back"

[exchanges.request]
method = "GET"
target = "/conf-bucketconfig?logging"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[exchanges.expect.body]
golden = "goldens/c-bucketconfig-0009.xml"

