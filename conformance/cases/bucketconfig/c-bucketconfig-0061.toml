[case]
id = "c-bucketconfig-0061"
schema_version = 1
title = "An unknown public-access setting is refused without replacing the stored block"
rationale = """
The four switches are the last line of defence against a bucket being made public, so a write carrying a setting this release does not know must fail rather than return 200 for a switch nobody stored. The refused write also turns every known switch off: the read-back still shows them on, which proves the refusal happened before anything replaced the configuration established first. The accepted twin without the unknown setting is c-bucketconfig-0020."""
polarity = "negative"
operation = "PutPublicAccessBlock"
tags = ["bucketconfig", "xml", "security"]
timeout_ms = 10000
quirks = ["q-pab-0005"]

[[case.evidence]]
url = "https://github.com/rustfs/gateway/blob/50adc72e/docs/adr/ADR-0007-ext-field-codec.md"
summary = "Security request configuration uses the allow-registered policy, so an unregistered element is refused while persisted reads keep a separate policy."
kind = "other"

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutPublicAccessBlock.html"
summary = "The write reference declares exactly four optional boolean settings in the configuration document."
kind = "aws-doc"

[[setup.buckets]]
name = "conf-bucketconfig"

[[exchanges]]
name = "establish-known-block"

[exchanges.request]
method = "PUT"
target = "/conf-bucketconfig?publicAccessBlock"
headers = { "content-md5" = "njdlwnEoAxGSpOozjhzsJQ==", "content-type" = "application/xml" }
body = { utf8 = '<PublicAccessBlockConfiguration><BlockPublicAcls>true</BlockPublicAcls><IgnorePublicAcls>true</IgnorePublicAcls><BlockPublicPolicy>true</BlockPublicPolicy><RestrictPublicBuckets>true</RestrictPublicBuckets></PublicAccessBlockConfiguration>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[[exchanges]]
name = "put-with-unknown-setting"

[exchanges.request]
method = "PUT"
target = "/conf-bucketconfig?publicAccessBlock"
headers = { "content-md5" = "HMfI+Af/vMTo7zsJF6gsLQ==", "content-type" = "application/xml" }
body = { utf8 = '<PublicAccessBlockConfiguration><BlockPublicAcls>false</BlockPublicAcls><IgnorePublicAcls>false</IgnorePublicAcls><BlockPublicPolicy>false</BlockPublicPolicy><RestrictPublicBuckets>false</RestrictPublicBuckets><FutureSetting>true</FutureSetting></PublicAccessBlockConfiguration>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 400
connection_after = "open"

[exchanges.expect.error]
code = "MalformedXML"
request_id_present = true

[[exchanges]]
name = "read-back"

[exchanges.request]
method = "GET"
target = "/conf-bucketconfig?publicAccessBlock"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[exchanges.expect.body]
contains_utf8 = ["<BlockPublicAcls>true</BlockPublicAcls>", "<RestrictPublicBuckets>true</RestrictPublicBuckets>"]
not_contains_utf8 = ["FutureSetting", "false"]
