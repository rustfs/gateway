[case]
id = "c-bucketconfig-0039"
schema_version = 1
title = "A policy write with neither Content-MD5 nor a checksum header is refused"
rationale = """
The same requirement as its five siblings, on the one body in the band that decides who may read the bucket. An access-control document arriving without an integrity claim is exactly the one that must not be stored on the strength of hope."""
polarity = "negative"
operation = "PutBucketPolicy"
tags = ["bucketconfig", "checksum", "error-shape", "security"]
timeout_ms = 10000
quirks = ["q-pol-0006"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutBucketPolicy.html"
summary = "The write reference documents a JSON policy body, the Content-MD5 header and MalformedPolicy as the refusal."
kind = "aws-doc"


[[setup.buckets]]
name = "conf-bucketconfig"
[request]
method = "PUT"
target = "/conf-bucketconfig?policy"
headers = { "content-type" = "application/json" }
body = { utf8 = '{"Version":"2012-10-17","Statement":[{"Sid":"one","Effect":"Allow","Principal":{"AWS":"arn:aws:iam::111122223333:root"},"Action":"s3:GetObject","Resource":"arn:aws:s3:::conf-bucketconfig/*"}]}' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 400
connection_after = "open"

[expect.error]
code = "InvalidRequest"
request_id_present = true
