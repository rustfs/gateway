[case]
id = "c-bucketconfig-0057"
schema_version = 3
title = "A policy body that is not UTF-8 is refused, and nothing panics"
rationale = """
This is the decoder's whole contribution to the JSON payload, and the only refusal it is capable of making: the bytes are text or they are not. Everything else about a policy — whether it parses, how deep it nests, how large it is — is asked afterwards by the shared validator, because MalformedPolicy is not a code a generated decoder can name and the decoder has no parameter that could carry one. Worth a case of its own because the refusal is a branch nothing else in the corpus reaches: every other policy case sends text, so an implementation that lossily replaced invalid bytes instead of refusing them would store a policy the caller never wrote and pass every one of them. The connection staying open is half the observation: a decoder that panicked on the input would drop it."""
polarity = "negative"
operation = "PutBucketPolicy"
tags = ["bucketconfig", "error-shape", "security", "dos"]
timeout_ms = 10000
quirks = ["q-pol-0001"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutBucketPolicy.html"
summary = "The operation documents the request body as a JSON policy document, and JSON is defined over Unicode text rather than over arbitrary bytes."
kind = "aws-doc"


[[setup.buckets]]
name = "conf-bucketconfig"
[request]
method = "PUT"
target = "/conf-bucketconfig?policy"
headers = { "content-type" = "application/json" }
content_md5 = "computed"
body = { hex = "7b2256657273696f6e223a22ff32303132223a7d" }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 400
connection_after = "open"

[expect.error]
code = "MalformedPolicy"
request_id_present = true
