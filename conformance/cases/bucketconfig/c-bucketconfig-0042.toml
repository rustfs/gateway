[case]
id = "c-bucketconfig-0042"
schema_version = 1
title = "A notification write with no integrity header is not refused"
rationale = """
The second exempt write. Its retired v1 predecessor did carry the requirement, which is precisely why an implementation is likely to apply it here by analogy and why the exemption needs an observation of its own."""
polarity = "negative"
operation = "PutBucketNotificationConfiguration"
tags = ["bucketconfig", "checksum"]
timeout_ms = 10000
quirks = ["q-ntf-0003"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutBucketNotificationConfiguration.html"
summary = "The write reference shows the three destination lists and the event list as flattened siblings, and lists no Content-MD5 header."
kind = "aws-doc"


[[setup.buckets]]
name = "conf-bucketconfig"
[request]
method = "PUT"
target = "/conf-bucketconfig?notification"
headers = { "content-type" = "application/xml" }
body = { utf8 = '<NotificationConfiguration><TopicConfiguration><Id>topic-one</Id><Topic>arn:aws:sns:us-east-1:111122223333:events</Topic><Event>s3:ObjectCreated:*</Event><Event>s3:ObjectRemoved:*</Event></TopicConfiguration><QueueConfiguration><Id>queue-one</Id><Queue>arn:aws:sqs:us-east-1:111122223333:events</Queue><Event>s3:ObjectCreated:Put</Event><Filter><S3Key><FilterRule><Name>prefix</Name><Value>images/</Value></FilterRule><FilterRule><Name>suffix</Name><Value>.jpg</Value></FilterRule></S3Key></Filter></QueueConfiguration><CloudFunctionConfiguration><Id>fn-one</Id><CloudFunction>arn:aws:lambda:us-east-1:111122223333:function:thumbnail</CloudFunction><Event>s3:ObjectCreated:Post</Event></CloudFunctionConfiguration></NotificationConfiguration>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 200
connection_after = "open"
