[case]
id = "c-bucketconfig-0052"
schema_version = 3
title = "A policy body over the documented 20 KB ceiling is refused"
rationale = """
The ceiling is checked against the raw body before anything parses it, so the refusal costs a length comparison rather than a parse. Without it the body size a caller may make the gateway hold is unbounded."""
polarity = "negative"
operation = "PutBucketPolicy"
tags = ["bucketconfig", "dos", "security"]
timeout_ms = 10000
quirks = ["q-pol-0007"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/userguide/bucket-policies.html"
summary = "The bucket-policy guide states a 20 KB size limit for a bucket policy document."
kind = "aws-doc"

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutBucketPolicy.html"
summary = "The write reference documents a JSON policy body, the Content-MD5 header and MalformedPolicy as the refusal."
kind = "aws-doc"


[[setup.buckets]]
name = "conf-bucketconfig"
[request]
method = "PUT"
target = "/conf-bucketconfig?policy"
headers = { "content-type" = "application/json" }
content_md5 = "computed"
body = { utf8 = '{"Version":"2012-10-17","Sid":""}' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 400
connection_after = "open"

[expect.error]
code = "MalformedPolicy"
request_id_present = true
