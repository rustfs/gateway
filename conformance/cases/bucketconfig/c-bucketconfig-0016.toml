[case]
id = "c-bucketconfig-0016"
schema_version = 3
title = "A valid JSON policy carrying Content-MD5 is accepted"
rationale = """
The policy write is the family's one access-control surface, and the one whose body is JSON rather than XML. The integrity claim matters more here than anywhere else in the band: the body being written decides who may read the bucket, so a truncated one must not be stored. The refusal without the header is c-bucketconfig-0039."""
polarity = "positive"
operation = "PutBucketPolicy"
tags = ["bucketconfig", "checksum", "security"]
timeout_ms = 10000
quirks = ["q-pol-0001", "q-pol-0006"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutBucketPolicy.html"
summary = "The write reference documents a JSON policy body, the Content-MD5 header and MalformedPolicy as the refusal."
kind = "aws-doc"


[[setup.buckets]]
name = "conf-bucketconfig"
[request]
method = "PUT"
target = "/conf-bucketconfig?policy"
headers = { "content-type" = "application/json" }
content_md5 = "computed"
body = { utf8 = '{"Version":"2012-10-17","Statement":[{"Sid":"one","Effect":"Allow","Principal":{"AWS":"arn:aws:iam::111122223333:root"},"Action":"s3:GetObject","Resource":"arn:aws:s3:::conf-bucketconfig/*"}]}' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 200
connection_after = "open"
