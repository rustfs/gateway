[case]
id = "c-bucketconfig-0014"
schema_version = 3
title = "A whole-site redirect with no document members is accepted"
rationale = """
The other side of the exclusion c-bucketconfig-0049 asserts: RedirectAllRequestsTo alone is a complete and legal website configuration. Without this half, an implementation that refused every document carrying the element would still pass the refusal case."""
polarity = "positive"
operation = "PutBucketWebsite"
tags = ["bucketconfig", "xml"]
timeout_ms = 10000
quirks = ["q-web-0003"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutBucketWebsite.html"
summary = "The write reference documents the wrapped routing rules, the redirect exclusion and the Content-MD5 header."
kind = "aws-doc"


[[setup.buckets]]
name = "conf-bucketconfig"
[request]
method = "PUT"
target = "/conf-bucketconfig?website"
headers = { "content-type" = "application/xml" }
content_md5 = "computed"
body = { utf8 = '<WebsiteConfiguration><RedirectAllRequestsTo><HostName>example.com</HostName><Protocol>https</Protocol></RedirectAllRequestsTo></WebsiteConfiguration>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 200
connection_after = "open"
