[case]
id = "c-bucketconfig-0017"
schema_version = 3
title = "A stored policy reads back as application/json, byte for byte"
rationale = """
The only success body in the S3 surface that is not XML. Two things are asserted and both matter: the content type, because a client parses on it, and the bytes, because the read is documented to hand back the document that was written — a gateway that parsed and re-serialised would return a policy the client cannot compare with the one it stored, and comparison is how a caller verifies an access-control change landed."""
polarity = "positive"
operation = "GetBucketPolicy"
tags = ["bucketconfig", "wire-bytes", "security"]
timeout_ms = 10000
quirks = ["q-pol-0001", "q-pol-0003"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_GetBucketPolicy.html"
summary = "The read reference documents a JSON policy document as the response body and NoSuchBucketPolicy as the unconfigured error."
kind = "aws-doc"

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutBucketPolicy.html"
summary = "The write reference documents a JSON policy body, the Content-MD5 header and MalformedPolicy as the refusal."
kind = "aws-doc"


[[setup.buckets]]
name = "conf-bucketconfig"
[[exchanges]]
name = "write"

[exchanges.request]
method = "PUT"
target = "/conf-bucketconfig?policy"
headers = { "content-type" = "application/json" }
content_md5 = "computed"
body = { utf8 = '{"Version":"2012-10-17","Statement":[{"Sid":"one","Effect":"Allow","Principal":{"AWS":"arn:aws:iam::111122223333:root"},"Action":"s3:GetObject","Resource":"arn:aws:s3:::conf-bucketconfig/*"}]}' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[[exchanges]]
name = "read-back"

[exchanges.request]
method = "GET"
target = "/conf-bucketconfig?policy"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[exchanges.expect.headers_present]
"content-type" = "application/json"

[exchanges.expect.body]
exact_utf8 = '''{"Version":"2012-10-17","Statement":[{"Sid":"one","Effect":"Allow","Principal":{"AWS":"arn:aws:iam::111122223333:root"},"Action":"s3:GetObject","Resource":"arn:aws:s3:::conf-bucketconfig/*"}]}'''

