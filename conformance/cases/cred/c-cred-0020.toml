# c-cred-0020 — a temporary credential whose lifetime has ended.
#
# Schema dimensions exercised: sign.credential = "expired_session", which was refused as unwired
# until the credential provider could hold a session at all. The expected body is byte-for-byte
# c-cred-0008's, and that identity is the whole case: an expired session must not be separable
# from an access key that never existed.

[case]
id = "c-cred-0020"
schema_version = 1
title = "An expired STS session is refused with exactly the bytes an unknown access key gets"
rationale = """
The lifetime of a temporary credential is an authentication property, so it is checked while the \
caller is being identified rather than while its permissions are evaluated — an expired token that \
reached policy evaluation would have bought decoding and a store read it was never entitled to. \
What the caller learns must be nothing: the access key exists, the signature was correct, and the \
only thing wrong was the expiry, which is precisely the fact that tells an attacker it has found a \
real issuance. So the answer is byte-identical to c-cred-0008's, which is an access key the \
provider has never heard of. GHSA-ccrv-v8v9-ch9q is the other half of the same rule: a token \
accepted with no expiry at all. The framework refuses to hold a session token without a lifetime, \
so that state is unrepresentable and this case pins the enforcement of the lifetime it does hold."""
polarity = "negative"
operation = "GetObject"
tags = ["signature", "sigv4", "security", "error-shape", "timing"]
timeout_ms = 10000
quirks = []

[[case.evidence]]
url = "https://github.com/rustfs/rustfs/security/advisories/GHSA-ccrv-v8v9-ch9q"
summary = "A session token was accepted with a missing expiry claim, so an issued credential never stopped working."
kind = "other"

[[case.evidence]]
url = "https://github.com/rustfs/rustfs/security/advisories/GHSA-3p3x-734c-h5vx"
summary = "Distinguishable authentication failures let a caller learn which half of a credential was wrong; the fix is one answer for every failure plus rate limiting."
kind = "other"

[[case.evidence]]
url = "https://docs.aws.amazon.com/STS/latest/APIReference/API_AssumeRole.html"
summary = "A temporary credential is an access key, a secret, a session token and an expiration instant issued together."
kind = "aws-doc"

[clock]
fixed = "2026-01-02T03:04:05Z"
request_time = "2026-01-02T03:04:05Z"

[[setup.buckets]]
name = "conf-cred"

[[setup.objects]]
bucket = "conf-cred"
key = "probe"
body = { utf8 = "credential-probe" }

[request]
method = "GET"
target = "/conf-cred/probe"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "expired_session" }

[expect]
kind = "response"
status = 403
connection_after = "open"
headers_absent = ["etag", "x-amz-version-id", "last-modified"]

[expect.error]
code = "InvalidAccessKeyId"
request_id_present = true

[expect.headers_present]
"content-type" = "application/xml"

[expect.body]
redact = ["RequestId", "HostId"]
exact_utf8 = """
<?xml version="1.0" encoding="UTF-8"?>
<Error><Code>InvalidAccessKeyId</Code><Message>the request was not authenticated</Message><RequestId>__REDACTED__</RequestId><HostId>__REDACTED__</HostId></Error>"""
not_contains_utf8 = [
    "ExpiredToken",
    "expired",
    "FQoGZXIvYXdz",
    "sts.conformance.invalid",
    "StringToSign",
    "CanonicalRequest",
]
