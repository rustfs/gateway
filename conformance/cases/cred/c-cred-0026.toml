# c-cred-0026 — Pre-auth failures do not interpolate request identifiers.

[case]
id = "c-cred-0026"
schema_version = 1
title = "Pre-auth failures do not interpolate request identifiers"
rationale = """
The guard script mutates ProviderError separately; this response case proves malformed request-derived authorization bytes are not reflected to the caller. The request and response are measured by the in-process conformance target."""
polarity = "negative"
operation = "GetObject"
tags = ["signature", "sigv4", "security"]
timeout_ms = 10000
quirks = []

[[case.evidence]]
url = "https://docs.aws.amazon.com/IAM/latest/UserGuide/create-signed-request.html"
summary = "AWS signing binds an access key and, for temporary credentials, its security token to the request being authenticated."
kind = "aws-doc"

[clock]
fixed = "2026-01-02T03:04:05Z"
request_time = "2026-01-02T03:04:05Z"

[[setup.buckets]]
name = "conf-cred"

[[setup.objects]]
bucket = "conf-cred"
key = "probe"
body = { utf8 = "credential-probe" }

[request]
method = "GET"
target = "/conf-cred/probe"
headers = { Authorization = "AWS4-HMAC-SHA256 broken" }
sign = { mode = "none" }

[expect]
kind = "response"
status = 403
connection_after = "open"

[expect.headers_present]
"content-type" = "application/xml"
