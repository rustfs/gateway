# c-cred-0024 — A forged access key receives the uniform pre-auth refusal.

[case]
id = "c-cred-0024"
schema_version = 1
title = "A forged access key receives the uniform pre-auth refusal"
rationale = """
Per-IP admission is owned by P6-09; this credential-side case records that a forged access key is classified as CredentialLookup before its provider is driven, then pins the uniform refusal. The in-process target fails cleanup unless the governor observes that class exactly once."""
polarity = "negative"
operation = "GetObject"
tags = ["signature", "sigv4", "security"]
timeout_ms = 10000
quirks = []

[[case.evidence]]
url = "https://docs.aws.amazon.com/IAM/latest/UserGuide/create-signed-request.html"
summary = "AWS signing binds an access key and, for temporary credentials, its security token to the request being authenticated."
kind = "aws-doc"

[clock]
fixed = "2026-01-02T03:04:05Z"
request_time = "2026-01-02T03:04:05Z"

[[setup.buckets]]
name = "conf-cred"

[[setup.objects]]
bucket = "conf-cred"
key = "probe"
body = { utf8 = "credential-probe" }

[request]
method = "GET"
target = "/conf-cred/probe"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "unknown_access_key" }

[expect]
kind = "response"
status = 403
connection_after = "open"

[expect.headers_present]
"content-type" = "application/xml"
