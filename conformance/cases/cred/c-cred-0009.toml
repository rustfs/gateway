# c-cred-0009 — a known access key signed with the wrong secret.
#
# Schema dimensions exercised: sign.credential = "wrong_secret", byte-exact body. The expected
# document differs from c-cred-0008's in the error code and in nothing else — not in the message,
# not in the header set, not in an element that only appears on one of the two paths.

[case]
id = "c-cred-0009"
schema_version = 1
title = "A wrong secret is SignatureDoesNotMatch and otherwise refused exactly like an unknown access key"
rationale = """
S3 answers a wrong signature on a known key with SignatureDoesNotMatch and an unknown key with \
InvalidAccessKeyId, and SDKs branch on the difference, so the codes stay distinct (rd-loc-0002, \
docs/security-model.md). Everything else is pinned to the same bytes as c-cred-0008: the status, \
the headers and the message, so the code is the only difference, and timing parity and the \
credential rate limit bound what it tells an enumerator. Nothing derived from verification is \
rendered."""
polarity = "negative"
operation = "GetObject"
tags = ["signature", "sigv4", "security", "error-shape", "timing"]
timeout_ms = 10000
quirks = []

[[case.evidence]]
url = "https://github.com/rustfs/rustfs/security/advisories/GHSA-3p3x-734c-h5vx"
summary = "Distinguishable authentication failures let a caller learn which half of a credential was wrong; the fix is one answer for every failure plus rate limiting."
kind = "other"

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/ErrorResponses.html"
summary = "S3 answers a signature that does not match with 403 and the error code SignatureDoesNotMatch."
kind = "aws-doc"

[clock]
fixed = "2026-01-02T03:04:05Z"
request_time = "2026-01-02T03:04:05Z"

[[setup.buckets]]
name = "conf-cred"

[[setup.objects]]
bucket = "conf-cred"
key = "probe"
body = { utf8 = "credential-probe" }

[request]
method = "GET"
target = "/conf-cred/probe"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "wrong_secret" }

[expect]
kind = "response"
status = 403
connection_after = "open"
headers_absent = ["etag", "x-amz-version-id", "last-modified"]

[expect.error]
code = "SignatureDoesNotMatch"
request_id_present = true

[expect.headers_present]
"content-type" = "application/xml"

[expect.body]
redact = ["RequestId", "HostId"]
exact_utf8 = """
<?xml version="1.0" encoding="UTF-8"?>
<Error><Code>SignatureDoesNotMatch</Code><Message>the request was not authenticated</Message><RequestId>__REDACTED__</RequestId><HostId>__REDACTED__</HostId></Error>"""
not_contains_utf8 = [
    "AKIAIOSFODNN7EXAMPLE",
    "wJalrXUtnFEMI",
    "this-is-not-the-secret",
    "StringToSign",
    "CanonicalRequest",
    "SignatureProvided",
]
