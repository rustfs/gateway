# c-cred-0002 — An unsigned request stays anonymous and never reaches the provider.

[case]
id = "c-cred-0002"
schema_version = 1
title = "An unsigned request stays anonymous and never reaches the provider"
rationale = """
Anonymous admission is decided before credential lookup; the in-process target fails the case if its provider call counter is not zero. The request and response are measured by the in-process conformance target."""
polarity = "positive"
operation = "GetObject"
tags = ["signature", "sigv4", "security"]
timeout_ms = 10000
quirks = []

[[case.evidence]]
url = "https://docs.aws.amazon.com/IAM/latest/UserGuide/create-signed-request.html"
summary = "AWS signing binds an access key and, for temporary credentials, its security token to the request being authenticated."
kind = "aws-doc"

[clock]
fixed = "2026-01-02T03:04:05Z"
request_time = "2026-01-02T03:04:05Z"

[[setup.buckets]]
name = "conf-cred"

[[setup.objects]]
bucket = "conf-cred"
key = "probe"
body = { utf8 = "credential-probe" }

[request]
method = "GET"
target = "/conf-cred/probe"
sign = { mode = "anonymous" }

[expect]
kind = "response"
status = 403
connection_after = "open"

[expect.headers_present]
"content-type" = "application/xml"
