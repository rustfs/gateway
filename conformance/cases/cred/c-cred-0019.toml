# c-cred-0019 — Credential failures do not disclose authentication material.

[case]
id = "c-cred-0019"
schema_version = 1
title = "Credential failures do not disclose authentication material"
rationale = """
The most detailed client response must omit the secret, session token, authorization value, expected signature, and canonical signing intermediates. The request and response are measured by the in-process conformance target."""
polarity = "negative"
operation = "GetObject"
tags = ["signature", "sigv4", "security"]
timeout_ms = 10000
quirks = []

[[case.evidence]]
url = "https://docs.aws.amazon.com/IAM/latest/UserGuide/create-signed-request.html"
summary = "AWS signing binds an access key and, for temporary credentials, its security token to the request being authenticated."
kind = "aws-doc"

[clock]
fixed = "2026-01-02T03:04:05Z"
request_time = "2026-01-02T03:04:05Z"

[[setup.buckets]]
name = "conf-cred"

[[setup.objects]]
bucket = "conf-cred"
key = "probe"
body = { utf8 = "credential-probe" }

[request]
method = "GET"
target = "/conf-cred/probe"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "wrong_secret" }

[expect]
kind = "response"
status = 403
connection_after = "open"

[expect.body]
not_contains_utf8 = ["wJalrXUtnFEMI", "FQoGZXIvYXdz", "Authorization", "StringToSign", "CanonicalRequest", "SignatureProvided"]
