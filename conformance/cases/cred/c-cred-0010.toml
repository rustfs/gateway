# c-cred-0010 — A disabled credential is indistinguishable from a missing key.

[case]
id = "c-cred-0010"
schema_version = 1
title = "A disabled credential is indistinguishable from a missing key"
rationale = """
A known but disabled credential must reveal neither its existence nor its disabled state, so its response is pinned to the same bytes as an unknown key. The request and response are measured by the in-process conformance target."""
polarity = "negative"
operation = "GetObject"
tags = ["signature", "sigv4", "security"]
timeout_ms = 10000
quirks = []

[[case.evidence]]
url = "https://docs.aws.amazon.com/IAM/latest/UserGuide/create-signed-request.html"
summary = "AWS signing binds an access key and, for temporary credentials, its security token to the request being authenticated."
kind = "aws-doc"

[clock]
fixed = "2026-01-02T03:04:05Z"
request_time = "2026-01-02T03:04:05Z"

[[setup.buckets]]
name = "conf-cred"

[[setup.objects]]
bucket = "conf-cred"
key = "probe"
body = { utf8 = "credential-probe" }

[request]
method = "GET"
target = "/conf-cred/probe"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "disabled" }

[expect]
kind = "response"
status = 403
connection_after = "open"

[expect.body]
redact = ["RequestId", "HostId"]
exact_utf8 = """
<?xml version="1.0" encoding="UTF-8"?>
<Error><Code>InvalidAccessKeyId</Code><Message>the request was not authenticated</Message><RequestId>__REDACTED__</RequestId><HostId>__REDACTED__</HostId></Error>"""
