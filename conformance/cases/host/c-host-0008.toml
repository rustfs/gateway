# c-host-0008 — [S] a write through an unknown domain is path style and reaches the bucket.

[case]
id = "c-host-0008"
schema_version = 1
title = "A write on a host that matches no configured base domain is path style and stores the object"
rationale = """
A read that falls back correctly proves less than a write that does: the fallback has to produce a \
bucket and a key a handler can act on, not merely a route that resolves. The host here is an ordinary \
name in front of a reverse proxy, which is the deployment s3s#643 broke."""
polarity = "negative"
operation = "PutObject"
tags = ["vhost", "routing"]
timeout_ms = 10000
# Empty on purpose. A quirk in `model/overlays/quirks/` is scoped to an operation or a shape, and
# host resolution is neither: it happens before an operation has been chosen. The whole family is
# therefore held by `crates/gateway/tests/vhost_resolution.rs` and by the negative cases beside
# this one, not by the quirk mutation gate.
quirks = []

[[case.evidence]]
url = "https://github.com/s3s-project/s3s/issues/643"
summary = "Upstream reports that configuring a domain list makes path-style requests on hosts outside the list unusable."
kind = "s3s-issue"


[[setup.buckets]]
name = "conf-host"

[request]
method = "PUT"
target = "/conf-host/written.txt"
host = "some-other-domain.test"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }
body = { utf8 = "written path style" }

[expect]
kind = "response"
status = 200
connection_after = "open"

[expect.headers_present]
"etag" = "\"17c0e55ffef299a2ff2e3c071387d2b2\""
