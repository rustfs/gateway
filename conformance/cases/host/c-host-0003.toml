# c-host-0003 — `PUT /` on a virtual host creates the bucket the host names.

[case]
id = "c-host-0003"
schema_version = 1
title = "A write to the root of a virtual host creates the bucket the host names, not a service-root request"
rationale = """
The root path means two different things depending on where the bucket came from. Path-style, \
`PUT /` names no bucket at all and is not an operation this service defines; on a virtual host it is \
CreateBucket for the bucket in the host. A resolver that classified the target from the path alone \
answers this 501, which is precisely the report in s3s#259 -- and it does so with a message about an \
unknown operation rather than about the request that was actually made."""
polarity = "positive"
operation = "CreateBucket"
tags = ["vhost", "routing"]
timeout_ms = 10000
# Empty on purpose. A quirk in `model/overlays/quirks/` is scoped to an operation or a shape, and
# host resolution is neither: it happens before an operation has been chosen. The whole family is
# therefore held by `crates/gateway/tests/vhost_resolution.rs` and by the negative cases beside
# this one, not by the quirk mutation gate.
quirks = []

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/userguide/VirtualHosting.html"
summary = "Virtual-hosted-style addressing puts the bucket in the host name, leaving the entire path to be the object key."
kind = "aws-doc"

[[case.evidence]]
url = "https://github.com/s3s-project/s3s/issues/259"
summary = "Upstream reports that a virtual-hosted request reaching an installation with no configured domain is answered 501 with nothing that says why."
kind = "s3s-issue"


[request]
method = "PUT"
target = "/"
host = "fresh-vhost-bucket.s3.example.com"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 200
connection_after = "open"

[expect.headers_present]
"location" = "/fresh-vhost-bucket"
