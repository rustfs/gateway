# c-host-0002 — the second configured base domain, the region-bearing one, matches too.

[case]
id = "c-host-0002"
schema_version = 1
title = "A bucket named in front of the region-bearing base domain resolves the same as on the plain one"
rationale = """
A deployment configures more than one base domain, and a resolver that only ever consults the \
first one answers every request on the others by their path -- a silent downgrade to path style that \
reaches the client as an ordinary 404. The domain here is the region-bearing endpoint form, so this \
also pins that an extra label inside the configured domain is part of the domain and not part of the \
prefix the bucket is read from."""
polarity = "positive"
operation = "GetObject"
tags = ["vhost", "routing", "region"]
timeout_ms = 10000
# Empty on purpose. A quirk in `model/overlays/quirks/` is scoped to an operation or a shape, and
# host resolution is neither: it happens before an operation has been chosen. The whole family is
# therefore held by `crates/gateway/tests/vhost_resolution.rs` and by the negative cases beside
# this one, not by the quirk mutation gate.
quirks = []

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/userguide/VirtualHosting.html"
summary = "Virtual-hosted-style addressing puts the bucket in the host name, leaving the entire path to be the object key."
kind = "aws-doc"

[[case.evidence]]
url = "https://github.com/s3s-project/s3s/pull/179"
summary = "Upstream extended a single base domain into a configurable list, which is the shape a deployment with a regional endpoint needs."
kind = "s3s-pr"


[[setup.buckets]]
name = "conf-host"

[[setup.objects]]
bucket = "conf-host"
key = "nested/plain.txt"
content_type = "text/plain; charset=utf-8"
body = { utf8 = "virtual hosted" }

[request]
method = "GET"
target = "/nested/plain.txt"
host = "conf-host.s3.us-east-1.example.com"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 200
connection_after = "open"

[expect.headers_present]
"content-type" = "text/plain; charset=utf-8"

[expect.body]
exact_utf8 = "virtual hosted"
