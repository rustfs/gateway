# c-host-0013 — [S] the other direction: a request that is not virtual-host-shaped gets the
# generic refusal, so the diagnostic in c-host-0012 is a branch and not a constant.

[case]
id = "c-host-0013"
schema_version = 1
title = "A request that does not look virtual-hosted is refused with the generic message, not the virtual-host hint"
rationale = """
c-host-0012 on its own is satisfied by a gateway that answers every unrouted request with the \
virtual-host sentence, which would be a worse message than the generic one for the majority of \
unrouted requests -- they are typos, unsupported operations and probes, not misconfigured domains. \
This is the control: the same method and the same path, on the base domain the gateway does serve, \
whose first label `s3` is two characters and therefore no bucket's name. The hint has nothing to \
suggest, so the generic sentence is what comes back. The pair is what makes either assertion a \
measurement."""
polarity = "negative"
tags = ["vhost", "routing", "error-shape"]
timeout_ms = 10000
# Empty on purpose. A quirk in `model/overlays/quirks/` is scoped to an operation or a shape, and
# host resolution is neither: it happens before an operation has been chosen. The whole family is
# therefore held by `crates/gateway/tests/vhost_resolution.rs` and by the negative cases beside
# this one, not by the quirk mutation gate.
quirks = []

[[case.evidence]]
url = "https://github.com/s3s-project/s3s/issues/259"
summary = "Upstream reports that a virtual-hosted request reaching an installation with no configured domain is answered 501 with nothing that says why; the fix must not make every other 501 say it instead."
kind = "s3s-issue"

[request]
method = "PUT"
target = "/"
host = "s3.example.com"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 501
connection_after = "open"

[expect.error]
code = "NotImplemented"
request_id_present = true

[expect.body]
redact = ["RequestId", "HostId"]
exact_utf8 = '''
<?xml version="1.0" encoding="UTF-8"?>
<Error><Code>NotImplemented</Code><Message>This request does not name any S3 operation. If clients address buckets as virtual hosts, check that the gateway has been configured with the domain it serves; otherwise the method, path or query is not one this service defines.</Message><RequestId>__REDACTED__</RequestId><HostId>__REDACTED__</HostId></Error>'''
