# c-host-0001 — a virtual-hosted read: the bucket is in the host and the whole path is the key.
#
# Schema dimensions exercised: request.host override, byte-exact body.

[case]
id = "c-host-0001"
schema_version = 1
title = "A bucket named by the host is read with the whole request path as the object key"
rationale = """
This is the positive control the negative cases in this family are read against: unless a host can \
actually name a bucket, "that host must not name a bucket" is satisfied by a resolver that reads no \
host at all. The key is a two-segment path on purpose. A resolver that took the bucket from the \
host and then still split the first path segment off as a bucket would answer this request with the \
object `plain.txt` instead of `nested/plain.txt`, and a single-segment key could not tell the two \
apart."""
polarity = "positive"
operation = "GetObject"
tags = ["vhost", "routing"]
timeout_ms = 10000
# Empty on purpose. A quirk in `model/overlays/quirks/` is scoped to an operation or a shape, and
# host resolution is neither: it happens before an operation has been chosen. The whole family is
# therefore held by `crates/gateway/tests/vhost_resolution.rs` and by the negative cases beside
# this one, not by the quirk mutation gate.
quirks = []

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/userguide/VirtualHosting.html"
summary = "Virtual-hosted-style addressing puts the bucket in the host name, leaving the entire path to be the object key."
kind = "aws-doc"

[[setup.buckets]]
name = "conf-host"

[[setup.objects]]
bucket = "conf-host"
key = "nested/plain.txt"
content_type = "text/plain; charset=utf-8"
body = { utf8 = "virtual hosted" }

[request]
method = "GET"
target = "/nested/plain.txt"
host = "conf-host.s3.example.com"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 200
connection_after = "open"

[expect.headers_present]
"content-type" = "text/plain; charset=utf-8"

[expect.body]
exact_utf8 = "virtual hosted"
