# c-host-0007 — [S] an address is never a virtual host, and path style still works on one.

[case]
id = "c-host-0007"
schema_version = 1
title = "A request addressed to an IP literal is path style, and configuring base domains does not change that"
rationale = """
Direct connections to an address are how every health check, every sidecar and every operator with \
a shell reaches this service. s3s#147/#150 fixed an implementation that read a bucket out of such a \
host; s3s#643 is the same area breaking the other way, where configuring any domain made these requests \
stop working. Both halves are asserted at once: the address names no bucket, and the path still does."""
polarity = "negative"
operation = "GetObject"
tags = ["vhost", "routing", "security"]
timeout_ms = 10000
# Empty on purpose. A quirk in `model/overlays/quirks/` is scoped to an operation or a shape, and
# host resolution is neither: it happens before an operation has been chosen. The whole family is
# therefore held by `crates/gateway/tests/vhost_resolution.rs` and by the negative cases beside
# this one, not by the quirk mutation gate.
quirks = []

[[case.evidence]]
url = "https://github.com/s3s-project/s3s/pull/150"
summary = "Upstream changed a non-matching host to be read path style after an address-addressed request resolved the wrong bucket."
kind = "s3s-pr"

[[case.evidence]]
url = "https://github.com/s3s-project/s3s/issues/643"
summary = "Upstream reports that configuring a domain list makes path-style requests on hosts outside the list unusable."
kind = "s3s-issue"


[[setup.buckets]]
name = "conf-host"

[[setup.objects]]
bucket = "conf-host"
key = "nested/plain.txt"
content_type = "text/plain; charset=utf-8"
body = { utf8 = "virtual hosted" }

[request]
method = "GET"
target = "/conf-host/nested/plain.txt"
host = "192.168.1.1:8014"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 200
connection_after = "open"

[expect.headers_present]
"content-type" = "text/plain; charset=utf-8"

[expect.body]
exact_utf8 = "virtual hosted"
