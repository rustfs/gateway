# c-host-0011 — [S] a prefix that is not a legal bucket name is not repaired.

[case]
id = "c-host-0011"
schema_version = 1
title = "A label in the bucket position that no bucket could be called names no bucket"
rationale = """
`_bad_` is a host label and not a bucket name. A resolver that stripped, lower-cased or otherwise \
repaired it into something acceptable would be inventing a bucket, and every such repair is a second \
spelling for a bucket the signature never covered. The request falls back to its path, which is the \
answer every unrecognised shape gets."""
polarity = "negative"
operation = "GetObject"
tags = ["vhost", "routing", "security"]
timeout_ms = 10000
# Empty on purpose. A quirk in `model/overlays/quirks/` is scoped to an operation or a shape, and
# host resolution is neither: it happens before an operation has been chosen. The whole family is
# therefore held by `crates/gateway/tests/vhost_resolution.rs` and by the negative cases beside
# this one, not by the quirk mutation gate.
quirks = []

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/userguide/bucketnamingrules.html"
summary = "The naming rules admit only lowercase letters, digits, hyphens and dots, reserve the xn-- prefix, and record that a dotted name cannot be addressed virtual-hosted over HTTPS."
kind = "aws-doc"


[[setup.buckets]]
name = "conf-host"

[[setup.objects]]
bucket = "conf-host"
key = "nested/plain.txt"
content_type = "text/plain; charset=utf-8"
body = { utf8 = "virtual hosted" }

[request]
method = "GET"
target = "/conf-host/nested/plain.txt"
host = "_bad_.s3.example.com"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 200
connection_after = "open"

[expect.headers_present]
"content-type" = "text/plain; charset=utf-8"

[expect.body]
exact_utf8 = "virtual hosted"
