# c-host-0009 — [S] a dotted name in the bucket position is not read as a virtual host.

[case]
id = "c-host-0009"
schema_version = 1
title = "A multi-label prefix matching none of the recognised shapes names no bucket"
rationale = """
A bucket name may contain dots, and such a bucket cannot be addressed virtual-hosted: the extra \
label falls outside the wildcard certificate, so AWS itself falls back to path style for them. More to \
the point, a resolver that reassembled `mine.dotted.bucket` out of the labels in front of the domain \
would be guessing, and an attacker picks what it guesses from. The request is answered from its path."""
polarity = "negative"
operation = "GetObject"
tags = ["vhost", "routing", "security"]
timeout_ms = 10000
# Empty on purpose. A quirk in `model/overlays/quirks/` is scoped to an operation or a shape, and
# host resolution is neither: it happens before an operation has been chosen. The whole family is
# therefore held by `crates/gateway/tests/vhost_resolution.rs` and by the negative cases beside
# this one, not by the quirk mutation gate.
quirks = []

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/userguide/bucketnamingrules.html"
summary = "The naming rules admit only lowercase letters, digits, hyphens and dots, reserve the xn-- prefix, and record that a dotted name cannot be addressed virtual-hosted over HTTPS."
kind = "aws-doc"


[[setup.buckets]]
name = "conf-host"

[[setup.objects]]
bucket = "conf-host"
key = "nested/plain.txt"
content_type = "text/plain; charset=utf-8"
body = { utf8 = "virtual hosted" }

[request]
method = "GET"
target = "/conf-host/nested/plain.txt"
host = "mine.dotted.bucket.s3.example.com"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 200
connection_after = "open"

[expect.headers_present]
"content-type" = "text/plain; charset=utf-8"

[expect.body]
exact_utf8 = "virtual hosted"
