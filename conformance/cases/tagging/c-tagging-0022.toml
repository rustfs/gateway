# c-tagging-0022 — the untag clears one version, and stops there.
#
# Schema dimensions exercised: multi-exchange state, captured version ids, byte-exact bodies.

[case]
id = "c-tagging-0022"
schema_version = 1
title = "DeleteObjectTagging on one version leaves another version's tag set standing"
rationale = """
The delete is the clearing path for a tag set, and it is the operation where over-reach is \
cheapest to write and hardest to see: clearing every version answers the same 204 as clearing \
one. Both versions are labelled first so that "the other version still has its set" is a real \
observation rather than a vacuous one — against a fixture where only the named version was ever \
tagged, a delete that cleared everything would pass. The read of the untouched version is \
byte-exact, because a store that cleared it would answer the same 200 with an empty set."""
polarity = "positive"
operation = "DeleteObjectTagging"
tags = ["tagging", "wire-bytes"]
timeout_ms = 10000
quirks = ["q-tag-delete-idempotent-0091", "q-tag-object-unconfigured-0090"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_DeleteObjectTagging.html"
summary = "The delete documents versionId as naming the version whose tag set is removed."
kind = "aws-doc"

[clock]
fixed = "2026-01-02T03:04:05Z"

[connection]
reuse = true

[[setup.buckets]]
name = "conf-tagging-untag"
versioning = "enabled"

[[exchanges]]
name = "write-the-first-version"

[exchanges.request]
method = "PUT"
target = "/conf-tagging-untag/doc.txt"
headers = { "content-type" = "text/plain" }
body = { utf8 = "first" }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[exchanges.expect.capture]
first = { header = "x-amz-version-id" }

[[exchanges]]
name = "write-the-second-version"

[exchanges.request]
method = "PUT"
target = "/conf-tagging-untag/doc.txt"
headers = { "content-type" = "text/plain" }
body = { utf8 = "second" }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[exchanges.expect.capture]
second = { header = "x-amz-version-id" }

[[exchanges]]
name = "label-the-older-version"

[exchanges.request]
method = "PUT"
target = "/conf-tagging-untag/doc.txt?tagging&versionId=${capture.first}"
headers = { "content-md5" = "QTsTDAb4c0VADLNy4ipavA==" }
body = { utf8 = '<Tagging><TagSet><Tag><Key>colour</Key><Value>green</Value></Tag></TagSet></Tagging>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[[exchanges]]
name = "label-the-newer-version-differently"

[exchanges.request]
method = "PUT"
target = "/conf-tagging-untag/doc.txt?tagging&versionId=${capture.second}"
headers = { "content-md5" = "Eqjc2dLsYeOiFyCAHNmyhA==" }
body = { utf8 = '<Tagging><TagSet><Tag><Key>colour</Key><Value>red</Value></Tag></TagSet></Tagging>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[[exchanges]]
name = "untag-only-the-older-version"

[exchanges.request]
method = "DELETE"
target = "/conf-tagging-untag/doc.txt?tagging&versionId=${capture.first}"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 204
connection_after = "open"

[[exchanges]]
name = "the-older-version-is-bare"

[exchanges.request]
method = "GET"
target = "/conf-tagging-untag/doc.txt?tagging&versionId=${capture.first}"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[exchanges.expect.body]
exact_utf8 = '''
<?xml version="1.0" encoding="UTF-8"?>
<Tagging xmlns="http://s3.amazonaws.com/doc/2006-03-01/"><TagSet></TagSet></Tagging>'''

[[exchanges]]
name = "the-newer-version-kept-its-own"

[exchanges.request]
method = "GET"
target = "/conf-tagging-untag/doc.txt?tagging&versionId=${capture.second}"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[exchanges.expect.body]
exact_utf8 = '''
<?xml version="1.0" encoding="UTF-8"?>
<Tagging xmlns="http://s3.amazonaws.com/doc/2006-03-01/"><TagSet><Tag><Key>colour</Key><Value>red</Value></Tag></TagSet></Tagging>'''
