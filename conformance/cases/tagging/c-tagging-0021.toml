# c-tagging-0021 — a tag set belongs to a version, not to a key.
#
# Schema dimensions exercised: multi-exchange state, captured version ids, byte-exact bodies.

[case]
id = "c-tagging-0021"
schema_version = 1
title = "A tag set written to one version is read back from that version and from no other"
rationale = """
`versionId` is in the wire shape of all three object tagging operations, and a store that parses \
it and then labels whatever version happens to be newest answers every read with a 200 that is \
wrong about which bytes carry the labels. Cost allocation, lifecycle filters and IAM tag \
conditions all branch on that answer, so the failure surfaces as a bill or a policy decision \
rather than as an error. Both directions are asserted deliberately: a store that ignored the \
parameter entirely and one that applied the write to every version would each satisfy "the named \
version carries the new set" alone, and only the untouched sibling separates them. The final read \
names no version, which must select the newest — the one that was never labelled."""
polarity = "positive"
operation = "PutObjectTagging"
tags = ["tagging", "wire-bytes"]
timeout_ms = 10000
quirks = ["q-tag-wrapped-0088", "q-tag-object-unconfigured-0090"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutObjectTagging.html"
summary = "The write documents versionId as naming the object version the tag set is applied to."
kind = "aws-doc"

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_GetObjectTagging.html"
summary = "The read documents versionId as selecting the version whose tag set is answered, and its absence as selecting the current one."
kind = "aws-doc"

[clock]
fixed = "2026-01-02T03:04:05Z"

[connection]
reuse = true

[[setup.buckets]]
name = "conf-tagging-versions"
versioning = "enabled"

[[exchanges]]
name = "write-the-first-version"

[exchanges.request]
method = "PUT"
target = "/conf-tagging-versions/doc.txt"
headers = { "content-type" = "text/plain" }
body = { utf8 = "first" }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[exchanges.expect.capture]
first = { header = "x-amz-version-id" }

[[exchanges]]
name = "write-the-second-version"

[exchanges.request]
method = "PUT"
target = "/conf-tagging-versions/doc.txt"
headers = { "content-type" = "text/plain" }
body = { utf8 = "second" }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[exchanges.expect.capture]
second = { header = "x-amz-version-id" }

[[exchanges]]
name = "label-the-older-version"

[exchanges.request]
method = "PUT"
target = "/conf-tagging-versions/doc.txt?tagging&versionId=${capture.first}"
headers = { "content-md5" = "QTsTDAb4c0VADLNy4ipavA==" }
body = { utf8 = '<Tagging><TagSet><Tag><Key>colour</Key><Value>green</Value></Tag></TagSet></Tagging>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[[exchanges]]
name = "the-named-version-carries-the-set"

[exchanges.request]
method = "GET"
target = "/conf-tagging-versions/doc.txt?tagging&versionId=${capture.first}"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[exchanges.expect.body]
exact_utf8 = '''
<?xml version="1.0" encoding="UTF-8"?>
<Tagging xmlns="http://s3.amazonaws.com/doc/2006-03-01/"><TagSet><Tag><Key>colour</Key><Value>green</Value></Tag></TagSet></Tagging>'''

[[exchanges]]
name = "the-version-beside-it-is-untouched"

[exchanges.request]
method = "GET"
target = "/conf-tagging-versions/doc.txt?tagging&versionId=${capture.second}"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[exchanges.expect.body]
exact_utf8 = '''
<?xml version="1.0" encoding="UTF-8"?>
<Tagging xmlns="http://s3.amazonaws.com/doc/2006-03-01/"><TagSet></TagSet></Tagging>'''

[[exchanges]]
name = "no-version-id-selects-the-newest"

[exchanges.request]
method = "GET"
target = "/conf-tagging-versions/doc.txt?tagging"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[exchanges.expect.body]
exact_utf8 = '''
<?xml version="1.0" encoding="UTF-8"?>
<Tagging xmlns="http://s3.amazonaws.com/doc/2006-03-01/"><TagSet></TagSet></Tagging>'''
