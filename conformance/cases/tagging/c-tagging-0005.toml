# c-tagging-0005 — the empty TagSet is not a write; the delete is the clearing path.
#
# Schema dimensions exercised: required-member enforcement at its boundary, refusal-then-verify.

[case]
id = "c-tagging-0005"
schema_version = 1
title = "PutBucketTagging with an empty TagSet is a 400 MalformedXML and the set survives"
rationale = """
The tempting reading is that the empty document clears the set, and implementations that adopt it \
diverge from AWS in the worst way: the write succeeds locally and fails against the real service, \
so the client's clearing path breaks only in production. AWS validates the document against its \
schema, where TagSet requires at least one Tag, and answers MalformedXML; DeleteBucketTagging is \
the clearing operation. The follow-up read proves the refused document did not half-apply — the \
previous set is still there, byte for byte."""
polarity = "negative"
operation = "PutBucketTagging"
tags = ["tagging", "xml", "error-shape"]
timeout_ms = 10000
quirks = ["q-tag-wrapped-0088"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutBucketTagging.html"
summary = "TagSet is a required member of the request document, and MalformedXML is the documented refusal for a body that does not validate."
kind = "aws-doc"

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_DeleteBucketTagging.html"
summary = "Clearing the set has its own operation, so the empty write is not the clearing path."
kind = "aws-doc"

[clock]
fixed = "2026-01-02T03:04:05Z"

[connection]
reuse = true

[[setup.buckets]]
name = "conf-tagging"

[[exchanges]]
name = "configure-a-set-to-survive"

[exchanges.request]
method = "PUT"
target = "/conf-tagging?tagging"
headers = { "content-md5" = "lIekmFtFZOTSZInJM/f1eQ==" }
body = { utf8 = '<Tagging><TagSet><Tag><Key>keep</Key><Value>yes</Value></Tag></TagSet></Tagging>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[[exchanges]]
name = "the-empty-document-is-refused"

[exchanges.request]
method = "PUT"
target = "/conf-tagging?tagging"
headers = { "content-md5" = "k6PBbu32RmFaV5nRULDSlw==" }
body = { utf8 = '<Tagging><TagSet></TagSet></Tagging>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 400
connection_after = "open"

[exchanges.expect.error]
code = "MalformedXML"
request_id_present = true

[[exchanges]]
name = "the-previous-set-survived"

[exchanges.request]
method = "GET"
target = "/conf-tagging?tagging"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[exchanges.expect.body]
exact_utf8 = '''
<?xml version="1.0" encoding="UTF-8"?>
<Tagging xmlns="http://s3.amazonaws.com/doc/2006-03-01/"><TagSet><Tag><Key>keep</Key><Value>yes</Value></Tag></TagSet></Tagging>'''
