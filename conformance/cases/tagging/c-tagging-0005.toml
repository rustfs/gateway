# c-tagging-0005 — the empty TagSet is the documented clearing write, not a malformed document.
#
# Schema dimensions exercised: required-member enforcement at its boundary, write-then-verify.

[case]
id = "c-tagging-0005"
schema_version = 3
title = "PutBucketTagging with an empty TagSet clears the set and the read afterwards is NoSuchTagSet"
rationale = """
This case asserted the opposite until rustfs/backlog#1717, on the strength of `required = true` \
alone, and that reading was wrong twice over. `required` says the `<TagSet>` element has to be \
there; minimum cardinality is a different trait, and the pinned model spells it out where it means \
it — `Tag.Key` targets a shape carrying `length { min: 1 }` two members away, while the list \
carries no length trait at all. AWS's user guide is the other half: it documents the empty tag set \
on the tagging write as *deleting* the existing tag set, and recommends the delete only because it \
is cheaper, not because the write is refused. The gateway also wrote `<TagSet></TagSet>` for every \
untagged read (`c-tagging-0007`) and then refused to read those same bytes back, so it was \
emitting a document it could not accept. The follow-up read is what distinguishes clearing from \
storing an empty set: this scope has no `200` with nothing in it, so a cleared bucket answers \
`404 NoSuchTagSet` exactly as one that never had a set does."""
polarity = "positive"
operation = "PutBucketTagging"
tags = ["tagging", "xml", "wire-bytes"]
timeout_ms = 10000
quirks = ["q-tag-wrapped-0088", "q-tag-bucket-unconfigured-0089"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-tagging.html"
summary = "The user guide states that a tagging write carrying an empty tag set deletes the existing tag set, and prefers the delete operation only on cost."
kind = "aws-doc"

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutBucketTagging.html"
summary = "TagSet is a required member of the request document, which is a claim about the element being present and not about how many entries it holds."
kind = "aws-doc"

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_GetBucketTagging.html"
summary = "The bucket read answers NoSuchTagSet when there is no tag set, which is the state a cleared bucket is in."
kind = "aws-doc"

[clock]
fixed = "2026-01-02T03:04:05Z"

[connection]
reuse = true

[[setup.buckets]]
name = "conf-tagging"

[[exchanges]]
name = "configure-a-set-to-clear"

[exchanges.request]
method = "PUT"
target = "/conf-tagging?tagging"
headers = {  }
content_md5 = "computed"
body = { utf8 = '<Tagging><TagSet><Tag><Key>keep</Key><Value>yes</Value></Tag></TagSet></Tagging>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[[exchanges]]
name = "the-empty-document-is-accepted"

[exchanges.request]
method = "PUT"
target = "/conf-tagging?tagging"
headers = {  }
content_md5 = "computed"
body = { utf8 = '<Tagging><TagSet></TagSet></Tagging>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[[exchanges]]
name = "the-set-is-gone-not-empty"

[exchanges.request]
method = "GET"
target = "/conf-tagging?tagging"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 404
connection_after = "open"

[exchanges.expect.error]
code = "NoSuchTagSet"
request_id_present = true
