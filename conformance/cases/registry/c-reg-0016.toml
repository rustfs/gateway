# c-reg-0016 — Operation with errors config registers.
#
# Schema dimensions exercised: registry.errors.register (positive)

[case]
id = "c-reg-0016"
schema_version = 1
title = "Operation with errors configuration registers"
rationale = """
Operations must declare their error codes."""
polarity = "positive"
operation = "GetObject"
tags = ["registry", "errors"]
timeout_ms = 5000

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/Welcome.html"
summary = "Error configuration declares the error codes an operation may return."
kind = "aws-doc"

[expect]
kind = "registry"
operation = "GetObject"
registered = true
has_errors_config = true
