# c-reg-0018 — Operation with method registers.
#
# Schema dimensions exercised: registry.method.register (positive)

[case]
id = "c-reg-0018"
schema_version = 1
title = "Operation with HTTP method registers"
rationale = """
Operations must declare their HTTP method."""
polarity = "positive"
operation = "GetObject"
tags = ["registry", "method"]
timeout_ms = 5000

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/Welcome.html"
summary = "HTTP method binding ensures GET/PUT/DELETE map to the correct operation."
kind = "aws-doc"

[expect]
kind = "registry"
operation = "GetObject"
registered = true
method = "GET"
