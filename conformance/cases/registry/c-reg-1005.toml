# c-reg-1005 — Operation with invalid name fails.
#
# Schema dimensions exercised: registry.invalid_name.reject (negative)

[case]
id = "c-reg-1005"
schema_version = 1
title = "Operation with invalid name is rejected"
rationale = """
Operation names must follow naming conventions."""
polarity = "negative"
operation = "invalid name"
tags = ["registry", "naming"]
timeout_ms = 5000

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/Welcome.html"
summary = "Operation names must match the allowed naming pattern."
