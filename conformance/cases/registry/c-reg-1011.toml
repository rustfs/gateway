# c-reg-1011 — Compile-fail: missing handler implementation.
#
# Schema dimensions exercised: registry.compile_fail.missing (negative)

[case]
id = "c-reg-1011"
schema_version = 1
title = "Missing handler implementation fails to compile"
rationale = """
The type system must prevent registering operations without handlers."""
polarity = "negative"
operation = "GetObject"
tags = ["registry", "compile_fail"]
timeout_ms = 5000

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/Welcome.html"
summary = "Missing handler implementations are caught at compile time."
kind = "aws-doc"

[expect]
kind = "compile_fail"
error = "E0277"
