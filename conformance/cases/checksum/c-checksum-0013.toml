# c-checksum-0013 — two of the added checksum algorithms on one write.

[case]
id = "c-checksum-0013"
schema_version = 1
title = "A write carrying two of the added checksum algorithms is refused as two claims"
rationale = """
The added algorithms join the same one-claim rule as the original five. A request naming SHA-512 \
and XXHash64 at once is two integrity claims, and verifying one while dropping the other is exactly \
the silent merge the rule exists to refuse."""
polarity = "negative"
operation = "PutObject"
tags = ["checksum", "error-shape"]
timeout_ms = 10000
quirks = ["q-checksum-0006"]

[[case.evidence]]
url = "https://aws.amazon.com/about-aws/whats-new/2026/04/s3-five-additional-checksum-algorithms/"
summary = "S3 added MD5, XXHash3, XXHash64, XXHash128 and SHA-512 checksums and validates a supplied value against the upload before storing it."
kind = "aws-doc"

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/userguide/checking-object-integrity.html"
summary = "Lists the ten checksum algorithms an upload may name, and states that a supplied checksum that does not match fails the upload."
kind = "aws-doc"

[clock]
fixed = "2026-01-02T03:04:05Z"

[[setup.buckets]]
name = "conf-checksum"

[[setup.objects]]
bucket = "conf-checksum"
key = "two/added"
absent = true

[request]
method = "PUT"
target = "/conf-checksum/two/added"
headers = { "x-amz-checksum-sha512" = "MJ7MSJwS1utMxA9QyQLytNDtd+5RGnx6m808qG1M2G+YndNbxf9JlnDaNCVbRbDP2DDoH2Bdz33FVC6TrpzXbw==", "x-amz-checksum-xxhash64" = "RatnNLIeaWg=" }
body = { utf8 = "hello world" }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 400
headers_absent = ["etag", "x-amz-version-id"]
connection_after = "open"

[expect.error]
code = "InvalidRequest"
request_id_present = true

[expect.body]
redact = ["RequestId", "HostId"]
contains_utf8 = ["<Code>InvalidRequest</Code>"]
