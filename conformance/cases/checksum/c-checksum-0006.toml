# c-checksum-0006 — a XXHash3 checksum on a write.

[case]
id = "c-checksum-0006"
schema_version = 1
title = "An XXHash3 write is verified and answered with its checksum"
rationale = """
XXHash3 is one of the five checksum algorithms S3 added in 2026-04. A client configured for it \
sends the 8-byte digest of its body and expects the write to be verified and the value \
echoed back; refusing it as an unknown algorithm fails every upload that client makes."""
polarity = "positive"
operation = "PutObject"
tags = ["checksum"]
timeout_ms = 10000
quirks = ["q-checksum-0006"]

[[case.evidence]]
url = "https://aws.amazon.com/about-aws/whats-new/2026/04/s3-five-additional-checksum-algorithms/"
summary = "S3 added MD5, XXHash3, XXHash64, XXHash128 and SHA-512 checksums and validates a supplied value against the upload before storing it."
kind = "aws-doc"

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/userguide/checking-object-integrity.html"
summary = "Lists the ten checksum algorithms an upload may name, and states that a supplied checksum that does not match fails the upload."
kind = "aws-doc"

[clock]
fixed = "2026-01-02T03:04:05Z"

[[setup.buckets]]
name = "conf-checksum"

[request]
method = "PUT"
target = "/conf-checksum/added/xxhash3"
headers = { "x-amz-checksum-xxhash3" = "1Eex6kDmmIs=" }
body = { utf8 = "hello world" }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 200
connection_after = "open"

[expect.headers_present]
"x-amz-checksum-xxhash3" = "1Eex6kDmmIs="
