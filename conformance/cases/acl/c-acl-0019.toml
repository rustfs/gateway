[case]
id = "c-acl-0019"
schema_version = 3
title = "bucket-owner-full-control on a bucket is a 400 InvalidArgument"
rationale = """
The mirror of c-acl-0018 across the other boundary of the split set, and the direction a union would also let through. A bucket has no bucket owner distinct from its own owner, so the value describes nothing here; storing it would produce a policy whose meaning depends on a resource relationship that does not exist."""
polarity = "negative"
operation = "PutBucketAcl"
tags = ["acl", "error-shape"]
timeout_ms = 10000
quirks = ["q-acl-0005"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/userguide/acl-overview.html#canned-acl"
summary = "The canned-ACL table restricts the two bucket-owner values to objects."
kind = "aws-doc"

[[setup.buckets]]
name = "conf-acl"

[request]
method = "PUT"
target = "/conf-acl?acl"
headers = { "x-amz-acl" = "bucket-owner-full-control" }
content_md5 = "computed"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 400
connection_after = "open"

[expect.error]
code = "InvalidArgument"
message_present = true
