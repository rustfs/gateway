[case]
id = "c-acl-0015"
schema_version = 1
title = "A bucket ACL write with no Content-MD5 and no checksum header is refused before the body"
rationale = """
This operation is in the set AWS marks as requiring an integrity header, and the requirement lives in a Smithy trait the lowering does not read — so it is stated in the overlay, and an overlay entry nothing exercises is a claim rather than a rule. The refusal has to happen before the body is parsed: a permission document accepted on an unverifiable request is a permission change whose bytes nobody can prove were the caller's."""
polarity = "negative"
operation = "PutBucketAcl"
tags = ["acl", "checksum", "security", "error-shape"]
timeout_ms = 10000
quirks = ["q-acl-0009"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutBucketAcl.html"
summary = "The request syntax documents Content-MD5 as required for this operation."
kind = "aws-doc"

[[setup.buckets]]
name = "conf-acl"

[request]
method = "PUT"
target = "/conf-acl?acl"
headers = { "content-type" = "application/xml" }
body = { utf8 = '<AccessControlPolicy><Owner><ID>3f6e2b1c4a8d90e7b5c31f2a6d80e4c97b1a3d5f8e206c4b7a9d1e3f5c7b9a0d</ID><DisplayName>conformance</DisplayName></Owner><AccessControlList><Grant><Grantee><ID>3f6e2b1c4a8d90e7b5c31f2a6d80e4c97b1a3d5f8e206c4b7a9d1e3f5c7b9a0d</ID></Grantee><Permission>FULL_CONTROL</Permission></Grant></AccessControlList></AccessControlPolicy>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 400
connection_after = "open"

[expect.error]
code = "InvalidRequest"
message_present = true
