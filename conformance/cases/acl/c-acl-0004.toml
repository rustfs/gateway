[case]
id = "c-acl-0004"
schema_version = 3
title = "Four grants of three grantee kinds keep their order inside one AccessControlList wrapper"
rationale = """
Two wire facts meet here and only a byte comparison sees both. The grants are wrapped in a single AccessControlList element rather than repeated flat under the root, which is the opposite of the Contents and Rule lists elsewhere in this surface — a flattened serialization reads to every SDK as an ACL with no grants, which is an ACL that permits nothing. And the order the client wrote is the order it gets back, because a reordered ACL is a document an auditor diffs against its own records."""
polarity = "positive"
operation = "GetBucketAcl"
tags = ["acl", "xml", "wire-bytes"]
timeout_ms = 10000
quirks = ["q-acl-0001", "q-acl-0003"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_GetBucketAcl.html"
summary = "The documented response wraps every Grant in one AccessControlList element under the AccessControlPolicy root."
kind = "aws-doc"

[[case.evidence]]
url = "https://github.com/s3s-project/s3s/issues/264"
summary = "Upstream shipped response roots without the S3 namespace and strict clients refused them."
kind = "s3s-issue"

[[setup.buckets]]
name = "conf-acl"

[[exchanges]]
name = "write-four-grants"

[exchanges.request]
method = "PUT"
target = "/conf-acl?acl"
headers = { "content-type" = "application/xml" }
content_md5 = "computed"
body = { utf8 = '<AccessControlPolicy><Owner><ID>3f6e2b1c4a8d90e7b5c31f2a6d80e4c97b1a3d5f8e206c4b7a9d1e3f5c7b9a0d</ID><DisplayName>conformance</DisplayName></Owner><AccessControlList><Grant><Grantee><ID>3f6e2b1c4a8d90e7b5c31f2a6d80e4c97b1a3d5f8e206c4b7a9d1e3f5c7b9a0d</ID><DisplayName>conformance</DisplayName></Grantee><Permission>FULL_CONTROL</Permission></Grant><Grant><Grantee><URI>http://acs.amazonaws.com/groups/global/AllUsers</URI></Grantee><Permission>READ</Permission></Grant><Grant><Grantee><URI>http://acs.amazonaws.com/groups/s3/LogDelivery</URI></Grantee><Permission>WRITE</Permission></Grant><Grant><Grantee><EmailAddress>grantee@example.com</EmailAddress></Grantee><Permission>READ_ACP</Permission></Grant></AccessControlList></AccessControlPolicy>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[[exchanges]]
name = "read-back"

[exchanges.request]
method = "GET"
target = "/conf-acl?acl"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[exchanges.expect.body]
golden = "goldens/c-acl-0004.xml"
