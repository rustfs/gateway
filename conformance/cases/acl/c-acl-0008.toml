[case]
id = "c-acl-0008"
schema_version = 3
title = "Grant header keys are case-insensitive and surrounding whitespace is tolerated"
rationale = """
The AWS SDKs do not agree on the spelling of these keys and a client cannot fix a 400 by changing anything it controls, so the tolerance is required rather than generous. It is bounded on purpose and the bound is asserted next door: accepting ID and EmailAddress must not become accepting any key at all, which c-acl-0022 pins from the other side. The two permissions come from two different headers, so a parser that read one header and stopped is visible here too."""
polarity = "positive"
operation = "PutBucketAcl"
tags = ["acl", "wire-bytes"]
timeout_ms = 10000
quirks = ["q-acl-0011"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutBucketAcl.html"
summary = "The three grantee keys are documented in mixed case, and HTTP header values carry incidental whitespace between list items."
kind = "aws-doc"

[[setup.buckets]]
name = "conf-acl"

[[exchanges]]
name = "grant-by-header"

[exchanges.request]
method = "PUT"
target = "/conf-acl?acl"
headers = { "x-amz-grant-full-control" = '  ID="9c11ab5a4d8e37f0b2c6d19e4a730f85c2b6d4a1e93f70c58b2d6a4e1c93f705"  ', "x-amz-grant-read" = 'URI = "http://acs.amazonaws.com/groups/global/AuthenticatedUsers"' }
content_md5 = "computed"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[[exchanges]]
name = "read-back"

[exchanges.request]
method = "GET"
target = "/conf-acl?acl"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[exchanges.expect.body]
golden = "goldens/c-acl-0008.xml"
