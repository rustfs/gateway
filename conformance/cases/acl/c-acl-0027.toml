[case]
id = "c-acl-0027"
schema_version = 3
title = "A canned ACL beside a grant header is accepted, because only the body exclusion is documented"
rationale = """
The leniency the channel rule stops at. AWS documents the body-versus-headers exclusion and documents no exclusion between the two header spellings, so refusing this combination would be a rule of this project's invention — and an invented refusal on an authorization input is a request a correct client cannot make. The case exists so that the exclusion cannot quietly widen: a gateway that refused everything with more than one ACL header would satisfy c-acl-0013 and c-acl-0014 and fail here."""
polarity = "negative"
operation = "PutBucketAcl"
tags = ["acl"]
timeout_ms = 10000
quirks = ["q-acl-0007"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutBucketAcl.html"
summary = "The request reference excludes the body from the headers and states no exclusion among the headers themselves."
kind = "aws-doc"

[[setup.buckets]]
name = "conf-acl"

[request]
method = "PUT"
target = "/conf-acl?acl"
headers = { "x-amz-acl" = "private", "x-amz-grant-read" = 'uri="http://acs.amazonaws.com/groups/global/AllUsers"' }
content_md5 = "computed"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 200
connection_after = "open"
