[case]
id = "c-acl-0010"
schema_version = 3
title = "bucket-owner-full-control is accepted on an object, which is the only place it means anything"
rationale = """
The object half of the split set, and the canned ACL a cross-account uploader is told to send so that the destination bucket's owner can read what it wrote. Refusing it would break the documented cross-account upload; accepting it on a bucket would store a grant naming an owner the bucket does not have, which c-acl-0019 refuses from the other side."""
polarity = "positive"
operation = "PutObjectAcl"
tags = ["acl"]
timeout_ms = 10000
quirks = ["q-acl-0005"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/userguide/acl-overview.html#canned-acl"
summary = "The canned-ACL table lists bucket-owner-full-control as applying to an object and to nothing else."
kind = "aws-doc"

[[setup.buckets]]
name = "conf-acl"

[[setup.objects]]
bucket = "conf-acl"
key = "doc.txt"
body = { utf8 = "payload" }

[request]
method = "PUT"
target = "/conf-acl/doc.txt?acl"
headers = { "x-amz-acl" = "bucket-owner-full-control" }
content_md5 = "computed"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 200
connection_after = "open"
