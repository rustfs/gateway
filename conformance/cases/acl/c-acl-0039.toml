[case]
id = "c-acl-0039"
schema_version = 1
title = "An xsi:type whose prefix nothing declared is not the attribute, and does not refuse the write"
rationale = """
The other direction of c-acl-0035, and the one that makes the namespace resolution falsifiable. The two bodies carry the same bogus discriminator; this one never binds the prefix. A reader that stored attributes under their literal prefixed name would see 'xsi:type=Wombat' here too and refuse — so the 200 is what says the declaration is what the lookup goes through. An undeclared prefix is a namespace-well-formedness error and names a namespace the document never bound, so the reader's answer is that the attribute was not written; the grantee is then classified by its ID, exactly as every SDK that omits the attribute already is."""
polarity = "positive"
operation = "PutBucketAcl"
tags = ["acl", "xml", "known-divergence"]
timeout_ms = 10000
quirks = ["q-acl-0003", "q-acl-0014"]

[[case.evidence]]
url = "https://www.w3.org/TR/xml-names/#nsc-NSDeclared"
summary = "Namespaces in XML makes a prefix that no declaration binds a namespace-well-formedness error rather than a name in some namespace."
kind = "rfc"

[[setup.buckets]]
name = "conf-acl"

[[exchanges]]
name = "write-with-an-unbound-prefix"

[exchanges.request]
method = "PUT"
target = "/conf-acl?acl"
headers = { "content-type" = "application/xml", "content-md5" = "lpSGr0mhjRZQA2ItzGPD4g==" }
body = { utf8 = '<AccessControlPolicy><Owner><ID>3f6e2b1c4a8d90e7b5c31f2a6d80e4c97b1a3d5f8e206c4b7a9d1e3f5c7b9a0d</ID><DisplayName>conformance</DisplayName></Owner><AccessControlList><Grant><Grantee xsi:type="Wombat"><ID>3f6e2b1c4a8d90e7b5c31f2a6d80e4c97b1a3d5f8e206c4b7a9d1e3f5c7b9a0d</ID></Grantee><Permission>FULL_CONTROL</Permission></Grant></AccessControlList></AccessControlPolicy>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[[exchanges]]
name = "read-back-classifies-by-the-identifying-member"

[exchanges.request]
method = "GET"
target = "/conf-acl?acl"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[exchanges.expect.body]
golden = "goldens/c-acl-0039.xml"
