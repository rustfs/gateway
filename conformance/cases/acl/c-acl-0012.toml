[case]
id = "c-acl-0012"
schema_version = 3
title = "All five permissions round-trip, each on its own grant and in the order written"
rationale = """
Five values, one document: a codec that dropped WRITE_ACP or folded READ_ACP into READ would still answer a well-formed policy, and a case checking one permission at a time would pass through the fold. The permission is the half of a grant that says what may be done, so a value quietly changed on the way through is a permission change nobody requested and nothing reports."""
polarity = "positive"
operation = "PutBucketAcl"
tags = ["acl", "xml", "wire-bytes"]
timeout_ms = 10000
quirks = ["q-acl-0012"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/userguide/acl-overview.html#permissions"
summary = "The permissions table enumerates exactly five values and describes what each one grants."
kind = "aws-doc"

[[setup.buckets]]
name = "conf-acl"

[[exchanges]]
name = "write-every-permission"

[exchanges.request]
method = "PUT"
target = "/conf-acl?acl"
headers = { "content-type" = "application/xml" }
content_md5 = "computed"
body = { utf8 = '<AccessControlPolicy><Owner><ID>3f6e2b1c4a8d90e7b5c31f2a6d80e4c97b1a3d5f8e206c4b7a9d1e3f5c7b9a0d</ID><DisplayName>conformance</DisplayName></Owner><AccessControlList><Grant><Grantee><ID>3f6e2b1c4a8d90e7b5c31f2a6d80e4c97b1a3d5f8e206c4b7a9d1e3f5c7b9a0d</ID></Grantee><Permission>FULL_CONTROL</Permission></Grant><Grant><Grantee><ID>3f6e2b1c4a8d90e7b5c31f2a6d80e4c97b1a3d5f8e206c4b7a9d1e3f5c7b9a0d</ID></Grantee><Permission>WRITE</Permission></Grant><Grant><Grantee><ID>3f6e2b1c4a8d90e7b5c31f2a6d80e4c97b1a3d5f8e206c4b7a9d1e3f5c7b9a0d</ID></Grantee><Permission>WRITE_ACP</Permission></Grant><Grant><Grantee><ID>3f6e2b1c4a8d90e7b5c31f2a6d80e4c97b1a3d5f8e206c4b7a9d1e3f5c7b9a0d</ID></Grantee><Permission>READ</Permission></Grant><Grant><Grantee><ID>3f6e2b1c4a8d90e7b5c31f2a6d80e4c97b1a3d5f8e206c4b7a9d1e3f5c7b9a0d</ID></Grantee><Permission>READ_ACP</Permission></Grant></AccessControlList></AccessControlPolicy>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[[exchanges]]
name = "read-back"

[exchanges.request]
method = "GET"
target = "/conf-acl?acl"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[exchanges.expect.body]
golden = "goldens/c-acl-0012.xml"
