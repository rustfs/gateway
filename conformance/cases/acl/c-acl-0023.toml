[case]
id = "c-acl-0023"
schema_version = 3
title = "A grant header past its byte ceiling is refused at the bound, not parsed"
rationale = """
A grant header is a short list of identities, and nothing about the wire stops a client from sending nine kilobytes of them. Without a ceiling the parser allocates a vector whose size the sender chose, before anything has decided the request is even well formed. Refusing at the bound rather than after parsing is what makes the ceiling a limit rather than a report, and the refusal must not echo the value that hit it."""
polarity = "negative"
operation = "PutBucketAcl"
tags = ["acl", "dos", "security", "error-shape"]
timeout_ms = 10000
quirks = ["q-acl-0010", "q-acl-0011"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/userguide/acl-overview.html"
summary = "AWS caps an access control list at 100 grants, so a header naming more cannot describe a storable ACL."
kind = "aws-doc"

[[setup.buckets]]
name = "conf-acl"

[request]
method = "PUT"
target = "/conf-acl?acl"
headers = { "x-amz-grant-read" = 'id=""' }
content_md5 = "computed"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 400
connection_after = "open"

[expect.error]
code = "InvalidArgument"
message_present = true

[expect.body]
not_contains_utf8 = ["uuuuuuuuuuuuuuuu"]
