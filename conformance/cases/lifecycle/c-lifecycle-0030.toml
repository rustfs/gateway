[case]
id = "c-lifecycle-0030"
schema_version = 1
title = "A lifecycle write whose Content-MD5 is the digest of a different document is 400 BadDigest and stores nothing"
rationale = """
c-lifecycle-0012 proves the integrity header must be present on this operation, and c-lifecycle-0016 proves an empty body is refused before it can be stored; neither can prove the declared digest is compared to anything at all. A gateway that read content-md5 and matched it against nothing would satisfy both while telling every client its retention policy arrived intact. This is the direction those two cannot reach: a well-formed digest naming bytes other than the ones that arrived. The digest here is the real digest of the same document with Disabled in place of Enabled, which is exactly the shape the check exists for — a rule set mutated in flight now differs from the one the client signed for by the one member that decides whether objects expire, and a lifecycle family is the family where that silent difference costs data rather than a request. The read-back is the half that says nothing was written: a gateway that verified after storing would answer this same 400 and leave the document installed, so the second exchange demands the bucket still have no lifecycle configuration at all."""
polarity = "negative"
operation = "PutBucketLifecycleConfiguration"
tags = ["lifecycle", "checksum", "error-shape"]
timeout_ms = 10000
quirks = []

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutBucketLifecycleConfiguration.html"
summary = "The write reference documents Content-MD5 as required for this operation, which is the header this case gets wrong on purpose."
kind = "aws-doc"

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/ErrorResponses.html"
summary = "The error list gives BadDigest for a Content-MD5 that disagrees with the body it accompanies."
kind = "aws-doc"


[[setup.buckets]]
name = "conf-lifecycle"

[[exchanges]]
name = "write-carrying-the-digest-of-a-disabled-rule"

[exchanges.request]
method = "PUT"
target = "/conf-lifecycle?lifecycle"
headers = { "content-type" = "application/xml", "content-md5" = "/l0gqxCWEnh4frHGVWALKA==" }
body = { utf8 = '<LifecycleConfiguration xmlns="http://s3.amazonaws.com/doc/2006-03-01/"><Rule><Expiration><Days>30</Days></Expiration><ID>expire-logs</ID><Filter><Prefix>logs/</Prefix></Filter><Status>Enabled</Status></Rule></LifecycleConfiguration>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 400
connection_after = "open"

[exchanges.expect.error]
code = "BadDigest"
request_id_present = true

[exchanges.expect.headers_present]
"content-type" = "application/xml"

[[exchanges]]
name = "read-back-shows-no-document-was-stored"

[exchanges.request]
method = "GET"
target = "/conf-lifecycle?lifecycle"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 404
connection_after = "open"

[exchanges.expect.error]
code = "NoSuchLifecycleConfiguration"
request_id_present = true
