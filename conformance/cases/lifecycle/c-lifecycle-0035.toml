# c-lifecycle-0035 — a character XML 1.0 cannot represent is refused at the body boundary.
#
# Schema dimensions exercised: U+0000, raw, in the tag key, in Filter.And.Tag.Key.

[case]
id = "c-lifecycle-0035"
schema_version = 1
title = "A raw U+0000 in a filter <Key> is refused rather than stored and echoed"
rationale = """
A filter tag key reaches the same refusal as its siblings, which is the point: the defect this pins was that one of the four string members of this document was refused and three were not, and a member fixed alone reproduces the asymmetry. NUL is the one C0 control several implementations special-case, so it is the one most likely to be handled by a separate path."""
polarity = "negative"
operation = "PutBucketLifecycleConfiguration"
tags = ["lifecycle", "xml", "encoding", "security"]
timeout_ms = 10000
quirks = []

[[case.evidence]]
url = "https://www.w3.org/TR/xml/#charsets"
summary = "The XML specification excludes most C0 control characters from documents entirely, escaped or not."
kind = "other"

[[case.evidence]]
url = "https://github.com/aws/aws-sdk-java/issues/333"
summary = "A captured DeleteObjects request body carrying the same class of character was answered by real S3 with MalformedXML and 400, in both the raw and the character-reference spelling."
kind = "observed"


[[setup.buckets]]
name = "conf-lifecycle"

[request]
method = "PUT"
target = "/conf-lifecycle?lifecycle"
headers = { "content-type" = "application/xml", "content-md5" = "RYiVuJlxt2Ge7GC2W584Sw==" }
body = { utf8 = "<LifecycleConfiguration><Rule><ID>logs</ID><Status>Enabled</Status><Filter><And><Prefix>logs/</Prefix><Tag><Key>te\u0000am</Key><Value>ops</Value></Tag></And></Filter><Expiration><Days>1</Days></Expiration></Rule></LifecycleConfiguration>" }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 400
connection_after = "open"

[expect.error]
code = "MalformedXML"
request_id_present = true

[expect.headers_present]
"content-type" = "application/xml"

[expect.body]
redact = ["RequestId", "HostId"]
exact_utf8 = '''
<?xml version="1.0" encoding="UTF-8"?>
<Error><Code>MalformedXML</Code><Message>the request body is not the XML this operation accepts</Message><RequestId>__REDACTED__</RequestId><HostId>__REDACTED__</HostId></Error>'''
