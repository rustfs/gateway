[case]
id = "c-lifecycle-0018"
schema_version = 3
title = "Lifecycle keeps MinIO's DelMarkerExpiration and skips an unknown future element without losing known members"
rationale = """
The lenient HTTP read is a durability promise: a lifecycle document is stored configuration, re-parsed by every future release, and other implementations extend the rule vocabulary. An unregistered FutureKnob is therefore skipped while every known member survives. MinIO's DelMarkerExpiration is not unknown: RustFS reads it, and ADR-0033 makes it a member of every assembly's lifecycle codec, so it is decoded, stored and written back in its model slot after Expiration. The persisted-XML registration path is exercised separately by rustfs-gateway-dialect-minio."""
polarity = "negative"
operation = "PutBucketLifecycleConfiguration"
tags = ["lifecycle", "xml"]
timeout_ms = 10000
quirks = ["q-lc-0006", "q-lc-0015"]

[[case.evidence]]
url = "https://github.com/s3s-project/s3s/issues/613"
summary = "AWS ignores unknown elements in request XML and strict upstream parsing broke real clients."
kind = "s3s-issue"

[[case.evidence]]
url = "https://github.com/s3s-project/s3s/pull/617"
summary = "The upstream relaxation that made unknown request elements a skip rather than a refusal."
kind = "s3s-pr"

[[case.evidence]]
url = "https://github.com/s3s-project/s3s/pull/611"
summary = "MinIO's lifecycle dialect members forced upstream to fork its generated code, which is the pressure this decoder absorbs by skipping instead."
kind = "s3s-pr"


[[setup.buckets]]
name = "conf-lifecycle"

[[exchanges]]
name = "put-with-unknowns"

[exchanges.request]
method = "PUT"
target = "/conf-lifecycle?lifecycle"
headers = { "content-type" = "application/xml" }
content_md5 = "computed"
body = { utf8 = '<LifecycleConfiguration xmlns="http://s3.amazonaws.com/doc/2006-03-01/"><Rule><Expiration><Days>7</Days></Expiration><ID>dialect</ID><Filter><Prefix>del/</Prefix></Filter><Status>Enabled</Status><DelMarkerExpiration><Days>7</Days></DelMarkerExpiration><FutureKnob>on</FutureKnob></Rule></LifecycleConfiguration>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[[exchanges]]
name = "read-back-known-members"

[exchanges.request]
method = "GET"
target = "/conf-lifecycle?lifecycle"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[exchanges.expect.headers_present]
"content-type" = "application/xml"

[exchanges.expect.body]
golden = "goldens/c-lifecycle-0018.xml"
contains_utf8 = ["<DelMarkerExpiration><Days>7</Days></DelMarkerExpiration>"]
not_contains_utf8 = ["FutureKnob"]
