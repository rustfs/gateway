[case]
id = "c-lifecycle-0018"
schema_version = 3
title = "An unselected lifecycle dialect skips vendor and future elements without losing known members"
rationale = """
The lenient HTTP read is a durability promise: a lifecycle document is stored configuration, re-parsed by every future release, and other implementations extend the rule vocabulary. This fixture deliberately selects no vendor dialect, so both MinIO's registered DelMarkerExpiration spelling and an unregistered FutureKnob are skipped while every known member survives. The selected persisted path is exercised separately by rustfs-gateway-dialect-minio, where DelMarkerExpiration round-trips and FutureKnob blocks replacement; keeping this negative control proves that registering one dialect does not silently make its behavior global."""
polarity = "negative"
operation = "PutBucketLifecycleConfiguration"
tags = ["lifecycle", "xml"]
timeout_ms = 10000
quirks = ["q-lc-0006", "q-lc-0015"]

[[case.evidence]]
url = "https://github.com/s3s-project/s3s/issues/613"
summary = "AWS ignores unknown elements in request XML and strict upstream parsing broke real clients."
kind = "s3s-issue"

[[case.evidence]]
url = "https://github.com/s3s-project/s3s/pull/617"
summary = "The upstream relaxation that made unknown request elements a skip rather than a refusal."
kind = "s3s-pr"

[[case.evidence]]
url = "https://github.com/s3s-project/s3s/pull/611"
summary = "MinIO's lifecycle dialect members forced upstream to fork its generated code, which is the pressure this decoder absorbs by skipping instead."
kind = "s3s-pr"


[[setup.buckets]]
name = "conf-lifecycle"

[[exchanges]]
name = "put-with-unknowns"

[exchanges.request]
method = "PUT"
target = "/conf-lifecycle?lifecycle"
headers = { "content-type" = "application/xml" }
content_md5 = "computed"
body = { utf8 = '<LifecycleConfiguration xmlns="http://s3.amazonaws.com/doc/2006-03-01/"><Rule><Expiration><Days>7</Days></Expiration><ID>dialect</ID><Filter><Prefix>del/</Prefix></Filter><Status>Enabled</Status><DelMarkerExpiration><Days>7</Days></DelMarkerExpiration><FutureKnob>on</FutureKnob></Rule></LifecycleConfiguration>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[[exchanges]]
name = "read-back-known-members-only"

[exchanges.request]
method = "GET"
target = "/conf-lifecycle?lifecycle"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[exchanges.expect.headers_present]
"content-type" = "application/xml"

[exchanges.expect.body]
golden = "goldens/c-lifecycle-0018.xml"
not_contains_utf8 = ["DelMarkerExpiration", "FutureKnob"]
