[case]
id = "c-lifecycle-0041"
schema_version = 3
title = "An empty rule Status is an out-of-set value, stored and echoed, never a 500"
rationale = """
An empty required enumeration element is a value the client sent, not a member nobody filled. The decoder used to read it into the placeholder its type's default holds, and the decode exit check that exists to catch a decoder defect then answered 500 InternalError for the client's own document: every SDK retries a 500 as a server fault, so the client retried a request that could never succeed and finally reported the server as broken (rustfs/gateway#1078). The empty value now takes the same path as any other out-of-set Status (c-lifecycle-0028): this assembly stores it and echoes it as written, in both the paired and the self-closing spelling; a backend that refuses it, as legacy RustFS does with MalformedXML, answers 400 with its own code."""
polarity = "negative"
operation = "PutBucketLifecycleConfiguration"
tags = ["lifecycle", "xml", "error-shape"]
timeout_ms = 10000
quirks = ["q-lc-0014"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_LifecycleRule.html"
summary = "The rule's Status member is required and documents Enabled and Disabled as its value set, so an empty one is off-spec input."
kind = "aws-doc"

[[case.evidence]]
url = "https://github.com/rustfs/rustfs/blob/5851d9eb54dd920d93e70d41383bd7a377e17ba1/rustfs/src/app/bucket_usecase.rs#L1220-L1227"
summary = "Legacy RustFS receives the empty rule status from its decoder and refuses it in its handler with 400 MalformedXML."
kind = "other"

[[setup.buckets]]
name = "conf-lifecycle"

[connection]
reuse = true

[[exchanges]]
name = "paired-empty-status"

[exchanges.request]
method = "PUT"
target = "/conf-lifecycle?lifecycle"
headers = { "content-type" = "application/xml" }
content_md5 = "computed"
body = { utf8 = '<LifecycleConfiguration><Rule><Expiration><Days>30</Days></Expiration><ID>empty</ID><Filter><Prefix>logs/</Prefix></Filter><Status></Status></Rule></LifecycleConfiguration>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[exchanges.expect.body]
size = 0

[[exchanges]]
name = "self-closing-empty-status"

[exchanges.request]
method = "PUT"
target = "/conf-lifecycle?lifecycle"
headers = { "content-type" = "application/xml" }
content_md5 = "computed"
body = { utf8 = '<LifecycleConfiguration><Rule><Expiration><Days>30</Days></Expiration><ID>empty</ID><Filter><Prefix>logs/</Prefix></Filter><Status/></Rule></LifecycleConfiguration>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[exchanges.expect.body]
size = 0

[[exchanges]]
name = "read-back"

[exchanges.request]
method = "GET"
target = "/conf-lifecycle?lifecycle"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[exchanges.expect.body]
contains_utf8 = ["<ID>empty</ID>", "<Status></Status>"]
