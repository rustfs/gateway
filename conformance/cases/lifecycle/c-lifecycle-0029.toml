[case]
id = "c-lifecycle-0029"
schema_version = 1
title = "Non-numeric, overflowing and unparsable member values are 400 — never a panic, never a wrap"
rationale = """
Integer and timestamp members are where a decoder crashes or silently wraps: a twenty-digit Days must not overflow into an arbitrary retention, a word must not take the process down, and a malformed Date must not be guessed at. Each arrives as a 400 naming the member, with bounded response time, which is the assertion that the parser refused rather than malfunctioned."""
polarity = "negative"
operation = "PutBucketLifecycleConfiguration"
tags = ["lifecycle", "dos", "error-shape"]
timeout_ms = 10000
quirks = []

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_LifecycleExpiration.html"
summary = "Days is an integer number of days and Date is an ISO 8601 timestamp, which admit no other lexical form."
kind = "aws-doc"


[[setup.buckets]]
name = "conf-lifecycle"

[[exchanges]]
name = "non-numeric-days"

[exchanges.request]
method = "PUT"
target = "/conf-lifecycle?lifecycle"
headers = { "content-type" = "application/xml", "content-md5" = "iJasTStqv/JMu+yB/htbXw==" }
body = { utf8 = '<LifecycleConfiguration><Rule><Expiration><Days>thirty</Days></Expiration><ID>w</ID><Filter><Prefix>a/</Prefix></Filter><Status>Enabled</Status></Rule></LifecycleConfiguration>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 400
connection_after = "open"

[exchanges.expect.error]
code = "InvalidArgument"
request_id_present = true

[exchanges.expect.headers_present]
"content-type" = "application/xml"

[exchanges.expect.body]
redact = ["RequestId", "HostId"]
exact_utf8 = '''
<?xml version="1.0" encoding="UTF-8"?>
<Error><Code>InvalidArgument</Code><Message>the request carries a value this member cannot hold</Message><Resource>Days</Resource><RequestId>__REDACTED__</RequestId><HostId>__REDACTED__</HostId></Error>'''

[[exchanges]]
name = "beyond-i32-days"

[exchanges.request]
method = "PUT"
target = "/conf-lifecycle?lifecycle"
headers = { "content-type" = "application/xml", "content-md5" = "hZ01bR1VhEl2JT0BAJWN3Q==" }
body = { utf8 = '<LifecycleConfiguration><Rule><Expiration><Days>99999999999999999999</Days></Expiration><ID>w</ID><Filter><Prefix>a/</Prefix></Filter><Status>Enabled</Status></Rule></LifecycleConfiguration>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 400
connection_after = "open"

[exchanges.expect.timing]
terminate_within_ms = 5000

[exchanges.expect.error]
code = "InvalidArgument"
request_id_present = true

[exchanges.expect.headers_present]
"content-type" = "application/xml"

[exchanges.expect.body]
redact = ["RequestId", "HostId"]
exact_utf8 = '''
<?xml version="1.0" encoding="UTF-8"?>
<Error><Code>InvalidArgument</Code><Message>the request carries a value this member cannot hold</Message><Resource>Days</Resource><RequestId>__REDACTED__</RequestId><HostId>__REDACTED__</HostId></Error>'''

[[exchanges]]
name = "unparsable-date"

[exchanges.request]
method = "PUT"
target = "/conf-lifecycle?lifecycle"
headers = { "content-type" = "application/xml", "content-md5" = "TQUHT7vbA+hKO5KsUrjdCw==" }
body = { utf8 = '<LifecycleConfiguration><Rule><Expiration><Date>tomorrow</Date></Expiration><ID>w</ID><Filter><Prefix>a/</Prefix></Filter><Status>Enabled</Status></Rule></LifecycleConfiguration>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 400
connection_after = "open"

[exchanges.expect.error]
code = "InvalidArgument"
request_id_present = true

[exchanges.expect.headers_present]
"content-type" = "application/xml"

[exchanges.expect.body]
redact = ["RequestId", "HostId"]
exact_utf8 = '''
<?xml version="1.0" encoding="UTF-8"?>
<Error><Code>InvalidArgument</Code><Message>the request carries a value this member cannot hold</Message><Resource>Date</Resource><RequestId>__REDACTED__</RequestId><HostId>__REDACTED__</HostId></Error>'''
