[case]
id = "c-lifecycle-0002"
schema_version = 1
title = "A stored three-rule document reads back as flattened Rule siblings under an xmlns-bearing root"
rationale = """
The read-back is where the flattened shape becomes observable: every SDK parses Rule as repeated children of the LifecycleConfiguration root, so a serializer that introduces a Rules wrapper returns a document in which every SDK finds zero rules — the whole configuration silently invisible. The root's xmlns is pinned for the same reason: strict parsers refuse an unnamespaced root. Byte-level comparison is the only assertion that notices either."""
polarity = "positive"
operation = "GetBucketLifecycleConfiguration"
tags = ["lifecycle", "xml", "wire-bytes"]
timeout_ms = 10000
quirks = ["q-lc-0002", "q-lc-0003"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_GetBucketLifecycleConfiguration.html"
summary = "The documented response syntax shows Rule elements as direct children of the LifecycleConfiguration root with no wrapper."
kind = "aws-doc"

[[case.evidence]]
url = "https://github.com/s3s-project/s3s/issues/264"
summary = "Upstream shipped response roots without the S3 xmlns and strict clients refused them."
kind = "s3s-issue"


[[setup.buckets]]
name = "conf-lifecycle"

[[exchanges]]
name = "put-three-rules"

[exchanges.request]
method = "PUT"
target = "/conf-lifecycle?lifecycle"
headers = { "content-type" = "application/xml", "content-md5" = "cm9W2PJNmo2mA6/br3mGaQ==" }
body = { utf8 = '<LifecycleConfiguration><Rule><Expiration><Days>30</Days></Expiration><ID>logs</ID><Filter><Prefix>logs/</Prefix></Filter><Status>Enabled</Status></Rule><Rule><Expiration><Days>7</Days></Expiration><ID>tmp</ID><Filter><Prefix>tmp/</Prefix></Filter><Status>Disabled</Status></Rule><Rule><ID>abort-mpu</ID><Filter><Prefix>mpu/</Prefix></Filter><Status>Enabled</Status><AbortIncompleteMultipartUpload><DaysAfterInitiation>7</DaysAfterInitiation></AbortIncompleteMultipartUpload></Rule></LifecycleConfiguration>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[[exchanges]]
name = "read-back"

[exchanges.request]
method = "GET"
target = "/conf-lifecycle?lifecycle"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[exchanges.expect.headers_present]
"content-type" = "application/xml"

[exchanges.expect.body]
golden = "goldens/c-lifecycle-0002.xml"
not_contains_utf8 = ["<Rules>"]
