[case]
id = "c-lifecycle-0004"
schema_version = 3
title = "A midnight-UTC expiration date survives the round trip in the ISO 8601 millisecond form"
rationale = """
The Date member is constrained to midnight UTC and rendered with milliseconds; a serializer that drops the fractional part or shifts the zone returns a document whose date no longer matches what the client signed and stored. Pinning the round trip byte for byte is what catches a renderer that re-derives the timestamp instead of preserving the instant."""
polarity = "positive"
operation = "GetBucketLifecycleConfiguration"
tags = ["lifecycle", "xml", "wire-bytes"]
timeout_ms = 10000
quirks = ["q-lc-0009"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_LifecycleExpiration.html"
summary = "The Date member is ISO 8601 with the time component always midnight UTC."
kind = "aws-doc"


[[setup.buckets]]
name = "conf-lifecycle"

[[exchanges]]
name = "put-date"

[exchanges.request]
method = "PUT"
target = "/conf-lifecycle?lifecycle"
headers = { "content-type" = "application/xml" }
content_md5 = "computed"
body = { utf8 = '<LifecycleConfiguration><Rule><Expiration><Date>2030-01-01T00:00:00.000Z</Date></Expiration><ID>on-date</ID><Filter><Prefix>data/</Prefix></Filter><Status>Enabled</Status></Rule></LifecycleConfiguration>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[[exchanges]]
name = "read-back"

[exchanges.request]
method = "GET"
target = "/conf-lifecycle?lifecycle"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[exchanges.expect.headers_present]
"content-type" = "application/xml"

[exchanges.expect.body]
golden = "goldens/c-lifecycle-0004.xml"
