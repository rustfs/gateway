# c-lifecycle-0034 — a character XML 1.0 cannot represent is refused at the body boundary.
#
# Schema dimensions exercised: U+000B, raw, in the key prefix, in Filter.And.Prefix.

[case]
id = "c-lifecycle-0034"
schema_version = 1
title = "A raw U+000B in <Prefix> is refused rather than stored and echoed"
rationale = """
The same rule as the identifier, on a different kind of member: a key prefix is caller-chosen free text, and the vertical tab is the C0 control most often mistaken for legal whitespace because tab and newline are. It is not — XML 1.0 admits exactly tab, newline and carriage return — so a prefix carrying one has no spelling in any document, escaped or raw."""
polarity = "negative"
operation = "PutBucketLifecycleConfiguration"
tags = ["lifecycle", "xml", "encoding", "security"]
timeout_ms = 10000
quirks = []

[[case.evidence]]
url = "https://www.w3.org/TR/xml/#charsets"
summary = "The XML specification excludes most C0 control characters from documents entirely, escaped or not."
kind = "other"

[[case.evidence]]
url = "https://github.com/aws/aws-sdk-java/issues/333"
summary = "A captured DeleteObjects request body carrying the same class of character was answered by real S3 with MalformedXML and 400, in both the raw and the character-reference spelling."
kind = "observed"


[[setup.buckets]]
name = "conf-lifecycle"

[request]
method = "PUT"
target = "/conf-lifecycle?lifecycle"
headers = { "content-type" = "application/xml", "content-md5" = "8mC/s7hgdo7V0Gt4WpQxPQ==" }
body = { utf8 = "<LifecycleConfiguration><Rule><ID>logs</ID><Status>Enabled</Status><Filter><And><Prefix>logs\u000B/</Prefix><Tag><Key>team</Key><Value>ops</Value></Tag></And></Filter><Expiration><Days>1</Days></Expiration></Rule></LifecycleConfiguration>" }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 400
connection_after = "open"

[expect.error]
code = "MalformedXML"
request_id_present = true

[expect.headers_present]
"content-type" = "application/xml"

[expect.body]
redact = ["RequestId", "HostId"]
exact_utf8 = '''
<?xml version="1.0" encoding="UTF-8"?>
<Error><Code>MalformedXML</Code><Message>the request body is not the XML this operation accepts</Message><RequestId>__REDACTED__</RequestId><HostId>__REDACTED__</HostId></Error>'''
