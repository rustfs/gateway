[case]
id = "c-lifecycle-0013"
schema_version = 1
title = "An unconfigured bucket answers the lifecycle read with 404 NoSuchLifecycleConfiguration, never an empty 200"
rationale = """
Clients branch on the code, not the number: NoSuchBucket means the bucket is gone, NoSuchLifecycleConfiguration means the bucket is fine and retention is simply not configured. Worse than the wrong code is a 200 with an empty document, which tooling reads as a configuration that exists and expires nothing — and then re-saves, making the misreading durable. The body is pinned byte for byte so a renderer that swaps the code for the message fails here."""
polarity = "negative"
operation = "GetBucketLifecycleConfiguration"
tags = ["lifecycle", "error-shape"]
timeout_ms = 10000
quirks = ["q-lc-0001"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_GetBucketLifecycleConfiguration.html"
summary = "The error table lists NoSuchLifecycleConfiguration with status 404 for an unconfigured bucket."
kind = "aws-doc"

[[case.evidence]]
url = "https://github.com/s3s-project/s3s/pull/515"
summary = "Upstream had to backfill missing error codes because clients branch on the specific code string."
kind = "s3s-pr"


[[setup.buckets]]
name = "conf-lifecycle"

[request]
method = "GET"
target = "/conf-lifecycle?lifecycle"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 404
connection_after = "open"

[expect.error]
code = "NoSuchLifecycleConfiguration"
request_id_present = true

[expect.headers_present]
"content-type" = "application/xml"

[expect.body]
redact = ["RequestId", "HostId"]
exact_utf8 = '''
<?xml version="1.0" encoding="UTF-8"?>
<Error><Code>NoSuchLifecycleConfiguration</Code><Message>The lifecycle configuration does not exist</Message><RequestId>__REDACTED__</RequestId><HostId>__REDACTED__</HostId></Error>'''
