[case]
id = "c-lifecycle-0028"
schema_version = 3
title = "A Status outside the documented pair is stored and echoed rather than refused"
rationale = """
The deliberate leniency, pinned so it cannot be tightened by accident: a stored configuration is re-parsed by every future release, and the persistence path fails open — a Status spelling refused tomorrow that was accepted yesterday downgrades the whole document to none and turns retention off silently. The read-back golden proves the value is preserved as sent, not corrected to the canonical spelling, because rewriting stored bytes is a second way to surprise the next parser."""
polarity = "negative"
operation = "PutBucketLifecycleConfiguration"
tags = ["lifecycle", "xml", "known-divergence"]
timeout_ms = 10000
quirks = ["q-lc-0014"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_LifecycleRule.html"
summary = "The Status member documents Enabled and Disabled as its value set; passing out-of-set spellings through is this project's recorded fail-open decision."
kind = "aws-doc"

[[case.evidence]]
url = "https://github.com/s3s-project/s3s/issues/428"
summary = "Upstream's lifecycle types could not round-trip stored documents, the failure a strict enum decode reintroduces."
kind = "s3s-issue"


[[setup.buckets]]
name = "conf-lifecycle"

[[exchanges]]
name = "lowercase-status"

[exchanges.request]
method = "PUT"
target = "/conf-lifecycle?lifecycle"
headers = { "content-type" = "application/xml" }
content_md5 = "computed"
body = { utf8 = '<LifecycleConfiguration><Rule><Expiration><Days>30</Days></Expiration><ID>lax</ID><Filter><Prefix>lax/</Prefix></Filter><Status>enabled</Status></Rule></LifecycleConfiguration>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[[exchanges]]
name = "read-back"

[exchanges.request]
method = "GET"
target = "/conf-lifecycle?lifecycle"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[exchanges.expect.headers_present]
"content-type" = "application/xml"

[exchanges.expect.body]
golden = "goldens/c-lifecycle-0028.xml"
