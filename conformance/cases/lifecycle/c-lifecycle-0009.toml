[case]
id = "c-lifecycle-0009"
schema_version = 1
title = "An empty Filter element scopes a rule to every object and survives the round trip"
rationale = """
An empty Filter is the documented spelling for a rule that applies to the whole bucket, and it is easy to break twice: a strict decoder refuses the element for having no condition, and a lenient encoder drops it on the way out — turning a valid stored rule into one with no scope at all, which a stricter future parse then refuses. Both halves are pinned here."""
polarity = "positive"
operation = "PutBucketLifecycleConfiguration"
tags = ["lifecycle", "xml"]
timeout_ms = 10000
quirks = []

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/userguide/intro-lifecycle-rules.html"
summary = "The lifecycle rules guide shows an empty Filter element as the spelling for a rule that applies to all objects in the bucket."
kind = "aws-doc"


[[setup.buckets]]
name = "conf-lifecycle"

[[exchanges]]
name = "put-empty-filter"

[exchanges.request]
method = "PUT"
target = "/conf-lifecycle?lifecycle"
headers = { "content-type" = "application/xml", "content-md5" = "ULAod+/NOWnGoEUw95GAnQ==" }
body = { utf8 = '<LifecycleConfiguration><Rule><Expiration><Days>30</Days></Expiration><ID>everything</ID><Filter></Filter><Status>Enabled</Status></Rule></LifecycleConfiguration>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[[exchanges]]
name = "read-back"

[exchanges.request]
method = "GET"
target = "/conf-lifecycle?lifecycle"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[exchanges.expect.headers_present]
"content-type" = "application/xml"

[exchanges.expect.body]
golden = "goldens/c-lifecycle-0009.xml"
