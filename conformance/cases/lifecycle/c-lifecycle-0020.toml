[case]
id = "c-lifecycle-0020"
schema_version = 3
title = "An And with a single condition is refused as MalformedXML"
rationale = """
An And that combines nothing is a document generated by broken tooling, and accepting it would freeze that tooling's bug into stored data: the next writer that round-trips the configuration has to decide whether the And was meaningful. Refusing at the write keeps the single-condition spelling canonical — the condition goes directly under Filter."""
polarity = "negative"
operation = "PutBucketLifecycleConfiguration"
tags = ["lifecycle", "xml", "error-shape"]
timeout_ms = 10000
quirks = ["q-lc-0007"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/userguide/intro-lifecycle-rules.html"
summary = "The guide's And element exists to combine more than one filter condition."
kind = "aws-doc"


[[setup.buckets]]
name = "conf-lifecycle"

[[exchanges]]
name = "single-condition-and"

[exchanges.request]
method = "PUT"
target = "/conf-lifecycle?lifecycle"
headers = { "content-type" = "application/xml" }
content_md5 = "computed"
body = { utf8 = '<LifecycleConfiguration><Rule><Expiration><Days>30</Days></Expiration><ID>bad</ID><Filter><And><Prefix>logs/</Prefix></And></Filter><Status>Enabled</Status></Rule></LifecycleConfiguration>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 400
connection_after = "open"

[exchanges.expect.error]
code = "MalformedXML"
request_id_present = true

[exchanges.expect.headers_present]
"content-type" = "application/xml"

[exchanges.expect.body]
redact = ["RequestId", "HostId"]
exact_utf8 = '''
<?xml version="1.0" encoding="UTF-8"?>
<Error><Code>MalformedXML</Code><Message>An And must contain at least two conditions</Message><RequestId>__REDACTED__</RequestId><HostId>__REDACTED__</HostId></Error>'''
