# c-object-0048 — a non-account spelling cannot satisfy the owner assertion.

[case]
id = "c-object-0048"
schema_version = 1
title = "A malformed expected bucket owner fails closed"
rationale = """
The header names an account id, and a value outside that vocabulary cannot identify the actual
owner. Treating malformed input as if the header were absent would turn an explicit cross-account
guard off, so it must take the same caller-visible refusal as any other mismatch."""
polarity = "negative"
operation = "GetObject"
tags = ["security", "error-shape"]
timeout_ms = 10000
quirks = []

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_GetObject.html"
summary = "The request header identifies the expected owner by account id, and only a match with the actual owner avoids the documented 403 refusal."
kind = "aws-doc"

[clock]
fixed = "2026-01-02T03:04:05Z"

[[setup.buckets]]
name = "conf-object-owner-gate"

[[setup.objects]]
bucket = "conf-object-owner-gate"
key = "malformed/read.txt"
content_type = "text/plain"
body = { utf8 = "must not be returned" }

[request]
method = "GET"
target = "/conf-object-owner-gate/malformed/read.txt"
headers = { "x-amz-expected-bucket-owner" = "not-an-account-id" }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 403
connection_after = "open"
headers_absent = ["etag", "x-amz-version-id"]

[expect.error]
code = "AccessDenied"
request_id_present = true

[expect.body]
redact = ["RequestId", "HostId"]
contains_utf8 = ["<Code>AccessDenied</Code>"]
not_contains_utf8 = ["must not be returned"]
