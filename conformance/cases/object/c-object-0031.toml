[case]
id = "c-object-0031"
schema_version = 1
title = "response-cache-control carrying a bare line feed is refused, not quietly dropped"
rationale = """
A bare LF ends a header line for a large share of deployed parsers even where the grammar demands the pair, so an implementation that only looks for CRLF leaves the split reachable through half of it. This parameter is asserted on its own because the six overrides are six separate query readings: a corpus that proved the rule once, on whichever parameter its author happened to pick, would go green with five of them still copying the caller's bytes into the head. The stored object is present and its bytes must not appear in the answer, which is what makes this a refusal rather than a sanitised success."""
polarity = "negative"
operation = "GetObject"
tags = ["security", "presigned", "error-shape"]
timeout_ms = 10000
quirks = ["q-response-0023"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_GetObject.html"
summary = "The documented read response is the authority for the headers a read returns and the query overrides it honours."
kind = "aws-doc"

[[case.evidence]]
url = "https://www.rfc-editor.org/rfc/rfc9110#section-5.5"
summary = "A field value carries no bare CR or LF, so a value that does cannot be emitted as one."
kind = "rfc"

[clock]
fixed = "2026-01-02T03:04:05Z"

[[setup.buckets]]
name = "conf-object"

[[setup.objects]]
bucket = "conf-object"
key = "overrides/inject.bin"
content_type = "text/plain"
body = { utf8 = "hello world" }

[request]
method = "GET"
target = "/conf-object/overrides/inject.bin?response-cache-control=no-store%0ax-injected%3A%20yes"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 400
connection_after = "open"
headers_absent = ["x-injected", "cache-control", "etag"]

[expect.error]
code = "InvalidArgument"
request_id_present = true

[expect.body]
redact = ["RequestId", "HostId"]
contains_utf8 = [
  "<Code>InvalidArgument</Code>",
  "response-* override carries a value the response header cannot hold",
  "<Resource>ResponseCacheControl</Resource>",
]
not_contains_utf8 = ["x-injected", "hello world"]
