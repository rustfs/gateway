[case]
id = "c-object-0017"
schema_version = 1
title = "An object stored without a content type is read back as binary octet-stream"
rationale = """
An object written with no content type has to be given one on the read, and the value AWS gives it is `binary/octet-stream`, which is not the spelling any MIME library defaults to. An implementation that reaches for `application/octet-stream` passes every unit test and hands browsers a different type than the reference implementation does, which is exactly the class of divergence this suite exists to catch."""
polarity = "positive"
operation = "GetObject"
tags = ["object-attributes", "wire-bytes"]
timeout_ms = 10000
quirks = ["q-content-0008"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_GetObject.html"
summary = "The documented read response is the authority for which headers the stored object contributes."
kind = "aws-doc"

[clock]
fixed = "2026-01-02T03:04:05Z"

[[setup.buckets]]
name = "conf-object"

[connection]
reuse = true

[[exchanges]]
name = "write-without-a-type"

[exchanges.request]
method = "PUT"
target = "/conf-object/defaults/untyped.bin"
body = { utf8 = "hello world" }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[[exchanges]]
name = "read-back"

[exchanges.request]
method = "GET"
target = "/conf-object/defaults/untyped.bin"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[exchanges.expect.headers_present]
"content-type" = "binary/octet-stream"

[exchanges.expect.body]
exact_utf8 = "hello world"
