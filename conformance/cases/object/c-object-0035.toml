[case]
id = "c-object-0035"
schema_version = 1
title = "response-expires carrying a CRLF is refused for carrying it, not for failing to be a date"
rationale = """
This parameter was already answered 400 before the rule existed, and for a reason that has nothing to do with injection: its value is modelled as an HTTP date, and a string with a CRLF in it is not one. That accident is the trap this case exists to close. A corpus row that asserted only the status and the code would have been green on an implementation with no header-safety check anywhere, so the assertion names the refusal's own sentence — the one no date parser produces. It is also the reason the other five parameters get cases of their own: the one that looked safe was safe by coincidence, and the coincidence does not generalise."""
polarity = "negative"
operation = "GetObject"
tags = ["security", "presigned", "error-shape"]
timeout_ms = 10000
quirks = ["q-response-0023"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_GetObject.html"
summary = "The documented read response is the authority for the headers a read returns and the query overrides it honours."
kind = "aws-doc"

[[case.evidence]]
url = "https://www.rfc-editor.org/rfc/rfc9110#section-5.5"
summary = "A field value carries no bare CR or LF, so a value that does cannot be emitted as one."
kind = "rfc"

[clock]
fixed = "2026-01-02T03:04:05Z"

[[setup.buckets]]
name = "conf-object"

[[setup.objects]]
bucket = "conf-object"
key = "overrides/inject.bin"
content_type = "text/plain"
body = { utf8 = "hello world" }

[request]
method = "GET"
target = "/conf-object/overrides/inject.bin?response-expires=Thu%2C%2001%20Jan%201970%2000%3A00%3A00%20GMT%0d%0ax-injected%3A%20yes"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 400
connection_after = "open"
# The injected name is deliberately NOT in `headers_absent`. A response header *named*
# `x-injected` or `set-cookie` is unconstructible in this gateway — `crates/core/src/lib.rs`
# is `#![forbid(unsafe_code)]`, every insertion goes through `HeaderName::from_bytes` on a
# compile-time constant, and hyper serialises the head from a typed map — so the needle could
# not fail for any reachable defect and would read exactly like a check that passed. The live
# assertion against the same input is the `not_contains_utf8` twin below, which fires when the
# value is echoed into the error document.
headers_absent = ["expires", "etag"]

[expect.error]
code = "InvalidArgument"
request_id_present = true

[expect.body]
redact = ["RequestId", "HostId"]
contains_utf8 = [
  "<Code>InvalidArgument</Code>",
  "response-* override carries a value the response header cannot hold",
  "<Resource>ResponseExpires</Resource>",
]
not_contains_utf8 = ["x-injected", "hello world"]
