# c-object-0008 — HeadObject on a key that does not exist.
#
# Schema dimensions exercised: byte-empty body on an error status, error assertion without a body.

[case]
id = "c-object-0008"
schema_version = 1
title = "A head of a key that does not exist is a bodyless 404, error document included"
rationale = """
This is where the RFC 9110 rule and the S3 error shape collide, and implementations resolve the \
collision the wrong way about as often as the right one: the error document is generated by the \
same code that generates it for a read, and then written to a response that must not carry \
content. A client reading a Content-Length that promises a body it will never receive either hangs \
waiting for it or treats the connection as broken and drops the keep-alive, which turns a cheap \
existence check into a new TCP handshake for every miss."""
polarity = "negative"
operation = "HeadObject"
tags = ["head", "error-shape", "rfc9110"]
timeout_ms = 10000
quirks = ["q-head-0025"]

[[case.evidence]]
url = "https://www.rfc-editor.org/rfc/rfc9110#section-9.3.2"
summary = "A response to a head request never carries content, whatever the status line says."
kind = "rfc"

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_HeadObject.html"
summary = "A head of a key that is not present answers 404 and the response has no body to inspect."
kind = "aws-doc"

[clock]
fixed = "2026-01-02T03:04:05Z"

[[setup.buckets]]
name = "conf-object"

[[setup.objects]]
bucket = "conf-object"
key = "missing/key"
absent = true

[request]
method = "HEAD"
target = "/conf-object/missing/key"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 404
headers_absent = ["etag", "last-modified", "x-amz-version-id"]
connection_after = "open"

[expect.timing]
terminate_within_ms = 5000

# Not one byte. The error code travels in the status line and in x-amz-error-code, never in a body
# a head response is forbidden to have.
[expect.body]
size = 0
exact_utf8 = ""
