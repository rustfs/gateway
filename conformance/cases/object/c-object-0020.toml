[case]
id = "c-object-0020"
schema_version = 1
title = "response-content-disposition carrying a CRLF is refused, not quietly dropped"
rationale = """
The response overrides are the one place in this operation where a caller writes a response header value directly, and a presigned URL puts that power in the hands of whoever holds the link. A value carrying CR or LF that is copied into the head splits the response and lets the link's holder mint headers, a body, or a second response entirely. Dropping the header and answering 200 with the object is not the answer: the caller asked for a representation the service cannot describe, got a different one, and nothing on the wire records that the request was hostile. The case therefore asserts the refusal itself — 400 InvalidArgument naming this parameter's member — and that the object bytes never left, because a 400 that still shipped the body would have run the handler on a request that was never valid. One case per parameter: the six do not share a decoder line, and a case covering the group cannot say which one regressed."""
polarity = "negative"
operation = "GetObject"
tags = ["security", "presigned", "error-shape"]
timeout_ms = 10000
quirks = ["q-response-0023"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_GetObject.html"
summary = "The documented read response is the authority for the headers a read returns and the query overrides it honours."
kind = "aws-doc"

[[case.evidence]]
url = "https://www.rfc-editor.org/rfc/rfc9110#section-5.5"
summary = "A field value carries no bare CR or LF, so a value that does cannot be emitted as one."
kind = "rfc"

[clock]
fixed = "2026-01-02T03:04:05Z"

[[setup.buckets]]
name = "conf-object"

[[setup.objects]]
bucket = "conf-object"
key = "overrides/inject.bin"
content_type = "text/plain"
body = { utf8 = "hello world" }

[request]
method = "GET"
target = "/conf-object/overrides/inject.bin?response-content-disposition=inline%0d%0ax-injected%3A%20yes"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 400
connection_after = "open"
# The injected name is deliberately NOT in `headers_absent`. A response header *named*
# `x-injected` or `set-cookie` is unconstructible in this gateway — `crates/core/src/lib.rs`
# is `#![forbid(unsafe_code)]`, every insertion goes through `HeaderName::from_bytes` on a
# compile-time constant, and hyper serialises the head from a typed map — so the needle could
# not fail for any reachable defect and would read exactly like a check that passed. The live
# assertion against the same input is the `not_contains_utf8` twin below, which fires when the
# value is echoed into the error document.
headers_absent = ["content-disposition", "etag"]

[expect.error]
code = "InvalidArgument"
request_id_present = true

[expect.body]
redact = ["RequestId", "HostId"]
contains_utf8 = [
  "<Code>InvalidArgument</Code>",
  "response-* override carries a value the response header cannot hold",
  "<Resource>ResponseContentDisposition</Resource>",
]
not_contains_utf8 = ["x-injected", "hello world"]
