# c-object-0046 — the destination bucket owner assertion is a framework gate.

[case]
id = "c-object-0046"
schema_version = 1
title = "A mismatched expected bucket owner refuses an object read"
rationale = """
The destination owner assertion applies before the operation handler. Accepting a value that does
not identify the bucket owner lets a request cross the account boundary that the caller explicitly
asked the service to enforce; the refusal must therefore be AccessDenied and must expose no object
metadata."""
polarity = "negative"
operation = "GetObject"
tags = ["security", "error-shape"]
timeout_ms = 10000
quirks = []

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_GetObject.html"
summary = "A GetObject request whose expected bucket owner differs from the actual owner is refused with 403 AccessDenied."
kind = "aws-doc"

[clock]
fixed = "2026-01-02T03:04:05Z"

[[setup.buckets]]
name = "conf-object-owner-gate"

[[setup.objects]]
bucket = "conf-object-owner-gate"
key = "private/read.txt"
content_type = "text/plain"
body = { utf8 = "must not be returned" }

[request]
method = "GET"
target = "/conf-object-owner-gate/private/read.txt"
headers = { "x-amz-expected-bucket-owner" = "000000000000" }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 403
connection_after = "open"
headers_absent = ["etag", "x-amz-version-id"]

[expect.error]
code = "AccessDenied"
request_id_present = true

[expect.body]
redact = ["RequestId", "HostId"]
contains_utf8 = ["<Code>AccessDenied</Code>"]
not_contains_utf8 = ["must not be returned"]
