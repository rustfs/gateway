[case]
id = "c-object-0029"
schema_version = 1
title = "Every answer carries the identifiers support asks for, whatever its shape"
rationale = """
The request identifiers are what turns a customer report into a server-side trace, and the answers that most need tracing are the ones with the least room to carry anything: a 204 has no body, a head has no body, and an error has a body the client may not keep. An implementation that writes them from the success encoder loses them on exactly those three. Four shapes are asserted in one run because each is written by different code and any one of them can lose the headers alone."""
polarity = "positive"
operation = "GetObject"
tags = ["error-shape", "wire-bytes"]
timeout_ms = 10000
quirks = []

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_GetObject.html"
summary = "The documented read response is the authority for the headers a read returns."
kind = "aws-doc"

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_DeleteObject.html"
summary = "The documented delete answers 204 with no content, which is the shape most likely to lose a response header."
kind = "aws-doc"
[clock]
fixed = "2026-01-02T03:04:05Z"

[connection]
reuse = true

[[setup.buckets]]
name = "conf-object"

[[setup.objects]]
bucket = "conf-object"
key = "common/plain.txt"
content_type = "text/plain"
body = { utf8 = "hello world" }

[[exchanges]]
name = "a-read"

[exchanges.request]
method = "GET"
target = "/conf-object/common/plain.txt"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[exchanges.expect.headers_present]
"x-amz-request-id" = "*"
"x-amz-id-2" = "*"
"date" = "*"
"accept-ranges" = "bytes"

[[exchanges]]
name = "a-head"

[exchanges.request]
method = "HEAD"
target = "/conf-object/common/plain.txt"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[exchanges.expect.headers_present]
"x-amz-request-id" = "*"
"x-amz-id-2" = "*"
"date" = "*"
"accept-ranges" = "bytes"

[[exchanges]]
name = "an-empty-success"

[exchanges.request]
method = "DELETE"
target = "/conf-object/common/plain.txt"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 204
connection_after = "open"

[exchanges.expect.headers_present]
"x-amz-request-id" = "*"
"x-amz-id-2" = "*"
"date" = "*"

[[exchanges]]
name = "a-refusal"

[exchanges.request]
method = "GET"
target = "/conf-object/common/absent.txt"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 404
connection_after = "open"

[exchanges.expect.headers_present]
"x-amz-request-id" = "*"
"x-amz-id-2" = "*"
"date" = "*"
