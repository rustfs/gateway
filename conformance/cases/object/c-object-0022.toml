[case]
id = "c-object-0022"
schema_version = 1
title = "A delete body carrying a namespace and an element from a later revision is processed, not refused"
rationale = """
Every SDK that has ever shipped writes the namespace attribute onto this root, and AWS adds members to this shape without a version bump, so a parser that validates the namespace or rejects an unknown child breaks clients that are newer than the server. The two are asserted together because they are the same mistake — treating the wire shape as closed — and an implementation usually makes both or neither."""
polarity = "negative"
operation = "DeleteObjects"
tags = ["xml", "encoding"]
timeout_ms = 10000
quirks = ["q-deletes-0027"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_DeleteObjects.html"
summary = "The documented multi-object delete is the authority for its request root, its result root and its integrity header."
kind = "aws-doc"

[[case.evidence]]
url = "https://github.com/s3s-project/s3s/issues/551"
summary = "Upstream's multi-object delete dropped keys instead of accounting for every one it was given."
kind = "s3s-issue"

[clock]
fixed = "2026-01-02T03:04:05Z"

[[setup.buckets]]
name = "conf-object"

[request]
method = "POST"
target = "/conf-object?delete"
headers = { "content-type" = "application/xml", "content-md5" = "VesO8tD2pN1TTdlljYbfcg==" }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[request.body]
utf8 = """
<Delete xmlns="http://s3.amazonaws.com/doc/2006-03-01/"><FutureField>whatever</FutureField><Object><Key>batch/one</Key><FutureMember>x</FutureMember></Object></Delete>"""

[expect]
kind = "response"
status = 200
connection_after = "open"

[expect.body]
exact_utf8 = """
<?xml version="1.0" encoding="UTF-8"?>
<DeleteResult xmlns="http://s3.amazonaws.com/doc/2006-03-01/"><Deleted><Key>batch/one</Key></Deleted></DeleteResult>"""
