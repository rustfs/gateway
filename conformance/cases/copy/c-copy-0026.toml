# c-copy-0026 — a key that looks like a path is still a key
#
# Schema dimensions exercised: a traversal spelling in the copy source, answered as data rather than as a path

[case]
id = "c-copy-0026"
schema_version = 1
title = "A copy source key containing dot-dot segments is refused before any lookup"
rationale = """
An object key is opaque text and the storage layer behind it is a filesystem often enough that a key spelled like a traversal is the first thing an attacker tries. This case used to pin the boring answer: look the key up literally and report not-found. P6-05 replaced that with an earlier and stronger one. A dot-dot segment is refused by the naming safety floor, at the point the header is read, so no lookup is attempted at all — which is what GHSA-f4vq-9ffr-m8m3 needed and did not have, because there the authorisation check read a key and the storage layer read a path. The assertion that must never change is the last one: no success, and nothing from outside the bucket in the body. What changed is that the refusal now arrives before the backend, not after it."""
polarity = "negative"
operation = "CopyObject"
tags = ["security", "error-shape"]
timeout_ms = 10000
quirks = ["q-copy-source-split-0077", "q-naming-0003"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-keys.html"
summary = "An object key is an opaque sequence of Unicode characters, so no segment of it has any path meaning to the service."
kind = "aws-doc"

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_CopyObject.html"
summary = "The documented copy: how the source is named, what the two directives mean, and that a failure can arrive inside a success."
kind = "aws-doc"

[clock]
fixed = "2026-01-02T03:04:05Z"

[[setup.buckets]]
name = "conf-copy"

[[setup.objects]]
bucket = "conf-copy"
key = "src/plain.txt"
content_type = "text/plain"
body = { utf8 = "hello world" }
metadata = { "origin" = "source" }

[request]
method = "PUT"
target = "/conf-copy/dst/0026"
headers = { "x-amz-copy-source" = "/conf-copy/../../etc/passwd" }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 400
connection_after = "open"
headers_absent = ["etag", "x-amz-version-id", "x-amz-copy-source-version-id"]

[expect.error]
code = "InvalidArgument"
request_id_present = true

[expect.body]
redact = ["RequestId", "HostId"]
contains_utf8 = ["<Code>InvalidArgument</Code>"]
not_contains_utf8 = ["<CopyObjectResult", "root:", "../../etc/passwd"]
