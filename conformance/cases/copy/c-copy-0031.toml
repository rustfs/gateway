# c-copy-0031 — a copy-source condition that does not hold
#
# Schema dimensions exercised: the failing half of the pair, with the destination read back to prove nothing was written

[case]
id = "c-copy-0031"
schema_version = 1
title = "A copy whose copy-source entity tag does not match is refused with 412 and writes nothing"
rationale = """
This is the compare-and-swap a client builds an idempotent copy out of, so two things have to hold: the status has to be the precondition failure rather than a not-found or a 200, and the destination has to be untouched. An implementation that evaluates the condition after the write answers 412 and has already replaced the destination, which turns a guard into a destructive operation."""
polarity = "negative"
operation = "CopyObject"
tags = ["conditional", "preconditions", "etag"]
timeout_ms = 10000
quirks = ["q-copy-conditions-0081"]

[[case.evidence]]
url = "https://github.com/s3s-project/s3s/pull/577"
summary = "Upstream change adding the four copy-source conditional headers, which were decoded and never evaluated."
kind = "s3s-pr"

[[case.evidence]]
url = "https://www.rfc-editor.org/rfc/rfc9110#section-13.1"
summary = "Preconditions are evaluated against one selected representation, which is what makes two representations two independent evaluations."
kind = "rfc"

[clock]
fixed = "2026-01-02T03:04:05Z"

[connection]
reuse = true

[[setup.buckets]]
name = "conf-copy"

[[setup.objects]]
bucket = "conf-copy"
key = "src/plain.txt"
content_type = "text/plain"
body = { utf8 = "hello world" }
metadata = { "origin" = "source" }

[[setup.objects]]
bucket = "conf-copy"
key = "dst/existing"
content_type = "text/plain"
body = { utf8 = "keep me" }

[[exchanges]]
name = "the-source-condition-fails"

[exchanges.request]
method = "PUT"
target = "/conf-copy/dst/existing"
headers = { "x-amz-copy-source" = "/conf-copy/src/plain.txt", "x-amz-copy-source-if-match" = "\"00000000000000000000000000000000\"" }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 412
connection_after = "open"
headers_absent = ["etag", "x-amz-version-id", "x-amz-copy-source-version-id"]

[exchanges.expect.error]
code = "PreconditionFailed"
request_id_present = true

[exchanges.expect.body]
redact = ["RequestId", "HostId"]
contains_utf8 = ["<Code>PreconditionFailed</Code>"]

[[exchanges]]
name = "the-destination-was-not-written"

[exchanges.request]
method = "GET"
target = "/conf-copy/dst/existing"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[exchanges.expect.body]
exact_utf8 = "keep me"
