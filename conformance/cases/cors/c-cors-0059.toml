[case]
id = "c-cors-0059"
schema_version = 1
title = "A CORS write whose Content-MD5 is the digest of a different policy is a 400 BadDigest and stores nothing"
rationale = """
c-cors-0014 proves the integrity header must be present on this operation and c-cors-0015 proves an empty body is refused before it can be stored; neither can prove the declared digest is compared to anything, and a gateway that read `content-md5` and matched it against nothing would satisfy both while telling every client its cross-origin policy arrived intact. This is the direction those two cannot reach: a well-formed digest naming bytes other than the ones that arrived. The digest here is the real digest of the same document with `PUT` in place of `GET`, which is the shape the check exists for — a rule set that was mutated in flight now differs from the one the client signed for by exactly one method, and a stored `GET`-only policy would silently deny every write the caller believed it had just allowed. The read-back is the half that says nothing was written: a gateway that verified after storing would answer this same 400 and leave the configuration installed, so the second exchange demands the bucket still have no CORS document at all.
"""
polarity = "negative"
operation = "PutBucketCors"
tags = ["cors", "checksum", "error-shape"]
timeout_ms = 10000
quirks = []

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutBucketCors.html"
summary = "The write reference documents Content-MD5 as required for this operation, which is the header this case gets wrong on purpose."
kind = "aws-doc"

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/ErrorResponses.html"
summary = "The error list gives BadDigest for a Content-MD5 that disagrees with the body it accompanies."
kind = "aws-doc"

[[setup.buckets]]
name = "conf-cors"

[[exchanges]]
name = "write-carrying-the-digest-of-a-different-rule"

[exchanges.request]
method = "PUT"
target = "/conf-cors?cors"
headers = { "content-type" = "application/xml", "content-md5" = "rAqMzbtniOyp6dCmIWiViw==" }
body = { utf8 = "<CORSConfiguration><CORSRule><AllowedMethod>GET</AllowedMethod><AllowedOrigin>https://app.example.com</AllowedOrigin></CORSRule></CORSConfiguration>" }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 400
connection_after = "open"

[exchanges.expect.error]
code = "BadDigest"
request_id_present = true

[exchanges.expect.headers_present]
"content-type" = "application/xml"

[[exchanges]]
name = "read-back-shows-no-policy-was-stored"

[exchanges.request]
method = "GET"
target = "/conf-cors?cors"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 404
connection_after = "open"

[exchanges.expect.error]
code = "NoSuchCORSConfiguration"
request_id_present = true
