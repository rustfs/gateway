[case]
id = "c-cors-0054"
schema_version = 1
title = "An empty Origin is refused before matching"
rationale = "The stored wildcard would admit any usable origin, so the refusal proves the empty value is rejected first."
polarity = "negative"
tags = ["cors", "preflight", "security"]
timeout_ms = 10000
quirks = ["q-cors-0041"]

[[case.evidence]]
url = "https://fetch.spec.whatwg.org/#http-cors-protocol"
summary = "A preflight carries an origin value rather than an empty placeholder."
kind = "rfc"

[[setup.buckets]]
name = "conf-cors-rt"

[[exchanges]]
[exchanges.request]
method = "PUT"
target = "/conf-cors-rt?cors"
headers = { "content-type" = "application/xml", "content-md5" = "JwjOZkFs+i5vAUZUg/9fsw==" }
body = { utf8 = "<CORSConfiguration><CORSRule><AllowedHeader>x-amz-*</AllowedHeader><AllowedMethod>PUT</AllowedMethod><AllowedOrigin>*</AllowedOrigin></CORSRule></CORSConfiguration>" }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }
[exchanges.expect]
kind = "response"
status = 200

[[exchanges]]
[exchanges.request]
method = "OPTIONS"
target = "/conf-cors-rt/key"
headers = { "origin" = "", "access-control-request-method" = "PUT" }
[exchanges.expect]
kind = "response"
status = 403
[exchanges.expect.error]
code = "AccessForbidden"
request_id_present = true
