[case]
id = "c-cors-0025"
schema_version = 3
title = "All three CORS operations on an absent bucket answer 404 NoSuchBucket"
rationale = """
The bucket question is settled before the configuration question, in every method: a PUT must not invent a bucket to hang a document on, a GET must say NoSuchBucket rather than NoSuchCORSConfiguration, and a DELETE must not answer its usual unconditional 204 — a 204 for a bucket that is not there tells teardown automation its work landed on something. The three answers differ from the configured-bucket path in exactly one way, the bucket, which is why they are one case."""
polarity = "negative"
operation = "GetBucketCors"
tags = ["cors", "error-shape"]
timeout_ms = 10000
quirks = []

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_GetBucketCors.html"
summary = "NoSuchBucket is in the operation's error table for a bucket that does not exist."
kind = "aws-doc"

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_DeleteBucketCors.html"
summary = "The delete's error table carries NoSuchBucket, so the unconditional 204 does not extend to a missing bucket."
kind = "aws-doc"


[[exchanges]]
name = "read"

[exchanges.request]
method = "GET"
target = "/never-created?cors"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 404
connection_after = "open"

[exchanges.expect.error]
code = "NoSuchBucket"
request_id_present = true

[exchanges.expect.body]
redact = ["RequestId", "HostId"]
exact_utf8 = '''
<?xml version="1.0" encoding="UTF-8"?>
<Error><Code>NoSuchBucket</Code><Message>The specified bucket does not exist</Message><RequestId>__REDACTED__</RequestId><HostId>__REDACTED__</HostId></Error>'''

[[exchanges]]
name = "write"

[exchanges.request]
method = "PUT"
target = "/never-created?cors"
headers = { "content-type" = "application/xml" }
content_md5 = "computed"
body = { utf8 = "<CORSConfiguration><CORSRule><AllowedMethod>GET</AllowedMethod><AllowedOrigin>https://example.com</AllowedOrigin></CORSRule></CORSConfiguration>" }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 404
connection_after = "open"

[exchanges.expect.error]
code = "NoSuchBucket"
request_id_present = true

[exchanges.expect.body]
redact = ["RequestId", "HostId"]
exact_utf8 = '''
<?xml version="1.0" encoding="UTF-8"?>
<Error><Code>NoSuchBucket</Code><Message>The specified bucket does not exist</Message><RequestId>__REDACTED__</RequestId><HostId>__REDACTED__</HostId></Error>'''

[[exchanges]]
name = "delete"

[exchanges.request]
method = "DELETE"
target = "/never-created?cors"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 404
connection_after = "open"

[exchanges.expect.error]
code = "NoSuchBucket"
request_id_present = true

[exchanges.expect.body]
redact = ["RequestId", "HostId"]
exact_utf8 = '''
<?xml version="1.0" encoding="UTF-8"?>
<Error><Code>NoSuchBucket</Code><Message>The specified bucket does not exist</Message><RequestId>__REDACTED__</RequestId><HostId>__REDACTED__</HostId></Error>'''
