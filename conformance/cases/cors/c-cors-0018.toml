[case]
id = "c-cors-0018"
schema_version = 3
title = "An AllowedOrigin with two wildcards is refused with 400"
rationale = """
The origin grammar admits at most one asterisk. Two is not a stricter pattern but an undefined one: no matcher semantic is documented for it, so accepting it stores a rule whose meaning each implementation invents — the exact class of stored ambiguity that surfaces as security-relevant divergence later, when the preflight matcher and a different vendor's matcher answer differently for the same origin."""
polarity = "negative"
operation = "PutBucketCors"
tags = ["cors", "security", "error-shape"]
timeout_ms = 10000
quirks = ["q-cors-0005"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/userguide/ManageCorsUsing.html"
summary = "The guide permits one wildcard in an AllowedOrigin and defines no meaning for a second."
kind = "aws-doc"


[[setup.buckets]]
name = "conf-cors"

[request]
method = "PUT"
target = "/conf-cors?cors"
headers = { "content-type" = "application/xml" }
content_md5 = "computed"
body = { utf8 = "<CORSConfiguration><CORSRule><AllowedMethod>GET</AllowedMethod><AllowedOrigin>https://*.*.example.com</AllowedOrigin></CORSRule></CORSConfiguration>" }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 400
connection_after = "open"

[expect.error]
code = "InvalidRequest"
request_id_present = true

[expect.headers_present]
"content-type" = "application/xml"

[expect.body]
redact = ["RequestId", "HostId"]
exact_utf8 = '''
<?xml version="1.0" encoding="UTF-8"?>
<Error><Code>InvalidRequest</Code><Message>AllowedOrigin can not have more than one wildcard</Message><RequestId>__REDACTED__</RequestId><HostId>__REDACTED__</HostId></Error>'''
