[case]
id = "c-cors-0035"
schema_version = 1
title = "A preflight against a bucket that does not exist answers exactly what a configured-but-empty one does"
rationale = """
The enumeration oracle lives in the difference between these two answers, not in either of them. A preflight is
unauthenticated by protocol, so anybody with a browser can ask; if a bucket that exists answers differently from one
that does not — a different code, a different message, a different header set — private bucket names fall out one
probe at a time. The body here is the same string as c-cors-0034's, deliberately."""
polarity = "negative"
tags = ["cors", "preflight", "security"]
timeout_ms = 10000
quirks = ["q-cors-0015", "q-cors-0038"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/userguide/cors.html"
summary = "S3 answers a bucket preflight out of that bucket's stored CORS document and refuses an unmatched one with 403."
kind = "aws-doc"

[[case.evidence]]
url = "https://github.com/rustfs/rustfs/security/advisories/GHSA-x5xv-223c-8vm7"
summary = "RustFS reflected an arbitrary Origin alongside a credentials allowance, which lets any site read a user's data."
kind = "other"

[[setup.buckets]]
name = "conf-cors-absent"
absent = true


[request]
method = "OPTIONS"
target = "/conf-cors-absent/key.txt"
headers = { "origin" = "https://app.example.com", "access-control-request-method" = "PUT" }

[expect]
kind = "response"
status = 403
connection_after = "open"
headers_absent = [
  "access-control-allow-origin",
  "access-control-allow-methods",
  "access-control-allow-headers",
  "access-control-allow-credentials",
  "access-control-max-age",
  "access-control-expose-headers",
]

[expect.error]
code = "AccessForbidden"
request_id_present = true

[expect.headers_present]
"content-type" = "application/xml"
"vary" = "origin"

[expect.body]
redact = ["RequestId", "HostId"]
exact_utf8 = '''
<?xml version="1.0" encoding="UTF-8"?>
<Error><Code>AccessForbidden</Code><Message>CORSResponse: no CORS rule allows this request</Message><RequestId>__REDACTED__</RequestId><HostId>__REDACTED__</HostId></Error>'''
