[case]
id = "c-cors-0055"
schema_version = 1
title = "An Origin longer than 2048 bytes is refused"
rationale = "The stored wildcard would admit the value, so the refusal proves the unauthenticated reflection surface enforces its byte ceiling."
polarity = "negative"
tags = ["cors", "preflight", "security"]
timeout_ms = 10000
quirks = ["q-cors-0042"]

[[case.evidence]]
url = "https://github.com/rustfs/rustfs/security/advisories/GHSA-x5xv-223c-8vm7"
summary = "The unauthenticated origin-reflection surface must remain bounded before response construction."
kind = "other"

[[setup.buckets]]
name = "conf-cors-rt"

[[exchanges]]
[exchanges.request]
method = "PUT"
target = "/conf-cors-rt?cors"
headers = { "content-type" = "application/xml", "content-md5" = "zQH2qoeTIChLyIT5Hii1aQ==" }
body = { utf8 = "<CORSConfiguration><CORSRule><AllowedHeader>x-amz-*</AllowedHeader><AllowedMethod>PUT</AllowedMethod><AllowedOrigin>*</AllowedOrigin></CORSRule></CORSConfiguration>" }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }
[exchanges.expect]
kind = "response"
status = 200

[[exchanges]]
[exchanges.request]
method = "OPTIONS"
target = "/conf-cors-rt/key"
headers = { "origin" = "", "access-control-request-method" = "PUT" }
[exchanges.expect]
kind = "response"
status = 403
[exchanges.expect.error]
code = "AccessForbidden"
request_id_present = true
