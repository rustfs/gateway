[case]
id = "c-cors-0010"
schema_version = 1
title = "A document at the hundred-rule cap is accepted"
rationale = """
One hundred is the documented ceiling, and a cap is only trustworthy if both of its sides are pinned: this case holds the inclusive side while c-cors-0023 holds the refusing side. An off-by-one that refused the hundredth rule would reject configurations AWS accepts, and migrating operators would hit it precisely when moving their largest, oldest bucket."""
polarity = "positive"
operation = "PutBucketCors"
tags = ["cors"]
timeout_ms = 10000
quirks = []

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutBucketCors.html"
summary = "The operation documents a limit of one hundred rules per configuration."
kind = "aws-doc"


[[setup.buckets]]
name = "conf-cors"

[request]
method = "PUT"
target = "/conf-cors?cors"
headers = { "content-type" = "application/xml", "content-md5" = "JYoSwYo6t9w8byT3F3Jgxg==" }
body = { file = "fixtures/cors/one-hundred-rules.xml" }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 200
connection_after = "open"

[expect.timing]
terminate_within_ms = 5000
