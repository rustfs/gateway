[case]
id = "c-cors-0009"
schema_version = 1
title = "MaxAgeSeconds of zero is stored and returned as zero, not dropped as a default"
rationale = """
Zero is a meaningful value — it tells browsers to preflight every request, which operators use while debugging a policy — and it is exactly the value an omit-when-default serializer silently deletes. A dropped zero falls back to the browser's own default cache lifetime, so the operator's debugging switch quietly stops working. The byte-level read-back is the only assertion that distinguishes a stored zero from an omitted member."""
polarity = "positive"
operation = "PutBucketCors"
tags = ["cors", "xml", "wire-bytes"]
timeout_ms = 10000
quirks = ["q-cors-0002"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_CORSRule.html"
summary = "MaxAgeSeconds is the preflight cache lifetime and zero is a legal value of it."
kind = "aws-doc"

[[case.evidence]]
url = "https://github.com/s3s-project/s3s/issues/229"
summary = "Upstream conflated empty and default-valued members, which is the failure mode a stored zero exposes."
kind = "s3s-issue"


[[setup.buckets]]
name = "conf-cors"

[[exchanges]]
name = "put-zero-age"

[exchanges.request]
method = "PUT"
target = "/conf-cors?cors"
headers = { "content-type" = "application/xml", "content-md5" = "xmKDSJPvGp/o0VaJ6E9M7w==" }
body = { utf8 = "<CORSConfiguration><CORSRule><AllowedMethod>GET</AllowedMethod><AllowedOrigin>https://example.com</AllowedOrigin><MaxAgeSeconds>0</MaxAgeSeconds></CORSRule></CORSConfiguration>" }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[[exchanges]]
name = "read-back"

[exchanges.request]
method = "GET"
target = "/conf-cors?cors"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[exchanges.expect.headers_present]
"content-type" = "application/xml"

[exchanges.expect.body]
golden = "goldens/c-cors-0009.xml"
contains_utf8 = ["<MaxAgeSeconds>0</MaxAgeSeconds>"]
