[case]
id = "c-cors-0015"
schema_version = 1
title = "An empty request body is 400 MalformedXML, not a stored empty configuration"
rationale = """
Zero bytes is what a client sends when its serializer failed, and the two wrong answers are both observed in the wild: a 200 that stores nothing makes the client believe its policy is live, and a 500 turns a client bug into a server incident. MalformedXML with a 400 is the only answer that puts the fault where it is."""
polarity = "negative"
operation = "PutBucketCors"
tags = ["cors", "xml", "error-shape"]
timeout_ms = 10000
quirks = []

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutBucketCors.html"
summary = "The request body is the configuration document and it is required."
kind = "aws-doc"


[[setup.buckets]]
name = "conf-cors"

[request]
method = "PUT"
target = "/conf-cors?cors"
headers = { "content-type" = "application/xml", "content-md5" = "1B2M2Y8AsgTpgAmY7PhCfg==" }
body = { utf8 = "" }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 400
connection_after = "open"

[expect.error]
code = "MalformedXML"
request_id_present = true

[expect.headers_present]
"content-type" = "application/xml"

[expect.body]
redact = ["RequestId", "HostId"]
exact_utf8 = '''
<?xml version="1.0" encoding="UTF-8"?>
<Error><Code>MalformedXML</Code><Message>the request body is not the XML this operation accepts</Message><RequestId>__REDACTED__</RequestId><HostId>__REDACTED__</HostId></Error>'''
