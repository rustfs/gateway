[case]
id = "c-cors-0043"
schema_version = 1
title = "An OPTIONS with no CORS headers is refused as BadRequest before routing"
rationale = """
An unsigned AWS OPTIONS capture in issue #875 returned 400 BadRequest. That observation corrects
this case's former 501 routing assumption. The request still grants no CORS permission and does
not claim to measure a GET-presigned query or other malformed preflight variants."""
polarity = "negative"
tags = ["cors", "preflight", "routing"]
timeout_ms = 10000
quirks = ["q-cors-0016"]

[[case.evidence]]
url = "https://fetch.spec.whatwg.org/#http-cors-protocol"
summary = "The preflight and its answer are defined here, including which response header a browser reads from which response."
kind = "rfc"

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/userguide/cors.html"
summary = "S3 answers a bucket preflight out of that bucket's stored CORS document and refuses an unmatched one with 403."
kind = "aws-doc"

[[case.evidence]]
url = "https://github.com/rustfs/gateway/issues/875"
summary = "The issue records an actual unsigned AWS OPTIONS response with status 400, code BadRequest and a SHA-256 receipt."
kind = "other"

[[setup.buckets]]
name = "conf-cors-rt"


[request]
method = "OPTIONS"
target = "/conf-cors-rt/key.txt"

[expect]
kind = "response"
status = 400
headers_absent = [
  "access-control-allow-origin",
  "access-control-allow-methods",
  "access-control-allow-credentials",
]

[expect.error]
code = "BadRequest"
