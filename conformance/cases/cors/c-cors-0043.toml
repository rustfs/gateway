[case]
id = "c-cors-0043"
schema_version = 1
title = "An OPTIONS with neither CORS header is not a preflight and is routed like anything else"
rationale = """
An OPTIONS that does not carry Origin and Access-Control-Request-Method is a request about the server's own options,
not a CORS question, and claiming it here would make every OPTIONS in the deployment a CORS answer — including ones
a future route row is meant to serve. The 501 is the route table's answer and this case exists to prove the request
reached it, which is also what makes the interception itself falsifiable."""
polarity = "negative"
tags = ["cors", "preflight", "routing"]
timeout_ms = 10000
quirks = ["q-cors-0016"]

[[case.evidence]]
url = "https://fetch.spec.whatwg.org/#http-cors-protocol"
summary = "The preflight and its answer are defined here, including which response header a browser reads from which response."
kind = "rfc"

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/userguide/cors.html"
summary = "S3 answers a bucket preflight out of that bucket's stored CORS document and refuses an unmatched one with 403."
kind = "aws-doc"

[[setup.buckets]]
name = "conf-cors-rt"


[request]
method = "OPTIONS"
target = "/conf-cors-rt/key.txt"

[expect]
kind = "response"
status = 501
headers_absent = [
  "access-control-allow-origin",
  "access-control-allow-methods",
  "access-control-allow-credentials",
]

[expect.error]
code = "NotImplemented"
