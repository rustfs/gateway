[case]
id = "c-cors-0053"
schema_version = 1
title = "CORS match dimensions cannot be composed across rules"
rationale = "One rule admits the origin and another the method, but neither complete rule admits the request."
polarity = "negative"
tags = ["cors", "preflight", "security"]
timeout_ms = 10000
quirks = ["q-cors-0036"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/userguide/cors.html"
summary = "Each complete CORS rule is evaluated against the request."
kind = "aws-doc"

[[setup.buckets]]
name = "conf-cors-rt"

[[exchanges]]
[exchanges.request]
method = "PUT"
target = "/conf-cors-rt?cors"
headers = { "content-type" = "application/xml", "content-md5" = "PE70kL1+P1zZgVr17FCTDw==" }
body = { utf8 = "<CORSConfiguration><CORSRule><AllowedMethod>GET</AllowedMethod><AllowedOrigin>https://a.example.com</AllowedOrigin></CORSRule><CORSRule><AllowedMethod>PUT</AllowedMethod><AllowedOrigin>https://b.example.com</AllowedOrigin></CORSRule></CORSConfiguration>" }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }
[exchanges.expect]
kind = "response"
status = 200

[[exchanges]]
[exchanges.request]
method = "OPTIONS"
target = "/conf-cors-rt/key"
headers = { "origin" = "https://a.example.com", "access-control-request-method" = "PUT" }
[exchanges.expect]
kind = "response"
status = 403
[exchanges.expect.error]
code = "AccessForbidden"
request_id_present = true
