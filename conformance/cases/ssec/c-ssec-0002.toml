[case]
id = "c-ssec-0002"
schema_version = 1
title = "Reading with a customer-provided key over cleartext is refused and echoes no key"
rationale = """
The gate is not a property of writes. A GET carrying the trio has put the key on the wire exactly as a PUT has, so it is refused on the same terms — and the refusal must not echo the key back, which would hand it to the caller's own access log a second time. The assertion is on the whole response: the error document is byte-exact and the key header is asserted absent, so a refusal that quoted the key in its message or repeated it in a header would be caught by one or the other.
"""
polarity = "negative"
operation = "GetObject"
tags = ["sse", "encryption", "security", "tls"]
timeout_ms = 10000
quirks = ["q-sse-0010"]

[case.applies_to]
tls = "forbidden"

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/userguide/ServerSideEncryptionCustomerKeys.html"
summary = "The same three headers govern reads of an object written with a customer-provided key, and a response echoes only the algorithm and the key digest."
kind = "aws-doc"

[[setup.buckets]]
name = "conf-ssec"

[request]
method = "GET"
target = "/conf-ssec/plaintext-key.bin"
headers = { "x-amz-server-side-encryption-customer-algorithm" = "AES256", "x-amz-server-side-encryption-customer-key" = "AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=", "x-amz-server-side-encryption-customer-key-md5" = "tP/LI3N87DFaSk0aoqYgzg==" }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 400
connection_after = "open"
headers_absent = ["x-amz-server-side-encryption-customer-key", "x-amz-server-side-encryption-customer-key-md5"]

[expect.error]
code = "InvalidRequest"
request_id_present = true


[expect.body]
redact = ["RequestId", "HostId"]
exact_utf8 = '''
<?xml version="1.0" encoding="UTF-8"?>
<Error><Code>InvalidRequest</Code><Message>requests specifying a customer-provided encryption key must be made over a secure connection</Message><RequestId>__REDACTED__</RequestId><HostId>__REDACTED__</HostId></Error>'''
