# c-pipe-1003 — Pipeline rejects unauthorized access.
#
# Schema dimensions exercised: pipeline.authorized.unauthorized (negative)

[case]
id = "c-pipe-1003"
schema_version = 1
title = "Pipeline rejects unauthorized access to private bucket"
rationale = """
The authorized stage must reject requests that lack proper authorization."""
polarity = "negative"
operation = "GetObject"
tags = ["pipeline", "authorized", "authz", "security"]
timeout_ms = 5000

[request]
method = "GET"
target = "/private-bucket/key"

[request.sign]
mode = "sigv4_header"
service = "s3"
region = "us-east-1"
credential = "valid_no_access"

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/Welcome.html"
summary = "Pipeline rejects unauthorized access to private bucket"
kind = "aws-doc"

[expect]
kind = "response"
status = 403

[expect.error]
code = "AccessDenied"
