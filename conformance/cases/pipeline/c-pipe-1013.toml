# c-pipe-1013 — Pipeline rejects SSE-C without TLS.
#
# Schema dimensions exercised: pipeline.guarded.sse_no_tls (negative)

[case]
id = "c-pipe-1013"
schema_version = 1
title = "Pipeline rejects SSE-C headers without TLS"
rationale = """
The guarded stage must reject SSE-C requests over non-TLS connections."""
polarity = "negative"
operation = "PutObject"
tags = ["pipeline", "guarded", "sse", "security"]
timeout_ms = 5000

[request]
method = "PUT"
target = "/bucket/key"
headers = { "content-type" = "application/octet-stream", "x-amz-server-side-encryption-customer-algorithm" = "AES256", "x-amz-server-side-encryption-customer-key" = "base64key", "x-amz-server-side-encryption-customer-key-MD5" = "base64md5" }

[request.sign]
mode = "sigv4_header"
service = "s3"
region = "us-east-1"
credential = "valid"
payload_hash = "computed"

[[request.chunks]]
utf8 = "body"

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/Welcome.html"
summary = "Pipeline rejects SSE-C headers without TLS"
kind = "aws-doc"

[expect]
kind = "response"
status = 400
