[case]
id = "c-replication-0028"
schema_version = 1
title = "Two rules with the same ID are refused as InvalidArgument"
rationale = """
The ID is documented as a unique identifier, and its uniqueness is what makes a rule addressable — monitoring reports, engine diagnostics and operator edits all name rules by ID, and two rules under one name make every such reference ambiguous. Two anonymous rules remain legal: uniqueness binds ids, not their absence."""
polarity = "negative"
operation = "PutBucketReplication"
tags = ["replication", "xml", "error-shape"]
timeout_ms = 10000
quirks = ["q-repl-0008"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_ReplicationRule.html"
summary = "The ID member is documented as a unique identifier for the rule."
kind = "aws-doc"


[[setup.buckets]]
name = "conf-replication"
[request]
method = "PUT"
target = "/conf-replication?replication"
headers = { "content-type" = "application/xml", "content-md5" = "lCnNjmhEAdVJClt/bnu52w==" }
body = { utf8 = '<ReplicationConfiguration><Role>arn:aws:iam::111122223333:role/replication-role</Role><Rule><ID>twin</ID><Prefix>a/</Prefix><Status>Enabled</Status><Destination><Bucket>arn:aws:s3:::replica-bucket</Bucket></Destination></Rule><Rule><ID>twin</ID><Prefix>b/</Prefix><Status>Enabled</Status><Destination><Bucket>arn:aws:s3:::replica-two</Bucket></Destination></Rule></ReplicationConfiguration>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 400
connection_after = "open"

[expect.error]
code = "InvalidArgument"
request_id_present = true

[expect.headers_present]
"content-type" = "application/xml"

[expect.body]
redact = ["RequestId", "HostId"]
exact_utf8 = '''
<?xml version="1.0" encoding="UTF-8"?>
<Error><Code>InvalidArgument</Code><Message>Rule ID must be unique; found the same ID for more than one rule</Message><RequestId>__REDACTED__</RequestId><HostId>__REDACTED__</HostId></Error>'''
