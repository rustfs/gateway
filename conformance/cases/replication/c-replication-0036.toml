[case]
id = "c-replication-0036"
schema_version = 1
title = "A replication write whose Content-MD5 is the digest of a different destination is 400 BadDigest and stores nothing"
rationale = """
c-replication-0015 proves an integrity claim must be present on this operation; it cannot prove the declared digest is compared to anything, and a gateway that read content-md5 and matched it against nothing would satisfy it while telling every client its configuration arrived intact. This is the direction that case cannot reach: a well-formed digest naming bytes other than the ones that arrived. The digest here is the real digest of the same document with the destination bucket ARN changed to another bucket, which is exactly the shape the check exists for — a replication document altered in flight differs from the one the client signed for by the member that decides where every new object is copied, and RustFS parses this configuration fail-closed, so the altered document would be installed as authoritative. The read-back is the half that says nothing was written: a gateway that verified after storing would answer this same 400 and leave the document installed, so the second exchange demands the bucket still have no replication configuration at all."""
polarity = "negative"
operation = "PutBucketReplication"
tags = ["replication", "checksum", "error-shape"]
timeout_ms = 10000
quirks = []

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutBucketReplication.html"
summary = "The write reference documents Content-MD5 as the base64 digest of the configuration, which is the header this case gets wrong on purpose."
kind = "aws-doc"

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/ErrorResponses.html"
summary = "The error list gives BadDigest for a Content-MD5 that disagrees with the body it accompanies."
kind = "aws-doc"


[[setup.buckets]]
name = "conf-replication"

[[exchanges]]
name = "write-carrying-the-digest-of-another-destination"

[exchanges.request]
method = "PUT"
target = "/conf-replication?replication"
headers = { "content-type" = "application/xml", "content-md5" = "KZNaiWm8S77mclNUcxNXCA==" }
body = { utf8 = '<ReplicationConfiguration xmlns="http://s3.amazonaws.com/doc/2006-03-01/"><Role>arn:aws:iam::111122223333:role/replication</Role><Rule><ID>replicate-logs</ID><Priority>1</Priority><Filter><Prefix>logs/</Prefix></Filter><DeleteMarkerReplication><Status>Disabled</Status></DeleteMarkerReplication><Status>Enabled</Status><Destination><Bucket>arn:aws:s3:::replica-bucket</Bucket></Destination></Rule></ReplicationConfiguration>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 400
connection_after = "open"

[exchanges.expect.error]
code = "BadDigest"
request_id_present = true

[exchanges.expect.headers_present]
"content-type" = "application/xml"

[[exchanges]]
name = "read-back-shows-no-document-was-stored"

[exchanges.request]
method = "GET"
target = "/conf-replication?replication"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 404
connection_after = "open"

[exchanges.expect.error]
code = "ReplicationConfigurationNotFoundError"
request_id_present = true
