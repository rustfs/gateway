[case]
id = "c-replication-0025"
schema_version = 3
title = "An And wrapping a single condition is refused as MalformedXML"
rationale = """
The combinator exists only to combine — the documentation introduces And as required only when more than one filter is specified — so an And with one condition is a grammar the sender misread, and the single-condition spelling they wanted is the bare child. Refusing it now is a five-second fix for the client; accepting it stores a shape other S3 tooling will refuse to parse back."""
polarity = "negative"
operation = "PutBucketReplication"
tags = ["replication", "xml", "error-shape"]
timeout_ms = 10000
quirks = ["q-repl-0007"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_ReplicationRuleAndOperator.html"
summary = "The And operator is documented as required only when specifying more than one filter condition."
kind = "aws-doc"


[[setup.buckets]]
name = "conf-replication"
[request]
method = "PUT"
target = "/conf-replication?replication"
headers = { "content-type" = "application/xml" }
content_md5 = "computed"
body = { utf8 = '<ReplicationConfiguration><Role>arn:aws:iam::111122223333:role/replication-role</Role><Rule><Priority>1</Priority><Filter><And><Prefix>logs/</Prefix></And></Filter><Status>Enabled</Status><Destination><Bucket>arn:aws:s3:::replica-bucket</Bucket></Destination><DeleteMarkerReplication><Status>Disabled</Status></DeleteMarkerReplication></Rule></ReplicationConfiguration>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 400
connection_after = "open"

[expect.error]
code = "MalformedXML"
request_id_present = true

[expect.headers_present]
"content-type" = "application/xml"

[expect.body]
redact = ["RequestId", "HostId"]
exact_utf8 = '''
<?xml version="1.0" encoding="UTF-8"?>
<Error><Code>MalformedXML</Code><Message>An And must contain at least two conditions</Message><RequestId>__REDACTED__</RequestId><HostId>__REDACTED__</HostId></Error>'''
