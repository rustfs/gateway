[case]
id = "c-replication-0024"
schema_version = 1
title = "Two direct Filter children outside an And are refused as MalformedXML"
rationale = """
A Filter must specify exactly one Prefix, Tag or And child — several conditions combine only inside one And, where the combination's semantics (logical AND) is explicit. Two direct siblings are two contradictory scopes with no stated combinator, and the client that sent them plausibly believed it wrote an intersection; storing either reading silently replicates the wrong object set."""
polarity = "negative"
operation = "PutBucketReplication"
tags = ["replication", "xml", "error-shape"]
timeout_ms = 10000
quirks = ["q-repl-0007"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_ReplicationRuleFilter.html"
summary = "The type documents that a Filter must specify exactly one Prefix, Tag or And child element."
kind = "aws-doc"


[[setup.buckets]]
name = "conf-replication"
[request]
method = "PUT"
target = "/conf-replication?replication"
headers = { "content-type" = "application/xml", "content-md5" = "ERY0eTUroas87qOSBUalTw==" }
body = { utf8 = '<ReplicationConfiguration><Role>arn:aws:iam::111122223333:role/replication-role</Role><Rule><Priority>1</Priority><Filter><Prefix>logs/</Prefix><Tag><Key>env</Key><Value>prod</Value></Tag></Filter><Status>Enabled</Status><Destination><Bucket>arn:aws:s3:::replica-bucket</Bucket></Destination><DeleteMarkerReplication><Status>Disabled</Status></DeleteMarkerReplication></Rule></ReplicationConfiguration>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 400
connection_after = "open"

[expect.error]
code = "MalformedXML"
request_id_present = true

[expect.headers_present]
"content-type" = "application/xml"

[expect.body]
redact = ["RequestId", "HostId"]
exact_utf8 = '''
<?xml version="1.0" encoding="UTF-8"?>
<Error><Code>MalformedXML</Code><Message>A Filter must have exactly one of Prefix, Tag or And specified</Message><RequestId>__REDACTED__</RequestId><HostId>__REDACTED__</HostId></Error>'''
