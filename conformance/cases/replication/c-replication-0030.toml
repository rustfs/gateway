[case]
id = "c-replication-0030"
schema_version = 3
title = "A Status outside the documented pair is stored and echoed rather than refused"
rationale = """
The deliberate leniency, pinned so it cannot be tightened by accident: a stored configuration is re-parsed by every future release, and this is the one configuration RustFS parses fail-closed — a Status spelling refused tomorrow that was accepted yesterday does not switch replication off, it makes the bucket unusable. The read-back golden proves the value is preserved as sent, not corrected to the canonical spelling, because rewriting stored bytes is a second way to surprise the next parser."""
polarity = "negative"
operation = "PutBucketReplication"
tags = ["replication", "xml", "known-divergence"]
timeout_ms = 10000
quirks = ["q-repl-0012"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_ReplicationRule.html"
summary = "The Status member documents Enabled and Disabled as its value set; passing out-of-set spellings through is this project's recorded fail-open decision."
kind = "aws-doc"

[[case.evidence]]
url = "https://github.com/s3s-project/s3s/issues/428"
summary = "Upstream's replication configuration types could not round-trip stored documents, the failure a strict enum decode reintroduces."
kind = "s3s-issue"


[[setup.buckets]]
name = "conf-replication"
[[exchanges]]
name = "lowercase-status"

[exchanges.request]
method = "PUT"
target = "/conf-replication?replication"
headers = { "content-type" = "application/xml" }
content_md5 = "computed"
body = { utf8 = '<ReplicationConfiguration><Role>arn:aws:iam::111122223333:role/replication-role</Role><Rule><Prefix>lax/</Prefix><Status>enabled</Status><Destination><Bucket>arn:aws:s3:::replica-bucket</Bucket></Destination></Rule></ReplicationConfiguration>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[[exchanges]]
name = "read-back"

[exchanges.request]
method = "GET"
target = "/conf-replication?replication"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[exchanges.expect.headers_present]
"content-type" = "application/xml"

[exchanges.expect.body]
golden = "goldens/c-replication-0030.xml"
