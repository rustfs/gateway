[case]
id = "c-replication-0012"
schema_version = 3
title = "Configure, delete, read: the delete answers 204 and the read then answers the family's 404"
rationale = """
The teardown sequence a real operator runs, held together in one case because its meaning is in the ordering: the delete of an existing document is 204 with no body, and the very next read answers ReplicationConfigurationNotFoundError — proof the delete actually removed the document rather than answering 204 over a configuration still in force. A delete that reports success while the rules quietly persist is the failure this sequence exists to catch: the operator believes replication is off, and the bucket keeps shipping every new object to the old destination."""
polarity = "positive"
operation = "DeleteBucketReplication"
tags = ["replication", "error-shape"]
timeout_ms = 10000
quirks = ["q-repl-0001", "q-repl-0003"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_DeleteBucketReplication.html"
summary = "The operation documents a 204 No Content success for removing the bucket's replication configuration."
kind = "aws-doc"

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/ErrorResponses.html"
summary = "The replication-related error code list documents ReplicationConfigurationNotFoundError with HTTP status 404."
kind = "aws-doc"


[[setup.buckets]]
name = "conf-replication"
[[exchanges]]
name = "put"

[exchanges.request]
method = "PUT"
target = "/conf-replication?replication"
headers = { "content-type" = "application/xml" }
content_md5 = "computed"
body = { utf8 = '<ReplicationConfiguration><Role>arn:aws:iam::111122223333:role/replication-role</Role><Rule><Status>Enabled</Status><Destination><Bucket>arn:aws:s3:::replica-bucket</Bucket></Destination></Rule></ReplicationConfiguration>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[[exchanges]]
name = "delete"

[exchanges.request]
method = "DELETE"
target = "/conf-replication?replication"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 204
connection_after = "open"

[[exchanges]]
name = "read-after-delete"

[exchanges.request]
method = "GET"
target = "/conf-replication?replication"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 404
connection_after = "open"

[exchanges.expect.error]
code = "ReplicationConfigurationNotFoundError"
request_id_present = true
