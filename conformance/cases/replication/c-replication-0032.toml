[case]
id = "c-replication-0032"
schema_version = 1
title = "A rule missing its required Destination is refused as MalformedXML"
rationale = """
The Destination is the rule's other required member — a rule without one selects objects and sends them nowhere. The refusal must land at decode time: a stored destination-less rule is a document the engine can only fail on, and under fail-closed persistence that failure is the whole bucket, not the one rule."""
polarity = "negative"
operation = "PutBucketReplication"
tags = ["replication", "xml", "error-shape"]
timeout_ms = 10000
quirks = []

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_ReplicationRule.html"
summary = "The Destination member is documented as required within a replication rule."
kind = "aws-doc"


[[setup.buckets]]
name = "conf-replication"
[request]
method = "PUT"
target = "/conf-replication?replication"
headers = { "content-type" = "application/xml", "content-md5" = "kG8gwjbUnn6SYMLX6olOSg==" }
body = { utf8 = '<ReplicationConfiguration><Role>arn:aws:iam::111122223333:role/replication-role</Role><Rule><Prefix>logs/</Prefix><Status>Enabled</Status></Rule></ReplicationConfiguration>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 400
connection_after = "open"

[expect.error]
code = "MalformedXML"
request_id_present = true
