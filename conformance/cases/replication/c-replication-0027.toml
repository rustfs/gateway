[case]
id = "c-replication-0027"
schema_version = 3
title = "A rule ID over 255 characters is refused as InvalidArgument"
rationale = """
The ID's bound is documented — a maximum of 255 characters — and the refusal is measured in characters, not bytes, so a multi-byte name is not penalized for its encoding. The constant refusal message names the bound and never the offending value: a 256-character identifier echoed into an error body is a log line nobody asked to store."""
polarity = "negative"
operation = "PutBucketReplication"
tags = ["replication", "xml", "error-shape"]
timeout_ms = 10000
quirks = ["q-repl-0008"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_ReplicationRule.html"
summary = "The ID member is documented as a unique identifier for the rule with a maximum of 255 characters."
kind = "aws-doc"


[[setup.buckets]]
name = "conf-replication"
[request]
method = "PUT"
target = "/conf-replication?replication"
headers = { "content-type" = "application/xml" }
content_md5 = "computed"
body = { utf8 = '<ReplicationConfiguration><Role>arn:aws:iam::111122223333:role/replication-role</Role><Rule><ID>iiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiii</ID><Prefix>logs/</Prefix><Status>Enabled</Status><Destination><Bucket>arn:aws:s3:::replica-bucket</Bucket></Destination></Rule></ReplicationConfiguration>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 400
connection_after = "open"

[expect.error]
code = "InvalidArgument"
request_id_present = true

[expect.headers_present]
"content-type" = "application/xml"

[expect.body]
redact = ["RequestId", "HostId"]
exact_utf8 = '''
<?xml version="1.0" encoding="UTF-8"?>
<Error><Code>InvalidArgument</Code><Message>ID must be no more than 255 characters</Message><RequestId>__REDACTED__</RequestId><HostId>__REDACTED__</HostId></Error>'''
