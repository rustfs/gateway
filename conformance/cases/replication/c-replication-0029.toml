[case]
id = "c-replication-0029"
schema_version = 3
title = "A refused document carrying a KMS key id and an account id leaks neither into the error body"
rationale = """
The hygiene probe on the refusal path: this document is refused for its missing Priority, and it happens to carry a replica KMS key id and a destination account id. The refusal must be the constant reason and nothing else — an error body that quoted the surrounding document back would copy a key identifier and an account number into every log line that captures one, which is how configuration secrets end up in log aggregators with wider read access than the bucket ever had."""
polarity = "negative"
operation = "PutBucketReplication"
tags = ["replication", "xml", "error-shape", "security"]
timeout_ms = 10000
quirks = ["q-repl-0010"]

[[case.evidence]]
url = "https://github.com/s3s-project/s3s/pull/319"
summary = "Upstream's secret-handling fixes record how easily key material reaches unintended surfaces once carried as a plain string."
kind = "s3s-pr"

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutBucketReplication.html"
summary = "The operation documents that a configuration adding the Filter element must also add Priority, the refusal this case rides on."
kind = "aws-doc"


[[setup.buckets]]
name = "conf-replication"
[request]
method = "PUT"
target = "/conf-replication?replication"
headers = { "content-type" = "application/xml" }
content_md5 = "computed"
body = { utf8 = '<ReplicationConfiguration><Role>arn:aws:iam::111122223333:role/replication-role</Role><Rule><Filter><Prefix>kms/</Prefix></Filter><Status>Enabled</Status><Destination><Bucket>arn:aws:s3:::replica-bucket</Bucket><Account>111122223333</Account><EncryptionConfiguration><ReplicaKmsKeyID>arn:aws:kms:us-east-1:111122223333:key/1234abcd-12ab-34cd-56ef-1234567890ab</ReplicaKmsKeyID></EncryptionConfiguration></Destination><DeleteMarkerReplication><Status>Disabled</Status></DeleteMarkerReplication></Rule></ReplicationConfiguration>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 400
connection_after = "open"

[expect.error]
code = "InvalidRequest"
request_id_present = true

[expect.headers_present]
"content-type" = "application/xml"

[expect.body]
redact = ["RequestId", "HostId"]
exact_utf8 = '''
<?xml version="1.0" encoding="UTF-8"?>
<Error><Code>InvalidRequest</Code><Message>A Rule that specifies a Filter must also specify a Priority</Message><RequestId>__REDACTED__</RequestId><HostId>__REDACTED__</HostId></Error>'''
not_contains_utf8 = ["arn:aws:kms", "1234abcd", "111122223333"]
