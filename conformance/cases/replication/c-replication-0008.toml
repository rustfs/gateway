[case]
id = "c-replication-0008"
schema_version = 3
title = "SourceSelectionCriteria and a ReplicaKmsKeyID round-trip, and the read echoes the key id"
rationale = """
The SSE-KMS opt-in in full: SseKmsEncryptedObjects selects the encrypted sources, ReplicaModifications the replica-side edits, and the destination names the KMS key that will encrypt the replicas. The read-back deliberately proves the key id is echoed — that is the documented GET response, and an implementation that redacted it here would break the operator reading back their own configuration. The refusal path is the opposite contract, pinned by its own case: an error message never carries this value."""
polarity = "positive"
operation = "PutBucketReplication"
tags = ["replication", "xml", "wire-bytes", "security"]
timeout_ms = 10000
quirks = ["q-repl-0010"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_GetBucketReplication.html"
summary = "The documented response echoes the stored destination configuration including the ReplicaKmsKeyID member."
kind = "aws-doc"

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/userguide/replication-add-config.html"
summary = "The SSE-KMS walkthrough opts in through SourceSelectionCriteria and names the replica key in the destination's EncryptionConfiguration."
kind = "aws-doc"


[[setup.buckets]]
name = "conf-replication"
[[exchanges]]
name = "put"

[exchanges.request]
method = "PUT"
target = "/conf-replication?replication"
headers = { "content-type" = "application/xml" }
content_md5 = "computed"
body = { utf8 = '<ReplicationConfiguration><Role>arn:aws:iam::111122223333:role/replication-role</Role><Rule><Priority>1</Priority><Filter><Prefix>kms/</Prefix></Filter><Status>Enabled</Status><SourceSelectionCriteria><SseKmsEncryptedObjects><Status>Enabled</Status></SseKmsEncryptedObjects><ReplicaModifications><Status>Enabled</Status></ReplicaModifications></SourceSelectionCriteria><Destination><Bucket>arn:aws:s3:::replica-bucket</Bucket><EncryptionConfiguration><ReplicaKmsKeyID>arn:aws:kms:us-east-1:111122223333:key/1234abcd-12ab-34cd-56ef-1234567890ab</ReplicaKmsKeyID></EncryptionConfiguration></Destination><DeleteMarkerReplication><Status>Disabled</Status></DeleteMarkerReplication></Rule></ReplicationConfiguration>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[[exchanges]]
name = "read-back"

[exchanges.request]
method = "GET"
target = "/conf-replication?replication"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[exchanges.expect.headers_present]
"content-type" = "application/xml"

[exchanges.expect.body]
golden = "goldens/c-replication-0008.xml"
