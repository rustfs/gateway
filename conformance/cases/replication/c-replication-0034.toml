[case]
id = "c-replication-0034"
schema_version = 1
title = "A V1 rule carrying a DeleteMarkerReplication element is refused as InvalidRequest"
rationale = """
The second member refused on a V1 rule, for the same reason as the Priority: DeleteMarkerReplication arrives with the V2 schema, and the earlier format handles delete markers implicitly — the documentation's backward-compatibility notes say V1 configurations replicate delete markers by their own fixed rule, with no element to override it. A V1 rule carrying the V2 element is a document whose delete-marker behaviour depends on which schema the reader assumes."""
polarity = "negative"
operation = "PutBucketReplication"
tags = ["replication", "xml", "error-shape"]
timeout_ms = 10000
quirks = ["q-repl-0006"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_ReplicationRule.html"
summary = "The DeleteMarkerReplication member documents that earlier-version configurations handle delete markers differently, through the backward-compatibility notes."
kind = "aws-doc"


[[setup.buckets]]
name = "conf-replication"
[request]
method = "PUT"
target = "/conf-replication?replication"
headers = { "content-type" = "application/xml", "content-md5" = "36WPF2FhR7WSaPRSzB4eVA==" }
body = { utf8 = '<ReplicationConfiguration><Role>arn:aws:iam::111122223333:role/replication-role</Role><Rule><Prefix>logs/</Prefix><Status>Enabled</Status><Destination><Bucket>arn:aws:s3:::replica-bucket</Bucket></Destination><DeleteMarkerReplication><Status>Disabled</Status></DeleteMarkerReplication></Rule></ReplicationConfiguration>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 400
connection_after = "open"

[expect.error]
code = "InvalidRequest"
request_id_present = true

[expect.headers_present]
"content-type" = "application/xml"

[expect.body]
redact = ["RequestId", "HostId"]
exact_utf8 = '''
<?xml version="1.0" encoding="UTF-8"?>
<Error><Code>InvalidRequest</Code><Message>DeleteMarkerReplication can only be used together with a Filter; a rule-level Prefix belongs to the earlier schema</Message><RequestId>__REDACTED__</RequestId><HostId>__REDACTED__</HostId></Error>'''
