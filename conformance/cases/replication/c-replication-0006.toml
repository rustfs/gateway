[case]
id = "c-replication-0006"
schema_version = 1
title = "A Destination carrying a bucket ARN, an Account and a StorageClass round-trips intact"
rationale = """
The destination Bucket is an ARN — arn:aws:s3:::bucket — a value the S3 bucket-name grammar itself would refuse for its colons, which is why the member is decoded as a plain string rather than through the bucket-name type the model declares. This case pins that decision at the wire: the ARN, the twelve-digit account and the replica storage class all come back byte for byte, and no invented ARN grammar gets a chance to refuse a stored document."""
polarity = "positive"
operation = "PutBucketReplication"
tags = ["replication", "xml", "wire-bytes"]
timeout_ms = 10000
quirks = ["q-repl-0011"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_Destination.html"
summary = "The Bucket member is documented as the Amazon Resource Name of the destination bucket, with Account and StorageClass beside it."
kind = "aws-doc"


[[setup.buckets]]
name = "conf-replication"
[[exchanges]]
name = "put"

[exchanges.request]
method = "PUT"
target = "/conf-replication?replication"
headers = { "content-type" = "application/xml", "content-md5" = "0S1VZ1pL1hfWaA4J1gL4ZA==" }
body = { utf8 = '<ReplicationConfiguration><Role>arn:aws:iam::111122223333:role/replication-role</Role><Rule><Priority>1</Priority><Filter><Prefix>docs/</Prefix></Filter><Status>Enabled</Status><Destination><Bucket>arn:aws:s3:::replica-bucket</Bucket><Account>111122223333</Account><StorageClass>STANDARD_IA</StorageClass></Destination><DeleteMarkerReplication><Status>Disabled</Status></DeleteMarkerReplication></Rule></ReplicationConfiguration>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[[exchanges]]
name = "read-back"

[exchanges.request]
method = "GET"
target = "/conf-replication?replication"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[exchanges.expect.headers_present]
"content-type" = "application/xml"

[exchanges.expect.body]
golden = "goldens/c-replication-0006.xml"
