[case]
id = "c-replication-0018"
schema_version = 3
title = "A document with a Role but no Rule is refused as MalformedXML"
rationale = """
A replication configuration must include at least one rule — the documentation says so in as many words — and a rule-less document is not a spelling of "stop replicating", which is the delete's job. The refusal keeps the family's three states honest: configured, unconfigured, and nothing in between for a monitoring tool to misread."""
polarity = "negative"
operation = "PutBucketReplication"
tags = ["replication", "xml", "error-shape"]
timeout_ms = 10000
quirks = []

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutBucketReplication.html"
summary = "The operation documents that a replication configuration must include at least one rule and can contain up to one thousand."
kind = "aws-doc"


[[setup.buckets]]
name = "conf-replication"
[request]
method = "PUT"
target = "/conf-replication?replication"
headers = { "content-type" = "application/xml" }
content_md5 = "computed"
body = { utf8 = '<ReplicationConfiguration><Role>arn:aws:iam::111122223333:role/replication-role</Role></ReplicationConfiguration>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 400
connection_after = "open"

[expect.error]
code = "MalformedXML"
request_id_present = true
