[case]
id = "c-replication-0020"
schema_version = 1
title = "A rule carrying both a Filter and a rule-level Prefix is refused as InvalidRequest"
rationale = """
The rule-level Prefix is the V1 spelling of the scope and the Filter is the V2 spelling, and the configuration's schema version is decided by exactly this distinction — a rule carrying both is two versions at once, with two scopes that need not agree. Refusing it is what keeps the stored document's version well-defined; storing it would hand the engine a rule whose object set depends on which spelling the reader happens to prefer."""
polarity = "negative"
operation = "PutBucketReplication"
tags = ["replication", "xml", "error-shape"]
timeout_ms = 10000
quirks = ["q-repl-0006"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/userguide/replication-add-config.html"
summary = "The backward-compatibility section defines V2 as the format whose rules carry Filter and V1 as the format whose rules carry a direct Prefix child."
kind = "aws-doc"


[[setup.buckets]]
name = "conf-replication"
[request]
method = "PUT"
target = "/conf-replication?replication"
headers = { "content-type" = "application/xml", "content-md5" = "2pLqWZQxkD2RU0vA4R98cg==" }
body = { utf8 = '<ReplicationConfiguration><Role>arn:aws:iam::111122223333:role/replication-role</Role><Rule><Priority>1</Priority><Prefix>logs/</Prefix><Filter><Prefix>docs/</Prefix></Filter><Status>Enabled</Status><Destination><Bucket>arn:aws:s3:::replica-bucket</Bucket></Destination><DeleteMarkerReplication><Status>Disabled</Status></DeleteMarkerReplication></Rule></ReplicationConfiguration>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 400
connection_after = "open"

[expect.error]
code = "InvalidRequest"
request_id_present = true

[expect.headers_present]
"content-type" = "application/xml"

[expect.body]
redact = ["RequestId", "HostId"]
exact_utf8 = '''
<?xml version="1.0" encoding="UTF-8"?>
<Error><Code>InvalidRequest</Code><Message>A Rule cannot combine a Filter with a rule-level Prefix; Prefix is the earlier schema's spelling of the scope</Message><RequestId>__REDACTED__</RequestId><HostId>__REDACTED__</HostId></Error>'''
