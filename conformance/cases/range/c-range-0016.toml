# c-range-0016 — a partial read must not advertise the whole object's checksum.
#
# Schema dimensions exercised: headers_absent as the entire assertion, contrasted against a full
# read on the same connection where the same header must be present.

[case]
id = "c-range-0016"
schema_version = 1
title = "A ranged read carries no whole-object checksum, while a full read still does"
rationale = """
An SDK that was told the object's checksum verifies what it received against it, so a 206 carrying \
the digest of the entire object fails verification on every ranged download — and the client \
reports data corruption, which sends an operator looking at storage rather than at a header. The \
suppression has to be exactly this narrow: dropping the checksum from complete responses too would \
disable verification everywhere and would look like a fix, because the errors stop. The second \
exchange is what holds that line."""
polarity = "negative"
operation = "GetObject"
tags = ["range", "checksum", "read"]
timeout_ms = 10000
quirks = ["q-range-0055"]

[[case.evidence]]
url = "https://github.com/s3s-project/s3s/issues/284"
summary = "A ranged read returned the whole object's checksum, so client-side verification of the received bytes could not succeed."

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/userguide/checking-object-integrity.html"
summary = "Describes a returned checksum as covering the bytes it accompanies, which for a partial read is not the whole object."

[clock]
fixed = "2026-01-02T03:04:05Z"

[connection]
reuse = true

[[setup.buckets]]
name = "conf-range"

[[setup.objects]]
bucket = "conf-range"
key = "checksummed"
content_type = "text/plain"
body = { utf8 = "0123456789" }
metadata = { "conformance-note" = "written with a checksum algorithm by the fixture loader" }

[[exchanges]]
name = "the-ranged-read-carries-no-object-checksum"

[exchanges.request]
method = "GET"
target = "/conf-range/checksummed"
headers = { "range" = "bytes=0-4", "x-amz-checksum-mode" = "ENABLED" }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 206
headers_absent = ["x-amz-checksum-crc32", "x-amz-checksum-crc32c", "x-amz-checksum-sha1", "x-amz-checksum-sha256", "x-amz-checksum-crc64nvme"]
connection_after = "open"

[exchanges.expect.headers_present]
"content-range" = "bytes 0-4/10"

[exchanges.expect.body]
exact_utf8 = "01234"

[[exchanges]]
name = "the-full-read-still-does"

[exchanges.request]
method = "GET"
target = "/conf-range/checksummed"
headers = { "x-amz-checksum-mode" = "ENABLED" }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[exchanges.expect.headers_present]
"x-amz-checksum-crc32" = "*"

[exchanges.expect.body]
exact_utf8 = "0123456789"
