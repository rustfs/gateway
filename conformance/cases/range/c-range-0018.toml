# c-range-0018 — If-Range is a switch, not a condition.
#
# Schema dimensions exercised: two exchanges over one connection, contrasting the matched and the
# stale validator against one object.

[case]
id = "c-range-0018"
schema_version = 1
title = "A stale If-Range drops the range and serves the whole object instead of failing"
rationale = """
If-Range exists so that a resumed download cannot splice bytes from two different versions of an \
object together. When the validator still matches, the range is honoured; when it does not, the \
correct answer is the whole new object, because that is what the client needs in order to start \
again. An implementation that treats it as an ordinary precondition answers 412 and the client \
gives up on a request that should simply have restarted; one that ignores it entirely produces the \
spliced file the header was invented to prevent."""
polarity = "negative"
operation = "GetObject"
tags = ["range", "conditional", "preconditions", "wire-bytes"]
timeout_ms = 10000
quirks = ["q-range-0058"]

[[case.evidence]]
url = "https://www.rfc-editor.org/rfc/rfc9110#section-13.1.5"
summary = "When the If-Range validator does not match, the server ignores the range header and returns the entire representation."

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_GetObject.html"
summary = "Documents If-Range alongside the range header as the guard on a resumed partial read."

[clock]
fixed = "2026-01-02T03:04:05Z"

[connection]
reuse = true

[[setup.buckets]]
name = "conf-range"

[[setup.objects]]
bucket = "conf-range"
key = "ten"
content_type = "text/plain"
body = { utf8 = "0123456789" }

[[exchanges]]
name = "the-validator-still-matches"

[exchanges.request]
method = "GET"
target = "/conf-range/ten"
headers = { "range" = "bytes=0-4", "if-range" = "\"781e5e245d69b566979b86e28d23f2c7\"" }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 206
connection_after = "open"

[exchanges.expect.headers_present]
"content-range" = "bytes 0-4/10"

[exchanges.expect.body]
exact_utf8 = "01234"

[[exchanges]]
name = "the-validator-is-stale"

[exchanges.request]
method = "GET"
target = "/conf-range/ten"
headers = { "range" = "bytes=0-4", "if-range" = "\"0000000000000000000000000000dead\"" }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
headers_absent = ["content-range"]
connection_after = "open"

[exchanges.expect.headers_present]
"content-length" = "10"

[exchanges.expect.body]
exact_utf8 = "0123456789"
