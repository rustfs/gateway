# c-range-0012 — a descending range, resolved to one behaviour.
#
# Schema dimensions exercised: byte-exact body, which pins which of the two admissible answers was
# chosen.

[case]
id = "c-range-0012"
schema_version = 1
title = "A range whose start is after its end is ignored rather than answered"
rationale = """
A descending range is syntactically well formed and semantically empty, and both "ignore it" and \
"refuse it" are defensible. What is not defensible is leaving the choice to whichever branch runs \
first: an implementation that subtracts the positions without checking their order underflows, and \
the resulting length is either enormous or a panic. Fixing the behaviour to the ignoring answer \
keeps it consistent with every other unusable spelling, and pinning it here is what stops it from \
drifting the next time the parser is touched."""
polarity = "negative"
operation = "GetObject"
tags = ["range", "security", "wire-bytes"]
timeout_ms = 10000
quirks = ["q-range-0057"]

[[case.evidence]]
url = "https://www.rfc-editor.org/rfc/rfc9110#section-14.1.1"
summary = "A range whose first position exceeds its last is invalid, and an invalid range set is ignored."

[[case.evidence]]
url = "https://github.com/s3s-project/s3s/pull/37"
summary = "Upstream change that typed the range header so malformed spellings stopped reaching arithmetic that assumed they were ordered."

[clock]
fixed = "2026-01-02T03:04:05Z"

[[setup.buckets]]
name = "conf-range"

[[setup.objects]]
bucket = "conf-range"
key = "ten"
content_type = "text/plain"
body = { utf8 = "0123456789" }

[request]
method = "GET"
target = "/conf-range/ten"
headers = { "range" = "bytes=5-3" }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 200
headers_absent = ["content-range"]
connection_after = "open"

[expect.headers_present]
"content-length" = "10"

[expect.timing]
terminate_within_ms = 5000

[expect.body]
exact_utf8 = "0123456789"
