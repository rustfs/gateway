# c-range-0014 — a zero-byte object has no satisfiable range.
#
# Schema dimensions exercised: a zero-length fixture, the unsatisfied Content-Range form at zero.

[case]
id = "c-range-0014"
schema_version = 1
title = "Every range of a zero-byte object is unsatisfiable, including bytes=0-0"
rationale = """
The first byte of an empty object does not exist, so satisfiability is false for every range — and \
`bytes=0-0` is the spelling that makes an implementation prove it, because zero is inside almost \
every bounds check written by hand. The alternative outcome is a 206 announcing one byte and \
sending none, which leaves the client waiting on a body that is already finished. Empty objects \
are common enough as markers and placeholders that this is not a hypothetical."""
polarity = "negative"
operation = "GetObject"
tags = ["range", "read", "error-shape"]
timeout_ms = 10000
quirks = ["q-range-0052", "q-range-0054"]

[[case.evidence]]
url = "https://www.rfc-editor.org/rfc/rfc9110#section-14.1.1"
summary = "A range is satisfiable only when its first position is less than the current length, which no position is when the length is zero."

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/ErrorResponses.html"
summary = "The error-response reference lists the code returned for a range that cannot be satisfied."

[clock]
fixed = "2026-01-02T03:04:05Z"

[[setup.buckets]]
name = "conf-range"

[[setup.objects]]
bucket = "conf-range"
key = "empty"
content_type = "text/plain"
body = { utf8 = "" }

[request]
method = "GET"
target = "/conf-range/empty"
headers = { "range" = "bytes=0-0" }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 416
connection_after = "open"

[expect.error]
code = "InvalidRange"
request_id_present = true

[expect.headers_present]
"content-range" = "bytes */0"

[expect.timing]
terminate_within_ms = 5000
