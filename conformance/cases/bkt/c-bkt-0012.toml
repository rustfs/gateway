# c-bkt-0012 — us-east-1 written out explicitly.
#
# Schema dimensions exercised: error code plus status, on the rule this family exists for.

[case]
id = "c-bkt-0012"
schema_version = 1
title = "An explicit us-east-1 location constraint is refused rather than accepted as a no-op"
rationale = """
us-east-1 is the region with no constraint value: a creation there sends no constraint at all, and writing the name out is not a longer spelling of the same request but a value the field cannot take. Accepting it looks harmless and is not — it teaches a client that the explicit form works, and that client then sends the same body to AWS and gets the 400 this server hid. Every S3 reimplementation that has skipped this rule has produced exactly that migration failure."""
polarity = "negative"
operation = "CreateBucket"
tags = ["region", "error-shape"]
timeout_ms = 10000
quirks = ["q-bkt-0003"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_CreateBucket.html"
summary = "The request body documentation states that a creation in us-east-1 does not specify a location constraint."
kind = "aws-doc"

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_BucketLocationConstraint.html"
summary = "The enumerated constraint values exclude us-east-1 and keep the historical EU alias."
kind = "aws-doc"

[[setup.buckets]]
name = "conf-bkt-explicit"
absent = true

[request]
method = "PUT"
target = "/conf-bkt-explicit"
headers = { "content-type" = "application/xml" }
body = { utf8 = "<CreateBucketConfiguration><LocationConstraint>us-east-1</LocationConstraint></CreateBucketConfiguration>" }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 400
connection_after = "open"

[expect.error]
code = "InvalidLocationConstraint"
request_id_present = true

[expect.headers_present]
"content-type" = "application/xml"

[expect.timing]
terminate_within_ms = 5000
