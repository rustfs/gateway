# c-bkt-0021 — a deeply nested configuration body.
#
# Schema dimensions exercised: a depth ceiling, with the response-time budget as the assertion that
# the ceiling was reached rather than the tree walked.

[case]
id = "c-bkt-0021"
schema_version = 1
title = "A deeply nested configuration body is refused at the depth ceiling"
rationale = """
Nesting is the cheapest asymmetry a caller has: a few hundred bytes of open tags cost the sender \
nothing and cost a recursive-descent parser one stack frame each. The failure mode is not a wrong \
answer but a stack overflow, which takes the process down and takes every in-flight request with \
it — so the assertion is that the request is refused, quickly, with the connection still usable \
afterwards."""
polarity = "negative"
operation = "CreateBucket"
tags = ["xml", "dos"]
timeout_ms = 10000
quirks = ["q-bkt-0011"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/ErrorResponses.html"
summary = "A document a server will not parse is answered as malformed rather than by attempting it."
kind = "aws-doc"

[[setup.buckets]]
name = "conf-bkt-deep"
absent = true

[request]
method = "PUT"
target = "/conf-bkt-deep"
headers = { "content-type" = "application/xml" }
