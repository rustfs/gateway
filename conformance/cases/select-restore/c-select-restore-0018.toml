[case]
id = "c-select-restore-0018"
schema_version = 1
title = "A restore naming a version id that does not exist is NoSuchVersion, not the current copy"
rationale = """
A parameter that is decoded and then dropped answers exactly like one that arrived. Without the selector the same request starts a retrieval (c-select-restore-0001); with an id this bucket never minted it must be refused as NoSuchVersion rather than retrieving the current copy. A binding that lost the value, or a backend that ignored it, would answer 202 here."""
polarity = "negative"
operation = "RestoreObject"
tags = ["restore", "routing"]
timeout_ms = 10000
quirks = ["q-restore-0008"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_RestoreObject.html"
summary = "The operation documents versionId as the query parameter selecting which version is retrieved."
kind = "aws-doc"
[[setup.buckets]]
name = "conf-restore"

[[setup.objects]]
bucket = "conf-restore"
key = "cold.txt"
body = { utf8 = "archived payload" }
storage_class = "GLACIER"

[request]
method = "POST"
target = "/conf-restore/cold.txt?restore&versionId=v1"
headers = { "content-type" = "application/xml" }
body = { utf8 = '<RestoreRequest><Days>1</Days></RestoreRequest>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 404
connection_after = "open"

[expect.error]
code = "NoSuchVersion"
request_id_present = true
