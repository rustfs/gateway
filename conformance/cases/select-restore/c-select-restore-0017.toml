[case]
id = "c-select-restore-0017"
schema_version = 1
title = "A restore with an empty body is MalformedXML, not a retrieval with an invented duration"
rationale = """
The payload member is promoted to required precisely so this cannot be read as a defaulted document: neither documented form has a default, and Days in particular has none, so an accepted empty body would start a retrieval whose lifetime this implementation chose. The refusal comes from the decoder, before any of the semantic rules run."""
polarity = "negative"
operation = "RestoreObject"
tags = ["restore", "xml", "error-shape"]
timeout_ms = 10000
quirks = ["q-restore-0006"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_RestoreObject.html"
summary = "Every documented request example carries a RestoreRequest document and no default duration is published."
kind = "aws-doc"

[[case.evidence]]
url = "https://github.com/s3s-project/s3s/pull/377"
summary = "Upstream accepted an empty body where a document was required, and the fix pins the answer to 400 MalformedXML."
kind = "s3s-pr"
[[setup.buckets]]
name = "conf-restore"

[[setup.objects]]
bucket = "conf-restore"
key = "cold.txt"
body = { utf8 = "archived payload" }
storage_class = "GLACIER"

[request]
method = "POST"
target = "/conf-restore/cold.txt?restore"
headers = { "content-type" = "application/xml" }
body = { utf8 = '' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 400
connection_after = "open"

[expect.error]
code = "MalformedXML"
request_id_present = true

[expect.headers_present]
"content-type" = "application/xml"

[expect.body]
redact = ["RequestId", "HostId"]
exact_utf8 = '''
<?xml version="1.0" encoding="UTF-8"?>
<Error><Code>MalformedXML</Code><Message>the request body is not the XML this operation accepts</Message><RequestId>__REDACTED__</RequestId><HostId>__REDACTED__</HostId></Error>'''
