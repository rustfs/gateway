[case]
id = "c-select-restore-0024"
schema_version = 1
title = "Two input serializations at once are an ObjectSerializationConflict"
rationale = """
CSV and JSON are two descriptions of one object's format, and a reader that picked one would parse the bytes as something the caller did not describe and return rows that look plausible. That is the worst available outcome for a query, and it is why AWS publishes a code for the conflict rather than a preference."""
polarity = "negative"
operation = "SelectObjectContent"
tags = ["select", "error-shape"]
timeout_ms = 10000
quirks = ["q-select-0003"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_InputSerialization.html"
summary = "The structure documents CSV, JSON and Parquet as alternative descriptions of one object's format."
kind = "aws-doc"
[[setup.buckets]]
name = "conf-select"

[[setup.objects]]
bucket = "conf-select"
key = "rows.csv"
body = { utf8 = "a,b\n1,2\n" }

[request]
method = "POST"
target = "/conf-select/rows.csv?select&select-type=2"
headers = { "content-type" = "application/xml" }
body = { utf8 = '<SelectObjectContentRequest><Expression>SELECT * FROM S3Object</Expression><ExpressionType>SQL</ExpressionType><InputSerialization><CSV><FileHeaderInfo>USE</FileHeaderInfo><FieldDelimiter>,</FieldDelimiter><QuoteCharacter>"</QuoteCharacter></CSV><JSON><Type>LINES</Type></JSON><CompressionType>NONE</CompressionType></InputSerialization><OutputSerialization><CSV><RecordDelimiter>\n</RecordDelimiter></CSV></OutputSerialization></SelectObjectContentRequest>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 400
connection_after = "open"

[expect.error]
code = "ObjectSerializationConflict"
request_id_present = true

[expect.headers_present]
"content-type" = "application/xml"

[expect.body]
redact = ["RequestId", "HostId"]
exact_utf8 = '''
<?xml version="1.0" encoding="UTF-8"?>
<Error><Code>ObjectSerializationConflict</Code><Message>InputSerialization must name exactly one of CSV, JSON or Parquet</Message><RequestId>__REDACTED__</RequestId><HostId>__REDACTED__</HostId></Error>'''
