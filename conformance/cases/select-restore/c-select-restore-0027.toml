[case]
id = "c-select-restore-0027"
schema_version = 1
title = "An OutputSerialization naming no format is refused"
rationale = """
The complement of the conflict above, and the direction a validator that only counted duplicates would miss."""
polarity = "negative"
operation = "SelectObjectContent"
tags = ["select", "xml"]
timeout_ms = 10000
quirks = ["q-select-0004"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_OutputSerialization.html"
summary = "The structure documents one of CSV or JSON as the description of the returned records."
kind = "aws-doc"
[[setup.buckets]]
name = "conf-select"

[[setup.objects]]
bucket = "conf-select"
key = "rows.csv"
body = { utf8 = "a,b\n1,2\n" }

[request]
method = "POST"
target = "/conf-select/rows.csv?select&select-type=2"
headers = { "content-type" = "application/xml" }
body = { utf8 = '<SelectObjectContentRequest><Expression>SELECT * FROM S3Object</Expression><ExpressionType>SQL</ExpressionType><InputSerialization><CSV><FileHeaderInfo>USE</FileHeaderInfo><FieldDelimiter>,</FieldDelimiter><QuoteCharacter>"</QuoteCharacter></CSV><CompressionType>NONE</CompressionType></InputSerialization><OutputSerialization></OutputSerialization></SelectObjectContentRequest>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 400
connection_after = "open"

[expect.error]
code = "MalformedXML"
request_id_present = true

[expect.headers_present]
"content-type" = "application/xml"

[expect.body]
redact = ["RequestId", "HostId"]
exact_utf8 = '''
<?xml version="1.0" encoding="UTF-8"?>
<Error><Code>MalformedXML</Code><Message>OutputSerialization must name one of CSV or JSON</Message><RequestId>__REDACTED__</RequestId><HostId>__REDACTED__</HostId></Error>'''
