[case]
id = "c-select-restore-0025"
schema_version = 1
title = "An InputSerialization naming no format is refused"
rationale = """
The element is present and says nothing about how the object is written, which is not a default: guessing CSV would parse a JSON object as one enormous malformed row and report it as data."""
polarity = "negative"
operation = "SelectObjectContent"
tags = ["select", "xml"]
timeout_ms = 10000
quirks = ["q-select-0003"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_InputSerialization.html"
summary = "The structure documents one of CSV, JSON or Parquet as the description of the object's format."
kind = "aws-doc"
[[setup.buckets]]
name = "conf-select"

[[setup.objects]]
bucket = "conf-select"
key = "rows.csv"
body = { utf8 = "a,b\n1,2\n" }

[request]
method = "POST"
target = "/conf-select/rows.csv?select&select-type=2"
headers = { "content-type" = "application/xml" }
body = { utf8 = '<SelectObjectContentRequest><Expression>SELECT * FROM S3Object</Expression><ExpressionType>SQL</ExpressionType><InputSerialization><CompressionType>NONE</CompressionType></InputSerialization><OutputSerialization><CSV><RecordDelimiter>\n</RecordDelimiter></CSV></OutputSerialization></SelectObjectContentRequest>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 400
connection_after = "open"

[expect.error]
code = "MalformedXML"
request_id_present = true

[expect.headers_present]
"content-type" = "application/xml"

[expect.body]
redact = ["RequestId", "HostId"]
exact_utf8 = '''
<?xml version="1.0" encoding="UTF-8"?>
<Error><Code>MalformedXML</Code><Message>InputSerialization must name one of CSV, JSON or Parquet</Message><RequestId>__REDACTED__</RequestId><HostId>__REDACTED__</HostId></Error>'''
