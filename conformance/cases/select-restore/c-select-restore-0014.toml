[case]
id = "c-select-restore-0014"
schema_version = 1
title = "A SELECT restore without an OutputLocation is refused"
rationale = """
The select form has two required members and an answer that goes somewhere else, so a document naming the query without naming where to write it describes a retrieval with no destination. Accepting it would either drop the result or write it somewhere this implementation chose."""
polarity = "negative"
operation = "RestoreObject"
tags = ["restore", "select", "xml"]
timeout_ms = 10000
quirks = ["q-restore-select-output-required-0132"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_RestoreObject.html"
summary = "The SELECT form documents SelectParameters and an OutputLocation together."
kind = "aws-doc"
[[setup.buckets]]
name = "conf-restore"

[[setup.objects]]
bucket = "conf-restore"
key = "cold.txt"
body = { utf8 = "archived payload" }
storage_class = "GLACIER"

[request]
method = "POST"
target = "/conf-restore/cold.txt?restore"
headers = { "content-type" = "application/xml" }
body = { utf8 = '<RestoreRequest><Type>SELECT</Type><SelectParameters><InputSerialization><CSV></CSV></InputSerialization><ExpressionType>SQL</ExpressionType><Expression>SELECT * FROM S3Object</Expression><OutputSerialization><CSV></CSV></OutputSerialization></SelectParameters></RestoreRequest>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 400
connection_after = "open"

[expect.error]
code = "MalformedXML"
request_id_present = true

[expect.headers_present]
"content-type" = "application/xml"

[expect.body]
redact = ["RequestId", "HostId"]
exact_utf8 = '''
<?xml version="1.0" encoding="UTF-8"?>
<Error><Code>MalformedXML</Code><Message>A SELECT restore requires both SelectParameters and OutputLocation</Message><RequestId>__REDACTED__</RequestId><HostId>__REDACTED__</HostId></Error>'''
