[case]
id = "c-select-restore-0052"
schema_version = 1
title = "A select that asks for progress carries a keep-alive and a Progress frame before the accounting"
rationale = """
Progress and Cont are the two frames a client sees while a long scan runs: one reports interim byte counts when the request enabled RequestProgress, the other keeps an idle connection from being taken for a stall. Both are ordinary event messages that must survive the shared service path with their own headers and both CRCs, interleaved before the single Stats and the terminating End. The exact stream pins the order; the event counts and headers pin the frames independently of it."""
polarity = "positive"
operation = "SelectObjectContent"
tags = ["select", "event-stream"]
timeout_ms = 10000
quirks = ["q-select-event-status-0150", "q-select-termination-0155"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/RESTSelectObjectAppendix.html"
summary = "Progress reports interim byte counts when requested, Cont keeps the connection alive, and both precede the final Stats and End."
kind = "aws-doc"
[[setup.buckets]]
name = "conf-select"

[[setup.objects]]
bucket = "conf-select"
key = "rows.csv"
body = { utf8 = "a,b\n1,2\n" }

[request]
method = "POST"
target = "/conf-select/rows.csv?select&select-type=2"
headers = { "content-type" = "application/xml" }
body = { utf8 = '<SelectObjectContentRequest><Expression>SELECT * FROM S3Object</Expression><ExpressionType>SQL</ExpressionType><InputSerialization><CSV/></InputSerialization><OutputSerialization><CSV/></OutputSerialization><RequestProgress><Enabled>true</Enabled></RequestProgress></SelectObjectContentRequest>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "event_stream"
status = 200
connection_after = "open"
headers_present = { "content-type" = "application/vnd.amazon.event-stream" }

[[expect.events]]
type = "Cont"
min_count = 1
max_count = 1
headers = { "message-type" = "event", "event-type" = "Cont" }

[[expect.events]]
type = "Records"
min_count = 1
max_count = 1

[[expect.events]]
type = "Progress"
min_count = 1
max_count = 1
headers = { "content-type" = "text/xml" }

[expect.events.payload]
exact_utf8 = "<Progress><Details><BytesScanned>8</BytesScanned><BytesProcessed>8</BytesProcessed><BytesReturned>8</BytesReturned></Details></Progress>"

[[expect.events]]
type = "Stats"
min_count = 1
max_count = 1

[[expect.events]]
type = "End"
min_count = 1
max_count = 1

[expect.body]
exact_hex = ""
