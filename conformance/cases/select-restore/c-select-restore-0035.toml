[case]
id = "c-select-restore-0035"
schema_version = 1
title = "A well-formed select leaves the shared service as a complete event stream"
rationale = """
A select response is neither an empty generated output nor the XML continuation used by operations that commit a 200 before finishing. The handler returns the third response shape through the same assembled service as ordinary operations, and the observed body must contain a Records frame, exactly one Stats frame, and a terminating End frame with both CRCs valid."""
polarity = "positive"
operation = "SelectObjectContent"
tags = ["select", "event-stream"]
timeout_ms = 10000
quirks = ["q-select-0009"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/RESTSelectObjectAppendix.html"
summary = "The response is a sequence of self-framed messages, each a prelude with its own CRC, a header block, a payload and a message CRC."
kind = "aws-doc"

[[case.evidence]]
url = "https://github.com/s3s-project/s3s/issues/350"
summary = "Upstream shipped responses that ended without completing, which hangs a client — the failure a partly wired stream produces and a refusal does not."
kind = "s3s-issue"
[[setup.buckets]]
name = "conf-select"

[[setup.objects]]
bucket = "conf-select"
key = "rows.csv"
body = { utf8 = "a,b\n1,2\n" }

[request]
method = "POST"
target = "/conf-select/rows.csv?select&select-type=2"
headers = { "content-type" = "application/xml" }
body = { utf8 = '<SelectObjectContentRequest><Expression>SELECT * FROM S3Object</Expression><ExpressionType>SQL</ExpressionType><InputSerialization><CSV><FileHeaderInfo>USE</FileHeaderInfo><FieldDelimiter>,</FieldDelimiter><QuoteCharacter>"</QuoteCharacter></CSV><CompressionType>NONE</CompressionType></InputSerialization><OutputSerialization><CSV><RecordDelimiter>\n</RecordDelimiter></CSV></OutputSerialization></SelectObjectContentRequest>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "event_stream"
status = 200
connection_after = "open"
headers_present = { "content-type" = "application/vnd.amazon.event-stream" }

[[expect.events]]
type = "Records"
min_count = 1
max_count = 1

[[expect.events]]
type = "Stats"
min_count = 1
max_count = 1

[[expect.events]]
type = "End"
min_count = 1
max_count = 1

[expect.body]
exact_hex = ""
