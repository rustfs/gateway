[case]
id = "c-select-restore-0053"
schema_version = 1
title = "A select that disables progress carries no Progress and no keep-alive frame"
rationale = """
The opposite direction of c-select-restore-0052 on the same object and expression: RequestProgress present but disabled. A service that emitted interim frames regardless, or a harness that could not tell them apart, would make both cases green; here neither frame may appear and the stream is exactly Records, Stats, End."""
polarity = "negative"
operation = "SelectObjectContent"
tags = ["select", "event-stream"]
timeout_ms = 10000
quirks = ["q-select-termination-0155"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/RESTSelectObjectAppendix.html"
summary = "Progress messages are sent only when the request enables them; otherwise the stream carries records, the accounting and the terminator."
kind = "aws-doc"
[[setup.buckets]]
name = "conf-select"

[[setup.objects]]
bucket = "conf-select"
key = "rows.csv"
body = { utf8 = "a,b\n1,2\n" }

[request]
method = "POST"
target = "/conf-select/rows.csv?select&select-type=2"
headers = { "content-type" = "application/xml" }
body = { utf8 = '<SelectObjectContentRequest><Expression>SELECT * FROM S3Object</Expression><ExpressionType>SQL</ExpressionType><InputSerialization><CSV/></InputSerialization><OutputSerialization><CSV/></OutputSerialization><RequestProgress><Enabled>false</Enabled></RequestProgress></SelectObjectContentRequest>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "event_stream"
status = 200
connection_after = "open"

[[expect.events]]
type = "Progress"
min_count = 0
max_count = 0

[[expect.events]]
type = "Cont"
min_count = 0
max_count = 0

[[expect.events]]
type = "Records"
min_count = 1
max_count = 1

[[expect.events]]
type = "Stats"
min_count = 1
max_count = 1

[[expect.events]]
type = "End"
min_count = 1
max_count = 1

[expect.body]
exact_hex = ""
