[case]
id = "c-select-restore-0055"
schema_version = 1
title = "A deeply nested select body is refused at the depth ceiling"
rationale = """
Nesting is the cheapest asymmetry a caller has: a few hundred bytes of open tags cost the sender nothing and cost a recursive parser a frame each. The request body of this operation is untrusted input like any other, so it is refused at the XML depth ceiling, quickly, with the connection still usable, and never becomes a partial document the handler sees. Every required member is present and unknown elements are otherwise skipped, so the depth ceiling is the only reason this document is refused."""
polarity = "negative"
operation = "SelectObjectContent"
tags = ["select", "xml", "dos"]
timeout_ms = 10000
quirks = ["q-select-0008"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/ErrorResponses.html"
summary = "A document a server will not parse is answered as malformed rather than by attempting it."
kind = "aws-doc"

[[setup.buckets]]
name = "conf-select"

[[setup.objects]]
bucket = "conf-select"
key = "rows.csv"
body = { utf8 = "a,b\n1,2\n" }

[request]
method = "POST"
target = "/conf-select/rows.csv?select&select-type=2"
headers = { "content-type" = "application/xml" }
body = { utf8 = "<SelectObjectContentRequest><Expression>SELECT * FROM S3Object</Expression><ExpressionType>SQL</ExpressionType><InputSerialization><CSV/></InputSerialization><OutputSerialization><CSV/></OutputSerialization><Future><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a><a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a></a>