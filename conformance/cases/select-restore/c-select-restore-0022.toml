[case]
id = "c-select-restore-0022"
schema_version = 1
title = "An expression past the documented ceiling is ExpressionTooLong"
rationale = """
The ceiling is 256 KiB and the operation publishes a code of its own for crossing it, which means a caller can tell "my query is too long" from "my query is wrong" without reading prose. The refusal happens on the length alone: not a character of the expression is parsed, and none of it appears in the answer."""
polarity = "negative"
operation = "SelectObjectContent"
tags = ["select", "dos", "security"]
timeout_ms = 10000
quirks = ["q-select-0002", "q-select-expression-secret-0139"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_SelectObjectContent.html"
summary = "The Expression member documents a maximum length of 256 KB and the operation publishes ExpressionTooLong."
kind = "aws-doc"
[[setup.buckets]]
name = "conf-select"

[[setup.objects]]
bucket = "conf-select"
key = "rows.csv"
body = { utf8 = "a,b\n1,2\n" }

[request]
method = "POST"
target = "/conf-select/rows.csv?select&select-type=2"
headers = { "content-type" = "application/xml" }
body = { file = "fixtures/select-restore/expression-too-long.xml" }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 400
connection_after = "open"

[expect.error]
code = "ExpressionTooLong"
request_id_present = true

[expect.body]
redact = ["RequestId", "HostId"]
not_contains_utf8 = ["QQQQQQQQ"]
exact_utf8 = '''
<?xml version="1.0" encoding="UTF-8"?>
<Error><Code>ExpressionTooLong</Code><Message>Expression exceeds the maximum length of 262144 bytes</Message><RequestId>__REDACTED__</RequestId><HostId>__REDACTED__</HostId></Error>'''
