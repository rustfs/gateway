[case]
id = "c-select-restore-0047"
schema_version = 1
title = "An end-only ScanRange selects a suffix"
rationale = """
End without Start names the suffix form. Treating the value as a prefix boundary returns different records while every frame and status remains valid."""
polarity = "positive"
operation = "SelectObjectContent"
tags = ["select", "range", "event-stream"]
timeout_ms = 10000
quirks = ["q-select-scan-suffix-0147"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_ScanRange.html"
summary = "The end-only form selects the documented suffix window."
kind = "aws-doc"

[[setup.buckets]]
name = "conf-select"

[[setup.objects]]
bucket = "conf-select"
key = "rows.csv"
body = { utf8 = "0123456789" }

[request]
method = "POST"
target = "/conf-select/rows.csv?select&select-type=2"
headers = { "content-type" = "application/xml" }
body = { utf8 = '<SelectObjectContentRequest><Expression>SELECT 1</Expression><ExpressionType>SQL</ExpressionType><InputSerialization><CSV/></InputSerialization><OutputSerialization><CSV/></OutputSerialization><ScanRange><End>3</End></ScanRange></SelectObjectContentRequest>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "event_stream"
status = 200
connection_after = "open"
headers_present = { "content-type" = "application/vnd.amazon.event-stream" }

[[expect.events]]
type = "Records"
min_count = 1
max_count = 1

[expect.events.payload]
exact_utf8 = "789"

[[expect.events]]
type = "End"
min_count = 1
max_count = 1
