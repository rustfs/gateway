# c-location-0005 — a scope region the deployment does not serve is refused by default.
#
# Schema dimensions exercised: a SigV4 scope naming a region outside the configured set, on a bucket
# read, and the region detail that tells the client where to sign.

[case]
id = "c-location-0005"
schema_version = 1
title = "GetBucketLocation signed for a region the deployment does not serve is refused by default"
rationale = """
RustFS clients commonly sign with an operator label such as `rustfs-local` whatever the server is \
set to, and RustFS verifies them. The gateway keeps the S3 answer as its default: the scope is \
cross-checked against the configured regions before any key is derived, and a mismatch is a 400 \
AuthorizationHeaderMalformed naming the region to use. Accepting any region is the opt-in RustFS \
profile of ADR-0023 (rd-loc-0004), which this case must not see: a build that turned it on by \
default would answer 200 here. The bucket exists and the credential is valid, so the region is \
the only thing wrong with the request."""
polarity = "negative"
operation = "GetBucketLocation"
tags = ["signature", "sigv4", "region", "error-shape"]
timeout_ms = 10000
quirks = []

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/ErrorResponses.html"
summary = "S3 answers a credential scope that names the wrong region with 400 AuthorizationHeaderMalformed."
kind = "aws-doc"

[[case.evidence]]
url = "https://github.com/rustfs/backlog/issues/1752"
summary = "The M1 differential found that RustFS verifies any scope region; the gateway keeps S3's refusal unless the RustFS profile is enabled."
kind = "other"

[[setup.buckets]]
name = "conf-location-scope"

[request]
method = "GET"
target = "/conf-location-scope?location"
headers = { }
sign = { mode = "sigv4_header", service = "s3", region = "rustfs-local", credential = "valid" }

[expect]
kind = "response"
status = 400
connection_after = "open"

[expect.error]
code = "AuthorizationHeaderMalformed"
request_id_present = true

[expect.headers_present]
"content-type" = "application/xml"

[expect.body]
redact = ["RequestId", "HostId"]
contains_utf8 = ["<Code>AuthorizationHeaderMalformed</Code>", "<Region>us-east-1</Region>"]
not_contains_utf8 = ["rustfs-local", "<LocationConstraint"]
