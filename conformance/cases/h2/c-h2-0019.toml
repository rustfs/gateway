# c-h2-0019 — client-authored HTTP/2 control frame.

[case]
id = "c-h2-0019"
schema_version = 5
title = "A client RST_STREAM mid-response is processed with no reply before a later PING"
rationale = "The response is held at one byte of credit and the client cancels the stream; the acknowledgement of a PING written after the cancel must arrive with no stream reset, GOAWAY or further stream data before it. With one byte of credit the peer could not send more DATA anyway, so this does not show the peer discarded its queued response."
polarity = "positive"
tags = ["framing"]
timeout_ms = 1500
quirks = []
applies_to = { http_versions = ["h2"], tls = "forbidden" }

[[case.evidence]]
url = "https://www.rfc-editor.org/rfc/rfc9113.html#section-6.4"
summary = "After receiving RST_STREAM the receiver must not send further frames for that stream, other than PRIORITY; the connection stays usable."
kind = "rfc"

[[case.evidence]]
url = "https://www.rfc-editor.org/rfc/rfc9113.html#section-6.7"
summary = "A PING without ACK must be answered by a PING with ACK carrying the same eight octets; a PING with ACK is never answered."
kind = "rfc"

[[setup.buckets]]
name = "conf-cors-rt"

[request]
method = "OPTIONS"
target = "/conf-cors-rt/key.txt"
http_version = "h2"

# One byte of stream credit stalls the response after its first DATA octet (c-h2-0003).

[[request.h2_frames]]
type = "settings"
payload_hex = "000400000001"

[[request.h2_frames]]
type = "headers"
stream_id = 1
flags = ["end_headers", "end_stream"]
payload_hex = "02074f5054494f4e538604152f636f6e662d636f72732d72742f6b65792e747874410e73332e6578616d706c652e636f6d"

[[request.h2_frames]]
type = "rst_stream"
stream_id = 1
error_code = "CANCEL"
delay_ms = 80

# Its acknowledgement shows the peer processed the reset before it; the observation ends there.

[[request.h2_frames]]
type = "ping"
payload_hex = "0102030405060708"

[expect]
kind = "client_reset"
status = 400
h2_control_frames = [{ type = "window_update", stream_id = 0, increment = 2031617 }, { type = "ping", payload_hex = "0102030405060708" }]

[expect.body]
exact_utf8 = "<"
