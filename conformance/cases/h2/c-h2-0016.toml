# c-h2-0016 — client-authored HTTP/2 control frame.

[case]
id = "c-h2-0016"
schema_version = 4
title = "A seven-octet PING is a connection error"
rationale = "A PING whose opaque data is not eight octets cannot be echoed and must end the connection rather than be acknowledged."
polarity = "negative"
tags = ["framing"]
timeout_ms = 1500
quirks = []
applies_to = { http_versions = ["h2"], tls = "forbidden" }

[[case.evidence]]
url = "https://www.rfc-editor.org/rfc/rfc9113.html#section-6.7"
summary = "A PING frame whose length is anything other than eight octets must be treated as a connection error of type FRAME_SIZE_ERROR."
kind = "rfc"

[[case.evidence]]
url = "https://www.rfc-editor.org/rfc/rfc9113.html#section-5.4"
summary = "An endpoint may report any applicable error code, and the generic PROTOCOL_ERROR or INTERNAL_ERROR may always replace a more specific one."
kind = "rfc"

[[setup.buckets]]
name = "conf-cors-rt"

[request]
method = "OPTIONS"
target = "/conf-cors-rt/key.txt"
http_version = "h2"

[[request.h2_frames]]
type = "settings"

[[request.h2_frames]]
type = "raw"
payload_hex = "00000706000000000001020304050607"
# Written 100 ms after SETTINGS so the peer's initial connection grant is already on the wire before the
# violation reaches it. The expectation is ordered, so a host too slow for that fails this case; it cannot pass it.
delay_ms = 100

[[request.h2_frames]]
type = "headers"
stream_id = 1
flags = ["end_headers", "end_stream"]
payload_hex = "02074f5054494f4e538604152f636f6e662d636f72732d72742f6b65792e747874410e73332e6578616d706c652e636f6d"

[expect]
kind = "connection_reset"
h2_control_frames = [{ type = "window_update", stream_id = 0, increment = 2031617 }, { type = "goaway", last_stream_id = 0, error_code_any_of = [1, 2, 6] }]
# No socket_read_after: the authored frames after the offending one race the peer's close, so EOF
# versus TCP reset is decided by this client's own trailing write, not by the server.
