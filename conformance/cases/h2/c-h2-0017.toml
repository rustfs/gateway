# c-h2-0017 — client-authored HTTP/2 control frame.

[case]
id = "c-h2-0017"
schema_version = 5
title = "A client PING is acknowledged with the same eight octets"
rationale = "A connection-liveness probe is only useful if the peer echoes exactly the octets sent; an ACK with other data or no ACK breaks every client keep-alive."
polarity = "positive"
tags = ["framing"]
timeout_ms = 1500
quirks = []
applies_to = { http_versions = ["h2"], tls = "forbidden" }

[[case.evidence]]
url = "https://www.rfc-editor.org/rfc/rfc9113.html#section-6.7"
summary = "A PING without ACK must be answered by a PING with ACK carrying the same eight octets; a PING with ACK is never answered."
kind = "rfc"

[[setup.buckets]]
name = "conf-cors-rt"

[request]
method = "OPTIONS"
target = "/conf-cors-rt/key.txt"
http_version = "h2"

[[request.h2_frames]]
type = "settings"

# Written after the peer's own preface frames so its initial grant is already on the wire.

[[request.h2_frames]]
type = "ping"
payload_hex = "0102030405060708"
delay_ms = 100

[[request.h2_frames]]
type = "headers"
stream_id = 1
flags = ["end_headers", "end_stream"]
payload_hex = "02074f5054494f4e538604152f636f6e662d636f72732d72742f6b65792e747874410e73332e6578616d706c652e636f6d"

[expect]
kind = "response"
status = 400
h2_control_frames = [{ type = "window_update", stream_id = 0, increment = 2031617 }, { type = "ping", payload_hex = "0102030405060708" }]

[expect.body]
contains_utf8 = ["<Code>BadRequest</Code>"]
