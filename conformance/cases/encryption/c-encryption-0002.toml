[case]
id = "c-encryption-0002"
schema_version = 1
title = "A stored document reads back as flattened Rule siblings under an xmlns-bearing root"
rationale = """
The read-back is where the flattened shape becomes observable: every SDK parses Rule as repeated children of the ServerSideEncryptionConfiguration root, so a serializer that introduces a Rules wrapper returns a document in which every SDK finds zero rules — the whole default-encryption configuration silently invisible, which for this family means clients conclude the bucket is unprotected. The root's xmlns is pinned for the same reason: strict parsers refuse an unnamespaced root. Byte-level comparison is the only assertion that notices either."""
polarity = "positive"
operation = "GetBucketEncryption"
tags = ["encryption", "xml", "wire-bytes"]
timeout_ms = 10000
quirks = ["q-enc-0002"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_GetBucketEncryption.html"
summary = "The documented response syntax shows Rule elements as direct children of the ServerSideEncryptionConfiguration root with no wrapper."
kind = "aws-doc"

[[case.evidence]]
url = "https://github.com/s3s-project/s3s/issues/264"
summary = "Upstream shipped response roots without the S3 xmlns and strict clients refused them."
kind = "s3s-issue"


[[setup.buckets]]
name = "conf-encryption"

[[exchanges]]
name = "put-minimal"

[exchanges.request]
method = "PUT"
target = "/conf-encryption?encryption"
headers = { "content-type" = "application/xml", "content-md5" = "6vzSAkrj6gUU1ZdQlOJRWQ==" }
body = { utf8 = '<ServerSideEncryptionConfiguration><Rule><ApplyServerSideEncryptionByDefault><SSEAlgorithm>AES256</SSEAlgorithm></ApplyServerSideEncryptionByDefault></Rule></ServerSideEncryptionConfiguration>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[[exchanges]]
name = "read-back"

[exchanges.request]
method = "GET"
target = "/conf-encryption?encryption"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[exchanges.expect.headers_present]
"content-type" = "application/xml"

[exchanges.expect.body]
golden = "goldens/c-encryption-0002.xml"
not_contains_utf8 = ["<Rules>"]
