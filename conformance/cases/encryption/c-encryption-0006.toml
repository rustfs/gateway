[case]
id = "c-encryption-0006"
schema_version = 3
title = "Configure, delete, read: the delete answers 204 and the read then answers the family's 404"
rationale = """
The teardown sequence a real operator runs, held together in one case because its meaning is in the ordering: the delete of an existing document is 204 with no body, and the very next read answers ServerSideEncryptionConfigurationNotFoundError — proof the delete actually removed the document rather than answering 204 over a configuration still in force. A delete that reports success while the KMS default quietly persists is the failure this sequence exists to catch: the operator believes encryption is off, the bucket keeps encrypting to the old key."""
polarity = "positive"
operation = "DeleteBucketEncryption"
tags = ["encryption", "error-shape"]
timeout_ms = 10000
quirks = ["q-enc-0001", "q-enc-0003"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_DeleteBucketEncryption.html"
summary = "The operation documents a 204 No Content success for removing the bucket's encryption configuration."
kind = "aws-doc"

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/ErrorResponses.html"
summary = "The error code list documents ServerSideEncryptionConfigurationNotFoundError with HTTP status 404."
kind = "aws-doc"


[[setup.buckets]]
name = "conf-encryption"

[[exchanges]]
name = "put"

[exchanges.request]
method = "PUT"
target = "/conf-encryption?encryption"
headers = { "content-type" = "application/xml" }
content_md5 = "computed"
body = { utf8 = '<ServerSideEncryptionConfiguration><Rule><ApplyServerSideEncryptionByDefault><SSEAlgorithm>AES256</SSEAlgorithm></ApplyServerSideEncryptionByDefault></Rule></ServerSideEncryptionConfiguration>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[[exchanges]]
name = "delete"

[exchanges.request]
method = "DELETE"
target = "/conf-encryption?encryption"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 204
connection_after = "open"

[[exchanges]]
name = "read-after-delete"

[exchanges.request]
method = "GET"
target = "/conf-encryption?encryption"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 404
connection_after = "open"

[exchanges.expect.error]
code = "ServerSideEncryptionConfigurationNotFoundError"
request_id_present = true
