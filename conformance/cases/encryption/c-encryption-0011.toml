[case]
id = "c-encryption-0011"
schema_version = 1
title = "A rule of only BucketKeyEnabled false and a blocked SSE-C type is legal and round-trips"
rationale = """
Three less-travelled corners in one document. The model makes ApplyServerSideEncryptionByDefault optional, so a rule that only tunes the bucket key and blocks an encryption type is legal — a validator that required the default action would be stricter than the schema. The false boolean must round-trip as written, because omitting a false is how an explicit opt-out silently becomes the default again. And BlockedEncryptionTypes carries its EncryptionType children flattened inside the wrapper — the one nested-list shape in this family, pinned byte for byte."""
polarity = "positive"
operation = "PutBucketEncryption"
tags = ["encryption", "xml", "wire-bytes"]
timeout_ms = 10000
quirks = []

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_GetBucketEncryption.html"
summary = "The response syntax shows BlockedEncryptionTypes with repeated EncryptionType children and BucketKeyEnabled as a rule-level boolean, with the default action not required."
kind = "aws-doc"


[[setup.buckets]]
name = "conf-encryption"

[[exchanges]]
name = "put-tuning-only"

[exchanges.request]
method = "PUT"
target = "/conf-encryption?encryption"
headers = { "content-type" = "application/xml", "content-md5" = "54MSJqxC+MRqBQJKdRJ5uw==" }
body = { utf8 = '<ServerSideEncryptionConfiguration><Rule><BucketKeyEnabled>false</BucketKeyEnabled><BlockedEncryptionTypes><EncryptionType>SSE-C</EncryptionType></BlockedEncryptionTypes></Rule></ServerSideEncryptionConfiguration>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[[exchanges]]
name = "read-back"

[exchanges.request]
method = "GET"
target = "/conf-encryption?encryption"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[exchanges.expect.body]
golden = "goldens/c-encryption-0011.xml"
contains_utf8 = ["<BucketKeyEnabled>false</BucketKeyEnabled>", "<BlockedEncryptionTypes><EncryptionType>SSE-C</EncryptionType></BlockedEncryptionTypes>"]
