[case]
id = "c-encryption-0001"
schema_version = 1
title = "A minimal AES256 default-encryption document with Content-MD5 is accepted with 200"
rationale = """
The family's baseline write: one Rule, one ApplyServerSideEncryptionByDefault, the SSE-S3 algorithm, and the integrity header the operation demands. Everything else in this domain is a variation on this request, so it is pinned first — a deployment that refuses the simplest legal write has no encryption configuration surface at all, and every SDK's put_bucket_encryption call fails at the first attempt."""
polarity = "positive"
operation = "PutBucketEncryption"
tags = ["encryption", "xml"]
timeout_ms = 10000
quirks = []

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutBucketEncryption.html"
summary = "The documented request syntax is a ServerSideEncryptionConfiguration root with Rule children and a required Content-MD5 header."
kind = "aws-doc"


[[setup.buckets]]
name = "conf-encryption"

[request]
method = "PUT"
target = "/conf-encryption?encryption"
headers = { "content-type" = "application/xml", "content-md5" = "6vzSAkrj6gUU1ZdQlOJRWQ==" }
body = { utf8 = '<ServerSideEncryptionConfiguration><Rule><ApplyServerSideEncryptionByDefault><SSEAlgorithm>AES256</SSEAlgorithm></ApplyServerSideEncryptionByDefault></Rule></ServerSideEncryptionConfiguration>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 200
connection_after = "open"
