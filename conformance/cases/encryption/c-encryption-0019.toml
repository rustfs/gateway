[case]
id = "c-encryption-0019"
schema_version = 1
title = "A default action missing its required SSEAlgorithm is refused, and the key id it carried is not echoed"
rationale = """
SSEAlgorithm is the action's one required member; a default action that names only a key id says which key to use and not how, and the decoder refuses it before validation sees it. The case doubles as a hygiene probe on the decoder's own error path: the refused document carried a KMS key id, and the missing-member refusal must not quote the surrounding document back — the constant-refusal rule binds every error source, not just the validator's."""
polarity = "negative"
operation = "PutBucketEncryption"
tags = ["encryption", "xml", "error-shape", "security"]
timeout_ms = 10000
quirks = []

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_ServerSideEncryptionByDefault.html"
summary = "The SSEAlgorithm member is documented as required within ApplyServerSideEncryptionByDefault."
kind = "aws-doc"


[[setup.buckets]]
name = "conf-encryption"

[request]
method = "PUT"
target = "/conf-encryption?encryption"
headers = { "content-type" = "application/xml", "content-md5" = "yOR3jw6S3zNdjLS6DziXCQ==" }
body = { utf8 = '<ServerSideEncryptionConfiguration><Rule><ApplyServerSideEncryptionByDefault><KMSMasterKeyID>arn:aws:kms:us-east-1:111122223333:key/1234abcd-12ab-34cd-56ef-1234567890ab</KMSMasterKeyID></ApplyServerSideEncryptionByDefault></Rule></ServerSideEncryptionConfiguration>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 400
connection_after = "open"

[expect.error]
code = "MalformedXML"
request_id_present = true

[expect.body]
not_contains_utf8 = ["arn:aws:kms", "1234abcd"]
