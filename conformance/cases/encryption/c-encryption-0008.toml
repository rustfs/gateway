[case]
id = "c-encryption-0008"
schema_version = 1
title = "A second write replaces the whole document; the read shows no trace of the first"
rationale = """
There is no partial update in this family: the write replaces the configuration entirely, and the observable proof is a read after two different writes that matches the second document byte for byte. A backend that merged instead of replacing would leave the first write's AES256 rule beside the new KMS rule, and a client that intended to switch algorithms would end up with a configuration nobody wrote — for a security document, a merged state is a state no one audited."""
polarity = "positive"
operation = "PutBucketEncryption"
tags = ["encryption", "xml", "wire-bytes"]
timeout_ms = 10000
quirks = []

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutBucketEncryption.html"
summary = "The operation is documented as setting the bucket's default encryption configuration, a whole-document write with no partial form."
kind = "aws-doc"


[[setup.buckets]]
name = "conf-encryption"

[[exchanges]]
name = "put-first"

[exchanges.request]
method = "PUT"
target = "/conf-encryption?encryption"
headers = { "content-type" = "application/xml", "content-md5" = "6vzSAkrj6gUU1ZdQlOJRWQ==" }
body = { utf8 = '<ServerSideEncryptionConfiguration><Rule><ApplyServerSideEncryptionByDefault><SSEAlgorithm>AES256</SSEAlgorithm></ApplyServerSideEncryptionByDefault></Rule></ServerSideEncryptionConfiguration>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[[exchanges]]
name = "put-replacement"

[exchanges.request]
method = "PUT"
target = "/conf-encryption?encryption"
headers = { "content-type" = "application/xml", "content-md5" = "DAapRbQkt/2Lo2IZ2zGiKA==" }
body = { utf8 = '<ServerSideEncryptionConfiguration><Rule><ApplyServerSideEncryptionByDefault><SSEAlgorithm>aws:kms</SSEAlgorithm><KMSMasterKeyID>arn:aws:kms:us-east-1:111122223333:key/1234abcd-12ab-34cd-56ef-1234567890ab</KMSMasterKeyID></ApplyServerSideEncryptionByDefault><BucketKeyEnabled>true</BucketKeyEnabled></Rule></ServerSideEncryptionConfiguration>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[[exchanges]]
name = "read-back"

[exchanges.request]
method = "GET"
target = "/conf-encryption?encryption"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[exchanges.expect.body]
golden = "goldens/c-encryption-0008.xml"
not_contains_utf8 = ["AES256"]
