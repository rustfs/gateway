[case]
id = "c-encryption-0028"
schema_version = 3
title = "A BlockedEncryptionTypes entry outside every EncryptionType spelling is refused as MalformedXML"
rationale = """
SSE-KMS looks like a plausible encryption type but is not an EncryptionType value at all. The wrapper is a registered element, so it is decoded rather than refused as unknown, and the value inside it still has to come from the closed set. This pairs with c-encryption-0027, which covers a value the enumeration accepts but this wrapper does not. Together they show that the refusal comes from the value and not from the wrapper's presence: c-encryption-0011 and c-encryption-0025 store the same wrapper with documented values."""
polarity = "negative"
operation = "PutBucketEncryption"
tags = ["encryption", "xml", "sse"]
timeout_ms = 10000
quirks = []

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_BlockedEncryptionTypes.html"
summary = "The EncryptionType member of BlockedEncryptionTypes lists NONE and SSE-C as its only valid values."
kind = "aws-doc"

[[setup.buckets]]
name = "conf-encryption"

[request]
method = "PUT"
target = "/conf-encryption?encryption"
headers = { "content-type" = "application/xml" }
content_md5 = "computed"
body = { utf8 = '<ServerSideEncryptionConfiguration><Rule><BlockedEncryptionTypes><EncryptionType>SSE-KMS</EncryptionType></BlockedEncryptionTypes></Rule></ServerSideEncryptionConfiguration>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 400
connection_after = "open"

[expect.error]
code = "MalformedXML"
request_id_present = true
