# c-cond-0020 — an unparseable date is ignored, not rejected.
#
# Schema dimensions exercised: byte-exact body proving the request was served rather than refused.

[case]
id = "c-cond-0020"
schema_version = 1
title = "A date condition that is not an HTTP-date is ignored and the object is served"
rationale = """
This is the one place in the family where refusing the request is the wrong answer. Date headers \
are rewritten by proxies, generated by clients with their own idea of the format, and copied out \
of logs; a server that answers 400 breaks a request that would otherwise have worked, for a header \
that carries no requirement at all once it cannot be read. Ignoring it is what the specification \
asks for, and it is also the only behaviour that keeps a malformed value from becoming a denial of \
service against the client that sent it."""
polarity = "negative"
operation = "GetObject"
tags = ["conditional", "preconditions", "timing"]
timeout_ms = 10000
quirks = ["q-cond-0050"]

[[case.evidence]]
url = "https://www.rfc-editor.org/rfc/rfc9110#section-13.1.3"
summary = "A recipient ignores a modification-date condition whose value is not a valid HTTP-date."

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_GetObject.html"
summary = "Documents the modification-date condition as an HTTP-date, with no error defined for an unreadable value."

[clock]
fixed = "2026-01-02T03:04:05Z"

[[setup.buckets]]
name = "conf-cond"

[[setup.objects]]
bucket = "conf-cond"
key = "dates/garbage"
body = { utf8 = "hello" }

[request]
method = "GET"
target = "/conf-cond/dates/garbage"
headers = { "if-modified-since" = "not-a-date" }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 200
connection_after = "open"

[expect.headers_present]
"content-length" = "5"

[expect.timing]
terminate_within_ms = 5000

[expect.body]
exact_utf8 = "hello"
