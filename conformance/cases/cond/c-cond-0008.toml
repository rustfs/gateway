# c-cond-0008 — the date condition that serves the object.
#
# Schema dimensions exercised: clock injection so the fixture's modification date is a known
# value, byte-exact body.

[case]
id = "c-cond-0008"
schema_version = 1
title = "A read whose If-Modified-Since predates the object returns it with 200"
rationale = """
The date conditions are evaluated with an inequality, and an inequality has two ways to be wrong \
that produce opposite failures: always serving, which makes revalidation useless, and never \
serving, which makes a client believe a changed object is unchanged. This case pins the direction \
that must serve, and c-cond-0010 pins the boundary between the two. Without the injected clock \
neither assertion is reproducible, because the fixture's modification date would be whenever the \
suite happened to run."""
polarity = "positive"
operation = "GetObject"
tags = ["conditional", "preconditions", "timing"]
timeout_ms = 10000
quirks = ["q-cond-0050"]

[[case.evidence]]
url = "https://www.rfc-editor.org/rfc/rfc9110#section-13.1.3"
summary = "The condition holds, and the representation is served, when the last modification is later than the supplied date."

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_GetObject.html"
summary = "Documents the modification-date condition alongside the entity-tag conditions for a read."

[clock]
fixed = "2026-01-02T03:04:05Z"

[[setup.buckets]]
name = "conf-cond"

[[setup.objects]]
bucket = "conf-cond"
key = "dates/modified"
body = { utf8 = "hello" }

[request]
method = "GET"
target = "/conf-cond/dates/modified"
headers = { "if-modified-since" = "Thu, 01 Jan 2026 00:00:00 GMT" }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 200
connection_after = "open"

[expect.headers_present]
"last-modified" = "Fri, 02 Jan 2026 03:04:05 GMT"
"content-length" = "5"

[expect.timing]
terminate_within_ms = 5000

[expect.body]
exact_utf8 = "hello"
