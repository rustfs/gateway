[case]
id = "c-authz-0003"
schema_version = 1
title = "An operation with NoDerived still completes authorization"
rationale = "GetObject has no second resource set, but it must still cross the same consuming authorization boundary."
polarity = "positive"
operation = "GetObject"
tags = ["security"]
timeout_ms = 10000
quirks = []
[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_GetObject.html"
summary = "GetObject authorizes the object named by the routed request and has no body-derived resource."
kind = "aws-doc"

[[setup.buckets]]
name = "authz-read"
[[setup.objects]]
bucket = "authz-read"
key = "plain.txt"
body = { utf8 = "hello" }

[request]
method = "GET"
target = "/authz-read/plain.txt"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 200
[expect.body]
exact_utf8 = "hello"
