[case]
id = "c-authz-1015"
schema_version = 1
title = "The assembled registry exposes only action-bearing handlers"
rationale = "A signed request reaches the registered ListBuckets handler; compile and registry tests separately mutate its action mapping to prove assembly refusal."
polarity = "negative"
operation = "ListBuckets"
tags = ["security", "routing"]
timeout_ms = 10000
quirks = []
[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/userguide/list_amazons3.html"
summary = "S3 operations have explicit policy actions and supported resource shapes."
kind = "aws-doc"
[request]
method = "GET"
target = "/"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }
[expect]
kind = "response"
status = 200
