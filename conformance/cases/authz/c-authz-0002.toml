[case]
id = "c-authz-0002"
schema_version = 1
title = "DeleteObjects authorizes every key in its body"
rationale = "Three independently named keys must all survive resource derivation before the batch handler runs."
polarity = "positive"
operation = "DeleteObjects"
tags = ["security", "xml"]
timeout_ms = 10000
quirks = ["q-deletes-0027"]
[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_DeleteObjects.html"
summary = "A multi-object delete names each object independently in its request body."
kind = "aws-doc"

[[setup.buckets]]
name = "authz-delete"
[[setup.objects]]
bucket = "authz-delete"
key = "one"
body = { utf8 = "1" }
[[setup.objects]]
bucket = "authz-delete"
key = "two"
body = { utf8 = "2" }

[request]
method = "POST"
target = "/authz-delete?delete"
headers = { "content-type" = "application/xml", "content-md5" = "VK4ubZ8WQf0Vu81FdbnLGw==" }
body = { utf8 = "<Delete><Object><Key>one</Key></Object><Object><Key>two</Key></Object><Object><Key>absent</Key></Object></Delete>" }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 200
