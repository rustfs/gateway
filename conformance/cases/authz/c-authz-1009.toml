[case]
id = "c-authz-1009"
schema_version = 1
title = "An unreadable policy fails closed as AccessDenied"
rationale = "The case-specific policy source fails; the framework must answer 403 without consulting the backend."
polarity = "negative"
operation = "ListBuckets"
tags = ["security"]
timeout_ms = 10000
quirks = []
[[case.evidence]]
url = "https://github.com/rustfs/rustfs/security/advisories/GHSA-j548-9grx-fh4f"
summary = "An unreadable protection record must not be interpreted as the absence of protection."
kind = "other"
[request]
method = "GET"
target = "/"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }
[expect]
kind = "response"
status = 403
[expect.error]
code = "AccessDenied"
