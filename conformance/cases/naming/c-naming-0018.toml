# c-naming-0018 — the 1024-byte boundary is measured after UTF-8 encoding
#
[case]
id = "c-naming-0018"
schema_version = 1
title = "A 1024-byte multibyte key is accepted at the byte boundary"
rationale = """
The key contains 512 two-byte characters: 512 characters but exactly 1024 UTF-8 bytes. It must be accepted at the same boundary as the ASCII control, while an implementation counting characters or moving the byte limit to 1023 refuses or misclassifies it."""
polarity = "positive"
operation = "GetObject"
tags = ["naming", "routing", "encoding", "dos"]
timeout_ms = 10000
quirks = ["q-naming-0004"]

