# c-naming-0002 — the length limit is inclusive at 1024 bytes
#
[case]
id = "c-naming-0002"
schema_version = 1
title = "A key of exactly 1024 bytes is at the limit and is accepted"
rationale = """
A limit is only pinned by the value on each side of it. An off-by-one here refuses a key AWS accepts, and the client sees an unexplainable 400 on one object out of a bucket that otherwise works. Its partner case sends 1025 bytes and requires the refusal."""
polarity = "positive"
operation = "GetObject"
tags = ["naming", "routing", "dos"]
timeout_ms = 10000
quirks = ["q-naming-0004"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-keys.html"
summary = "A key is an opaque sequence of Unicode characters up to 1024 UTF-8 bytes long, with no path structure of its own."
kind = "aws-doc"

[clock]
fixed = "2026-01-02T03:04:05Z"

[[setup.buckets]]
name = "conf-naming"

[[setup.objects]]
bucket = "conf-naming"
key = ""
body = { utf8 = "at the limit" }

[request]
method = "GET"
target = "/conf-"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 200
connection_after = "open"

[expect.body]
exact_utf8 = "at the limit"
