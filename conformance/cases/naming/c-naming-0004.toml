# c-naming-0004 — no Unicode normalisation
#
[case]
id = "c-naming-0004"
schema_version = 1
title = "A decomposed key stays distinct from its composed spelling"
rationale = """
The request selects the decomposed U+0065 U+0301 spelling while the bucket also contains the composed U+00E9 spelling with a different body. NFC-normalising ingress would silently select the composed object, so the exact body distinguishes preservation from normalisation."""
polarity = "positive"
operation = "GetObject"
tags = ["naming", "routing", "encoding"]
timeout_ms = 10000
quirks = ["q-naming-0007"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-keys.html"
summary = "A key is an opaque sequence of Unicode characters up to 1024 UTF-8 bytes long, with no path structure of its own."
kind = "aws-doc"

[clock]
fixed = "2026-01-02T03:04:05Z"

[[setup.buckets]]
name = "conf-naming"

[[setup.objects]]
bucket = "conf-naming"
key = "caf\u00E9.txt"
body = { utf8 = "composed" }

[[setup.objects]]
bucket = "conf-naming"
key = "cafe\u0301.txt"
body = { utf8 = "decomposed" }

[request]
method = "GET"
target = "/conf-naming/cafe%CC%81.txt"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 200
connection_after = "open"

[expect.body]
exact_utf8 = "decomposed"
