# c-naming-0028 — a metadata read is refused like a body read
#
[case]
id = "c-naming-0028"
schema_version = 1
title = "A HeadObject whose key holds a backslash-delimited dot-dot segment is refused"
rationale = """
HEAD answers whether an object exists and what it is. Answering that for a traversal would turn the \
floor into an existence oracle for whatever the resolved path names outside the bucket, even though \
GET of the same key is refused. The floor runs before the operation is dispatched, so HEAD gets the \
same 400 as GET, and without a body, as a HEAD response must be."""
polarity = "negative"
operation = "HeadObject"
tags = ["naming", "routing", "security"]
timeout_ms = 10000
quirks = ["q-naming-0003"]

[[case.evidence]]
url = "https://github.com/rustfs/rustfs/security/advisories/GHSA-8r6f-hmq2-28rg"
summary = "An object key carrying a traversal sequence reached the filesystem mapping and escaped the bucket."
kind = "other"

[[case.evidence]]
url = "https://github.com/rustfs/gateway/issues/754"
summary = "The migration ruling keeps reads of a dot-dot key refused on every assembly."
kind = "other"

[clock]
fixed = "2026-01-02T03:04:05Z"

[[setup.buckets]]
name = "conf-naming"

[[setup.objects]]
bucket = "conf-naming"
key = "real.txt"
body = { utf8 = "in the bucket" }

[request]
method = "HEAD"
target = "/conf-naming/..%5Creal.txt"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 400
headers_absent = ["etag", "last-modified", "x-amz-version-id"]
connection_after = "open"

[expect.body]
size = 0
exact_utf8 = ""
