# c-naming-0031 — a multipart upload cannot be opened under a key the floor refuses
#
[case]
id = "c-naming-0031"
schema_version = 1
title = "A CreateMultipartUpload whose key holds a backslash-delimited dot-dot segment is refused"
rationale = """
Multipart is the second way to write an object, and the key is named when the upload is opened. An \
upload opened under a traversal would pass every later part and completion request through the same \
key, so the refusal belongs at the first request, before an upload id exists for a client to reuse."""
polarity = "negative"
operation = "CreateMultipartUpload"
tags = ["naming", "routing", "security", "multipart"]
timeout_ms = 10000
quirks = ["q-naming-0003"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_CreateMultipartUpload.html"
summary = "The request path names the key of the object the upload will assemble."
kind = "aws-doc"

[[case.evidence]]
url = "https://github.com/rustfs/gateway/issues/754"
summary = "The migration ruling keeps every key-bearing operation refused, multipart included."
kind = "other"

[clock]
fixed = "2026-01-02T03:04:05Z"

[[setup.buckets]]
name = "conf-naming"

[request]
method = "POST"
target = "/conf-naming/a/..%5Cb.bin?uploads"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 400
connection_after = "open"

[expect.error]
code = "InvalidArgument"
message_present = true
request_id_present = true

[expect.body]
redact = ["RequestId", "HostId"]
contains_utf8 = ["<Code>InvalidArgument</Code>"]
not_contains_utf8 = ["<UploadId>"]
