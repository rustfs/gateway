# c-list-0045 — a version cursor is a position, not a reference that must still exist.
#
# Schema dimensions exercised: multi-exchange pagination with two captured cursors, and a deletion
# of the very key the cursor names between the two pages.

[case]
id = "c-list-0045"
schema_version = 1
title = "A version marker whose version was deleted resumes the listing at that position"
rationale = """
Every walker that empties or migrates a bucket pages the version listing and deletes each page \
before it asks for the next, so the version its cursor names is gone by the time it is sent back. \
The cursor is a position in the key-then-version order, and the listing resumes after it whether \
or not a version still stands there. Two wrong answers were seen: refusing the cursor, which leaves \
the bucket impossible to empty, and returning an empty page, which reports the bucket empty while \
keys remain. Both happen on the first continuation of the Ceph s3-tests cleanup, which is the \
shape this case replays: a bucket that never had versioning, a null version cursor, and the key it \
names deleted before the second page."""
polarity = "positive"
operation = "ListObjectVersions"
tags = ["list", "versions", "pagination"]
timeout_ms = 15000
quirks = ["q-marker-0070"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_ListObjectVersions.html"
summary = "Describes the key and version markers as the place in the ordered listing to start from."
kind = "aws-doc"

[[case.evidence]]
url = "https://github.com/rustfs/gateway/issues/807"
summary = "The s3-tests cleanup lists a page, deletes it, and resumes from the deleted marker; a refusal left the bucket impossible to empty."
kind = "observed"

[clock]
fixed = "2026-01-02T03:04:05Z"

[[setup.buckets]]
name = "conf-list-vanished"

[[setup.objects]]
bucket = "conf-list-vanished"
key = "a"
body = { utf8 = "first key" }

[[setup.objects]]
bucket = "conf-list-vanished"
key = "b"
body = { utf8 = "second key" }

[[setup.objects]]
bucket = "conf-list-vanished"
key = "c"
body = { utf8 = "third key" }

[connection]
reuse = true

[[exchanges]]
name = "page-1"

[exchanges.request]
method = "GET"
target = "/conf-list-vanished?versions&max-keys=1"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[exchanges.expect.capture]
key_marker = { xml_text = "NextKeyMarker" }
version_marker = { xml_text = "NextVersionIdMarker" }

[exchanges.expect.body]
contains_utf8 = [
  "<IsTruncated>true</IsTruncated>",
  "<NextKeyMarker>a</NextKeyMarker>",
  "<NextVersionIdMarker>null</NextVersionIdMarker>",
]

[[exchanges]]
name = "delete-the-marker-key"

[exchanges.request]
method = "DELETE"
target = "/conf-list-vanished/a"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 204
connection_after = "open"

[exchanges.expect.body]
size = 0

[[exchanges]]
name = "page-2-from-the-vanished-marker"

[exchanges.request]
method = "GET"
target = "/conf-list-vanished?versions&max-keys=1&key-marker=${capture.key_marker}&version-id-marker=${capture.version_marker}"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200

[exchanges.expect.body]
contains_utf8 = ["<Key>b</Key>", "<IsTruncated>true</IsTruncated>", "<NextKeyMarker>b</NextKeyMarker>"]
not_contains_utf8 = ["<Key>a</Key>", "<Key>c</Key>", "<Code>"]
