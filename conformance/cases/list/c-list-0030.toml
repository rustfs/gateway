# c-list-0030 — a cursor has a ceiling.
#
# Schema dimensions exercised: an oversized parameter and a bounded response time.

[case]
id = "c-list-0030"
schema_version = 1
title = "A continuation token larger than any this service mints is refused at the limit"
rationale = """
Without a ceiling the cursor is an unbounded allocation an unauthenticated client controls, once per request and as often as it likes. The refusal must happen at the limit rather than after parsing: a server that decodes the token first has already done the work the ceiling exists to prevent. The bounded response time is what distinguishes the two."""
polarity = "negative"
operation = "ListObjectsV2"
tags = ["list", "security", "limits"]
timeout_ms = 15000
quirks = ["q-token-0021", "q-token-form-0075"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_ListObjectsV2.html"
summary = "Describes the token as a value the service itself produced, which bounds any legitimate size."
kind = "aws-doc"

[clock]
fixed = "2026-01-02T03:04:05Z"

[[setup.buckets]]
name = "conf-list"

[[setup.objects]]
bucket = "conf-list"
key = "a/1.txt"
body = { utf8 = "a1" }

[[setup.objects]]
bucket = "conf-list"
key = "a/2.txt"
body = { utf8 = "a2" }

[[setup.objects]]
bucket = "conf-list"
key = "b/1.txt"
body = { utf8 = "b1" }

[[setup.objects]]
bucket = "conf-list"
key = "top.txt"
body = { utf8 = "top" }

[request]
# The token is written out at its full length rather than described, because the schema is frozen
# and its length is the value under test. Four kibibytes is comfortably past any ceiling a service
# in this family can justify and small enough to keep the case readable.
method = "GET"
target = "/conf-list?list-type=2&continuation-"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 400

[expect.error]
code = "InvalidArgument"

[expect.timing]
terminate_within_ms = 5000
