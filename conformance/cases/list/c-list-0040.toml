# c-list-0040 — one page costs one page, whatever the bucket costs.
#
# Schema dimensions exercised: a bucket much larger than the page, a bounded response time and a bounded body.

[case]
id = "c-list-0040"
schema_version = 1
title = "A page of a thousand keys out of a bucket of thousands returns a thousand and returns promptly"
rationale = """
The natural implementation enumerates the bucket, sorts it and slices the page, which is correct and turns every listing into a cost proportional to the bucket rather than to the page. It passes every functional test in this directory; what it does in production is make the first request against a large bucket time out, and the retry do the same work again. The bound on the body size is the observable half of the property, and the time bound is the half that fails first."""
polarity = "negative"
operation = "ListObjectsV2"
tags = ["list", "limits", "slow"]
timeout_ms = 15000
quirks = ["q-keycount-0018", "q-maxkeys-0068"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_ListObjectsV2.html"
summary = "Documents a page ceiling for the operation, which is what makes a per-page cost the intended behaviour."
kind = "aws-doc"

[clock]
fixed = "2026-01-02T03:04:05Z"

