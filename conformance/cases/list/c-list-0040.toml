contains_utf8 = ["<KeyCount>1000</KeyCount>", "<MaxKeys>1000</MaxKeys>", "<IsTruncated>true</IsTruncated>"]

[expect.body.xml]
root = "ListBucketResult"
xmlns = "http://s3.amazonaws.com/doc/2006-03-01/"
empty_elements = "paired"

[expect.timing]
terminate_within_ms = 10000
