# c-list-0023 — a member the request did not ask for is not written at all.
#
# Schema dimensions exercised: absence of elements as the assertion.

[case]
id = "c-list-0023"
schema_version = 1
title = "No Delimiter element without a delimiter, and no EncodingType element without an encoding type"
rationale = """
The rule for these two is the opposite of the rule for the prefix and the marker in the same document, so an implementation that picks one policy for the whole body is wrong about half of it. Writing an empty Delimiter is not harmless: a client that reads it as a configured delimiter renders a flat bucket as a folder tree with one empty folder."""
polarity = "negative"
operation = "ListObjectsV2"
tags = ["list", "empty-elements", "xml"]
timeout_ms = 15000
quirks = ["q-empty-0016", "q-encoding-0015"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_ListObjectsV2.html"
summary = "The documented response carries the delimiter and encoding type only when the request supplied them."
kind = "aws-doc"

[clock]
fixed = "2026-01-02T03:04:05Z"

[[setup.buckets]]
name = "conf-list"

[[setup.objects]]
bucket = "conf-list"
key = "a/1.txt"
body = { utf8 = "a1" }

[[setup.objects]]
bucket = "conf-list"
key = "a/2.txt"
body = { utf8 = "a2" }

[[setup.objects]]
bucket = "conf-list"
key = "b/1.txt"
body = { utf8 = "b1" }

[[setup.objects]]
bucket = "conf-list"
key = "top.txt"
body = { utf8 = "top" }

[request]
method = "GET"
target = "/conf-list?list-type=2"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 200

[expect.body]
not_contains_utf8 = ["<Delimiter>", "<EncodingType>"]

[expect.body.xml]
root = "ListBucketResult"
xmlns = "http://s3.amazonaws.com/doc/2006-03-01/"
empty_elements = "paired"
