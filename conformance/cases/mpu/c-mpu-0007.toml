# c-mpu-0007 — the storage class stated at initiation survives completion.
#
# Schema dimensions exercised: the same deferred-metadata round trip as c-mpu-0006, on a header
# whose absence is itself a meaningful answer.

[case]
id = "c-mpu-0007"
schema_version = 1
title = "A non-default storage class given at initiation is on the assembled object"
rationale = """
The storage class decides where the object lives and what it costs to read, and like the rest of \
the object's metadata it can only be stated on the initiating request. Losing it fails nothing \
visibly: the object appears, in the default class, and the divergence between what the caller asked \
for and what the bill says is found months later. A default-class upload would not do here, because \
the header is suppressed for the default class and the case would pass against an implementation \
that ignores the member entirely."""
polarity = "positive"
operation = "CreateMultipartUpload"
tags = ["multipart", "metadata", "storage-class"]
quirks = ["q-mpu-metadata-0039"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_CreateMultipartUpload.html"
summary = "The storage class is documented as a header of the initiating request, not of the part or the completion."
kind = "aws-doc"

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_HeadObject.html"
summary = "The storage class response header is returned for every object except one in the default class."
kind = "aws-doc"

[clock]
fixed = "2026-01-02T03:04:05Z"

[connection]
reuse = true

[[setup.buckets]]
name = "conf-mpu"

[[exchanges]]
name = "initiate"

[exchanges.request]
method = "POST"
target = "/conf-mpu/cold-object?uploads"
headers = { "x-amz-storage-class" = "GLACIER" }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[exchanges.expect.capture]
upload_id = { xml_text = "UploadId" }

[[exchanges]]
name = "upload-part"

[exchanges.request]
method = "PUT"
target = "/conf-mpu/cold-object?partNumber=1&uploadId=${capture.upload_id}"
body = { size = 64 }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[exchanges.expect.capture]
part1_etag = { header = "etag" }

[[exchanges]]
name = "complete"

[exchanges.request]
method = "POST"
target = "/conf-mpu/cold-object?uploadId=${capture.upload_id}"
headers = { "content-type" = "application/xml" }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.request.body]
utf8 = '''
<CompleteMultipartUpload xmlns="http://s3.amazonaws.com/doc/2006-03-01/"><Part><PartNumber>1</PartNumber><ETag>${capture.part1_etag}</ETag></Part></CompleteMultipartUpload>'''

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[[exchanges]]
name = "head"

[exchanges.request]
method = "HEAD"
target = "/conf-mpu/cold-object"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[exchanges.expect.headers_present]
"x-amz-storage-class" = "GLACIER"
