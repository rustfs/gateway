# c-mpu-0050 — a part listing under a real upload id for another key in the same bucket.

[case]
id = "c-mpu-0050"
schema_version = 1
title = "A part listing under a valid upload id for a different key in the same bucket is refused"
rationale = """
This is the disclosure half of the same defect, and it is the shape a bucket-scoped check waves \
through: same bucket, same credentials, wrong object. A listing answered here hands a stranger the \
part numbers, the byte sizes and the entity tags of an upload in progress — which is both a picture \
of somebody else's data and the exact material a forged completion needs, since a completion must \
name each part's digest. The answer is pinned to bytes rather than to a status because the document \
is the disclosure: it must be the same document an id that names nothing gets, down to the message, \
or the error itself tells the caller its guess was a real id."""
polarity = "negative"
operation = "ListParts"
tags = ["multipart", "security", "upload-id", "error-shape"]
quirks = ["q-mpu-upload-id-0037"]

[[case.evidence]]
url = "https://github.com/s3s-project/s3s/issues/51"
summary = "Upstream acted on any upload id it was handed without checking which resource it belonged to."
kind = "s3s-issue"

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_ListParts.html"
summary = "The listing is documented as naming a bucket, a key and an upload id together, and it reports the number, size and entity tag of every part uploaded so far."
kind = "aws-doc"

[clock]
fixed = "2026-01-02T03:04:05Z"

[[setup.buckets]]
name = "conf-mpu"

[[setup.multipart_uploads]]
bucket = "conf-mpu"
key = "the-right-key"
capture_upload_id_as = "upload_id"

[[setup.multipart_uploads.parts]]
part_number = 1
body = { size = 4242 }

[request]
method = "GET"
target = "/conf-mpu/the-wrong-key?uploadId=${capture.upload_id}"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 404
connection_after = "open"

[expect.error]
code = "NoSuchUpload"
request_id_present = true

[expect.body]
redact = ["RequestId", "HostId"]
exact_utf8 = '''
<?xml version="1.0" encoding="UTF-8"?>
<Error><Code>NoSuchUpload</Code><Message>The specified upload does not exist. The upload ID may be invalid, or the upload may have been aborted or completed.</Message><RequestId>__REDACTED__</RequestId><HostId>__REDACTED__</HostId></Error>'''
