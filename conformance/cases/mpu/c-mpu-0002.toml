# c-mpu-0002 — the entity tag of a three-part upload.
#
# Schema dimensions exercised: multipart fixtures with captured part digests, multi-exchange form
# with connection reuse, a capture read back as a conditional header, and a refusal pair that
# separates the composite from the digest of the assembled bytes.

[case]
id = "c-mpu-0002"
schema_version = 1
title = "A completed three-part upload answers an entity tag carrying the part count"
rationale = """
The entity tag of a multipart object is a digest over the concatenated raw part digests followed by \
a hyphen and the number of parts. An implementation that digests the assembled object instead \
produces a value of the right shape and the wrong content, and every client that verifies integrity \
against it concludes the object is corrupt and re-uploads. Asserting the suffix alone cannot see \
that failure at all, so the whole composite is asserted, the digest of the assembled bytes is \
refused as a precondition beside it, and the tag the completion published is read back on the head \
— which is where a client actually reads it — so the value is pinned to the object rather than to a \
shape."""
polarity = "positive"
operation = "CompleteMultipartUpload"
tags = ["multipart", "etag", "integrity"]
quirks = ["q-mpu-etag-0028", "q-mpu-attributes-etag-0036"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/userguide/checking-object-integrity.html"
summary = "Describes the multipart entity tag as a digest of the part digests carrying a part-count suffix."
kind = "aws-doc"

[[case.evidence]]
url = "https://github.com/s3s-project/s3s/issues/550"
summary = "Upstream digested the assembled object, so integrity-checking clients read every multipart object as corrupt."
kind = "s3s-issue"

[clock]
fixed = "2026-01-02T03:04:05Z"

[connection]
reuse = true

[[setup.buckets]]
name = "conf-mpu"

[[setup.multipart_uploads]]
bucket = "conf-mpu"
key = "three-parts"
capture_upload_id_as = "upload_id"

[[setup.multipart_uploads.parts]]
part_number = 1
body = { size = 5242880 }
capture_etag_as = "part1_etag"

[[setup.multipart_uploads.parts]]
part_number = 2
body = { size = 5242880 }
capture_etag_as = "part2_etag"

[[setup.multipart_uploads.parts]]
part_number = 3
body = { size = 17 }
capture_etag_as = "part3_etag"

# 1 — the completion, asserted against the whole composite. The three parts are the fixture's
# default fill, so the digests are 4c28640dc8df1933aaea192100d50ae0 twice and
# 1bdd36b0a024c90db383512607293692; the composite is the digest of those forty-eight raw bytes with
# the count after a hyphen.
[[exchanges]]
name = "complete"

[exchanges.request]
method = "POST"
target = "/conf-mpu/three-parts?uploadId=${capture.upload_id}"
headers = { "content-type" = "application/xml" }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.request.body]
utf8 = '''
<CompleteMultipartUpload xmlns="http://s3.amazonaws.com/doc/2006-03-01/"><Part><PartNumber>1</PartNumber><ETag>${capture.part1_etag}</ETag></Part><Part><PartNumber>2</PartNumber><ETag>${capture.part2_etag}</ETag></Part><Part><PartNumber>3</PartNumber><ETag>${capture.part3_etag}</ETag></Part></CompleteMultipartUpload>'''

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[exchanges.expect.body]
redact = ["Location", "UploadId"]
contains_utf8 = ["<CompleteMultipartUploadResult", "ceb79c6e3e838cdabb8fa04e30b4082f-3&quot;</ETag>"]
# The first is the digest of the ten and a half megabytes the three parts assemble into — the value
# the upstream defect published, and one that carries no suffix to warn a client. The second is the
# unescaped spelling of the same element: the quotes belong to the value and the writer escapes
# them, so a case asserting only the escaped form cannot tell the two apart.
not_contains_utf8 = ["4aaeac05ec090730e66f8d66ec75763b", "-3\"</ETag>", "<Error>"]

[exchanges.expect.body.xml]
root = "CompleteMultipartUploadResult"
element_order = ["Location", "Bucket", "Key", "ETag"]

# 2 — the object publishes the same value the result document did, in the header form a client
# reads it in: bare of the XML escaping, byte for byte the tag asserted above. The length is the
# concatenation of all three parts rather than of the first.
[[exchanges]]
name = "head"

[exchanges.request]
method = "HEAD"
target = "/conf-mpu/three-parts"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[exchanges.expect.capture]
head_etag = { header = "etag" }

[exchanges.expect.headers_present]
etag = "\"ceb79c6e3e838cdabb8fa04e30b4082f-3\""
content-length = "10485777"

# 3 — the tag the header published is the object's own rather than a value minted per response:
# read back as a precondition it matches.
[[exchanges]]
name = "the published tag matches as a precondition"

[exchanges.request]
method = "HEAD"
target = "/conf-mpu/three-parts"
headers = { "if-match" = "${capture.head_etag}" }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[exchanges.expect.headers_present]
etag = "\"ceb79c6e3e838cdabb8fa04e30b4082f-3\""
content-length = "10485777"

# 4 — the control this case exists for. An implementation that digested the assembled object and
# then appended the count would answer 200 here: the shape is right and every suffix assertion in
# the family would still be green.
#
# A GET rather than a HEAD, because a HEAD is answered with no body whatever the server writes and
# an assertion about that body would be true by construction.
[[exchanges]]
name = "the assembled digest wearing the suffix is refused"

[exchanges.request]
method = "GET"
target = "/conf-mpu/three-parts"
headers = { "if-match" = "\"4aaeac05ec090730e66f8d66ec75763b-3\"" }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 412
connection_after = "open"

[exchanges.expect.error]
code = "PreconditionFailed"
request_id_present = true

# 5 — the multipart value reaches the one XML response that omits entity-tag quotes. This is the
# operation-level exception; the completion and HEAD exchanges above are its quoted controls.
[[exchanges]]
name = "object attributes renders the composite tag bare"

[exchanges.request]
method = "GET"
target = "/conf-mpu/three-parts?attributes"
headers = { "x-amz-object-attributes" = "ETag" }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"
headers_present = { "content-type" = "application/xml" }
headers_absent = ["etag"]

[exchanges.expect.body]
exact_utf8 = '''
<?xml version="1.0" encoding="UTF-8"?>
<GetObjectAttributesOutput xmlns="http://s3.amazonaws.com/doc/2006-03-01/"><ETag>ceb79c6e3e838cdabb8fa04e30b4082f-3</ETag></GetObjectAttributesOutput>'''
not_contains_utf8 = ["&quot;", "-3\"</ETag>"]

# 6 — the same digest without the suffix, which is what an implementation that treated a multipart
# object like any other write would store.
[[exchanges]]
name = "the assembled digest is refused"

[exchanges.request]
method = "GET"
target = "/conf-mpu/three-parts"
headers = { "if-match" = "\"4aaeac05ec090730e66f8d66ec75763b\"" }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 412
connection_after = "open"

[exchanges.expect.error]
code = "PreconditionFailed"
request_id_present = true
