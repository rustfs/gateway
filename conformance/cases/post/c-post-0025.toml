# c-post-0025 — A malformed KMS form context is refused without storing an object.

[case]
id = "c-post-0025"
schema_version = 1
title = "A malformed KMS form context is refused without storing an object"
rationale = "Managed form fields are subject to the same SSE gate as request headers. The form is signed and authorized; the refusal must identify the invalid managed declaration, and a subsequent read must observe that no object was stored."
polarity = "negative"
operation = "PostObject"
tags = ["security", "validation"]
timeout_ms = 10000
quirks = []

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/developerguide/RESTObjectPOST.html"
summary = "POST Object carries managed encryption settings in form fields, including the algorithm and KMS qualifiers."
kind = "aws-doc"

[[case.evidence]]
url = "https://github.com/rustfs/gateway/issues/1399"
summary = "Managed encryption requested by a form must reach enforcement and storage rather than be dropped by its grammar."
kind = "other"

[clock]
fixed = "2026-01-02T03:04:05Z"
request_time = "2026-01-02T03:04:05Z"

[[setup.buckets]]
name = "conf-post"

[[setup.objects]]
bucket = "conf-post"
key = "c-post-0025.txt"
absent = true

[[exchanges]]
name = "upload"

[exchanges.request]
method = "POST"
target = "/conf-post"
sign = { mode = "anonymous" }
body = { utf8 = "--confpost\r\nContent-Disposition: form-data; name=\"bucket\"\r\n\r\nconf-post\r\n--confpost\r\nContent-Disposition: form-data; name=\"key\"\r\n\r\nc-post-0025.txt\r\n--confpost\r\nContent-Disposition: form-data; name=\"x-amz-algorithm\"\r\n\r\nAWS4-HMAC-SHA256\r\n--confpost\r\nContent-Disposition: form-data; name=\"x-amz-credential\"\r\n\r\nAKIAIOSFODNN7EXAMPLE/20260102/us-east-1/s3/aws4_request\r\n--confpost\r\nContent-Disposition: form-data; name=\"x-amz-date\"\r\n\r\n20260102T030405Z\r\n--confpost\r\nContent-Disposition: form-data; name=\"x-amz-server-side-encryption\"\r\n\r\naws:kms\r\n--confpost\r\nContent-Disposition: form-data; name=\"x-amz-server-side-encryption-context\"\r\n\r\nnot-base64\r\n--confpost\r\nContent-Disposition: form-data; name=\"policy\"\r\n\r\\r\n--confpost\r\nContent-Disposition: form-data; name=\"x-amz-signature\"\r\n\r\n958774b489572424ae4124cc279c8db148ef801551ed88a41a9983a54e9769e1\r\n--confpost\r\nContent-Disposition: form-data; name=\"file\"; filename=\"upload\"\r\n\r\nmanaged-sse-payload\r\n--confpost--\r\n" }

[exchanges.request.headers]
"content-type" = "multipart/form-data; boundary=confpost"

[exchanges.expect]
kind = "response"
status = 400

[exchanges.expect.error]
code = "InvalidArgument"

[[exchanges]]
name = "nothing-was-stored"

[exchanges.request]
method = "GET"
target = "/conf-post/c-post-0025.txt"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 404
