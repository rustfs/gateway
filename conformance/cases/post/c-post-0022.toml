# c-post-0022 — The legacy form grammar retains AES256 on HEAD.

[case]
id = "c-post-0022"
schema_version = 1
title = "The legacy form grammar retains AES256 on HEAD"
rationale = "A requested managed encryption algorithm must reach storage rather than disappear from the form. A subsequent HEAD observes the stored declaration. The form Content-Type and its HEAD value also witness that the bundled target selected the legacy RustFS grammar."
polarity = "positive"
operation = "PostObject"
tags = ["security", "validation"]
timeout_ms = 10000
quirks = []

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/developerguide/RESTObjectPOST.html"
summary = "POST Object carries managed encryption settings in form fields, including the algorithm and KMS qualifiers."
kind = "aws-doc"

[[case.evidence]]
url = "https://github.com/rustfs/gateway/issues/1399"
summary = "Managed encryption requested by a form must reach enforcement and storage rather than be dropped by its grammar."
kind = "other"

[clock]
fixed = "2026-01-02T03:04:05Z"
request_time = "2026-01-02T03:04:05Z"

[[setup.buckets]]
name = "conf-post"

[[setup.objects]]
bucket = "conf-post"
key = "c-post-0022.txt"
absent = true

[[exchanges]]
name = "upload"

[exchanges.request]
method = "POST"
target = "/conf-post"
sign = { mode = "anonymous" }
body = { utf8 = "--confpost\r\nContent-Disposition: form-data; name=\"bucket\"\r\n\r\nconf-post\r\n--confpost\r\nContent-Disposition: form-data; name=\"key\"\r\n\r\nc-post-0022.txt\r\n--confpost\r\nContent-Disposition: form-data; name=\"x-amz-algorithm\"\r\n\r\nAWS4-HMAC-SHA256\r\n--confpost\r\nContent-Disposition: form-data; name=\"x-amz-credential\"\r\n\r\nAKIAIOSFODNN7EXAMPLE/20260102/us-east-1/s3/aws4_request\r\n--confpost\r\nContent-Disposition: form-data; name=\"x-amz-date\"\r\n\r\n20260102T030405Z\r\n--confpost\r\nContent-Disposition: form-data; name=\"x-amz-server-side-encryption\"\r\n\r\nAES256\r\n--confpost\r\nContent-Disposition: form-data; name=\"content-type\"\r\n\r\ntext/plain\r\n--confpost\r\nContent-Disposition: form-data; name=\"policy\"\r\n\r\\r\n--confpost\r\nContent-Disposition: form-data; name=\"x-amz-signature\"\r\n\r\n4bfccc646ef052652bd751a1053efd41acdc1497955acc51718fd4f8cf964a32\r\n--confpost\r\nContent-Disposition: form-data; name=\"file\"; filename=\"upload\"\r\n\r\nmanaged-sse-payload\r\n--confpost--\r\n" }

[exchanges.request.headers]
"content-type" = "multipart/form-data; boundary=confpost"

[exchanges.expect]
kind = "response"
status = 204

[[exchanges]]
name = "stored-encryption"

[exchanges.request]
method = "HEAD"
target = "/conf-post/c-post-0022.txt"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200

[exchanges.expect.headers_present]
"x-amz-server-side-encryption" = "AES256"
"content-type" = "text/plain"
