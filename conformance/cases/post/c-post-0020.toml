# c-post-0020 — A form upload hands its handler the file's exact length.

[case]
id = "c-post-0020"
schema_version = 1
title = "A form upload hands its handler the file's exact length"
rationale = """
Legacy RustFS sizes a form upload from the file's exact length and refuses an unknown length with \
400 UnexpectedContent, so a handler that fronts it must be handed the length before it runs. Under \
the RustFS form grammar with a declared Content-Length the length is fixed before the file is read. \
Over the wire this case asserts the upload and its stored bytes; the in-process target assembles it \
under that grammar and records, at the handler's entry, PostObjectInput::content_length beside the \
body's own remaining length (crates/conformance/src/inprocess/post_object.rs), and fails the case \
unless both are exactly 24. A content_length of None turns this case red there."""
polarity = "positive"
operation = "PostObject"
tags = ["framing", "compatibility", "signature", "sigv4"]
timeout_ms = 10000
quirks = []

[[case.evidence]]
url = "https://github.com/rustfs/gateway/issues/1167"
summary = "Legacy RustFS derives a form file's exact length from the declared body length and refuses an upload it is handed no length for."
kind = "other"

[clock]
fixed = "2026-01-02T03:04:05Z"
request_time = "2026-01-02T03:04:05Z"

[[setup.buckets]]
name = "conf-post"

[[setup.objects]]
bucket = "conf-post"
key = "c-post-0020.txt"
absent = true

[[exchanges]]
name = "upload"

[exchanges.request]
method = "POST"
target = "/conf-post"
sign = { mode = "anonymous" }
body = { utf8 = "--confpost\r\nContent-Disposition: form-data; name=\"key\"\r\n\r\nc-post-0020.txt\r\n--confpost\r\nContent-Disposition: form-data; name=\"x-amz-algorithm\"\r\n\r\nAWS4-HMAC-SHA256\r\n--confpost\r\nContent-Disposition: form-data; name=\"x-amz-credential\"\r\n\r\nAKIAIOSFODNN7EXAMPLE/20260102/us-east-1/s3/aws4_request\r\n--confpost\r\nContent-Disposition: form-data; name=\"x-amz-date\"\r\n\r\n20260102T030405Z\r\n--confpost\r\nContent-Disposition: form-data; name=\"policy\"\r\n\r\\r\n--confpost\r\nContent-Disposition: form-data; name=\"x-amz-signature\"\r\n\r\n7238a6bf1ad3fefdb1bbe7f21b1309e6c41171705b60c279f35997a558b47f98\r\n--confpost\r\nContent-Disposition: form-data; name=\"file\"; filename=\"upload\"\r\n\r\ntwenty-four-byte-payload\r\n--confpost--\r\n" }

[exchanges.request.headers]
"content-type" = "multipart/form-data; boundary=confpost"

[exchanges.expect]
kind = "response"
status = 204
connection_after = "open"

[exchanges.expect.headers_present]
etag = '"c14b9a8d9306ecb82e14c13daabd677c"'

[exchanges.expect.body]
exact_utf8 = ""

[[exchanges]]
name = "stored-bytes"

[exchanges.request]
method = "GET"
target = "/conf-post/c-post-0020.txt"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[exchanges.expect.headers_present]
content-length = "24"

[exchanges.expect.body]
exact_utf8 = "twenty-four-byte-payload"
