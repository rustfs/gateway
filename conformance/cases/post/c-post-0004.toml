# c-post-0004 — A form field whose value carries CR and LF is refused.

[case]
id = "c-post-0004"
schema_version = 1
title = "A form field whose value carries CR and LF is refused"
rationale = """
A form value reaches a policy comparison, a log line and a stored header. CR and LF in it are the header-injection primitive one layer further out, and an implementation that passed them through would store metadata no response can carry. The form is refused before authorization."""
polarity = "negative"
operation = "PostObject"
tags = ["framing", "validation", "security"]
timeout_ms = 10000
quirks = []

[[case.evidence]]
url = "https://www.rfc-editor.org/rfc/rfc7578"
summary = "A multipart/form-data body is framed by its boundary, and every part names its field in a Content-Disposition header."
kind = "rfc"

[[setup.buckets]]
name = "conf-post"

[request]
method = "POST"
target = "/conf-post"
sign = { mode = "anonymous" }
body = { utf8 = "--confpost\r\nContent-Disposition: form-data; name=\"key\"\r\n\r\nuploads/report.txt\r\n--confpost\r\nContent-Disposition: form-data; name=\"x-amz-meta-note\"\r\n\r\nline one\r\nline two\r\n--confpost\r\nContent-Disposition: form-data; name=\"file\"; filename=\"report.txt\"\r\n\r\nthe object content\r\n--confpost--\r\n" }

[request.headers]
"content-type" = "multipart/form-data; boundary=confpost"

[expect]
kind = "response"
status = 400
headers_absent = ["etag", "x-amz-version-id"]
connection_after = "open"

[expect.error]
code = "MalformedPOSTRequest"
request_id_present = true

[expect.body]
redact = ["RequestId", "HostId"]
exact_utf8 = '''
<?xml version="1.0" encoding="UTF-8"?>
<Error><Code>MalformedPOSTRequest</Code><Message>the POST form was not accepted</Message><RequestId>__REDACTED__</RequestId><HostId>__REDACTED__</HostId></Error>'''
