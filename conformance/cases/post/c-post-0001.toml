# c-post-0001 — A browser upload form is read, and the request reaches authorization.

[case]
id = "c-post-0001"
schema_version = 1
title = "A well-formed browser upload form is read before authorization decides"
rationale = """
POST Object is the one S3 request whose credentials travel inside the body, so the form has to be \
read before anything can decide whether the upload is allowed. An implementation that refused a \
form every browser sends as malformed would break every HTML upload page with a 400 that no \
policy change can fix. The form here is anonymous and the target grants the public nothing, so \
the right answer is the authorization refusal: 403 AccessDenied, not 400 MalformedPOSTRequest, \
and nothing stored."""
polarity = "positive"
operation = "PostObject"
tags = ["framing", "validation"]
timeout_ms = 10000
quirks = []

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/RESTObjectPOST.html"
summary = "A browser upload carries its key, policy and signature as form fields that precede the file field."
kind = "aws-doc"

[[setup.buckets]]
name = "conf-post"

[request]
method = "POST"
target = "/conf-post"
sign = { mode = "anonymous" }
body = { utf8 = "--confpost\r\nContent-Disposition: form-data; name=\"key\"\r\n\r\nuploads/report.txt\r\n--confpost\r\nContent-Disposition: form-data; name=\"acl\"\r\n\r\nprivate\r\n--confpost\r\nContent-Disposition: form-data; name=\"file\"; filename=\"report.txt\"\r\nContent-Type: text/plain\r\n\r\nthe object content\r\n--confpost--\r\n" }

[request.headers]
"content-type" = "multipart/form-data; boundary=confpost"

[expect]
kind = "response"
status = 403
headers_absent = ["etag", "x-amz-version-id"]
connection_after = "open"

[expect.error]
code = "AccessDenied"
request_id_present = true

[expect.body]
redact = ["RequestId", "HostId"]
exact_utf8 = '''
<?xml version="1.0" encoding="UTF-8"?>
<Error><Code>AccessDenied</Code><Message>the request is not allowed</Message><RequestId>__REDACTED__</RequestId><HostId>__REDACTED__</HostId></Error>'''
