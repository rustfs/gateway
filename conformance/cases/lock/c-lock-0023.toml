[case]
id = "c-lock-0023"
schema_version = 3
title = "A bypass header that is neither true nor false is refused, never resolved to true"
rationale = """
This header is the single switch that weakens GOVERNANCE protection, so the direction of a parse failure is a security property rather than a style choice. A parser that treated any non-empty value as true would grant the bypass to a client that sent yes, or 1, or a typo — the exact opposite of what an unreadable value should mean. The refusal is the assertion; the 400 is only how it is observed."""
polarity = "negative"
operation = "PutObjectRetention"
tags = ["object-lock", "security", "error-shape"]
timeout_ms = 10000
quirks = ["q-lock-0012"]

[[case.evidence]]
url = "https://github.com/s3s-project/s3s/pull/151"
summary = "The boolean header parser upstream had to fix reads these values, which is why the accepted spellings are pinned on both sides."
kind = "s3s-pr"

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutObjectRetention.html"
summary = "The request documents x-amz-bypass-governance-retention as a boolean, which admits no third value."
kind = "aws-doc"

[[setup.buckets]]
name = "conf-lock"
object_lock = true

[[setup.objects]]
bucket = "conf-lock"
key = "doc.txt"
body = { utf8 = "payload" }

[request]
method = "PUT"
target = "/conf-lock/doc.txt?retention"
headers = { "content-type" = "application/xml", "x-amz-bypass-governance-retention" = "yes" }
content_md5 = "computed"
body = { utf8 = '<Retention><Mode>GOVERNANCE</Mode><RetainUntilDate>2030-01-01T00:00:00.000Z</RetainUntilDate></Retention>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 400
connection_after = "open"

[expect.error]
code = "InvalidArgument"
request_id_present = true

[expect.headers_present]
"content-type" = "application/xml"

[expect.body]
redact = ["RequestId", "HostId"]
exact_utf8 = '''
<?xml version="1.0" encoding="UTF-8"?>
<Error><Code>InvalidArgument</Code><Message>the request carries a value this member cannot hold</Message><Resource>BypassGovernanceRetention</Resource><RequestId>__REDACTED__</RequestId><HostId>__REDACTED__</HostId></Error>'''
