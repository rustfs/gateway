[case]
id = "c-lock-0005"
schema_version = 1
title = "A retention document is rooted at Retention, not at the shape name, in both directions"
rationale = """
The wire root is Retention while the structure AWS publishes is called ObjectLockRetention, and a decoder keyed to the shape name refuses every real client document while an encoder keyed to it returns one no SDK can read. Both halves are asserted here in one round trip, the response byte for byte, because the mismatch is invisible to any assertion weaker than the element name itself."""
polarity = "positive"
operation = "PutObjectRetention"
tags = ["object-lock", "xml", "wire-bytes"]
timeout_ms = 10000
quirks = ["q-lock-0004"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutObjectRetention.html"
summary = "The documented request syntax roots the body at a Retention element."
kind = "aws-doc"

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_ObjectLockRetention.html"
summary = "The structure the Retention element carries is published under the name ObjectLockRetention."
kind = "aws-doc"

[[setup.buckets]]
name = "conf-lock"
object_lock = true

[[setup.objects]]
bucket = "conf-lock"
key = "doc.txt"
body = { utf8 = "payload" }

[[exchanges]]
name = "put-retention"

[exchanges.request]
method = "PUT"
target = "/conf-lock/doc.txt?retention"
headers = { "content-type" = "application/xml", "content-md5" = "nRP4r9dIhDgQ95myRGb8sw==" }
body = { utf8 = '<Retention><Mode>GOVERNANCE</Mode><RetainUntilDate>2030-01-01T00:00:00.000Z</RetainUntilDate></Retention>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[[exchanges]]
name = "read-back"

[exchanges.request]
method = "GET"
target = "/conf-lock/doc.txt?retention"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[exchanges.expect.body]
golden = "goldens/c-lock-0005.xml"
not_contains_utf8 = ["<ObjectLockRetention>"]
