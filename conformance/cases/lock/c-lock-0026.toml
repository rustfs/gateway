[case]
id = "c-lock-0026"
schema_version = 3
title = "A legal-hold write on a bucket without object lock is refused the same way"
rationale = """
The retention rule applies to the second object-level document unchanged, and asserting both is what stops one of the two paths from being relaxed on its own. A hold accepted on an unlocked bucket is the more dangerous half: holds are placed in response to litigation, and the caller placing one has the least appetite for a 200 that means nothing."""
polarity = "negative"
operation = "PutObjectLegalHold"
tags = ["object-lock", "error-shape"]
timeout_ms = 10000
quirks = ["q-lock-0015"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock.html"
summary = "Object lock settings can be applied only to objects in buckets that have object lock enabled."
kind = "aws-doc"

[[setup.buckets]]
name = "conf-lock"

[[setup.objects]]
bucket = "conf-lock"
key = "doc.txt"
body = { utf8 = "payload" }

[request]
method = "PUT"
target = "/conf-lock/doc.txt?legal-hold"
headers = { "content-type" = "application/xml" }
content_md5 = "computed"
body = { utf8 = '<LegalHold><Status>ON</Status></LegalHold>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 400
connection_after = "open"

[expect.error]
code = "InvalidRequest"
request_id_present = true

[expect.headers_present]
"content-type" = "application/xml"

[expect.body]
redact = ["RequestId", "HostId"]
exact_utf8 = '''
<?xml version="1.0" encoding="UTF-8"?>
<Error><Code>InvalidRequest</Code><Message>Bucket is missing Object Lock Configuration</Message><RequestId>__REDACTED__</RequestId><HostId>__REDACTED__</HostId></Error>'''
