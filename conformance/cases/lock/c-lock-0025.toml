[case]
id = "c-lock-0025"
schema_version = 3
title = "A retention write on a bucket without object lock is refused as InvalidRequest"
rationale = """
Per-object lock state only means something inside a lock-enabled bucket, so accepting the write elsewhere stores a protection promise no enforcement path will ever read. The client sees a 200 and stops worrying about the object. The code is InvalidRequest rather than a not-found because the bucket is there: what is missing is the configuration the request presupposes."""
polarity = "negative"
operation = "PutObjectRetention"
tags = ["object-lock", "error-shape"]
timeout_ms = 10000
quirks = ["q-lock-0015"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock.html"
summary = "Object lock settings can be applied only to objects in buckets that have object lock enabled."
kind = "aws-doc"

[[setup.buckets]]
name = "conf-lock"

[[setup.objects]]
bucket = "conf-lock"
key = "doc.txt"
body = { utf8 = "payload" }

[request]
method = "PUT"
target = "/conf-lock/doc.txt?retention"
headers = { "content-type" = "application/xml" }
content_md5 = "computed"
body = { utf8 = '<Retention><Mode>GOVERNANCE</Mode><RetainUntilDate>2030-01-01T00:00:00.000Z</RetainUntilDate></Retention>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 400
connection_after = "open"

[expect.error]
code = "InvalidRequest"
request_id_present = true

[expect.headers_present]
"content-type" = "application/xml"

[expect.body]
redact = ["RequestId", "HostId"]
exact_utf8 = '''
<?xml version="1.0" encoding="UTF-8"?>
<Error><Code>InvalidRequest</Code><Message>Bucket is missing Object Lock Configuration</Message><RequestId>__REDACTED__</RequestId><HostId>__REDACTED__</HostId></Error>'''
