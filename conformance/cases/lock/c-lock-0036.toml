[case]
id = "c-lock-0036"
schema_version = 1
title = "Lock headers on an object write set its retention and hold, and an ISO 8601 date without milliseconds is accepted"
rationale = """
The object-write headers are only worth anything if they reach the store: a gateway that parsed them and dropped them answers the same 200 as one that honoured them. The two reads afterwards are the measurement, one per document. The retain-until header is the one request header in ISO 8601 rather than HTTP-date form, and it is sent here without fractional seconds, a legal variant of that format; the retention read writes it back with milliseconds, which is how the family renders the instant."""
polarity = "positive"
operation = "PutObject"
tags = ["object-lock", "compatibility", "wire-bytes"]
timeout_ms = 10000
quirks = ["q-timestamp-0011"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutObject.html"
summary = "The object write documents x-amz-object-lock-retain-until-date in the extended date time format, unlike every other date header."
kind = "aws-doc"

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_GetObjectRetention.html"
summary = "The retention read reports the mode and retain-until instant set on the object version."
kind = "aws-doc"

[clock]
fixed = "2026-01-02T03:04:05Z"

[connection]
reuse = true

[[setup.buckets]]
name = "conf-lock"
object_lock = true

[[exchanges]]
name = "write-with-all-three-headers"

[exchanges.request]
method = "PUT"
target = "/conf-lock/doc.txt"
headers = { "content-type" = "text/plain", "x-amz-object-lock-mode" = "COMPLIANCE", "x-amz-object-lock-retain-until-date" = "2030-01-01T00:00:00Z", "x-amz-object-lock-legal-hold" = "ON" }
body = { utf8 = 'payload' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[[exchanges]]
name = "the-retention-was-set"

[exchanges.request]
method = "GET"
target = "/conf-lock/doc.txt?retention"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[exchanges.expect.body]
exact_utf8 = '''
<?xml version="1.0" encoding="UTF-8"?>
<Retention xmlns="http://s3.amazonaws.com/doc/2006-03-01/"><Mode>COMPLIANCE</Mode><RetainUntilDate>2030-01-01T00:00:00.000Z</RetainUntilDate></Retention>'''

[[exchanges]]
name = "the-hold-was-set"

[exchanges.request]
method = "GET"
target = "/conf-lock/doc.txt?legal-hold"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[exchanges.expect.body]
exact_utf8 = '''
<?xml version="1.0" encoding="UTF-8"?>
<LegalHold xmlns="http://s3.amazonaws.com/doc/2006-03-01/"><Status>ON</Status></LegalHold>'''
