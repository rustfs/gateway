[case]
id = "c-lock-0035"
schema_version = 1
title = "An object write carrying lock headers into a bucket without object lock is InvalidRequest and creates nothing"
rationale = """
Per-object lock state exists only inside a lock-enabled bucket, and the three x-amz-object-lock headers on PutObject are the third way of writing it beside the retention and legal-hold documents. A gateway that ignored them would answer 200 for an object the client believes is protected, in a bucket where no protection can exist. Both header forms are refused, the retention pair and the hold alone, and the read afterwards proves neither refusal left an object behind."""
polarity = "negative"
operation = "PutObject"
tags = ["object-lock", "error-shape"]
timeout_ms = 10000
quirks = ["q-lock-0015"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock.html"
summary = "Object lock settings apply only to objects in buckets that have object lock enabled."
kind = "aws-doc"

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutObject.html"
summary = "The object write documents the three object lock headers that set retention and legal hold on the new object."
kind = "aws-doc"

[clock]
fixed = "2026-01-02T03:04:05Z"

[connection]
reuse = true

[[setup.buckets]]
name = "conf-unlocked"

[[exchanges]]
name = "write-with-a-retention-pair"

[exchanges.request]
method = "PUT"
target = "/conf-unlocked/doc.txt"
headers = { "content-type" = "text/plain", "x-amz-object-lock-mode" = "GOVERNANCE", "x-amz-object-lock-retain-until-date" = "2030-01-01T00:00:00.000Z" }
body = { utf8 = 'payload' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 400
connection_after = "open"

[exchanges.expect.error]
code = "InvalidRequest"
request_id_present = true

[[exchanges]]
name = "write-with-a-hold-alone"

[exchanges.request]
method = "PUT"
target = "/conf-unlocked/doc.txt"
headers = { "content-type" = "text/plain", "x-amz-object-lock-legal-hold" = "ON" }
body = { utf8 = 'payload' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 400
connection_after = "open"

[exchanges.expect.error]
code = "InvalidRequest"
request_id_present = true

[[exchanges]]
name = "no-object-was-created"

[exchanges.request]
method = "GET"
target = "/conf-unlocked/doc.txt"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 404
connection_after = "open"

[exchanges.expect.error]
code = "NoSuchKey"
request_id_present = true
