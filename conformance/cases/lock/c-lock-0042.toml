[case]
id = "c-lock-0042"
schema_version = 1
title = "A legal hold placed on a named version stays on that version after a newer one is written"
rationale = """
The legal-hold twin of c-lock-0040. A hold is a per-version legal state, so a newer write must neither inherit it nor erase it: the held version still answers ON and the newer one answers that no hold was ever placed on it."""
polarity = "positive"
operation = "GetObjectLegalHold"
tags = ["object-lock", "versions"]
timeout_ms = 10000
quirks = []

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutObjectLegalHold.html"
summary = "The legal-hold write documents versionId as selecting the object version the hold is placed on."
kind = "aws-doc"

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_GetObjectLegalHold.html"
summary = "The legal-hold read documents versionId as selecting the version whose hold is reported."
kind = "aws-doc"

[clock]
fixed = "2026-01-02T03:04:05Z"

[connection]
reuse = true

[[setup.buckets]]
name = "conf-lock-versions"
versioning = "enabled"
object_lock = true

[[exchanges]]
name = "write-the-first-version"

[exchanges.request]
method = "PUT"
target = "/conf-lock-versions/doc.txt"
headers = { "content-type" = "text/plain" }
body = { utf8 = 'first' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[exchanges.expect.capture]
first = { header = "x-amz-version-id" }

[[exchanges]]
name = "hold-the-first-version-by-id"

[exchanges.request]
method = "PUT"
target = "/conf-lock-versions/doc.txt?legal-hold&versionId=${capture.first}"
headers = { "content-type" = "application/xml", "content-md5" = "oK1+ndJbG6HuGA87LDxznw==" }
body = { utf8 = '<LegalHold><Status>ON</Status></LegalHold>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[[exchanges]]
name = "write-a-newer-version"

[exchanges.request]
method = "PUT"
target = "/conf-lock-versions/doc.txt"
headers = { "content-type" = "text/plain" }
body = { utf8 = 'second' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[exchanges.expect.capture]
second = { header = "x-amz-version-id" }

[[exchanges]]
name = "the-first-version-is-still-held"

[exchanges.request]
method = "GET"
target = "/conf-lock-versions/doc.txt?legal-hold&versionId=${capture.first}"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[exchanges.expect.body]
exact_utf8 = '''
<?xml version="1.0" encoding="UTF-8"?>
<LegalHold xmlns="http://s3.amazonaws.com/doc/2006-03-01/"><Status>ON</Status></LegalHold>'''

[[exchanges]]
name = "the-current-version-was-never-held"

[exchanges.request]
method = "GET"
target = "/conf-lock-versions/doc.txt?legal-hold"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 404
connection_after = "open"

[exchanges.expect.error]
code = "NoSuchObjectLockConfiguration"
request_id_present = true
