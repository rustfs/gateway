[case]
id = "c-lock-0034"
schema_version = 1
title = "A legal-hold write whose Content-MD5 is the digest of OFF is BadDigest and places no hold"
rationale = """
A hold document altered in flight flips between ON and OFF, and the two are opposite legal states. The digest here is the real digest of the OFF document, sent with an ON body, so only a comparison of the claim against the bytes can refuse it. The read-back shows no hold exists afterwards, which is the half a verify-after-store gateway would fail."""
polarity = "negative"
operation = "PutObjectLegalHold"
tags = ["object-lock", "checksum", "error-shape"]
timeout_ms = 10000
quirks = []

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutObjectLegalHold.html"
summary = "The write reference documents Content-MD5 as the base64 digest of the legal-hold document, which is the header this case gets wrong on purpose."
kind = "aws-doc"

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/ErrorResponses.html"
summary = "The error list gives BadDigest for a Content-MD5 that disagrees with the body it accompanies."
kind = "aws-doc"

[clock]
fixed = "2026-01-02T03:04:05Z"

[connection]
reuse = true

[[setup.buckets]]
name = "conf-lock"
object_lock = true

[[setup.objects]]
bucket = "conf-lock"
key = "doc.txt"
body = { utf8 = "payload" }

[[exchanges]]
name = "write-carrying-another-documents-digest"

[exchanges.request]
method = "PUT"
target = "/conf-lock/doc.txt?legal-hold"
headers = { "content-type" = "application/xml", "content-md5" = "An8G3mv4SfhAibzslQjGDw==" }
body = { utf8 = '<LegalHold><Status>ON</Status></LegalHold>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 400
connection_after = "open"

[exchanges.expect.error]
code = "BadDigest"
request_id_present = true

[[exchanges]]
name = "no-hold-was-placed"

[exchanges.request]
method = "GET"
target = "/conf-lock/doc.txt?legal-hold"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 404
connection_after = "open"

[exchanges.expect.error]
code = "NoSuchObjectLockConfiguration"
request_id_present = true
