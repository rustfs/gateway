[case]
id = "c-lock-0016"
schema_version = 3
title = "A lowercase retention mode is out of the set, because the set is case-sensitive"
rationale = """
AWS spells both modes in upper case and defines no others, so lowercase governance is a value no enforcement path recognises. Accepting it stores a mode that matches neither branch of every comparison downstream, which in practice means the object is protected by nothing while its metadata claims otherwise — the worst of the two failure directions."""
polarity = "negative"
operation = "PutObjectRetention"
tags = ["object-lock", "xml", "error-shape"]
timeout_ms = 10000
quirks = ["q-lock-0008"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_ObjectLockRetention.html"
summary = "The Mode member documents GOVERNANCE and COMPLIANCE in upper case as its only values."
kind = "aws-doc"

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/ErrorResponses.html"
summary = "MalformedXML is documented as the answer for a body that does not validate against the published schema."
kind = "aws-doc"

[[setup.buckets]]
name = "conf-lock"
object_lock = true

[[setup.objects]]
bucket = "conf-lock"
key = "doc.txt"
body = { utf8 = "payload" }

[request]
method = "PUT"
target = "/conf-lock/doc.txt?retention"
headers = { "content-type" = "application/xml" }
content_md5 = "computed"
body = { utf8 = '<Retention><Mode>governance</Mode><RetainUntilDate>2030-01-01T00:00:00.000Z</RetainUntilDate></Retention>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 400
connection_after = "open"

[expect.error]
code = "MalformedXML"
request_id_present = true

[expect.headers_present]
"content-type" = "application/xml"

[expect.body]
redact = ["RequestId", "HostId"]
exact_utf8 = '''
<?xml version="1.0" encoding="UTF-8"?>
<Error><Code>MalformedXML</Code><Message>Mode must be GOVERNANCE or COMPLIANCE</Message><RequestId>__REDACTED__</RequestId><HostId>__REDACTED__</HostId></Error>'''
