[case]
id = "c-lock-0027"
schema_version = 1
title = "A retention write leaves the object bytes alone, because it is not a PutObject"
rationale = """
Without a route row of its own this request was claimed by PutObject and the Retention document was stored as the object body: a caller protecting a file destroyed it, with a 200 and no other signal. The assertion is the second exchange rather than the first, because the first was always green — the write reported success either way. Reading the object back is the only thing that told the two apart."""
polarity = "negative"
operation = "PutObjectRetention"
tags = ["object-lock", "routing"]
timeout_ms = 10000
quirks = ["q-lock-0004"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutObjectRetention.html"
summary = "The retention write is documented as a PUT to the object key carrying the retention subresource, with the document as its body."
kind = "aws-doc"

[[setup.buckets]]
name = "conf-lock"
object_lock = true

[[setup.objects]]
bucket = "conf-lock"
key = "doc.txt"
body = { utf8 = "original-bytes" }

[[exchanges]]
name = "put-retention"

[exchanges.request]
method = "PUT"
target = "/conf-lock/doc.txt?retention"
headers = { "content-type" = "application/xml", "content-md5" = "nRP4r9dIhDgQ95myRGb8sw==" }
body = { utf8 = '<Retention><Mode>GOVERNANCE</Mode><RetainUntilDate>2030-01-01T00:00:00.000Z</RetainUntilDate></Retention>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[[exchanges]]
name = "object-is-untouched"

[exchanges.request]
method = "GET"
target = "/conf-lock/doc.txt"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 200
connection_after = "open"

[exchanges.expect.body]
exact_utf8 = "original-bytes"
