[case]
id = "c-lock-0038"
schema_version = 1
title = "A lock mode header without a retain-until header is refused, and so is a date without a mode"
rationale = """
A retention is a mode and an instant together; half of one is a protection nothing can evaluate. Storing a mode with no instant would read back as a retention that never lapses or never began, depending on the reader, and storing an instant with no mode leaves the one member that decides whether it can be lifted unset. Both halves are refused before anything is written."""
polarity = "negative"
operation = "PutObject"
tags = ["object-lock", "error-shape"]
timeout_ms = 10000
quirks = []

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutObject.html"
summary = "The object write documents the mode and the retain-until headers as the two parts of one retention setting."
kind = "aws-doc"

[clock]
fixed = "2026-01-02T03:04:05Z"

[connection]
reuse = true

[[setup.buckets]]
name = "conf-lock"
object_lock = true

[[exchanges]]
name = "write-with-a-mode-alone"

[exchanges.request]
method = "PUT"
target = "/conf-lock/doc.txt"
headers = { "content-type" = "text/plain", "x-amz-object-lock-mode" = "GOVERNANCE" }
body = { utf8 = 'payload' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 400
connection_after = "open"

[exchanges.expect.error]
code = "InvalidArgument"
request_id_present = true

[[exchanges]]
name = "write-with-a-date-alone"

[exchanges.request]
method = "PUT"
target = "/conf-lock/doc.txt"
headers = { "content-type" = "text/plain", "x-amz-object-lock-retain-until-date" = "2030-01-01T00:00:00.000Z" }
body = { utf8 = 'payload' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 400
connection_after = "open"

[exchanges.expect.error]
code = "InvalidArgument"
request_id_present = true

[[exchanges]]
name = "no-object-was-created"

[exchanges.request]
method = "GET"
target = "/conf-lock/doc.txt"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 404
connection_after = "open"

[exchanges.expect.error]
code = "NoSuchKey"
request_id_present = true
