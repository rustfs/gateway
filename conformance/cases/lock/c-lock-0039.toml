[case]
id = "c-lock-0039"
schema_version = 1
title = "Lock headers outside their closed value sets are refused as arguments rather than stored"
rationale = """
The header forms of mode and hold are held to the same closed sets as their documents: GOVERNANCE or COMPLIANCE, ON or OFF, case-sensitive. ARCHIVE is a mode no enforcement path can read, and a lowercase on is not the ON a compliance audit looks for, so storing either records a lock that protects nothing while telling the client it succeeded."""
polarity = "negative"
operation = "PutObject"
tags = ["object-lock", "error-shape"]
timeout_ms = 10000
quirks = []

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutObject.html"
summary = "The object write documents the closed value sets of the mode and legal hold headers."
kind = "aws-doc"

[clock]
fixed = "2026-01-02T03:04:05Z"

[connection]
reuse = true

[[setup.buckets]]
name = "conf-lock"
object_lock = true

[[exchanges]]
name = "write-with-an-unknown-mode"

[exchanges.request]
method = "PUT"
target = "/conf-lock/doc.txt"
headers = { "content-type" = "text/plain", "x-amz-object-lock-mode" = "ARCHIVE", "x-amz-object-lock-retain-until-date" = "2030-01-01T00:00:00.000Z" }
body = { utf8 = 'payload' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 400
connection_after = "open"

[exchanges.expect.error]
code = "InvalidArgument"
request_id_present = true

[[exchanges]]
name = "write-with-a-lowercase-hold"

[exchanges.request]
method = "PUT"
target = "/conf-lock/doc.txt"
headers = { "content-type" = "text/plain", "x-amz-object-lock-legal-hold" = "on" }
body = { utf8 = 'payload' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 400
connection_after = "open"

[exchanges.expect.error]
code = "InvalidArgument"
request_id_present = true

[[exchanges]]
name = "no-object-was-created"

[exchanges.request]
method = "GET"
target = "/conf-lock/doc.txt"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 404
connection_after = "open"

[exchanges.expect.error]
code = "NoSuchKey"
request_id_present = true
