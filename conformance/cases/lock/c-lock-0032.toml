[case]
id = "c-lock-0032"
schema_version = 1
title = "A retention write whose Content-MD5 is the digest of a COMPLIANCE document is BadDigest and stores nothing"
rationale = """
c-lock-0014 proves an integrity claim must be present; it cannot prove the claim is compared with anything. The digest here is the real digest of the same document with COMPLIANCE for GOVERNANCE, exactly the edit that matters on this surface: a retention altered in flight differs from the one the client signed for by whether the protection can ever be lifted. The read-back proves the refusal came before the store, because a gateway that verified after storing would answer the same 400 and keep the document."""
polarity = "negative"
operation = "PutObjectRetention"
tags = ["object-lock", "checksum", "error-shape"]
timeout_ms = 10000
quirks = []

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutObjectRetention.html"
summary = "The write reference documents Content-MD5 as the base64 digest of the retention document, which is the header this case gets wrong on purpose."
kind = "aws-doc"

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/ErrorResponses.html"
summary = "The error list gives BadDigest for a Content-MD5 that disagrees with the body it accompanies."
kind = "aws-doc"

[clock]
fixed = "2026-01-02T03:04:05Z"

[connection]
reuse = true

[[setup.buckets]]
name = "conf-lock"
object_lock = true

[[setup.objects]]
bucket = "conf-lock"
key = "doc.txt"
body = { utf8 = "payload" }

[[exchanges]]
name = "write-carrying-another-documents-digest"

[exchanges.request]
method = "PUT"
target = "/conf-lock/doc.txt?retention"
headers = { "content-type" = "application/xml", "content-md5" = "o7MgIADrtCE50g2clXbhQA==" }
body = { utf8 = '<Retention><Mode>GOVERNANCE</Mode><RetainUntilDate>2030-01-01T00:00:00.000Z</RetainUntilDate></Retention>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 400
connection_after = "open"

[exchanges.expect.error]
code = "BadDigest"
request_id_present = true

[[exchanges]]
name = "nothing-was-stored"

[exchanges.request]
method = "GET"
target = "/conf-lock/doc.txt?retention"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[exchanges.expect]
kind = "response"
status = 404
connection_after = "open"

[exchanges.expect.error]
code = "NoSuchObjectLockConfiguration"
request_id_present = true
