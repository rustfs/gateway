[case]
id = "c-lock-0009"
schema_version = 1
title = "The bypass header is read case-insensitively, so the AWS CLI capitalised True is accepted"
rationale = """
The AWS CLI sends True with a capital letter, and a case-sensitive parser refuses a request every AWS SDK considers well formed — the client sees a 400 it cannot fix by changing anything it controls. The relaxation is bounded on purpose and its other half is asserted next door: accepting True must not become accepting anything truthy-looking."""
polarity = "positive"
operation = "PutObjectRetention"
tags = ["object-lock", "security"]
timeout_ms = 10000
quirks = ["q-lock-0012"]

[[case.evidence]]
url = "https://github.com/s3s-project/s3s/pull/151"
summary = "The AWS CLI sends capitalised boolean header values, which a case-sensitive parser refuses."
kind = "s3s-pr"

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutObjectRetention.html"
summary = "The request documents x-amz-bypass-governance-retention as a boolean header of this operation."
kind = "aws-doc"

[[setup.buckets]]
name = "conf-lock"
object_lock = true

[[setup.objects]]
bucket = "conf-lock"
key = "doc.txt"
body = { utf8 = "payload" }

[request]
method = "PUT"
target = "/conf-lock/doc.txt?retention"
headers = { "content-type" = "application/xml", "content-md5" = "tyvCoL2jJRTO+akErSMCGQ==", "x-amz-bypass-governance-retention" = "True" }
body = { utf8 = '<Retention><Mode>GOVERNANCE</Mode><RetainUntilDate>2031-01-01T00:00:00.000Z</RetainUntilDate></Retention>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 200
connection_after = "open"
