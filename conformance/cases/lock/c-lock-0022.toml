[case]
id = "c-lock-0022"
schema_version = 3
title = "A lowercase legal-hold status is out of the set and is refused"
rationale = """
ON and OFF are the two values AWS defines, in upper case, and a lowercase on is a hold no enforcement path will match. The direction of the failure is what makes it worth a case: a client that meant to place a hold gets a 200, records the hold as placed, and the object is deletable — which is discovered when somebody deletes it."""
polarity = "negative"
operation = "PutObjectLegalHold"
tags = ["object-lock", "xml", "security"]
timeout_ms = 10000
quirks = ["q-lock-0011"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_ObjectLockLegalHold.html"
summary = "The Status member documents the closed value set ON and OFF."
kind = "aws-doc"

[[setup.buckets]]
name = "conf-lock"
object_lock = true

[[setup.objects]]
bucket = "conf-lock"
key = "doc.txt"
body = { utf8 = "payload" }

[request]
method = "PUT"
target = "/conf-lock/doc.txt?legal-hold"
headers = { "content-type" = "application/xml" }
content_md5 = "computed"
body = { utf8 = '<LegalHold><Status>on</Status></LegalHold>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 400
connection_after = "open"

[expect.error]
code = "MalformedXML"
request_id_present = true

[expect.headers_present]
"content-type" = "application/xml"

[expect.body]
redact = ["RequestId", "HostId"]
exact_utf8 = '''
<?xml version="1.0" encoding="UTF-8"?>
<Error><Code>MalformedXML</Code><Message>Status must be ON or OFF</Message><RequestId>__REDACTED__</RequestId><HostId>__REDACTED__</HostId></Error>'''
