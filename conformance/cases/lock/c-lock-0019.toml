[case]
id = "c-lock-0019"
schema_version = 3
title = "A default retention naming both Days and Years is refused as MalformedXML"
rationale = """
Thirty days and one year are two different answers to how long new objects are protected, and a document naming both has no defined winner. Whichever an implementation picked, the other is a retention policy silently discarded — and the two differ by more than an order of magnitude, so the discard is not a rounding error but the difference between a month and a year of legal exposure."""
polarity = "negative"
operation = "PutObjectLockConfiguration"
tags = ["object-lock", "xml", "error-shape"]
timeout_ms = 10000
quirks = ["q-lock-0010"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutObjectLockConfiguration.html"
summary = "The operation documents that Days and Years cannot be specified at the same time."
kind = "aws-doc"

[[setup.buckets]]
name = "conf-lock"

[request]
method = "PUT"
target = "/conf-lock?object-lock"
headers = { "content-type" = "application/xml" }
content_md5 = "computed"
body = { utf8 = '<ObjectLockConfiguration><ObjectLockEnabled>Enabled</ObjectLockEnabled><Rule><DefaultRetention><Mode>GOVERNANCE</Mode><Days>30</Days><Years>1</Years></DefaultRetention></Rule></ObjectLockConfiguration>' }
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 400
connection_after = "open"

[expect.error]
code = "MalformedXML"
request_id_present = true

[expect.headers_present]
"content-type" = "application/xml"

[expect.body]
redact = ["RequestId", "HostId"]
exact_utf8 = '''
<?xml version="1.0" encoding="UTF-8"?>
<Error><Code>MalformedXML</Code><Message>DefaultRetention cannot specify Days and Years at the same time</Message><RequestId>__REDACTED__</RequestId><HostId>__REDACTED__</HostId></Error>'''
