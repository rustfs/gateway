[case]
id = "c-lock-0028"
schema_version = 1
title = "A retention read naming a version that does not exist is NoSuchVersion, never the current version's document"
rationale = """
The bucket here is not versioned, so the only version doc.txt has is null and the id v1 names nothing. Answering the current version's retention for it would report a protection state for a version that does not exist, which on a compliance surface is a confident wrong answer. The read is refused with the code every other version-scoped read gets for an id that names nothing. c-lock-0040 is the positive twin that reads a version which does exist."""
polarity = "negative"
operation = "GetObjectRetention"
tags = ["object-lock", "versions", "error-shape"]
timeout_ms = 10000
quirks = ["q-lock-0002"]

[[case.evidence]]
url = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_GetObjectRetention.html"
summary = "The retention read documents versionId as selecting the version whose retention is reported."
kind = "aws-doc"

[[setup.buckets]]
name = "conf-lock"
object_lock = true

[[setup.objects]]
bucket = "conf-lock"
key = "doc.txt"
body = { utf8 = "payload" }

[request]
method = "GET"
target = "/conf-lock/doc.txt?retention&versionId=v1"
sign = { mode = "sigv4_header", service = "s3", region = "us-east-1", credential = "valid" }

[expect]
kind = "response"
status = 404
connection_after = "open"

[expect.error]
code = "NoSuchVersion"
request_id_present = true

[expect.headers_present]
"content-type" = "application/xml"
