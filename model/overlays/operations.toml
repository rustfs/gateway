# The operation whitelist and every per-operation wire decision the Smithy model cannot make.
#
# Structure comes from `model/s3.json` (bindings, wire names, enum values, list flattening);
# decisions come from this file (route precedence, IAM action, hot/cold split, body caps, element
# order, error codes). Codegen fails when the model carries an operation that is in neither
# `include` nor a [[deferred]] group, so an upstream addition can never be silently ignored.
#
# See overlays/README.md before editing.

include = ["GetBucketLocation", "ListObjectsV2", "PutObject"]

# ---------------------------------------------------------------------------------------------
# Scalar vocabulary: Smithy shape name -> IR scalar. This is what keeps `ETag`, `ObjectKey` and
# the opaque pagination tokens out of the generic `String` bucket without a per-field override at
# every use site. An `ETag` takes its rendering from its binding position; there is no default.
# ---------------------------------------------------------------------------------------------
[scalar]
AccountId = "String"
BucketName = "BucketName"
ETag = "ETag"
Expiration = "OpaqueString"
Expires = "OpaqueString"
NextToken = "OpaqueString"
ObjectKey = "ObjectKey"
Token = "OpaqueString"

# =============================================================================================
# GetBucketLocation
# =============================================================================================
[op.GetBucketLocation]
precedence = 300
auth_action = "s3:GetBucketLocation"
# The body is a single region string; a four kilobyte ceiling is generous and bounds the XML
# bomb surface for an operation that never returns a list.
response_max_bytes = 4096
error_codes = ["NoSuchBucket", "AccessDenied", "PermanentRedirect"]
quirk_refs = ["q-unwrapped-0001"]

# us-east-1 has a null constraint and still writes the element, so the default
# "optional member is omitted when empty" rule is wrong here.
[op.GetBucketLocation.empty_value]
LocationConstraint = "emit"

[[op.GetBucketLocation.field]]
side = "output"
name = "LocationConstraint"
hot = true
quirks = ["q-empty-0002", "q-region-0003"]

# =============================================================================================
# ListObjectsV2
# =============================================================================================
[op.ListObjectsV2]
precedence = 600
auth_action = "s3:ListBucket"
error_codes = ["NoSuchBucket", "AccessDenied", "InvalidArgument", "PermanentRedirect"]
quirk_refs = ["q-root-0013", "q-order-0014", "q-encoding-0015"]
# `x-amz-optional-object-attributes` is a comma-delimited list in a header position. The frozen
# IR can only describe a list through the XML notions `flattened` and `wrapper_name`, so there is
# no truthful way to emit it yet; it is withheld rather than described wrongly. Restoring it
# needs an IR change (see the P1-03 handoff), not an overlay change.
input_drop = ["OptionalObjectAttributes"]
# AWS always writes these five, whatever the model says about optionality.
output_required = ["Name", "Prefix", "KeyCount", "MaxKeys", "IsTruncated"]
input_hot = ["Prefix", "Delimiter", "MaxKeys", "ContinuationToken"]
output_hot = ["Name", "Prefix", "KeyCount", "MaxKeys", "Delimiter", "IsTruncated", "Contents", "CommonPrefixes"]
# Wire order, not model order: strict clients fail to parse when the bucket name follows the
# entry list. See q-order-0014.
element_order = [
  "Name",
  "Prefix",
  "KeyCount",
  "MaxKeys",
  "Delimiter",
  "IsTruncated",
  "Contents",
  "CommonPrefixes",
  "EncodingType",
  "ContinuationToken",
  "NextContinuationToken",
  "StartAfter",
]
url_encoded_fields = [
  "Prefix",
  "Delimiter",
  "StartAfter",
  "ContinuationToken",
  "NextContinuationToken",
  "Contents.Key",
  "CommonPrefixes.Prefix",
]

[[op.ListObjectsV2.field]]
side = "input"
name = "MaxKeys"
default_int = 1000

[[op.ListObjectsV2.field]]
side = "input"
name = "FetchOwner"
default_bool = false
quirks = ["q-owner-0017"]

[[op.ListObjectsV2.field]]
side = "input"
name = "ContinuationToken"
quirks = ["q-token-0021"]

[[op.ListObjectsV2.field]]
side = "input"
name = "EncodingType"
quirks = ["q-encoding-0015"]

[[op.ListObjectsV2.field]]
side = "output"
name = "Name"
quirks = ["q-order-0014"]

[[op.ListObjectsV2.field]]
side = "output"
name = "Prefix"
quirks = ["q-empty-0016"]

[[op.ListObjectsV2.field]]
side = "output"
name = "Delimiter"
quirks = ["q-empty-0016"]

[[op.ListObjectsV2.field]]
side = "output"
name = "KeyCount"
quirks = ["q-keycount-0018"]

[[op.ListObjectsV2.field]]
side = "output"
name = "Contents"
quirks = ["q-flat-0019"]

[[op.ListObjectsV2.field]]
side = "output"
name = "CommonPrefixes"
quirks = ["q-flat-0019"]

[[op.ListObjectsV2.field]]
side = "output"
name = "EncodingType"
quirks = ["q-encoding-0015"]

[[op.ListObjectsV2.field]]
side = "output"
name = "ContinuationToken"
quirks = ["q-token-0021"]

[[op.ListObjectsV2.field]]
side = "output"
name = "NextContinuationToken"
quirks = ["q-token-0021"]

# =============================================================================================
# PutObject
# =============================================================================================
[op.PutObject]
precedence = 800
auth_action = "s3:PutObject"
error_codes = [
  "NoSuchBucket",
  "AccessDenied",
  "MissingContentLength",
  "EntityTooLarge",
  "IncompleteBody",
  "InvalidDigest",
  "BadDigest",
  "XAmzContentChecksumMismatch",
  "InvalidRequest",
  "InvalidArgument",
  "PreconditionFailed",
  "ConditionalRequestConflict",
]
quirk_refs = ["q-checksum-0006"]
# The ten per-algorithm checksum headers collapse into one packed ChecksumSpec field; carrying
# them separately would put ten Option<String> on the hot path and make "more than one checksum
# header" a merge instead of an error. See q-checksum-0006.
input_drop = [
  "ChecksumCRC32",
  "ChecksumCRC32C",
  "ChecksumCRC64NVME",
  "ChecksumMD5",
  "ChecksumSHA1",
  "ChecksumSHA256",
  "ChecksumSHA512",
  "ChecksumXXHASH128",
  "ChecksumXXHASH3",
  "ChecksumXXHASH64",
]
output_drop = [
  "ChecksumCRC32",
  "ChecksumCRC32C",
  "ChecksumCRC64NVME",
  "ChecksumMD5",
  "ChecksumSHA1",
  "ChecksumSHA256",
  "ChecksumSHA512",
  "ChecksumXXHASH128",
  "ChecksumXXHASH3",
  "ChecksumXXHASH64",
]
input_required = ["ContentLength"]
input_hot = ["ContentType"]
output_hot = ["ETag", "VersionId"]

[[op.PutObject.field]]
side = "input"
name = "ContentLength"
hot = true
missing_error = "MissingContentLength"
quirks = ["q-length-0007"]

[[op.PutObject.field]]
side = "input"
name = "ContentType"
default_string = "binary/octet-stream"
quirks = ["q-content-0008"]

[[op.PutObject.field]]
side = "input"
name = "Expires"
quirks = ["q-timestamp-0005"]

[[op.PutObject.field]]
side = "input"
name = "ChecksumAlgorithm"
quirks = ["q-checksum-0006"]

[[op.PutObject.field]]
side = "input"
name = "Metadata"
quirks = ["q-meta-0009"]

[[op.PutObject.field]]
side = "input"
name = "SSECustomerKey"
quirks = ["q-sse-0010"]

[[op.PutObject.field]]
side = "input"
name = "SSECustomerKeyMD5"
quirks = ["q-sse-0010"]

[[op.PutObject.field]]
side = "input"
name = "SSEKMSKeyId"
quirks = ["q-sse-0010"]

[[op.PutObject.field]]
side = "input"
name = "SSEKMSEncryptionContext"
quirks = ["q-sse-0010"]

[[op.PutObject.field]]
side = "input"
name = "ObjectLockRetainUntilDate"
quirks = ["q-timestamp-0011"]

[[op.PutObject.field]]
side = "input"
name = "ChecksumSpec"
synthesize = true
after = "ContentMD5"
binding = "PrefixHeaders"
wire_name = "x-amz-checksum-"
type = "ChecksumSpec"
hot = true
quirks = ["q-checksum-0006"]

[[op.PutObject.field]]
side = "output"
name = "ETag"
required = true
quirks = ["q-etag-0004"]

[[op.PutObject.field]]
side = "output"
name = "Expiration"
quirks = ["q-timestamp-0012"]

[[op.PutObject.field]]
side = "output"
name = "SSECustomerAlgorithm"
quirks = ["q-sse-0010"]

[[op.PutObject.field]]
side = "output"
name = "SSECustomerKeyMD5"
quirks = ["q-sse-0010"]

[[op.PutObject.field]]
side = "output"
name = "SSEKMSKeyId"
quirks = ["q-sse-0010"]

[[op.PutObject.field]]
side = "output"
name = "SSEKMSEncryptionContext"
quirks = ["q-sse-0010"]

[[op.PutObject.field]]
side = "output"
name = "ChecksumSpec"
synthesize = true
after = "ETag"
binding = "PrefixHeaders"
wire_name = "x-amz-checksum-"
type = "ChecksumSpec"
quirks = ["q-checksum-0006"]

# =============================================================================================
# Nested shapes
# =============================================================================================
[shape.Object]
required = ["Key", "LastModified", "ETag", "Size", "StorageClass"]
hot = ["Key", "LastModified", "ETag", "Size"]

[[shape.Object.field]]
name = "Key"
quirks = ["q-encoding-0015"]

[[shape.Object.field]]
name = "ETag"
quirks = ["q-etag-0020"]

[[shape.Object.field]]
name = "ChecksumAlgorithm"
quirks = ["q-flat-0019"]

[[shape.Object.field]]
name = "StorageClass"
quirks = ["q-storageclass-0022"]

[[shape.Object.field]]
name = "Owner"
omit_when = "RequestField"
omit_when_field = "FetchOwner"
omit_when_equals = "false"
quirks = ["q-owner-0017"]

[shape.CommonPrefix]
required = ["Prefix"]
hot = ["Prefix"]

[[shape.CommonPrefix.field]]
name = "Prefix"
quirks = ["q-encoding-0015"]

# AWS writes the identifier before the display name; the model declares them the other way round.
[shape.Owner]
element_order = ["ID", "DisplayName"]

# =============================================================================================
# Deferred operations
#
# Every operation in the model that is not in `include` must appear here with a reason. Codegen
# fails on an operation that is in neither list, so an upstream addition surfaces as a build
# failure that needs a human decision rather than as silence.
# =============================================================================================

[[deferred]]
reason = "P5 multipart upload family; the part/checksum interaction needs its own reviewed pass."
operations = [
  "AbortMultipartUpload",
  "CompleteMultipartUpload",
  "CreateMultipartUpload",
  "ListMultipartUploads",
  "ListParts",
  "UploadPart",
  "UploadPartCopy",
]

[[deferred]]
reason = "P5 core object family; GetObject and CopyObject drive the conditional and copy-source clusters."
operations = [
  "CopyObject",
  "DeleteObject",
  "DeleteObjects",
  "GetObject",
  "GetObjectAttributes",
  "GetObjectTorrent",
  "HeadObject",
  "RenameObject",
  "RestoreObject",
  "SelectObjectContent",
  "UpdateObjectEncryption",
]

[[deferred]]
reason = "P5 object tagging, ACL and object-lock family; grant parsing is a shared cluster of its own."
operations = [
  "DeleteObjectTagging",
  "GetObjectAcl",
  "GetObjectLegalHold",
  "GetObjectLockConfiguration",
  "GetObjectRetention",
  "GetObjectTagging",
  "PutObjectAcl",
  "PutObjectLegalHold",
  "PutObjectLockConfiguration",
  "PutObjectRetention",
  "PutObjectTagging",
]

[[deferred]]
reason = "P5 listing family; pagination, delimiter rollup and encoding-type are shared with ListObjectsV2 and land together."
operations = [
  "ListBuckets",
  "ListDirectoryBuckets",
  "ListObjectVersions",
  "ListObjects",
]

[[deferred]]
reason = "P5 bucket lifecycle operations; CreateBucket carries the location-constraint request body."
operations = [
  "CreateBucket",
  "DeleteBucket",
  "HeadBucket",
]

[[deferred]]
reason = "P5 bucket subresource configuration family; one Get/Put/Delete triple per subresource, all sharing the not_configured 404 rule."
operations = [
  "DeleteBucketAnalyticsConfiguration",
  "DeleteBucketCors",
  "DeleteBucketEncryption",
  "DeleteBucketIntelligentTieringConfiguration",
  "DeleteBucketInventoryConfiguration",
  "DeleteBucketLifecycle",
  "DeleteBucketMetricsConfiguration",
  "DeleteBucketOwnershipControls",
  "DeleteBucketReplication",
  "DeleteBucketTagging",
  "DeleteBucketWebsite",
  "GetBucketAccelerateConfiguration",
  "GetBucketAcl",
  "GetBucketAnalyticsConfiguration",
  "GetBucketCors",
  "GetBucketEncryption",
  "GetBucketIntelligentTieringConfiguration",
  "GetBucketInventoryConfiguration",
  "GetBucketLifecycleConfiguration",
  "GetBucketLogging",
  "GetBucketMetricsConfiguration",
  "GetBucketNotificationConfiguration",
  "GetBucketOwnershipControls",
  "GetBucketReplication",
  "GetBucketRequestPayment",
  "GetBucketTagging",
  "GetBucketVersioning",
  "GetBucketWebsite",
  "ListBucketAnalyticsConfigurations",
  "ListBucketIntelligentTieringConfigurations",
  "ListBucketInventoryConfigurations",
  "ListBucketMetricsConfigurations",
  "PutBucketAccelerateConfiguration",
  "PutBucketAcl",
  "PutBucketAnalyticsConfiguration",
  "PutBucketCors",
  "PutBucketEncryption",
  "PutBucketIntelligentTieringConfiguration",
  "PutBucketInventoryConfiguration",
  "PutBucketLifecycleConfiguration",
  "PutBucketLogging",
  "PutBucketMetricsConfiguration",
  "PutBucketNotificationConfiguration",
  "PutBucketOwnershipControls",
  "PutBucketReplication",
  "PutBucketRequestPayment",
  "PutBucketTagging",
  "PutBucketVersioning",
  "PutBucketWebsite",
]

[[deferred]]
reason = "P5 bucket policy and public-access family; every one of these is an authorization surface and reviewed as a group."
operations = [
  "DeleteBucketPolicy",
  "DeletePublicAccessBlock",
  "GetBucketAbac",
  "GetBucketPolicy",
  "GetBucketPolicyStatus",
  "GetPublicAccessBlock",
  "PutBucketAbac",
  "PutBucketPolicy",
  "PutPublicAccessBlock",
]

[[deferred]]
reason = "Out of scope for the gateway: S3 Express One Zone session credentials."
operations = [
  "CreateSession",
]

[[deferred]]
reason = "Out of scope for the gateway: S3 Tables and bucket metadata table configuration, a separate AWS surface with its own control plane."
operations = [
  "CreateBucketMetadataConfiguration",
  "CreateBucketMetadataTableConfiguration",
  "DeleteBucketMetadataConfiguration",
  "DeleteBucketMetadataTableConfiguration",
  "GetBucketMetadataConfiguration",
  "GetBucketMetadataTableConfiguration",
  "UpdateBucketMetadataAnnotationTableConfiguration",
  "UpdateBucketMetadataInventoryTableConfiguration",
  "UpdateBucketMetadataJournalTableConfiguration",
]

[[deferred]]
reason = "Out of scope for the gateway: object annotations, an AWS-only metadata surface with no storage-backend equivalent."
operations = [
  "DeleteObjectAnnotation",
  "GetObjectAnnotation",
  "ListObjectAnnotations",
  "PutObjectAnnotation",
]

[[deferred]]
reason = "Out of scope for the gateway: S3 Object Lambda, which requires the Object Lambda access point host class."
operations = [
  "WriteGetObjectResponse",
]
