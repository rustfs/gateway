# =============================================================================================
# route.toml — the one hand-written authority for cross-precedence route shadowing.
#
# The ordered route table is first-match: lower precedence is tried first. A request that
# satisfies two rows at different precedences is answered by the earlier one and the later row is
# ignored. That is legal and necessary — it is why the disjointness model was abandoned — but it
# is never allowed to be an accident of source order. Every such pair is declared here with a
# reason and evidence, and a pair that overlaps without a declaration fails the table build
# (`UndeclaredShadowing`).
#
# `cargo xtask codegen` lowers this file into `generated/route_shadowing.rs`, which
# `rustfs-gateway-core` includes. Nothing else declares a shadowing pair: a hand-written
# `ShadowingDecl` literal in Rust is refused by `scripts/check_route_shadowing_authority.sh`,
# because two sources would be two sets of reasons that can drift apart.
#
# Same-precedence overlap is not declarable at all. It is always a build failure, and the fix is
# to give the two rows different precedences here and in `ops/<family>.toml`.
#
# Precedence itself is not set here. It is `precedence` on `[op.<Operation>]` in
# `model/overlays/ops/<family>.toml`, and the rule it follows is that the narrower row is tried
# first: a subresource read before a listing, a listing that pins a key before the one that pins
# none, and the fallback last. The resolved order, as one text, is
# `crates/core/tests/golden/route-table.txt` — read that to see what the numbers came to, rather
# than reconstructing it from the family files.
#
# ---------------------------------------------------------------------------------------------
# Grammar
#
#   [evidence.<id>]        url = "https://…"   summary = "one sentence, written here"
#   [reason.<id>]          text = "the paragraph shared by several pairs"
#   [[shadowing]]          winner, shadowed, exactly one of reason / reason_ref, evidence
#
# `evidence` is a list of `[evidence.<id>]` keys, never a URL written in place: one operation has
# one reference and one self-written sentence, and a second spelling of it is a second fact to
# keep in step. Never paste upstream prose — the summary is a sentence this project wrote.
#
# `reason` carries the prose inline and is for a pair whose reasoning is its own. `reason_ref`
# names a `[reason.<id>]` and is for reasoning a whole band shares. Exactly one of the two, and
# two entries may not carry the same inline `reason` — a repeated paragraph belongs in
# `[reason.<id>]`, where changing it changes every pair that meant it.
#
# Everything here is refused by the loader when it is wrong rather than ignored: an unknown
# evidence id, an unused `[evidence]` or `[reason]` entry, a missing or empty field, a repeated
# `winner`/`shadowed` pair, a pair naming an operation outside `include`, and a `winner` equal to
# its own `shadowed`.
# =============================================================================================

# ------------------------------------------------------------------ shared reasons
[reason.two-subresource-keys]
text = "Two bucket subresource keys in one request ask two questions at once. AWS documents no such combination, so the answer is fixed by precedence rather than left to source order: the earlier row answers and the later reading is ignored rather than merged into it."

[reason.subresource-over-listing]
text = "A subresource key and a listing key in one request name a configuration document and a page of the bucket's contents at the same time. The subresource is the narrower question and is tried first; the listing is ignored rather than merged into the answer."

[reason.subresource-over-fallback]
text = "ListObjects is what a GET on a bucket means when no other row claimed it, so its selector pins no query key and every subresource read satisfies it too. That is not a conflict but the design, and it is the whole reason this band sits at 200: a row behind the fallback would hand every configuration read back to the key listing, which is the defect the band exists to retire."


