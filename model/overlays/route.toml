# -------------------------------------------------------------- shadowing pairs
[[shadowing]]
winner   = "GetBucketLocation"
shadowed = "ListObjectsV2"
reason   = "A request carrying both ?location and ?list-type=2 asks two questions at once. AWS documents neither combination, so the answer is fixed here rather than left to source order: the subresource band (300) is tried before the listing band (600), so ?location wins and the listing is ignored."
evidence = ["get-bucket-location", "list-objects-v2"]

[[shadowing]]
winner   = "GetBucketLocation"
shadowed = "ListObjectVersions"
reason   = "Same shape as the pair above with the version listing in place of the key listing: only a client sending ?location and ?versions together reaches it, AWS documents no such combination, and the subresource band is tried first."
evidence = ["get-bucket-location", "list-object-versions"]

[[shadowing]]
winner   = "GetBucketLocation"
shadowed = "ListObjects"
reason   = "ListObjects pins no query key, so every ?location request also satisfies it. That is not a conflict but the design: the subresource is the specific reading and the key listing is the fallback, which is why the fallback sits at the end of the band. Reversing the two would make ?location unreachable."
evidence = ["get-bucket-location", "list-objects"]

[[shadowing]]
winner   = "GetBucketLocation"
shadowed = "ListMultipartUploads"
reason   = "The same both-keys-at-once shape as the three pairs above: ?location and ?uploads name two different subresources of one bucket. ?location is the narrower question and is tried first (300 before 460); the upload listing is ignored rather than merged into the answer."
evidence = ["get-bucket-location", "list-multipart-uploads"]

[[shadowing]]
winner   = "ListMultipartUploads"
shadowed = "ListObjectsV2"
reason   = "?uploads and ?list-type=2 together ask for the in-progress uploads and for a page of committed keys at the same time. The upload listing is the more specific reading and is tried first; the key listing is ignored."
evidence = ["list-multipart-uploads", "list-objects-v2"]

[[shadowing]]
winner   = "ListMultipartUploads"
shadowed = "ListObjectVersions"
reason   = "?uploads and ?versions together name two different listings of the same bucket. The upload listing is tried first for the same reason as the pair above."
evidence = ["list-multipart-uploads", "list-object-versions"]

[[shadowing]]
winner   = "ListMultipartUploads"
shadowed = "ListObjects"
reason   = "ListObjects pins no query key, so a ?uploads request satisfies it too. The upload listing is the specific reading and wins; the fallback stays last in the band."
evidence = ["list-multipart-uploads", "list-objects"]

[[shadowing]]
winner   = "ListObjectsV2"
shadowed = "ListObjectVersions"
reason   = "A request carrying list-type=2 and ?versions asks for a page of current keys and for every version of them at once. The two are different operations with different response roots, so one has to win: list-type=2 is an explicit value rather than a bare subresource key, and it is tried first."
evidence = ["list-objects-v2", "list-object-versions"]

[[shadowing]]
winner   = "ListObjectsV2"
shadowed = "ListObjects"
reason   = "This is the pair the version discriminator exists for: list-type=2 selects the second listing and its absence selects the first. Because the first pins no query key, the selection is entirely a matter of which is tried first, and getting it backwards would make the second version unreachable."
evidence = ["list-objects-v2", "list-objects"]

[[shadowing]]
winner   = "ListObjectVersions"
shadowed = "ListObjects"
reason   = "?versions selects the version listing, and its absence leaves the key listing. Same fallback relationship as the pair above, with the subresource in place of the version discriminator."
evidence = ["list-object-versions", "list-objects"]

[[shadowing]]
winner   = "GetBucketLocation"
shadowed = "GetBucketTagging"
reason   = "?location and ?tagging name two subresources of one bucket, and a request sending both asks two questions at once. AWS documents no such combination, so the answer is fixed here rather than left to source order: 300 is tried before 340, and the tagging reading is ignored rather than merged into the answer."
evidence = ["get-bucket-location", "get-bucket-tagging"]

[[shadowing]]
