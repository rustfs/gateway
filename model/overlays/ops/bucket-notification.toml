# Family: the event-notification configuration. GetBucketNotificationConfiguration,
# PutBucketNotificationConfiguration.
#
# Configuration codec only. Nothing here delivers an event: matching an object write against a
# rule, publishing to the topic, queue or function, and retrying a failed delivery are the
# notification engine's. Whether the destination even exists is what the caller suppresses with
# `x-amz-skip-destination-validation`, and this family never checks it either way.
#
# Three facts distinguish it inside the 200-249 band.
#
# Every list is **flattened**. `<TopicConfiguration>`, `<QueueConfiguration>` and
# `<CloudFunctionConfiguration>` repeat directly under the root, `<Event>` repeats directly inside
# each of them, and `<FilterRule>` repeats directly inside `<S3Key>`. That is the exact opposite of
# the website family's wrapped `<RoutingRules>`, one file over, and both shapes parse — a wrapped
# rendering here is a document every SDK reads as "no notifications configured".
#
# The wire names are not the member names, on the three that matter: `LambdaFunctionConfigurations`
# is `<CloudFunctionConfiguration>`, `LambdaFunctionArn` is `<CloudFunction>`, `QueueArn` is
# `<Queue>`, `TopicArn` is `<Topic>` and `NotificationConfigurationFilter.Key` is `<S3Key>`. All
# five come from the pinned model's own `xmlName`; none is stated here, and the reason they are
# written down at all is that a reader looking for `<LambdaFunctionConfiguration>` on the wire will
# not find it.
#
# The write has **no integrity requirement**. The v1 notification write AWS retired did; the v2
# operation the model declares carries no `content-md5` member and no request checksum
# requirement. It and `PutBucketAccelerateConfiguration` are the two writes in the band that
# accept a body with no integrity claim, and the difference is the model's.
#
# The routing reason is the band's: `GET /{Bucket}?notification` was claimed by `ListObjects` and
# answered with a page of keys — one of the nine debt-register lines this family retires — while
# the write was unroutable.

include = ["GetBucketNotificationConfiguration", "PutBucketNotificationConfiguration"]

# =============================================================================================
# GetBucketNotificationConfiguration — 210
#
# The unconfigured answer is 200 with an empty `<NotificationConfiguration/>`, so `not_configured`
# is unset. A bucket that delivers no events is not a bucket that is missing something.
# =============================================================================================
[op.GetBucketNotificationConfiguration]
precedence = 210
auth_action = "s3:GetBucketNotification"
# The response element order. It belongs to the *operation* and not to the shape: this read's
# output members are operation-level, so the shape is only ever a request payload — it gets a
# reader, a reader does not consult element order, and a `[shape]` declaration here would be a
# statement no test could falsify.
element_order = [
  "TopicConfigurations",
  "QueueConfigurations",
  "LambdaFunctionConfigurations",
  "EventBridgeConfiguration",
]
# A hundred configurations, each with an ARN, an id, an event list and a two-rule key filter.
# 256 KiB is well past a maximal document and bounds the XML surface.
response_max_bytes = 262144
error_codes = ["NoSuchBucket", "AccessDenied"]
url_encoded_fields = []
input_hot = []
output_hot = ["TopicConfigurations", "QueueConfigurations", "LambdaFunctionConfigurations"]
quirk_refs = ["q-ntf-0001", "q-ntf-0002"]

# =============================================================================================
# PutBucketNotificationConfiguration — 211
#
# Replaces the whole document, and an empty one is the documented spelling of "deliver nothing" —
# the only spelling, because the model declares no delete for this subresource.
# =============================================================================================
[op.PutBucketNotificationConfiguration]
precedence = 211
auth_action = "s3:PutBucketNotification"
# The request ceiling matches the read's: a hundred maximal configurations.
request_max_bytes = 262144
error_codes = ["NoSuchBucket", "AccessDenied", "MalformedXML", "InvalidArgument"]
url_encoded_fields = []
input_hot = ["NotificationConfiguration"]
output_hot = []
quirk_refs = ["q-ntf-0002", "q-ntf-0003", "q-ntf-0004", "q-ntf-0005"]

# =============================================================================================
# Nested shapes owned by this family
# =============================================================================================

# Nothing in this document is required: the empty one is legal and means "deliver nothing".
# The response order is stated on the read above, where it is observed.
[shape.NotificationConfiguration]
hot = ["TopicConfigurations", "QueueConfigurations", "LambdaFunctionConfigurations"]
