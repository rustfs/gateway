# Family: object tagging, ACL and object lock.
#
# Nothing is generated yet. Grant parsing and canonicalization is a shared cluster of its own,
# and the retention and legal-hold subresources share its request shape.

[[deferred]]
reason = "P5 object tagging, ACL and object-lock family; grant parsing is a shared cluster of its own."
operations = [
  "DeleteObjectTagging",
  "GetObjectAcl",
  "GetObjectLegalHold",
  "GetObjectLockConfiguration",
  "GetObjectRetention",
  "GetObjectTagging",
  "PutObjectAcl",
  "PutObjectLegalHold",
  "PutObjectLockConfiguration",
  "PutObjectRetention",
  "PutObjectTagging",
]
