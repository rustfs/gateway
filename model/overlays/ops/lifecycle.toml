# Family: bucket lifecycle (ILM) configuration. GetBucketLifecycleConfiguration,
# PutBucketLifecycleConfiguration, DeleteBucketLifecycle.
#
# Configuration codec only. Nothing here evaluates a rule: expiring an object, transitioning a
# storage class or aborting a stale multipart upload is the storage backend's scanner, and the
# gateway's whole contribution is that the document the scanner reads is the document the client
# wrote. That is also why the semantic validation lives in `ops/shared/lifecycle.rs` and stays
# deliberately narrow — a configuration parsed more strictly by the next release than by the one
# that stored it silently turns lifecycle rules off, and the first symptom is objects that stop
# expiring.
#
# The operation names are the model's, asymmetry included: the read and the write are the
# *Configuration spellings introduced with the 2014 API revision, while the delete kept the 2012
# name `DeleteBucketLifecycle` — there is no `DeleteBucketLifecycleConfiguration` in the pinned
# model, and the 2012 `GetBucketLifecycle`/`PutBucketLifecycle` pair does not exist in it either,
# so this triple is the whole family.
#
# The routing reason is the tagging and CORS bands' one more time: a deferred operation
# contributes no route row, so `GET /{Bucket}?lifecycle` was claimed by `ListObjects` — a
# lifecycle document request answered with a key listing (the
# `GetBucketLifecycleConfiguration -> ListObjects` debt-register line this family retires) — while
# the PUT and DELETE halves were unroutable.

include = ["DeleteBucketLifecycle", "GetBucketLifecycleConfiguration", "PutBucketLifecycleConfiguration"]

# =============================================================================================
# The `?lifecycle` band: 370 (GET), 380 (PUT), 390 (DELETE)
#
# Directly after the `?cors` band at 310/320/330, leaving room for the subresource triples still
# deferred. The GET row overlaps `?location` (300), `?cors` (310) and the four listings
# (460/600/610/700); the PUT and DELETE rows overlap only their `?cors` neighbours. Every pair is
# declared in `route/shadowing.rs`.
# =============================================================================================

# =============================================================================================
# GetBucketLifecycleConfiguration
#
# The stored lifecycle document, answered as `<LifecycleConfiguration>` with the rules flattened:
# `<Rule>` elements repeat directly under the root with no wrapper. The response root comes from
# the model's own xmlName; only the error surface and the byte ceiling are stated here.
# =============================================================================================
[op.GetBucketLifecycleConfiguration]
precedence = 370
auth_action = "s3:GetLifecycleConfiguration"
# AWS caps the document at 1,000 rules; a rule with a many-tag <And> filter runs to a kilobyte or
# so of XML, which puts the largest legitimate document comfortably under a mebibyte. The same
# ceiling bounds the write below.
response_max_bytes = 1048576
# The unconfigured read is the family's defining error: a bucket that never had a lifecycle
# document answers the operation-specific 404, not a generic not-found and not an empty 200.
not_configured = "NoSuchLifecycleConfiguration"
error_codes = ["NoSuchBucket", "AccessDenied", "NoSuchLifecycleConfiguration"]
element_order = ["Rules"]
url_encoded_fields = []
input_hot = []
output_hot = ["Rules"]
quirk_refs = ["q-lc-0001", "q-lc-0003"]

# =============================================================================================
# PutBucketLifecycleConfiguration
#
# Replaces the whole document; there is no partial update. The request root is stated here
# because the wire disagrees with the model: the payload shape is named
# `BucketLifecycleConfiguration`, but every client sends `<LifecycleConfiguration>` — a decoder
# keyed on the shape name would refuse every real document ever written.
# =============================================================================================
[op.PutBucketLifecycleConfiguration]
precedence = 380
auth_action = "s3:PutLifecycleConfiguration"
request_root = "LifecycleConfiguration"
# The pinned model carries `aws.protocols#httpChecksum` with `requestChecksumRequired`, which is a
# different trait from the `smithy.api#httpChecksumRequired` lowering reads, so the requirement is
# stated here rather than silently lost — exactly as PutBucketCors states it. A lifecycle write
# with neither Content-MD5 nor an x-amz-checksum-* header is refused before it is parsed.
http_checksum_required = true
# The 1,000-rule ceiling again, from the read side.
request_max_bytes = 1048576
error_codes = ["NoSuchBucket", "AccessDenied", "MalformedXML", "InvalidRequest", "InvalidArgument", "BadDigest"]
url_encoded_fields = []
input_hot = ["LifecycleConfiguration"]
output_hot = []
quirk_refs = [
  "q-lc-0002",
  "q-lc-0005",
  "q-lc-0006",
  "q-lc-0007",
  "q-lc-0008",
  "q-lc-0009",
  "q-lc-0010",
  "q-lc-0011",
  "q-lc-0012",
  "q-lc-0013",
  "q-lc-0014",
]

# =============================================================================================
# DeleteBucketLifecycle
#
# Removes the document. The model already answers 204, and the 204 is unconditional: deleting the
# lifecycle configuration of a bucket that has none is a success, exactly as DeleteBucketCors's
# is. The 2012 operation name is the model's own — see the family note above.
# =============================================================================================
[op.DeleteBucketLifecycle]
precedence = 390
auth_action = "s3:PutLifecycleConfiguration"
error_codes = ["NoSuchBucket", "AccessDenied"]
url_encoded_fields = []
input_hot = []
output_hot = []
quirk_refs = ["q-lc-0004"]
