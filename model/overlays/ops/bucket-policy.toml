# Family: bucket policy and public access.
#
# Nothing is generated yet. Every member is an authorization surface, so the family is reviewed
# as a group rather than one operation at a time.

[[deferred]]
reason = "P5 bucket policy and public-access family; every one of these is an authorization surface and reviewed as a group."
operations = [
  "DeleteBucketPolicy",
  "DeletePublicAccessBlock",
  "GetBucketAbac",
  "GetBucketPolicy",
  "GetBucketPolicyStatus",
  "GetPublicAccessBlock",
  "PutBucketAbac",
  "PutBucketPolicy",
  "PutPublicAccessBlock",
]
