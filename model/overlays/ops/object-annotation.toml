# Family: the object-annotation control surface.
#
# DeleteObjectAnnotation is admitted before the rest of the family because deferring its DELETE
# selector lets DeleteObject claim the request and remove the object itself. The operation has no
# request body, so its model-required input is representable without weakening a DTO field.

include = ["DeleteObjectAnnotation"]

[op.DeleteObjectAnnotation]
precedence = 590
auth_action = "s3:DeleteObjectAnnotation"
error_codes = ["NoSuchBucket", "NoSuchKey"]
url_encoded_fields = []
input_hot = ["Key", "AnnotationName", "VersionId"]
output_hot = ["ObjectVersionId"]
