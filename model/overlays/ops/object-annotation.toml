# Family: the object-annotation control surface.
#
# These operations are admitted before the rest of the family because deferring their selectors
# lets DeleteObject or GetObject claim the requests. Delete has no request body, Get has only a
# response stream, and List has a bounded result page, so every model-required input remains
# representable without weakening a DTO field.

include = ["DeleteObjectAnnotation", "GetObjectAnnotation", "ListObjectAnnotations", "PutObjectAnnotation"]

[op.DeleteObjectAnnotation]
precedence = 590
auth_action = "s3:DeleteObjectAnnotation"
error_codes = ["NoSuchBucket", "NoSuchKey"]
url_encoded_fields = []
input_hot = ["Key", "AnnotationName", "VersionId"]
output_hot = ["ObjectVersionId"]

[op.GetObjectAnnotation]
precedence = 591
query_present = ["annotationName"]
query_absent = ["acl", "attributes", "legal-hold", "retention", "tagging", "uploadId"]
auth_action = "s3:GetObjectAnnotation"
error_codes = ["NoSuchAnnotation", "NoSuchBucket", "NoSuchKey"]
url_encoded_fields = []
input_hot = ["Key", "AnnotationName", "VersionId"]
output_hot = ["ETag", "ContentLength", "ObjectVersionId"]

[op.ListObjectAnnotations]
precedence = 592
query_absent = ["acl", "annotationName", "attributes", "legal-hold", "retention", "tagging", "uploadId"]
auth_action = "s3:ListObjectAnnotations"
error_codes = ["InvalidPrefix", "NoSuchBucket", "NoSuchKey"]
url_encoded_fields = []
input_hot = ["Key", "AnnotationPrefix", "MaxAnnotationResults", "ContinuationToken", "VersionId"]
output_hot = ["Annotations", "AnnotationCount", "NextContinuationToken", "ObjectVersionId"]

[op.PutObjectAnnotation]
precedence = 593
query_absent = ["acl", "attributes", "legal-hold", "renameObject", "retention", "tagging", "uploadId"]
header_absent = ["x-amz-copy-source"]
auth_action = "s3:PutObjectAnnotation"
error_codes = ["NoSuchBucket", "NoSuchKey"]
url_encoded_fields = []
input_hot = ["Key", "AnnotationName", "AnnotationPayload", "VersionId"]
output_hot = ["ETag", "ObjectVersionId"]
