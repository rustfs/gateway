# Family: bucket CORS configuration. GetBucketCors, PutBucketCors, DeleteBucketCors.
#
# Configuration codec only. The runtime half — OPTIONS preflight, `Access-Control-*` response
# header injection, `Vary: Origin` — is a separately designed pre-auth stage (P6 scope): an
# unauthenticated OPTIONS that reads per-bucket state from inside the pipeline is an
# unauthenticated storage amplifier and a private-bucket enumeration oracle, which is why nothing
# here touches routing beyond the three subresource rows.
#
# The routing reason is the same as the tagging band's: a deferred operation contributes no route
# row, and `GET /{Bucket}?cors` was therefore claimed by `ListObjects` — a CORS document request
# answered with a key listing (the `GetBucketCors -> ListObjects` debt-register line this family
# retires). `PUT` and `DELETE` on a bucket have no fallback row at all, so those two requests were
# unroutable rather than mis-served.
#
# The selectors are derived from each operation's `@http` uri, which pins the literal `?cors`
# query; precedence is the only thing this overlay decides. The band sits directly after
# GetBucketLocation (300) and well before the listing bands (460/600/700), so a request naming
# `?cors` together with a listing key is read as the narrower subresource question.

include = ["DeleteBucketCors", "GetBucketCors", "PutBucketCors"]

# =============================================================================================
# The `?cors` band: 310 (GET), 320 (PUT), 330 (DELETE)
#
# Only the GET row overlaps anything: `?location` at 300 keeps winning the undocumented
# both-keys request, and the three listings (460, 600, 610) plus the fallback at 700 lose to the
# subresource. The PUT and DELETE rows share their method with no other bucket-level row.
# =============================================================================================

# =============================================================================================
# GetBucketCors
#
# The stored CORS document, answered as `<CORSConfiguration>` with the rules flattened —
# `<CORSRule>` elements repeat directly under the root, with no wrapper. The output structure has
# no xmlName in the pinned model, so the root is stated here: the generic output wrapper would be
# a document no SDK can read.
# =============================================================================================
[op.GetBucketCors]
precedence = 310
auth_action = "s3:GetBucketCORS"
response_root = "CORSConfiguration"
# AWS caps the stored document at 64 KiB on the way in (see PutBucketCors below), so the same
# ceiling bounds it on the way out.
response_max_bytes = 65536
# The unconfigured read is this family's defining error: a bucket that never had a CORS document
# answers the operation-specific 404, not a generic not-found and not an empty 200.
not_configured = "NoSuchCORSConfiguration"
error_codes = ["NoSuchBucket", "AccessDenied", "NoSuchCORSConfiguration"]
element_order = ["CORSRules"]
url_encoded_fields = []
input_hot = []
output_hot = ["CORSRules"]
quirk_refs = ["q-cors-0001", "q-cors-0002"]

# =============================================================================================
# PutBucketCors
#
# Replaces the whole document; there is no partial update. The request body is the
# `CORSConfiguration` structure as the payload, so the request root comes from the model's
# xmlName and needs no overlay.
# =============================================================================================
[op.PutBucketCors]
precedence = 320
auth_action = "s3:PutBucketCORS"
# The pinned model carries `aws.protocols#httpChecksum` with `requestChecksumRequired`, which is a
# different trait from the `smithy.api#httpChecksumRequired` lowering reads, so the requirement is
# stated here rather than silently lost — exactly as DeleteObjects and PutObjectTagging state it.
# A CORS write with neither Content-MD5 nor an x-amz-checksum-* header is refused before the
# handler runs.
http_checksum_required = true
# AWS documents the configuration document as at most 64 KB, which also closes the XML-bomb
# surface an unbounded buffered body would leave open.
request_max_bytes = 65536
error_codes = ["NoSuchBucket", "AccessDenied", "MalformedXML", "InvalidRequest", "InvalidArgument", "BadDigest"]
url_encoded_fields = []
input_hot = ["CORSConfiguration"]
output_hot = []
quirk_refs = ["q-cors-0003", "q-cors-0004", "q-cors-0005", "q-cors-0007", "q-cors-0008"]

# =============================================================================================
# DeleteBucketCors
#
# Removes the document. The model already answers 204, and the 204 is unconditional: deleting the
# CORS configuration of a bucket that has none is a success, exactly as DeleteObject's is.
# =============================================================================================
[op.DeleteBucketCors]
precedence = 330
auth_action = "s3:PutBucketCORS"
error_codes = ["NoSuchBucket", "AccessDenied"]
url_encoded_fields = []
input_hot = []
output_hot = []
quirk_refs = ["q-cors-0006"]

# =============================================================================================
# Nested shapes owned by this family
# =============================================================================================

# The payload of a CORS write and the body of a CORS read are the same structure. The model
# requires CORSRules, so `<CORSConfiguration/>` with no rule is refused as MalformedXML rather
# than read as "clear the configuration" — DeleteBucketCors is the spelling for that.
[shape.CORSConfiguration]
required = ["CORSRules"]
hot = ["CORSRules"]
element_order = ["CORSRules"]

# One rule. AllowedMethods and AllowedOrigins are required by the model; the other four members
# are optional. The element order is the model's declaration order, fixed here so the golden
# files pin one rendering. The four list members are all flattened with singular member names —
# `<AllowedMethod>` repeats, there is no `<AllowedMethods>` wrapper — which is the model's own
# xmlName + flattened declaration, recorded as a quirk because writing them wrapped is the
# classic defect that makes every SDK read zero rules.
[shape.CORSRule]
required = ["AllowedMethods", "AllowedOrigins"]
hot = ["AllowedMethods", "AllowedOrigins"]
element_order = ["ID", "AllowedHeaders", "AllowedMethods", "AllowedOrigins", "ExposeHeaders", "MaxAgeSeconds"]
