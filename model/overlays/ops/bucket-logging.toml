# Family: the server access-logging configuration. GetBucketLogging, PutBucketLogging.
#
# Configuration codec only. Nothing here writes a log line, chooses a log key or delivers a log
# object; the gateway's contribution is that the destination the logger reads is the destination
# the client wrote.
#
# Two facts distinguish it inside the 200-249 band.
#
# There is **no delete**. The model declares none, and the documented way to stop logging is a
# write carrying an empty `<BucketLoggingStatus/>`. That makes the empty document meaningful here
# in a way it is not for, say, the website family — refusing it would leave no way to turn logging
# off at all.
#
# `<TargetGrants>` is a **wrapped** list whose entry element is `<Grant>`, not `<TargetGrant>` —
# the wire name comes from the pinned model. Its contents are the ACL family's `Grantee` and
# `Permission` shapes reached through this document, so the two families share generated types;
# no grant grammar of this family's invention is applied to them.
#
# The routing reason is the band's: `GET /{Bucket}?logging` was claimed by `ListObjects` and
# answered with a page of keys — one of the nine debt-register lines this family retires — while
# the write was unroutable.

include = ["GetBucketLogging", "PutBucketLogging"]

# =============================================================================================
# GetBucketLogging — 205
#
# The unconfigured answer is 200 with an empty `<BucketLoggingStatus/>`, so `not_configured` is
# unset: a bucket that is not logging is not a bucket that is missing something.
# =============================================================================================
[op.GetBucketLogging]
precedence = 205
auth_action = "s3:GetBucketLogging"
# A target bucket, a prefix, a key format and a hundred grants. 64 KiB is well past a maximal
# document and bounds the XML surface.
response_max_bytes = 65536
error_codes = ["NoSuchBucket", "AccessDenied"]
url_encoded_fields = []
input_hot = []
output_hot = ["LoggingEnabled"]
quirk_refs = ["q-log-0001", "q-log-0003"]

# =============================================================================================
# PutBucketLogging — 206
# =============================================================================================
[op.PutBucketLogging]
precedence = 206
auth_action = "s3:PutBucketLogging"
# The pinned model carries `content-md5` and `aws.protocols#httpChecksum` with
# `requestChecksumRequired`, a different trait spelling from the one lowering reads, so the
# requirement is stated here rather than silently lost.
http_checksum_required = true
request_max_bytes = 65536
error_codes = ["NoSuchBucket", "AccessDenied", "MalformedXML", "InvalidArgument", "BadDigest"]
url_encoded_fields = []
input_hot = ["BucketLoggingStatus"]
output_hot = []
quirk_refs = ["q-log-0002", "q-log-0003", "q-log-0004"]

# =============================================================================================
# Nested shapes owned by this family
# =============================================================================================

# One optional member, and its absence is the documented "stop logging".
[shape.BucketLoggingStatus]
element_order = ["LoggingEnabled"]

# The documented element order. `TargetBucket` and `TargetPrefix` are required by the model, so a
# `<LoggingEnabled>` missing either is refused by the decoder before
# `ops/shared/bucket_config.rs` gets to ask whether the target names anything.
[shape.LoggingEnabled]
element_order = ["TargetBucket", "TargetPrefix", "TargetGrants", "TargetObjectKeyFormat"]
