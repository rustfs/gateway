# Family: bucket subresource configuration.
#
# One Get/Put/Delete triple per subresource, every one of them sharing the "unconfigured
# subresource answers a per-operation 404 code" rule. The CORS triple is the first of them to
# land and lives in its own family file, `ops/cors.toml`; the rest stay deferred here.

[[deferred]]
reason = "P5 bucket subresource configuration family; one Get/Put/Delete triple per subresource, all sharing the not_configured 404 rule."
