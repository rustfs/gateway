# Family: bucket subresource configuration.
#
# One Get/Put/Delete triple per subresource, every one of them sharing the "unconfigured
# subresource answers a per-operation 404 code" rule. The CORS triple landed first and lives in
# its own family file, `ops/cors.toml`, at 310/320/330; the lifecycle triple followed it into
# `ops/lifecycle.toml` at 370/380/390; the tagging triple is `include`d here as
# the family's calibration sample, because it collects every generic trap of the configuration
# operations in one place: the wrapped `<TagSet><Tag>` collection, the per-operation
# `not_configured` 404, the `httpChecksumRequired` write, and the unconditional `204` delete.
# The nine configurations of the 200-249 band followed, in `ops/bucket-switches.toml`,
# `ops/bucket-logging.toml`, `ops/bucket-notification.toml`, `ops/bucket-website.toml` and
# `ops/bucket-policy.toml`. What is left deferred below is deliberately *not* more of the same
# shape: see the reason on the block.
#
# The three rows land in the bucket subresource band, after `?location` at 300 and the `?cors`
# band at 310-330: 340 (GET), 350 (PUT), 360 (DELETE) — 370-390 are spoken for by the lifecycle
# family. Only the GET has same-method neighbours to order against: `?tagging` sits ahead of the
# listings (600-700) for the same reason `?location` and `?cors` do, and behind both of those
# only because a request naming two subresources needs *some* fixed answer and the band is
# ordered by arrival. `PUT /b?tagging` and `DELETE /b?tagging` order only against their `?cors`
# method twins, in the same arrival order.

include = [
  "DeleteBucketTagging",
  "GetBucketIntelligentTieringConfiguration",
  "GetBucketTagging",
  "ListBucketIntelligentTieringConfigurations",
  "PutBucketTagging",
]

# =============================================================================================
# GetBucketTagging
#
# The tag set of one bucket. The wire shape is the object read's — the output carries
# `xmlName = "Tagging"` and a wrapped `TagSet` list — but the unconfigured answer is not:
# a bucket that never had a tag set answers `404 NoSuchTagSet`, where the object read answers
# `200` with an empty set. `not_configured` is the declaration a client's branch depends on;
# a generic not-found here would read as "no such bucket".
# =============================================================================================
[op.GetBucketTagging]
precedence = 340
auth_action = "s3:GetBucketTagging"
# Fifty pairs of a 128-character key and a 256-character value, each character up to four UTF-8
# bytes, plus markup: an order of magnitude under 256 KiB, which still bounds the XML surface.
response_max_bytes = 262144
error_codes = ["NoSuchBucket", "NoSuchTagSet", "AccessDenied", "InvalidArgument"]
not_configured = "NoSuchTagSet"
element_order = ["TagSet"]
url_encoded_fields = []
output_hot = ["TagSet"]
quirk_refs = ["q-tag-wrapped-0088", "q-tag-bucket-unconfigured-0089"]

# =============================================================================================
# PutBucketTagging
#
# Replaces the whole tag set; there is no partial update. `TagSet` is a required member, so
# the empty document is refused by the decoder with `MalformedXML` — the delete is the
# clearing path.
# =============================================================================================
[op.PutBucketTagging]
precedence = 350
auth_action = "s3:PutBucketTagging"
# The pinned model carries `aws.protocols#httpChecksum` with `requestChecksumRequired` — the same
# trait spelling PutObjectTagging and DeleteObjects have, which lowering does not read — so the
# requirement is stated here rather than silently lost: a tagging write with neither Content-MD5
# nor an x-amz-checksum-* header is refused before the handler runs.
http_checksum_required = true
# The request ceiling matches the response ceiling of the read: fifty maximal tags with markup.
request_max_bytes = 262144
error_codes = ["NoSuchBucket", "AccessDenied", "InvalidArgument", "MalformedXML", "InvalidTag"]
url_encoded_fields = []
input_hot = ["Tagging"]
quirk_refs = ["q-tag-md5-required-0092", "q-tag-limits-0094"]

# =============================================================================================
# DeleteBucketTagging
#
# Removes the whole tag set. The model already answers 204, and the 204 is unconditional:
# untagging a bucket that carries no tags is a success, exactly as the object delete is.
# =============================================================================================
[op.DeleteBucketTagging]
precedence = 360
auth_action = "s3:DeleteBucketTagging"
error_codes = ["NoSuchBucket", "AccessDenied", "InvalidArgument"]
url_encoded_fields = []
quirk_refs = ["q-tag-delete-idempotent-0091"]

[op.GetBucketIntelligentTieringConfiguration]
precedence = 272
query_present = ["id"]
auth_action = "s3:GetIntelligentTieringConfiguration"
response_max_bytes = 65536
error_codes = ["NoSuchBucket", "AccessDenied"]
url_encoded_fields = []
input_hot = ["Id"]
output_hot = ["IntelligentTieringConfiguration"]

[op.ListBucketIntelligentTieringConfigurations]
precedence = 273
auth_action = "s3:GetIntelligentTieringConfiguration"
response_max_bytes = 1048576
error_codes = ["NoSuchBucket", "AccessDenied"]
url_encoded_fields = []
input_hot = ["ContinuationToken"]
output_hot = ["IsTruncated", "NextContinuationToken"]

[[deferred]]
reason = "Two groups, deferred for two different reasons, and neither is one of the nine configurations the 200-249 band covers. OwnershipControls belongs with the ACL family that landed at 250/260 and did not take it: BucketOwnerEnforced is the ownership value that disables ACLs outright, so the switch and the grant grammar answer each other and are reviewed together. The analytics, inventory, metrics and intelligent-tiering sets are the only bucket subresources that are keyed — each carries an id, so each has a list operation beside its triple and a selector that pins a query key both with and without a value, which is a routing shape no band in the table has yet."
operations = [
  "DeleteBucketAnalyticsConfiguration",
  "DeleteBucketIntelligentTieringConfiguration",
  "DeleteBucketInventoryConfiguration",
  "DeleteBucketMetricsConfiguration",
  "DeleteBucketOwnershipControls",
  "GetBucketAnalyticsConfiguration",
  "GetBucketInventoryConfiguration",
  "GetBucketMetricsConfiguration",
  "ListBucketAnalyticsConfigurations",
  "ListBucketInventoryConfigurations",
  "ListBucketMetricsConfigurations",
  "PutBucketAnalyticsConfiguration",
  "PutBucketIntelligentTieringConfiguration",
  "PutBucketInventoryConfiguration",
  "PutBucketMetricsConfiguration",
  "PutBucketOwnershipControls",
]
