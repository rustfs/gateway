# Family: the three one-switch bucket configurations. ?versioning, ?accelerate, ?requestPayment.
#
# Grouped because they are the same operation three times: a document whose whole content is one
# closed-set enumeration, a read, a write, and no delete. What makes them worth reading together
# is that their **unconfigured answers differ**, and each difference is a thing a client branches
# on:
#
#   * `?versioning`     — 200 with an empty `<VersioningConfiguration/>` and no `<Status>` at all.
#   * `?accelerate`     — 200 with an empty `<AccelerateConfiguration/>`.
#   * `?requestPayment` — 200 with `<Payer>BucketOwner</Payer>`, the *default value*, because there
#                         is no such thing as a bucket with no payer.
#
# None of the three is a 404, so `not_configured` is unset on all three reads — which is a
# statement, not an omission: three reads in this band do carry one, and the boundary between the
# two groups is the family's most error-prone fact.
#
# The writes differ too, and again from the model rather than from a simplification here:
# `PutBucketVersioning` and `PutBucketRequestPayment` carry a `content-md5` member and the
# `aws.protocols#httpChecksum` request requirement; `PutBucketAccelerateConfiguration` carries
# neither. Two of the three writes demand an integrity claim and the third does not.
#
# Nothing here switches anything on. Creating a version, accelerating a transfer and billing a
# requester are the storage layer's; the gateway's contribution is that the document it reads back
# is the document that was written.
#
# The routing reason is the band's: a deferred operation contributes no route row, so
# `GET /{Bucket}?versioning`, `?accelerate` and `?requestPayment` were claimed by `ListObjects` and
# answered with a page of keys — three of the nine debt-register lines this family retires — while
# the writes were unroutable.

include = [
  "GetBucketAccelerateConfiguration",
  "GetBucketRequestPayment",
  "GetBucketVersioning",
  "PutBucketAccelerateConfiguration",
  "PutBucketRequestPayment",
  "PutBucketVersioning",
]

# =============================================================================================
# GetBucketAccelerateConfiguration — 200
# =============================================================================================
[op.GetBucketAccelerateConfiguration]
precedence = 200
auth_action = "s3:GetAccelerateConfiguration"
# The response element order. It belongs to the *operation* and not to the shape: this read's
# output members are operation-level, so the shape is only ever a request payload — it gets a
# reader, a reader does not consult element order, and a `[shape]` declaration here would be a
# statement no test could falsify.
element_order = ["Status"]
# One enumeration inside one wrapper.
response_max_bytes = 4096
error_codes = ["NoSuchBucket", "AccessDenied"]
url_encoded_fields = []
input_hot = []
output_hot = []
quirk_refs = ["q-acc-0001", "q-acc-0002"]

# =============================================================================================
# PutBucketAccelerateConfiguration — 201
#
# One of the two writes in the whole 200-249 band with no integrity requirement. The pinned model
# carries no `content-md5` member for it and no request checksum requirement, so nothing is
# stated here: `http_checksum_required` stays false on purpose, and the case that proves it is the
# same case that proves its six siblings demand one.
# =============================================================================================
[op.PutBucketAccelerateConfiguration]
precedence = 201
auth_action = "s3:PutAccelerateConfiguration"
request_max_bytes = 4096
error_codes = ["NoSuchBucket", "AccessDenied", "MalformedXML", "InvalidArgument"]
url_encoded_fields = []
input_hot = ["AccelerateConfiguration"]
output_hot = []
quirk_refs = ["q-acc-0002", "q-acc-0003"]

# =============================================================================================
# GetBucketRequestPayment — 230
#
# The one read in the band whose unconfigured answer is a *default value* rather than an empty
# document or a 404.
# =============================================================================================
[op.GetBucketRequestPayment]
precedence = 230
auth_action = "s3:GetBucketRequestPayment"
# The response element order. It belongs to the *operation* and not to the shape: this read's
# output members are operation-level, so the shape is only ever a request payload — it gets a
# reader, a reader does not consult element order, and a `[shape]` declaration here would be a
# statement no test could falsify.
element_order = ["Payer"]
response_max_bytes = 4096
error_codes = ["NoSuchBucket", "AccessDenied"]
url_encoded_fields = []
input_hot = []
output_hot = []
quirk_refs = ["q-rqp-0001"]

# =============================================================================================
# PutBucketRequestPayment — 231
# =============================================================================================
[op.PutBucketRequestPayment]
precedence = 231
auth_action = "s3:PutBucketRequestPayment"
# The pinned model carries `content-md5` and the `aws.protocols#httpChecksum` request requirement,
# which lowering does not read, so it is stated here rather than silently lost.
http_checksum_required = true
request_max_bytes = 4096
error_codes = ["NoSuchBucket", "AccessDenied", "MalformedXML", "InvalidArgument", "BadDigest"]
url_encoded_fields = []
input_hot = ["RequestPaymentConfiguration"]
output_hot = []
quirk_refs = ["q-rqp-0002", "q-rqp-0003"]

# =============================================================================================
# GetBucketVersioning — 235
#
# The empty document this answers for a never-versioned bucket is the single most consequential
# byte sequence in the family: `<VersioningConfiguration/>` with no `<Status>` means "never
# versioned", `<Status>Suspended</Status>` means "versioned once and stopped", and the two are
# different states with different recovery behaviour.
# =============================================================================================
[op.GetBucketVersioning]
precedence = 235
auth_action = "s3:GetBucketVersioning"
# The response element order. It belongs to the *operation* and not to the shape: this read's
# output members are operation-level, so the shape is only ever a request payload — it gets a
# reader, a reader does not consult element order, and a `[shape]` declaration here would be a
# statement no test could falsify.
element_order = ["Status", "MFADelete"]
response_max_bytes = 4096
error_codes = ["NoSuchBucket", "AccessDenied"]
url_encoded_fields = []
input_hot = []
output_hot = []
quirk_refs = ["q-ver-0001", "q-ver-0004"]

# =============================================================================================
# PutBucketVersioning — 236
#
# The `x-amz-mfa` header is parsed into the input and passed through; whether the device and code
# it names actually authorise the change is the backend's question. The value is never echoed and
# never appears in a refusal.
# =============================================================================================
[op.PutBucketVersioning]
precedence = 236
auth_action = "s3:PutBucketVersioning"
# The pinned model carries `content-md5` and the `aws.protocols#httpChecksum` request requirement.
http_checksum_required = true
request_max_bytes = 4096
error_codes = ["NoSuchBucket", "AccessDenied", "MalformedXML", "InvalidArgument", "BadDigest"]
url_encoded_fields = []
input_hot = ["VersioningConfiguration"]
output_hot = []
quirk_refs = ["q-ver-0002", "q-ver-0003", "q-ver-0004"]

# MinIO's versioning extensions, which RustFS reads (prefixes and folders excluded from versioning)
# and the legacy stack (built with MinIO support) decodes: each `<ExcludedPrefixes>` element holds one `<Prefix>` and
# repeats with no wrapper. The generic decoder skipped both (rd-cfg-0006; rustfs/backlog#1752).
[shape.VersioningConfiguration]

[[shape.VersioningConfiguration.field]]
name = "ExcludedPrefixes"
synthesize = true
type = "FlattenedList:ExcludedPrefix"

[[shape.VersioningConfiguration.field]]
name = "ExcludeFolders"
synthesize = true
type = "Boolean"

[shape.ExcludedPrefix]
synthesize = true

[[shape.ExcludedPrefix.field]]
name = "Prefix"
synthesize = true
type = "String"

# =============================================================================================
# Nested shapes owned by this family
# =============================================================================================

# `MFADelete` is the model's member name and `MfaDelete` is its wire spelling — and the pinned
# model gives the read and the write the *same* `xmlName`, so no alternate-name rule is needed
# for it (`q-ver-0004`). `Payer` is required by the model, so a request-payment document naming
# no payer is refused by the decoder as MalformedXML before the closed-set check in
# `ops/shared/bucket_config.rs` runs. Neither fact needs a `[shape]` block: the wire names come
# from the model, and the response order of all three reads is stated on the reads above, where
# reversing it changes a byte-exact golden.
