# Family: multipart upload.
#
# Nothing is generated yet. The part-number and checksum interaction — a checksum of checksums,
# with a distinct entity-tag form — needs its own reviewed pass.

[[deferred]]
reason = "P5 multipart upload family; the part/checksum interaction needs its own reviewed pass."
operations = [
  "AbortMultipartUpload",
  "CompleteMultipartUpload",
  "CreateMultipartUpload",
  "ListMultipartUploads",
  "ListParts",
  "UploadPart",
  "UploadPartCopy",
]
