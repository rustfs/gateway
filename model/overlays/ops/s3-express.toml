# Family: S3 Express One Zone session creation.
#
# CreateSession mints short-lived session credentials for a directory bucket. It sits at 279 on
# the bucket GET band so ?session never falls through to ListObjects, signs under s3express, and
# refuses presigned, anonymous, SigV2, host header-token, and x-amz-s3session-token auth.

include = [
  "CreateSession",
]

[op.CreateSession]
precedence = 279
target = "Bucket"
auth_action = "s3express:CreateSession"
auth_service = "s3express"
auth_presigned = false
response_max_bytes = 65536
error_codes = ["NoSuchBucket", "AccessDenied", "InvalidArgument"]
url_encoded_fields = []
input_hot = ["SessionMode"]
output_hot = ["Credentials"]
