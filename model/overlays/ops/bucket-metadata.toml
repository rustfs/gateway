# Family: S3 Metadata configuration reads.
#
# Both generations are GET bucket subresources with the same IAM action. Their distinct query
# keys keep the V2 configuration response and the legacy V1 table response out of ListObjects.

include = [
  "GetBucketMetadataConfiguration",
  "GetBucketMetadataTableConfiguration",
]

[op.GetBucketMetadataConfiguration]
precedence = 280
auth_action = "s3:GetBucketMetadataTableConfiguration"
response_max_bytes = 1048576
error_codes = ["NoSuchBucket", "AccessDenied"]
url_encoded_fields = []
input_hot = ["ExpectedBucketOwner"]

[op.GetBucketMetadataTableConfiguration]
precedence = 281
auth_action = "s3:GetBucketMetadataTableConfiguration"
response_max_bytes = 1048576
error_codes = ["NoSuchBucket", "AccessDenied", "MethodNotAllowed"]
url_encoded_fields = []
input_hot = ["ExpectedBucketOwner"]
