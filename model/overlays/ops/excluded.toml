# Not a family: the operations this gateway does not serve at all.
#
# They still need an entry, because codegen fails on a model operation that is in neither
# `include` nor a [[deferred]] group. An upstream addition is therefore a build failure that
# needs a decision, never silence.

[[route_only]]
reason = "The request shape is protocol-known, but session credential DTOs and codecs remain deliberately unavailable."
operations = [
  "CreateSession",
]

[op.CreateSession]
precedence = 279
target = "Bucket"

[[deferred]]
reason = "Out of scope for the gateway: S3 Tables and bucket metadata table configuration, a separate AWS surface with its own control plane."
operations = [
  "CreateBucketMetadataConfiguration",
  "CreateBucketMetadataTableConfiguration",
  "DeleteBucketMetadataConfiguration",
  "DeleteBucketMetadataTableConfiguration",
  "UpdateBucketMetadataAnnotationTableConfiguration",
  "UpdateBucketMetadataInventoryTableConfiguration",
  "UpdateBucketMetadataJournalTableConfiguration",
]

[[deferred]]
reason = "Out of scope for the gateway: S3 Object Lambda, which requires the Object Lambda access point host class."
operations = [
  "WriteGetObjectResponse",
]
