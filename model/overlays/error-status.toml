# The error code -> HTTP status authority: the one hand-written place this mapping exists.
#
# `generated/error_status.rs` is rendered from this file and is the only table the runtime reads,
# so `rustfs-gateway-types::ErrorCode` cannot hold a second opinion about a status. Before
# rustfs/backlog#1694 the table was hand-written Rust and an unlisted code silently took a 400
# fallback; the fallback is gone, `ErrorCode::custom` now demands a status from its caller, and a
# code an operation can produce but this file does not list is a `check_error_status_total.sh`
# failure rather than a plausible-looking 400.
#
# It is deliberately NOT sharded per operation family, for the same reason `scalars.toml` is not:
# `NoSuchKey` means one status whichever family raises it, so two families holding two answers is
# not a merge to resolve, it is a contradiction, and one file is the cheapest way to make it
# impossible.
#
# Every row:
#   name         the wire spelling, as it appears in the `<Code>` element
#   constant     the associated constant on `ErrorCode`; `grep` finds the use sites from here
#   status       the HTTP status, as an integer, because the wire carries an integer
#   server_fault required on every 5xx row and refused on every other row. This is the whole 5xx
#                allowlist: a 5xx tells an SDK to retry and trips its circuit breaker, so a client
#                error that lands in the 5xx band is amplified into an outage
#   note         optional rustdoc lines, verbatim, for a row whose status reads wrong at a glance
#
# A code with no use site yet is listed in `allowances/error-status-unreferenced.txt`; that file is
# the dead-code ledger, and an entry in it that HAS a use site is also a guard failure.

# ── 3xx ───────────────────────────────────────────────────────────────────────────────────
[[code]]
name = "PermanentRedirect"
constant = "PERMANENT_REDIRECT"
status = 301
note = [
  "Path-style request for a bucket in another region; the response also carries",
  "`x-amz-bucket-region` so the client can retry without a second lookup.",
]

[[code]]
name = "TemporaryRedirect"
constant = "TEMPORARY_REDIRECT"
status = 307
note = [
  "A newly created bucket whose virtual-hosted DNS name has not propagated yet. Temporary by",
  "definition, so the client must not cache it.",
]

[[code]]
name = "NotModified"
constant = "NOT_MODIFIED"
status = 304
note = [
  "A precondition matched on a read: the response carries an `ETag` and no body at all, not",
  "even a `Content-Length`.",
]


