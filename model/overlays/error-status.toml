# Three codes `PutObject` declares and nothing had named, so each took the 400 fallback while
# reading like a mapped row. Evidence: the S3 API error list and the PutObject reference at
# https://docs.aws.amazon.com/AmazonS3/latest/API/ErrorResponses.html — my summary: all three
# describe a request that contradicts the object it addresses, which is the client's mistake, so
# they are 400s and not the 409 "conflict" reading their names invite.
[[code]]
name = "EncryptionTypeMismatch"
constant = "ENCRYPTION_TYPE_MISMATCH"
status = 400
note = [
  "The encryption the request asked for is not the encryption the existing object has. A 400,",
  "not a 409: nothing is racing, the request simply describes a different object than the one",
  "that is there.",
]

[[code]]
name = "InvalidWriteOffset"
constant = "INVALID_WRITE_OFFSET"
status = 400
note = ["An append whose write offset is not the object's current size."]

[[code]]
name = "TooManyParts"
constant = "TOO_MANY_PARTS"
status = 400
note = ["More parts than the upload allows. A 400 rather than the 413 the name suggests."]

