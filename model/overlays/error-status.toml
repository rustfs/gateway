# The bare code the HEAD operations answer with. Evidence: the HeadObject and HeadBucket
# references at https://docs.aws.amazon.com/AmazonS3/latest/API/API_HeadObject.html — my summary: a
# HEAD carries no body, so the only thing that can distinguish "no such key" is the status, and S3
# spells the code `NotFound` rather than `NoSuchKey` there.
[[code]]
name = "NotFound"
constant = "NOT_FOUND"
status = 404
note = [
  "What `HeadObject` and `HeadBucket` answer with instead of `NoSuchKey` or `NoSuchBucket`. A",
  "HEAD response has no body to carry the code, so this row exists for the status and for the",
  "code a client reconstructs from it.",
]

