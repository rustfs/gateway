constant = "OBJECT_ALREADY_IN_ACTIVE_TIER"
status = 403
note = ["A restore for an object that is already in the active tier. A 403, not a 409."]

[[code]]
name = "ObjectNotInActiveTierError"
constant = "OBJECT_NOT_IN_ACTIVE_TIER"
status = 403
note = ["A copy whose source is still in an archive tier. A 403, not a 409."]

