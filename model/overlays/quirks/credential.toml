[[quirk]]
id      = "q-cred-session-token-must-be-signed-0001"
kind    = "credential_authentication"
classification = "contract"
target  = "Authentication.X-Amz-Security-Token"
summary = "A temporary credential token is authenticated only when the signature covers its exact wire value."
cases   = ["c-cred-0003", "c-cred-0021"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/IAM/latest/UserGuide/create-signed-request.html"
  summary = "AWS requires the security token from temporary credentials to be included in the signed request."

[[quirk]]
id      = "q-cred-session-token-position-0002"
kind    = "credential_authentication"
classification = "contract"
target  = "Authentication.X-Amz-Security-Token"
summary = "Temporary credential tokens use a signed header for header auth and a signed query parameter for presigned auth."
cases   = ["c-cred-0003", "c-cred-0004"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/sigv4-query-string-auth.html"
  summary = "AWS presigned requests carry temporary credential tokens in the canonical query string."
