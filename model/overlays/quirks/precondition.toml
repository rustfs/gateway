[[quirk]]
id      = "q-copy-source-if-match-miss-0113"
kind    = "copy_source_if_match_outcome"
classification = "contract"
mutation_dimension = "copy_source_if_match_miss"
contract_value = "precondition_failed"
target  = "CopyObject.CopySourceIfMatch"
summary = "A copy-source If-Match value that misses the source entity tag refuses the copy with PreconditionFailed."
cases   = ["c-cond-0026"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_CopyObject.html"
  summary = "The operation reference documents a failed copy-source If-Match condition as a 412 response."

  [[quirk.evidence]]
  kind    = "s3s-pr"
  ref     = "https://github.com/s3s-project/s3s/pull/577"
  summary = "The upstream change added evaluation for copy-source conditional headers that had previously been ignored."

[[quirk]]
id      = "q-copy-source-guard-order-0114"
kind    = "copy_source_guard_order"
classification = "contract"
mutation_dimension = "copy_source_guard_order"
contract_value = "guard_before_target_write"
target  = "CopyObject"
summary = "A copy evaluates source guards before writing the target, so a refused copy cannot leave a target object."
cases   = ["c-cond-0026"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_CopyObject.html"
  summary = "The operation reference describes source-condition failure before the copy action succeeds."

  [[quirk.evidence]]
  kind    = "s3s-pr"
  ref     = "https://github.com/s3s-project/s3s/pull/577"
  summary = "The upstream change applies copy-source condition evaluation before performing the copy."
