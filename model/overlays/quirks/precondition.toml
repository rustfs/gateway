[[quirk]]
id      = "q-range-part-count-0105"
kind    = "response_header"
classification = "contract"
mutation_dimension = "part_count_header_policy"
contract_value = "include_total"
target  = "GetObject.PartNumber"
summary = "A part-number read reports the completed object's part count in x-amz-mp-parts-count."
