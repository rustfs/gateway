[[quirk]]
id      = "q-range-selector-conflict-0106"
kind    = "cross_field"
classification = "contract"
mutation_dimension = "range_part_selector_conflict"
contract_value = "reject"
target  = "GetObject.PartNumber"
summary = "A request carrying both Range and partNumber is refused with 400 because the selectors name bytes by different mechanisms."
cases   = ["c-range-0015"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_GetObject.html"
  summary = "Documents Range and partNumber as alternative partial-read selectors rather than a combined selector."

[[quirk]]
id      = "q-cond-if-match-miss-0108"
kind    = "if_match_outcome"
classification = "contract"
mutation_dimension = "if_match_miss_outcome"
contract_value = "precondition_failed"
target  = "PutObject.IfMatch"
summary = "A named If-Match value that does not equal the current entity tag refuses the write with PreconditionFailed."
cases   = ["c-cond-0011"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/userguide/conditional-writes.html"
  summary = "AWS documents a mismatched If-Match on a write as a precondition failure."

  [[quirk.evidence]]
  kind    = "s3s-issue"
  ref     = "https://github.com/s3s-project/s3s/issues/241"
  summary = "Ignoring the entity-tag guard let conditional writes proceed when their validator did not match."

[[quirk]]
id      = "q-cond-if-match-absent-0109"
kind    = "if_match_absent"
classification = "contract"
mutation_dimension = "if_match_absent_policy"
contract_value = "precondition_failed"
target  = "PutObject.IfMatch"
summary = "If-Match against an absent representation fails the condition instead of turning the request into an unconditional create."
cases   = ["c-cond-0012"]

  [[quirk.evidence]]
  kind    = "rfc"
  ref     = "https://www.rfc-editor.org/rfc/rfc9110#section-13.1.1"
  summary = "If-Match is false when no current representation exists."

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/userguide/conditional-writes.html"
  summary = "AWS documents an unsatisfied If-Match write as a precondition failure."

[[quirk]]
id      = "q-error-root-unnamespaced-0110"
