# Quirks of the bucket lifecycle configuration family.
#
# One [[quirk]] per behaviour the pinned Smithy model does not state, or states in a trait the
# lowering would otherwise lose. `summary` and every `evidence.summary` are written by this
# project; upstream issue and documentation prose stays under its author's copyright and is never
# pasted here.
#
# One dialect of the issue's list is deliberately absent: MinIO's `<DelMarkerExpiration>` element
# inside a rule needs the `ExtField` codec mechanism (task P1-08), which does not exist in this
# workspace yet. Until it does, the element is covered by q-lc-0006 — skipped on decode, absent
# from the re-encoded document — and registering a round-trip quirk nothing can satisfy would be
# a claim no case checks.

[[quirk]]
id      = "q-lc-0001"
kind    = "not_configured_error"
target  = "GetBucketLifecycleConfiguration"
summary = "A bucket that never had a lifecycle document answers 404 with the operation-specific code NoSuchLifecycleConfiguration, not a generic not-found and not an empty 200."
cases   = ["c-lifecycle-0013", "c-lifecycle-0011"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_GetBucketLifecycleConfiguration.html"
  summary = "The operation's error table lists NoSuchLifecycleConfiguration with HTTP status 404 for a bucket without a lifecycle configuration."

[[quirk]]
id      = "q-lc-0002"
kind    = "xml_root"
target  = "PutBucketLifecycleConfiguration"
summary = "The request body's root element is LifecycleConfiguration while the model names the payload shape BucketLifecycleConfiguration; a decoder keyed on the shape name would refuse every document a real client sends."
cases   = ["c-lifecycle-0001", "c-lifecycle-0017"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutBucketLifecycleConfiguration.html"
  summary = "The documented request syntax opens with a LifecycleConfiguration root element even though the payload member's shape is named BucketLifecycleConfiguration."

[[quirk]]
id      = "q-lc-0003"
kind    = "flattened_list"
target  = "BucketLifecycleConfiguration.Rules"
summary = "The rules repeat as sibling Rule elements directly under the LifecycleConfiguration root; a Rules wrapper element would make every SDK read zero rules."
cases   = ["c-lifecycle-0002", "c-lifecycle-0003"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_GetBucketLifecycleConfiguration.html"
  summary = "The documented response syntax shows Rule elements as direct children of the LifecycleConfiguration root with no intermediate wrapper."

  [[quirk.evidence]]
  kind    = "s3s-issue"
  ref     = "https://github.com/s3s-project/s3s/issues/264"
  summary = "Upstream shipped response roots without the S3 xmlns and strict clients refused them, which is why the root and its namespace are pinned byte for byte."

[[quirk]]
id      = "q-lc-0004"
kind    = "idempotent_delete"
target  = "DeleteBucketLifecycle"
summary = "The delete answers 204 with no body whether or not a configuration existed, so removing the lifecycle document of an unconfigured bucket is a success rather than a 404."
cases   = ["c-lifecycle-0014", "c-lifecycle-0011"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_DeleteBucketLifecycle.html"
  summary = "The operation documents a 204 No Content success and lists no not-found error for a missing configuration."

[[quirk]]
id      = "q-lc-0005"
kind    = "checksum_required"
target  = "PutBucketLifecycleConfiguration"
summary = "The write demands an integrity claim on the body, so a request with neither Content-MD5 nor an x-amz-checksum header is refused with 400 before the document is parsed."
cases   = ["c-lifecycle-0015"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutBucketLifecycleConfiguration.html"
  summary = "The request documents Content-MD5 as required for this operation, which the model spells as a request checksum requirement."

[[quirk]]
id      = "q-lc-0006"
kind    = "lenient_unknown_elements"
target  = "PutBucketLifecycleConfiguration"
summary = "Unknown elements inside the request document are skipped rather than refused, because a stored configuration parsed more strictly on the next release silently turns lifecycle rules off and the first symptom is objects that stop expiring."
cases   = ["c-lifecycle-0018"]

  [[quirk.evidence]]
  kind    = "s3s-issue"
  ref     = "https://github.com/s3s-project/s3s/issues/613"
  summary = "AWS ignores unknown elements in request XML, and upstream had to relax its decoder to match after strict parsing broke real clients."

  [[quirk.evidence]]
  kind    = "s3s-pr"
  ref     = "https://github.com/s3s-project/s3s/pull/617"
  summary = "The upstream fix that makes unknown request elements a skip rather than an error, which is the behaviour this decoder generates by construction."

[[quirk]]
id      = "q-lc-0007"
kind    = "exclusive_members"
target  = "LifecycleRuleFilter"
summary = "A Filter carries at most one direct child; several conditions must nest inside one And element, and an And with fewer than two conditions is refused as MalformedXML."
cases   = ["c-lifecycle-0019", "c-lifecycle-0020", "c-lifecycle-0007"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_LifecycleRuleFilter.html"
  summary = "The filter's members are documented as mutually exclusive alternatives, with the And member as the one spelling for combining more than one condition."

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/userguide/intro-lifecycle-rules.html"
  summary = "The lifecycle rules guide requires multiple filter conditions to be wrapped in a single And element."

[[quirk]]
id      = "q-lc-0008"
kind    = "legacy_form"
target  = "LifecycleRule.Prefix"
summary = "A rule may still scope itself with the deprecated rule-level Prefix element instead of a Filter, because configurations stored under the pre-Filter API revision must keep parsing; a rule carrying neither is refused as MalformedXML."
cases   = ["c-lifecycle-0008", "c-lifecycle-0021"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_LifecycleRule.html"
  summary = "The rule's Prefix member is documented as deprecated but still accepted, and Filter is documented as required exactly when the rule carries no Prefix."

[[quirk]]
id      = "q-lc-0009"
kind    = "value_constraint"
target  = "LifecycleExpiration.Date"
summary = "A Date value in an Expiration or Transition action must name midnight UTC; any other time of day is refused with 400 InvalidArgument rather than rounded."
cases   = ["c-lifecycle-0022", "c-lifecycle-0004"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_LifecycleExpiration.html"
  summary = "The Date member is documented as ISO 8601 with the time component always midnight UTC."

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_Transition.html"
  summary = "The transition's Date member carries the same always-midnight-UTC constraint as the expiration's."

[[quirk]]
id      = "q-lc-0010"
kind    = "exclusive_members"
target  = "LifecycleExpiration"
summary = "Days, Date and ExpiredObjectDeleteMarker are mutually exclusive within one Expiration action; a document naming two of them is refused as MalformedXML."
cases   = ["c-lifecycle-0023", "c-lifecycle-0005"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_LifecycleExpiration.html"
  summary = "The ExpiredObjectDeleteMarker member is documented as unusable together with Days or Date, which makes the three members alternatives rather than companions."

[[quirk]]
id      = "q-lc-0011"
kind    = "bounded_range"
target  = "BucketLifecycleConfiguration.Rules"
summary = "A configuration carries at most 1,000 rules; the 1,001st is refused with 400 rather than truncated or stored."
cases   = ["c-lifecycle-0026", "c-lifecycle-0012"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/userguide/intro-lifecycle-rules.html"
  summary = "The lifecycle rules guide caps a configuration at 1,000 rules per bucket."

[[quirk]]
id      = "q-lc-0012"
kind    = "value_constraint"
target  = "LifecycleRule.ID"
summary = "A rule id is at most 255 characters and unique across the configuration; a longer or duplicated id is refused with 400 InvalidArgument."
cases   = ["c-lifecycle-0024", "c-lifecycle-0025"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_LifecycleRule.html"
  summary = "The ID member is documented as a unique identifier for the rule with a length cap of 255 characters."

[[quirk]]
id      = "q-lc-0013"
kind    = "value_constraint"
target  = "LifecycleExpiration.Days"
summary = "An expiration measured in days must be a positive integer; zero and negative values are refused with 400 InvalidArgument."
cases   = ["c-lifecycle-0027"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_LifecycleExpiration.html"
  summary = "The Days member is documented as a non-zero positive integer."

[[quirk]]
id      = "q-lc-0014"
kind    = "lenient_enum"
target  = "LifecycleRule.Status"
summary = "A Status outside the documented Enabled/Disabled pair is stored and echoed rather than refused, because a stored configuration must survive reparse by a stricter release; the fail-open cost of refusing is silently disabled lifecycle rules."
cases   = ["c-lifecycle-0028"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_LifecycleRule.html"
  summary = "The Status member documents Enabled and Disabled as its value set, and this project's decision to pass rather than refuse out-of-set spellings is recorded here."

  [[quirk.evidence]]
  kind    = "s3s-issue"
  ref     = "https://github.com/s3s-project/s3s/issues/428"
  summary = "Upstream's lifecycle configuration types could not round-trip stored documents, which is the failure mode a strict enum decode reintroduces."
