# Quirks of the object listing family: ListObjectsV2 and the listings that land beside it.
#
# One [[quirk]] per behaviour the pinned Smithy model does not state. `summary` and every
# `evidence.summary` are written by this project; upstream issue and documentation prose stays
# under its author's copyright and is never pasted here.
#
# One file per family, for the same reason `ops/` is sharded: it is the unit of parallel edit
# conflict. A quirk id declared in two files is a load failure naming both.

[[quirk]]
id      = "q-empty-0016"
kind    = "empty_value"
classification = "mutable"
mutation_dimension = "optionality"
mutation_sources = ["ListObjectsV2.output.Prefix.required", "ListObjectsV2.output.Delimiter.required"]
target  = "ListObjectsV2"
summary = "The prefix element is always written even when empty, while the delimiter element only appears when the request supplied one."
cases   = ["c-list-0023", "c-list-0025", "c-list-0037", "c-list-0039", "c-list-0043"]

  [[quirk.evidence]]
  kind    = "capture"
  ref     = "captures/list-objects-v2-empty-prefix.http"
  summary = "Recorded response showing an empty prefix element present and no delimiter element at all."

[[quirk]]
id      = "q-encoding-0015"
kind    = "encoding_type"
classification = "mutable"
mutation_dimension = "element_encoding"
mutation_sources = ["ListObjectsV2.xml.url_encoded_fields"]
target  = "ListObjectsV2"
summary = "When url encoding is requested, a fixed per operation set of members is percent encoded and the encoding type is echoed back; keys containing control characters are otherwise unparseable."
cases   = ["c-list-0017", "c-list-0023", "c-list-0031", "c-list-0035", "c-list-0036", "c-mpu-0013"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_ListObjectsV2.html"
  summary = "Describes the request parameter and states that the response echoes the encoding type when it was requested."

  [[quirk.evidence]]
  kind    = "capture"
  ref     = "captures/list-objects-v2-encoding-url.http"
  summary = "Recorded response for a key containing characters that are illegal in XML, showing which members are encoded."

[[quirk]]
id      = "q-etag-0020"
kind    = "etag_render"
classification = "mutable"
mutation_dimension = "quote_strategy"
mutation_sources = [
  "ListObjectsV2.shapes.Object.fields.ETag.etag_render",
  "ListObjects.shapes.Object.fields.ETag.etag_render",
  "ListObjectVersions.shapes.ObjectVersion.fields.ETag.etag_render",
]
target  = "Object.ETag"
summary = "Inside the listing body the entity tag keeps its surrounding quotes, in contrast with the bare form used by the object attributes operation."
cases   = ["c-list-0021"]

  [[quirk.evidence]]
  kind    = "s3s-issue"
  ref     = "https://github.com/s3s-project/s3s/issues/632"
  summary = "Upstream applied one quoting rule everywhere, which is wrong for one of the two body contexts."

[[quirk]]
id      = "q-flat-0019"
kind    = "flattened"
classification = "mutable"
mutation_dimension = "wrap_strategy"
mutation_sources = [
  "ListObjectsV2.output.Contents.list_flattened",
  "ListObjectsV2.output.CommonPrefixes.list_flattened",
  "ListObjects.output.Contents.list_flattened",
  "ListObjects.output.CommonPrefixes.list_flattened",
  "ListObjectVersions.output.Versions.list_flattened",
  "ListObjectVersions.output.DeleteMarkers.list_flattened",
  "ListObjectVersions.output.CommonPrefixes.list_flattened",
  "ListMultipartUploads.output.Uploads.list_flattened",
  "ListMultipartUploads.output.CommonPrefixes.list_flattened",
]
target  = "ListObjectsV2"
summary = "Entry and common prefix lists repeat their element with no enclosing wrapper, unlike the wrapped lists used by tag sets and grant lists."
cases   = ["c-list-0003", "c-list-0004", "c-list-0008", "c-list-0038", "c-list-0039", "c-mpu-0012"]

  [[quirk.evidence]]
  kind    = "smithy-spec"
  ref     = "https://smithy.io/2.0/spec/protocol-traits.html#xmlflattened-trait"
  summary = "Defines the flattened list serialization that removes the wrapper element around repeated members."

[[quirk]]
id      = "q-keycount-0018"
kind    = "computed_member"
classification = "contract"
target  = "ListObjectsV2.KeyCount"
summary = "The key count is the number of entries plus common prefixes actually returned, not the requested maximum, and is always written."
cases   = ["c-list-0001", "c-list-0004", "c-list-0025"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_ListObjectsV2.html"
  summary = "Defines the count as the number of keys returned by this request, which is at most the requested maximum."

[[quirk]]
id      = "q-order-0014"
kind    = "element_order"
classification = "mutable"
mutation_dimension = "element_order"
mutation_sources = ["ListObjectsV2.xml.element_order"]
target  = "ListObjectsV2"
summary = "Sibling order in the listing result is part of the wire contract; strict clients fail to parse when the bucket name follows the entry list."
cases   = ["c-list-0001"]

  [[quirk.evidence]]
  kind    = "s3s-pr"
  ref     = "https://github.com/s3s-project/s3s/pull/480"
  summary = "Upstream emitted the listing elements in model order and broke a strict client until the order was corrected."

  [[quirk.evidence]]
  kind    = "capture"
  ref     = "captures/list-objects-v2-aws.http"
  summary = "Recorded reference response that fixes the sibling order used by the golden comparison."

[[quirk]]
id      = "q-owner-0017"
kind    = "omit_when"
classification = "mutable"
mutation_dimension = "omit_strategy"
mutation_sources = ["ListObjectsV2.shapes.Object.fields.Owner.omit_when"]
target  = "Object.Owner"
summary = "Owner information is written only when the request asked for it, so emission depends on a request field rather than on the value itself."
cases   = ["c-list-0009", "c-list-0010", "c-list-0024"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_ListObjectsV2.html"
  summary = "States that owner information is returned only when the fetch owner parameter is set."

[[quirk]]
id      = "q-root-0013"
kind    = "root_name"
classification = "mutable"
mutation_dimension = "element_rename"
mutation_sources = ["ListObjectsV2.xml.response_root", "ListObjects.xml.response_root"]
target  = "ListObjectsV2"
summary = "The response root element is shared verbatim with the first version of the listing operation, so the root name cannot be derived from the operation or output shape name."
cases   = ["c-list-0011"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_ListObjectsV2.html#API_ListObjectsV2_ResponseSyntax"
  summary = "The documented response syntax uses the same root element name as the older listing operation."

[[quirk]]
id      = "q-storageclass-0022"
kind    = "omit_when"
classification = "mutable"
mutation_dimension = "omit_strategy"
mutation_sources = [
  "ListObjectsV2.shapes.Object.fields.StorageClass.omit_when",
  "ListObjects.shapes.Object.fields.StorageClass.omit_when",
  "ListObjectVersions.shapes.ObjectVersion.fields.StorageClass.omit_when",
]
target  = "Object.StorageClass"
summary = "The storage class element in a listing is always written including the default class, which is the opposite of the header form that is suppressed for the default class."
cases   = ["c-list-0018", "c-list-0019", "c-object-0012"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_ListObjectsV2.html"
  summary = "The documented listing response includes the storage class element for every entry."

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_GetObject.html"
  summary = "States that the storage class response header is returned for every object except those in the default class."

[[quirk]]
id      = "q-token-0021"
kind    = "opaque_token"
classification = "contract"
target  = "ListObjectsV2"
summary = "Pagination tokens are attacker controlled opaque bytes; they are never parsed as keys or paths and must survive url encoding unchanged."
cases   = ["c-list-0029", "c-list-0030", "c-list-0031", "c-list-0032"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_ListObjectsV2.html"
  summary = "Describes the continuation token as an opaque value obtained from a previous response."

# ---------------------------------------------------------------------------------------------
# The three listings that landed with the rest of the family. Their ids continue at 0060 rather
# than at the next free number: several families are being written at once, ids are unique across
# every quirk file, and a collision is a load failure that names both files. One reserved band per
# family costs a gap in the numbering and removes the only merge conflict this file can have.
# ---------------------------------------------------------------------------------------------

[[quirk]]
id      = "q-root-0060"
kind    = "root_name"
classification = "mutable"
mutation_dimension = "element_rename"
mutation_sources = ["ListObjectVersions.xml.response_root"]
target  = "ListObjectVersions"
summary = "The version listing has a response root of its own, while the two key listings share theirs, so no rule derives a root name from the operation."
cases   = ["c-list-0012"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_ListObjectVersions.html"
  summary = "The documented response syntax uses a root element that names versions rather than the bucket listing root."

[[quirk]]
id      = "q-version-0061"
kind    = "element_name"
classification = "mutable"
mutation_dimension = "element_rename"
mutation_sources = [
  "ListObjectVersions.output.Versions.wire_name",
  "ListObjectVersions.output.DeleteMarkers.wire_name",
]
target  = "ListObjectVersions"
summary = "Version entries are written under an element named for a single version and deleted entries under a delete marker element; neither is named after the shape behind it."
cases   = ["c-list-0012", "c-list-0013"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_ListObjectVersions.html"
  summary = "The documented response repeats two differently named entry elements inside one result."

  [[quirk.evidence]]
  kind    = "smithy-spec"
  ref     = "https://smithy.io/2.0/spec/protocol-traits.html#xmlname-trait"
  summary = "Defines the trait that renames a member on the wire independently of the shape it targets."

[[quirk]]
id      = "q-wrapped-0062"
kind    = "flattened"
classification = "mutable"
mutation_dimension = "wrap_strategy"
mutation_sources = ["ListBuckets.output.Buckets.list_flattened"]
target  = "ListBuckets"
summary = "The bucket listing wraps its entries in an enclosing element, the one listing in this family that is not flattened."
cases   = ["c-list-0015"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_ListBuckets.html"
  summary = "The documented response nests every bucket entry inside a single enclosing element."

[[quirk]]
id      = "q-empty-0063"
kind    = "empty_value"
classification = "mutable"
mutation_dimension = "optionality"
mutation_sources = ["ListObjects.output.Prefix.required", "ListObjects.output.Marker.required"]
target  = "ListObjects"
summary = "The first listing version writes both its prefix and its marker element even when neither was supplied, so an absent value is an empty element rather than no element."
cases   = ["c-list-0002", "c-list-0003", "c-list-0018", "c-list-0022"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_ListObjects.html"
  summary = "The documented response syntax carries both elements unconditionally."

  [[quirk.evidence]]
  kind    = "s3s-issue"
  ref     = "https://github.com/s3s-project/s3s/issues/229"
  summary = "Upstream treated an empty element and an absent element as different values, which breaks in both directions."

[[quirk]]
id      = "q-marker-0064"
kind    = "computed_member"
classification = "contract"
target  = "ListObjects.NextMarker"
summary = "The first listing version emits its next cursor only when the page was truncated, and must emit it when a delimiter is in play because the client cannot derive it from the last entry."
cases   = ["c-list-0002", "c-list-0041", "c-list-0042"]

  [[quirk.evidence]]
  kind    = "s3s-issue"
  ref     = "https://github.com/s3s-project/s3s/issues/544"
  summary = "Upstream truncated a delimited listing without emitting the next cursor, leaving the client no way to ask for page two."

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_ListObjects.html"
  summary = "States the next cursor is present when the result was truncated and describes its role when a delimiter groups keys."

[[quirk]]
id      = "q-owner-0065"
kind    = "omit_when"
classification = "mutable"
mutation_dimension = "omit_strategy"
mutation_sources = ["ListObjects.shapes.Object.fields.Owner.omit_when"]
target  = "ListObjects.Object.Owner"
summary = "The first listing version has no fetch owner parameter and writes owner information for every entry, so the suppression the entry shape carries applies to the second version alone."
cases   = ["c-list-0010", "c-list-0024"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_ListObjects.html"
  summary = "The documented response carries owner information for every entry and the request has no parameter that would suppress it."

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_ListObjectsV2.html"
  summary = "States that the second version returns owner information only when the request asked for it."

[[quirk]]
id      = "q-order-0066"
kind    = "element_order"
classification = "mutable"
mutation_dimension = "element_order"
mutation_sources = [
  "ListObjects.xml.element_order",
  "ListObjectVersions.xml.element_order",
  "ListBuckets.xml.element_order",
  "ListObjectVersions.shapes.ObjectVersion.xml.element_order",
]
target  = "ListObjects"
summary = "Sibling order is a wire contract in every listing of this family and inside the version entry as well; the bucket name and the cursors precede the entry list."
cases   = ["c-list-0015", "c-list-0018", "c-list-0022"]

  [[quirk.evidence]]
  kind    = "s3s-pr"
  ref     = "https://github.com/s3s-project/s3s/pull/480"
  summary = "Upstream emitted listing elements in model order and broke a strict client until the order was corrected."

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_ListObjects.html"
  summary = "The documented response syntax fixes the sibling order the golden comparison pins."

[[quirk]]
id      = "q-encoding-0067"
kind    = "encoding_type"
classification = "mutable"
mutation_dimension = "element_encoding"
mutation_sources = [
  "ListObjects.xml.url_encoded_fields",
  "ListObjectVersions.xml.url_encoded_fields",
]
target  = "ListObjects"
summary = "The set of members percent encoded under url encoding is defined per operation, so the first version encodes its marker pair and the version listing encodes its key marker pair instead."
cases   = ["c-list-0017", "c-list-0035"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_ListObjects.html"
  summary = "Names the members the first listing version encodes and states that the encoding type is echoed back."

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_ListObjectVersions.html"
  summary = "Names a different member set for the version listing, including its key marker pair."

[[quirk]]
id      = "q-maxkeys-0068"
kind    = "computed_member"
classification = "mutable"
mutation_dimension = "default_value"
mutation_sources = ["ListObjects.input.MaxKeys.default_int", "ListObjectVersions.input.MaxKeys.default_int"]
target  = "ListObjects.MaxKeys"
summary = "Every listing echoes the page size the request asked for rather than the number of entries it returned, which is what lets a client tell a short page from a last page."
cases   = ["c-list-0001", "c-list-0002", "c-list-0005", "c-list-0027", "c-list-0028", "c-list-0040"]

  [[quirk.evidence]]
  kind    = "s3s-issue"
  ref     = "https://github.com/s3s-project/s3s/issues/350"
  summary = "Upstream echoed its own effective page size, and a client comparing it against the request paged forever."

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_ListObjectsV2.html"
  summary = "Defines the element as the maximum number of keys the request asked to be returned."

[[quirk]]
id      = "q-interleave-0069"
kind    = "element_order"
classification = "contract"
target  = "ListObjectVersions"
summary = "Version entries and delete marker entries are one sequence ordered by key and version, not two blocks, so the two element names alternate within a page."
cases   = ["c-list-0013", "c-list-0014"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_ListObjectVersions.html"
  summary = "Describes one ordered result whose entries are the versions and delete markers of the same key range."

[[quirk]]
id      = "q-marker-0070"
kind    = "opaque_token"
classification = "contract"
target  = "ListObjectVersions"
summary = "The version listing has two cursors and they are ordered: the version cursor is meaningless without the key cursor, so it alone is a malformed request rather than a page one."
cases   = ["c-list-0033", "c-list-0034"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_ListObjectVersions.html"
  summary = "States that the version cursor is only honoured when the key cursor is supplied with it."

[[quirk]]
id      = "q-buckets-0071"
kind    = "pagination"
classification = "contract"
target  = "ListBuckets"
summary = "The bucket listing gained a cursor, a page size, a prefix and a region filter long after the key listings, so a response carrying none of them is still a complete one."
cases   = ["c-list-0016", "c-list-0044"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_ListBuckets.html"
  summary = "Documents the four request parameters the bucket listing gained and the cursor element the response echoes."

[[quirk]]
id      = "q-token-form-0075"
kind    = "wire_form"
classification = "contract"
target  = "ListObjectsV2.ContinuationToken"
summary = "A cursor is a value this service minted, so one longer than anything it mints, one whose percent-decoded bytes are not text, and one spelling a parent traversal are all malformed input refused before the listing runs, rather than opaque bytes carried into whatever the listing does with them."
cases   = ["c-list-0029", "c-list-0030", "c-list-0031"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_ListObjectsV2.html"
  summary = "Describes the continuation token as an opaque value obtained from a previous response, which bounds both its size and the bytes it can hold."

  [[quirk.evidence]]
  kind    = "observed"
  ref     = "https://cwe.mitre.org/data/definitions/22.html"
  summary = "Building a path from external input without normalising it is a documented traversal class, and a cursor is the value in this family an implementation is most tempted to give path structure to."

[[quirk]]
id      = "q-max-keys-0073"
kind    = "bounded_range"
classification = "mutable"
codec_min = 0
codec_max = 1000
mutation_dimension = "integer_range"
target  = "ListObjectsV2.MaxKeys"
summary = "A page size runs from zero to a thousand inclusive, and a value outside it is refused rather than clamped, because a client that asked for a hundred thousand and silently read a thousand concludes the bucket is small."
cases   = ["c-list-0028"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_ListObjectsV2.html"
  summary = "Documents the parameter as an integer with a defined ceiling, which makes a value outside that ceiling malformed input rather than a request to clamp."
