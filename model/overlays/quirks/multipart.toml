# Quirks of the multipart upload family: CreateMultipartUpload, UploadPart,
# CompleteMultipartUpload, AbortMultipartUpload, ListParts, ListMultipartUploads.
#
# One [[quirk]] per behaviour the pinned Smithy model does not state, or states in a way a
# generator would get wrong if nobody wrote down that the difference is deliberate. `summary` and
# every `evidence.summary` are written by this project; upstream issue and documentation prose
# stays under its author's copyright and is never pasted here.
#
# Ids continue the global counter (the object family ended at 0027). They are not per family: two
# families minting the same number is exactly what the single counter prevents.

[[quirk]]
id      = "q-mpu-etag-0028"
kind    = "etag_composite"
target  = "CompleteMultipartUpload.ETag"
summary = "The entity tag of a completed upload is a digest over the concatenated raw part digests followed by a hyphen and the part count, never a digest of the assembled object, and an empty part list is refused rather than digested."
cases   = ["c-mpu-0002", "c-mpu-0003", "c-mpu-0019"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/userguide/checking-object-integrity.html"
  summary = "Describes the multipart entity tag as a digest of the part digests carrying a part-count suffix, distinguishing it from a whole-object digest."

  [[quirk.evidence]]
  kind    = "s3s-issue"
  ref     = "https://github.com/s3s-project/s3s/issues/550"
  summary = "Upstream computed the tag over the assembled object, so every client that verified integrity concluded the object was corrupt."

  [[quirk.evidence]]
  kind    = "s3s-pr"
  ref     = "https://github.com/s3s-project/s3s/pull/556"
  summary = "The fix derives the tag from the part digests and refuses an empty part list with a dedicated code."

[[quirk]]
id      = "q-mpu-root-0029"
kind    = "wire_root_name"
target  = "CreateMultipartUpload"
summary = "The response root element is the initiate spelling rather than the operation or shape name, so a generator that derived the root from either would produce a document no client parses."
cases   = ["c-mpu-0004"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_CreateMultipartUpload.html"
  summary = "The documented response syntax shows a root element whose name does not match the operation name."

[[quirk]]
id      = "q-mpu-request-root-0030"
kind    = "wire_root_name"
target  = "CompleteMultipartUpload.MultipartUpload"
summary = "The accepted request root is the completion verb while the model shape is the completed-participle spelling, and the model carries the wire name on the member rather than on the shape, so the payload decoder cannot take the shape name."
cases   = ["c-mpu-0005", "c-mpu-0033"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_CompleteMultipartUpload.html"
  summary = "The documented request syntax names a root element that differs from the structure name the model uses for the same body."

  [[quirk.evidence]]
  kind    = "s3s-issue"
  ref     = "https://github.com/s3s-project/s3s/issues/2"
  summary = "Upstream rejected ordinary SDK traffic because it matched the request body against the shape name instead of the wire name."

[[quirk]]
id      = "q-mpu-part-0031"
kind    = "flattened_list"
target  = "ListParts.Parts"
summary = "Each part element repeats directly under the result root with no wrapper element around the sequence, so a wrapped rendering is a document every SDK reads as an empty page."
cases   = ["c-mpu-0010"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_ListParts.html"
  summary = "The documented response syntax repeats the part element as a direct child of the result root."

[[quirk]]
id      = "q-mpu-upload-0032"
kind    = "flattened_list"
target  = "ListMultipartUploads.Uploads"
summary = "Each upload element repeats directly under the result root with no wrapper, and the element name is not the member name, so both halves have to come from the model rather than from the member spelling."
cases   = ["c-mpu-0011", "c-mpu-0012"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_ListMultipartUploads.html"
  summary = "The documented response syntax repeats an upload element directly under the result root under a name that differs from the member name."

[[quirk]]
id      = "q-mpu-late-error-0033"
kind    = "error_after_200"
target  = "CompleteMultipartUpload"
summary = "The response head is committed before the outcome is known, so a failure arrives as an error document under a success status, and every header the operation can return has to be in that already-committed head."
cases   = ["c-mpu-0001", "c-mpu-0015", "c-mpu-0016", "c-mpu-0017"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_CompleteMultipartUpload.html"
  summary = "AWS states this request can answer a success status whose body carries an error, and that a client must read the body to learn the outcome."

  [[quirk.evidence]]
  kind    = "s3s-issue"
  ref     = "https://github.com/s3s-project/s3s/issues/30"
  summary = "Completion took long enough that clients timed out before any bytes arrived, which is the reason whitespace is written while the outcome is pending."

  [[quirk.evidence]]
  kind    = "s3s-issue"
  ref     = "https://github.com/s3s-project/s3s/issues/325"
  summary = "Encryption headers were lost once the head had been flushed, because the values were produced after the point where headers could still be added."

[[quirk]]
id      = "q-mpu-trailer-0034"
kind    = "phantom_trailer"
target  = "CompleteMultipartUpload"
summary = "A trailer field is announced only when a trailer will actually be sent; announcing one that never arrives leaves strict clients waiting for a section that does not exist."
cases   = ["c-mpu-0037"]

  [[quirk.evidence]]
  kind    = "rfc"
  ref     = "https://www.rfc-editor.org/rfc/rfc9110#section-6.6.2"
  summary = "The trailer field enumerates fields the sender will place in the trailer section, so announcing one without sending it misdescribes the message."

  [[quirk.evidence]]
  kind    = "s3s-issue"
  ref     = "https://github.com/s3s-project/s3s/issues/326"
  summary = "Upstream announced a trailer field on responses that never carried a trailer section."

[[quirk]]
id      = "q-mpu-abort-0035"
kind    = "non_idempotent_delete"
target  = "AbortMultipartUpload"
summary = "Aborting succeeds with an empty no-content response and, unlike deleting an object, is not idempotent: an upload id that is unknown or already aborted answers the dedicated not-found code."
cases   = ["c-mpu-0014", "c-mpu-0032"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_AbortMultipartUpload.html"
  summary = "The documented success response carries no content, and an unknown upload id is documented as a dedicated error rather than a success."

[[quirk]]
id      = "q-mpu-attributes-etag-0036"
kind    = "etag_render"
target  = "GetObjectAttributes.ETag"
summary = "The object attributes response is the one place an entity tag is written without the surrounding quotes; it is registered with the multipart family because the value it renders is the composite tag this family produces, while the operation itself lands with its own family."
cases   = ["c-mpu-0002", "c-mpu-0018"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_GetObjectAttributes.html"
  summary = "The documented response syntax shows the entity tag element without the quotes every other rendering of the same value carries."

  [[quirk.evidence]]
  kind    = "s3s-issue"
  ref     = "https://github.com/s3s-project/s3s/issues/632"
  summary = "Upstream held two conflicting quoting rules in two files, which is why the rendering context is part of the type here rather than a convention."

[[quirk]]
id      = "q-mpu-upload-id-0037"
kind    = "capability_token"
target  = "UploadPart.UploadId"
summary = "An upload id is a server-minted capability, not a name the caller chose: it is resolved against the bucket and key of the request before anything is written, an unknown id answers the not-found code, and one belonging to another resource is refused rather than honoured."
cases   = ["c-mpu-0028", "c-mpu-0029", "c-mpu-0030", "c-mpu-0031"]

  [[quirk.evidence]]
  kind    = "s3s-issue"
  ref     = "https://github.com/s3s-project/s3s/issues/51"
  summary = "Upstream accepted any upload id without checking what it belonged to, so knowing an id was enough to act on somebody else's upload."

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_UploadPart.html"
  summary = "The request is documented as naming a bucket, a key and an upload id together, and the id is only meaningful for that pair."

[[quirk]]
id      = "q-mpu-limits-0038"
kind    = "bounded_input"
target  = "CompleteMultipartUpload.MultipartUpload"
summary = "Part numbers run from one to ten thousand, every part except the last has a floor on its size, and the completion list must be strictly ascending with no repeats; each of the three has its own code so a client can tell them apart."
cases   = ["c-mpu-0020", "c-mpu-0024", "c-mpu-0026", "c-mpu-0027"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/userguide/qfacts.html"
  summary = "States the part-number range and the minimum size every part except the final one must reach."

  [[quirk.evidence]]
  kind    = "s3s-pr"
  ref     = "https://github.com/s3s-project/s3s/pull/281"
  summary = "Upstream did not enforce the multipart limits, so an upload could exceed the part ceiling and fail only at assembly."

[[quirk]]
id      = "q-mpu-metadata-0039"
kind    = "deferred_metadata"
target  = "CreateMultipartUpload"
summary = "User metadata, content type, storage class and the encryption settings are carried on the initiating request alone and take effect on the assembled object; a part upload carries none of them, so losing them at initiation loses them permanently."
cases   = ["c-mpu-0006", "c-mpu-0007"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_CreateMultipartUpload.html"
  summary = "The object metadata headers are documented on the initiating request and not on the part request."

  [[quirk.evidence]]
  kind    = "s3s-pr"
  ref     = "https://github.com/s3s-project/s3s/pull/129"
  summary = "Upstream dropped the metadata supplied at initiation, so it was absent from the object after completion."

[[quirk]]
id      = "q-mpu-marker-0040"
kind    = "pagination_cursor"
target  = "ListParts.NextPartNumberMarker"
summary = "A truncated listing hands back a cursor that is valid as the next request's marker, the page-size limit is echoed as the caller sent it rather than as the server clamped it, and a listing of uploads needs both the key cursor and the upload-id cursor because one key can carry several uploads."
cases   = ["c-mpu-0010", "c-mpu-0011", "c-mpu-0047", "c-mpu-0048"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_ListMultipartUploads.html"
  summary = "Documents the pair of cursors a truncated upload listing returns and how the next request supplies them."

  [[quirk.evidence]]
  kind    = "s3s-pr"
  ref     = "https://github.com/s3s-project/s3s/pull/296"
  summary = "Upstream gave the part marker the wrong type and semantics, so a second page could not be requested from the value the first page returned."

[[quirk]]
id      = "q-marker-form-0076"
kind    = "wire_form"
target  = "ListMultipartUploads.UploadIdMarker"
summary = "The upload-id cursor of an upload listing is a server-minted value that comes back through the query string, so one spelling a parent traversal — including the percent-encoded spelling, which is already decoded when the check runs — is refused before the listing reads anything."
cases   = ["c-mpu-0047"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_ListMultipartUploads.html"
  summary = "The upload-id marker is documented as a value returned by a previous listing, not as a caller-chosen name."

  [[quirk.evidence]]
  kind    = "observed"
  ref     = "https://cwe.mitre.org/data/definitions/22.html"
  summary = "Building an index or filesystem path from external input without normalising it is a documented traversal class, and resuming a listing from a marker is the obvious way to reach one."

[[quirk]]
id      = "q-part-number-0072"
kind    = "bounded_range"
target  = "UploadPart.PartNumber"
summary = "A part number runs from one to ten thousand inclusive, and one outside that range is refused before any byte is stored, because a part above the ceiling can never be completed and no abort enumerates it."
cases   = ["c-mpu-0024"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/userguide/qfacts.html"
  summary = "States the part-number range as one through ten thousand inclusive."

  [[quirk.evidence]]
  kind    = "s3s-pr"
  ref     = "https://github.com/s3s-project/s3s/pull/281"
  summary = "Upstream did not enforce the multipart limits, so an upload could exceed the part ceiling and fail only at assembly."
