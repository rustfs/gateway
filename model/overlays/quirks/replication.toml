# Quirks of the bucket replication configuration family.
#
# One [[quirk]] per behaviour the pinned Smithy model does not state, or states in a trait the
# lowering would otherwise lose. `summary` and every `evidence.summary` are written by this
# project; upstream issue and documentation prose stays under its author's copyright and is never
# pasted here.
#
# The replication runtime quirks — rule evaluation, cross-site transfer, the per-object
# x-amz-replication-status response header (PENDING/COMPLETED/FAILED/REPLICA, produced by the
# object read and HEAD encoders) — are deliberately absent: the header belongs to task P5-01
# with the operations that carry it, and the engine belongs to the storage backend. Nothing in
# this family emits that header; the closest it comes is the KMS key id and destination account
# the stored document names, and the hygiene rule that follows from that is q-repl-0010.

[[quirk]]
id      = "q-repl-0001"
kind    = "not_configured_error"
classification = "mutable"
mutation_dimension = "optionality"
mutation_sources = ["GetBucketReplication.errors.not_configured"]
target  = "GetBucketReplication"
summary = "A bucket that never had a replication document answers 404 with the operation-specific code ReplicationConfigurationNotFoundError — one of the few AWS codes whose literal ends in Error — not a generic not-found and not an empty 200."
cases   = ["c-replication-0013", "c-replication-0012"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/ErrorResponses.html"
  summary = "The replication-related error code list documents ReplicationConfigurationNotFoundError with HTTP status 404 for a bucket with no replication configuration."

  [[quirk.evidence]]
  kind    = "s3s-pr"
  ref     = "https://github.com/s3s-project/s3s/pull/515"
  summary = "Upstream had to backfill missing error codes because clients branch on the specific code string, this family's included."

[[quirk]]
id      = "q-repl-0002"
kind    = "flattened_list"
classification = "mutable"
mutation_dimension = "wrap_strategy"
mutation_sources = [
  "GetBucketReplication.shapes.ReplicationConfiguration.fields.Rules.list_flattened",
  "PutBucketReplication.shapes.ReplicationConfiguration.fields.Rules.list_flattened",
]
target  = "ReplicationConfiguration.Rules"
summary = "The rules repeat as sibling Rule elements directly under the ReplicationConfiguration root; a Rules wrapper element would make every SDK read zero rules and conclude the bucket replicates nothing."
cases   = ["c-replication-0002", "c-replication-0003", "c-replication-0009", "c-replication-0010"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_GetBucketReplication.html"
  summary = "The documented response syntax shows Rule elements as direct children of the ReplicationConfiguration root with no intermediate wrapper."

  [[quirk.evidence]]
  kind    = "s3s-issue"
  ref     = "https://github.com/s3s-project/s3s/issues/264"
  summary = "Upstream shipped response roots without the S3 xmlns and strict clients refused them, which is why the root and its namespace are pinned byte for byte."

[[quirk]]
id      = "q-repl-0003"
kind    = "idempotent_delete"
classification = "contract"
target  = "DeleteBucketReplication"
summary = "The delete answers 204 with no body whether or not a configuration existed, so removing the replication document of an unconfigured bucket is a success rather than a 404."
cases   = ["c-replication-0014", "c-replication-0012"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_DeleteBucketReplication.html"
  summary = "The operation documents a 204 No Content success and lists no not-found error for a missing configuration."

[[quirk]]
id      = "q-repl-0004"
kind    = "checksum_required"
classification = "mutable"
mutation_dimension = "optionality"
mutation_sources = ["PutBucketReplication.checksum.http_checksum_required"]
target  = "PutBucketReplication"
summary = "The write demands an integrity claim on the body, so a request with neither Content-MD5 nor an x-amz-checksum header is refused with 400 before the document is parsed."
cases   = ["c-replication-0015", "c-replication-0001"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutBucketReplication.html"
  summary = "The request documents Content-MD5 as the base64 digest of the configuration, which the pinned model spells as a request checksum requirement."

[[quirk]]
id      = "q-repl-0005"
kind    = "lenient_unknown_elements"
classification = "contract"
target  = "PutBucketReplication"
summary = "Unknown elements inside the request document are skipped rather than refused — and the stakes are higher here than in any sibling family, because RustFS parses the stored replication document fail-closed: a decoder that got stricter on the next release would not silently switch replication off, it would make the bucket unusable."
cases   = ["c-replication-0019"]

  [[quirk.evidence]]
  kind    = "s3s-issue"
  ref     = "https://github.com/s3s-project/s3s/issues/613"
  summary = "AWS ignores unknown elements in request XML, and upstream had to relax its decoder to match after strict parsing broke real clients."

  [[quirk.evidence]]
  kind    = "s3s-pr"
  ref     = "https://github.com/s3s-project/s3s/pull/617"
  summary = "The upstream fix that makes unknown request elements a skip rather than an error, which is the behaviour this decoder generates by construction."

[[quirk]]
id      = "q-repl-0006"
kind    = "schema_version_exclusive"
classification = "contract"
target  = "ReplicationRule"
summary = "A rule is either V2 — a Filter, which then demands Priority and DeleteMarkerReplication beside it — or V1 — a bare rule-level Prefix, which carries neither; a rule mixing the two schema versions is refused with 400 InvalidRequest, because the version of a stored configuration is decided by exactly this distinction."
cases   = [
  "c-replication-0005",
  "c-replication-0020",
  "c-replication-0021",
  "c-replication-0022",
  "c-replication-0023",
  "c-replication-0034",
]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutBucketReplication.html"
  summary = "The operation documents that a configuration adding the Filter element must also add DeleteMarkerReplication, Status and Priority."

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/userguide/replication-add-config.html"
  summary = "The backward-compatibility section defines V2 as the format whose rules carry Filter and V1 as the format whose rules carry a direct Prefix child, with delete-marker handling implicit in V1 rather than spelled."

[[quirk]]
id      = "q-repl-0007"
kind    = "filter_grammar"
classification = "contract"
target  = "ReplicationRuleFilter"
summary = "A Filter takes at most one direct child — Prefix, Tag or And — and several conditions must nest inside one And, which exists only to combine and therefore needs at least two; two direct siblings are refused as MalformedXML. An empty Filter passes: it is the documented spelling for a rule that applies to every object."
cases   = ["c-replication-0004", "c-replication-0024", "c-replication-0025"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_ReplicationRuleFilter.html"
  summary = "The type documents that a Filter must specify exactly one Prefix, Tag or And child element, and that combined conditions are wrapped in an And."

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/userguide/replication-add-config.html"
  summary = "The filter walkthrough shows an empty Filter applying the rule to all objects, and every multi-condition example wrapped in a single And."

[[quirk]]
id      = "q-repl-0008"
kind    = "value_constraint"
classification = "contract"
target  = "ReplicationRule.ID"
summary = "A rule ID is bounded at 255 characters and must be unique within the configuration, and the document as a whole is bounded at 1000 rules; an ID over the cap or duplicated is refused with 400 InvalidArgument, the rule-count overflow with 400 InvalidRequest."
cases   = ["c-replication-0027", "c-replication-0028"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_ReplicationRule.html"
  summary = "The ID member is documented as a unique identifier for the rule with a maximum of 255 characters."

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/userguide/replication-add-config.html"
  summary = "The guide documents the per-bucket cap of 1000 replication rules and states the limit is not adjustable."

[[quirk]]
id      = "q-repl-0009"
kind    = "lenient_duplicates"
classification = "contract"
target  = "ReplicationRule.Priority"
summary = "Two rules carrying the same Priority are stored and echoed rather than refused: AWS documents no uniqueness requirement, only how the engine resolves a conflict between overlapping rules by taking the highest number — so refusing duplicates would invent a rule a stored document could already be breaking, under the one configuration RustFS parses fail-closed."
cases   = ["c-replication-0026"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_ReplicationRule.html"
  summary = "The Priority member documents only precedence between conflicting rules — the higher number wins — and states no uniqueness constraint the codec could enforce."

[[quirk]]
id      = "q-repl-0010"
kind    = "secret_hygiene"
classification = "contract"
target  = "EncryptionConfiguration.ReplicaKmsKeyID"
summary = "The replica KMS key id and the destination account id are configuration secrets: the stored document echoes them on the read — that is the documented GET behaviour — but every refusal message is a constant that never carries them, so a rejected write cannot leak a key id or an account id into an error body or a log line."
cases   = ["c-replication-0008", "c-replication-0029"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_GetBucketReplication.html"
  summary = "The documented response echoes the stored destination configuration including the ReplicaKmsKeyID and Account members, which pins the echo as read behaviour rather than error behaviour."

  [[quirk.evidence]]
  kind    = "s3s-pr"
  ref     = "https://github.com/s3s-project/s3s/pull/319"
  summary = "Upstream's secret-handling fixes are the record of how easily key material reaches unintended surfaces once it is carried as a plain string."

[[quirk]]
id      = "q-repl-0011"
kind    = "arn_valued_member"
classification = "contract"
target  = "Destination.Bucket"
summary = "The destination Bucket member is typed as a bucket name in the model but carries an ARN on the wire — arn:aws:s3:::bucket — so it is decoded as a plain string and neither the bucket-name grammar nor any ARN grammar is enforced on it: the model's type is unenforceable and a stricter grammar would be this project's invention."
cases   = ["c-replication-0006", "c-replication-0007"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_Destination.html"
  summary = "The Bucket member is documented as the Amazon Resource Name of the destination bucket, a value the S3 bucket-name grammar itself would refuse."

[[quirk]]
id      = "q-repl-0012"
kind    = "lenient_value_set"
classification = "contract"
target  = "ReplicationRule.Status"
summary = "Nonempty Status values outside Enabled/Disabled remain accepted and echoed. HTTP empty required Status is refused by q-xml-status-0001; persisted configuration decoding remains lenient for both empty and unknown values."
cases   = ["c-replication-0030"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_ReplicationRule.html"
  summary = "The Status member documents Enabled and Disabled as its value set; passing out-of-set spellings through is this project's recorded fail-open decision."

  [[quirk.evidence]]
  kind    = "s3s-issue"
  ref     = "https://github.com/s3s-project/s3s/issues/428"
  summary = "Upstream's replication configuration types could not round-trip stored documents, the failure a strict enum decode reintroduces."

[[quirk]]
id      = "q-repl-0013"
kind    = "header_passthrough"
classification = "contract"
target  = "PutBucketReplication.Token"
summary = "The x-amz-bucket-object-lock-token request header is parsed into the input and passed through to the backend untouched: whether the token actually permits enabling Object Lock on the source bucket is the storage backend's semantic question, and the codec neither requires nor validates the header."
cases   = ["c-replication-0011"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutBucketReplication.html"
  summary = "The request documents the optional x-amz-bucket-object-lock-token header as a token allowing Object Lock to be enabled for an existing bucket."

[[quirk]]
id      = "q-repl-0014"
kind    = "all_unknown_children"
classification = "mutable"
mutation_dimension = "all_unknown_children"
codec_value = "reject"
target  = "ReplicationRule.Filter"
summary = "A syntactically non-empty Filter whose children are all unknown is refused before decoding can collapse it to the explicit empty Filter that means every object; an empty Filter and a known condition beside unknown children remain accepted."
cases   = ["c-replication-0035"]

  [[quirk.evidence]]
  kind    = "other"
  ref     = "https://github.com/rustfs/gateway/issues/250"
  summary = "A lower-case Prefix or unknown wrapper was observed to decode as an empty filter, silently widening a scoped replication rule to every object."
