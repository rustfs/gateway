# Quirks of the event-notification configuration.
#
# One [[quirk]] per behaviour the pinned Smithy model does not state, or states in a trait the
# lowering would otherwise lose. `summary` and every `evidence.summary` are written by this
# project; upstream issue and documentation prose stays under its author's copyright and is never
# pasted here.

[[quirk]]
id      = "q-ntf-0001"
kind    = "not_configured_error"
classification = "mutable"
mutation_dimension = "optionality"
mutation_sources = ["GetBucketNotificationConfiguration.errors.not_configured"]
target  = "GetBucketNotificationConfiguration"
summary = "A bucket that delivers no events answers 200 with an empty NotificationConfiguration element rather than a 404, so a client reads no subscriptions rather than a missing resource."
cases   = ["c-bucketconfig-0024", "c-bucketconfig-0011"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_GetBucketNotificationConfiguration.html"
  summary = "The operation documents an empty configuration element as the response for a bucket with no notifications and lists no not-found error for it."

  [[quirk.evidence]]
  kind    = "s3s-pr"
  ref     = "https://github.com/s3s-project/s3s/pull/193"
  summary = "Upstream had to correct the shape of this response, and the empty-configuration case was part of what was wrong."

[[quirk]]
id      = "q-ntf-0002"
kind    = "flattened_list"
classification = "mutable"
mutation_dimension = "wrap_strategy"
mutation_sources = [
  "GetBucketNotificationConfiguration.output.TopicConfigurations.list_flattened",
  "GetBucketNotificationConfiguration.output.QueueConfigurations.list_flattened",
  "GetBucketNotificationConfiguration.output.LambdaFunctionConfigurations.list_flattened",
  "GetBucketNotificationConfiguration.shapes.TopicConfiguration.fields.Events.list_flattened",
  "GetBucketNotificationConfiguration.shapes.QueueConfiguration.fields.Events.list_flattened",
  "GetBucketNotificationConfiguration.shapes.LambdaFunctionConfiguration.fields.Events.list_flattened",
  "PutBucketNotificationConfiguration.shapes.NotificationConfiguration.fields.TopicConfigurations.list_flattened",
  "PutBucketNotificationConfiguration.shapes.NotificationConfiguration.fields.QueueConfigurations.list_flattened",
  "PutBucketNotificationConfiguration.shapes.NotificationConfiguration.fields.LambdaFunctionConfigurations.list_flattened",
  "PutBucketNotificationConfiguration.shapes.TopicConfiguration.fields.Events.list_flattened",
  "PutBucketNotificationConfiguration.shapes.QueueConfiguration.fields.Events.list_flattened",
  "PutBucketNotificationConfiguration.shapes.LambdaFunctionConfiguration.fields.Events.list_flattened",
]
target  = "NotificationConfiguration"
summary = "All three destination lists and the Event list inside each of them repeat as sibling elements directly under their parent with no wrapper, which is the opposite of the website family's wrapped routing rules."
cases   = ["c-bucketconfig-0011", "c-bucketconfig-0010"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutBucketNotificationConfiguration.html"
  summary = "The documented request syntax shows the topic, queue and function configurations as direct children of the root with no intermediate element, and the event names likewise inside each of them."

[[quirk]]
id      = "q-ntf-0003"
kind    = "checksum_required"
classification = "mutable"
mutation_dimension = "optionality"
mutation_sources = ["PutBucketNotificationConfiguration.checksum.http_checksum_required"]
target  = "PutBucketNotificationConfiguration"
summary = "The v2 notification write is the second of two writes in this band that carry no integrity requirement, so a body with neither Content-MD5 nor an x-amz-checksum header is accepted."
cases   = ["c-bucketconfig-0010", "c-bucketconfig-0042"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutBucketNotificationConfiguration.html"
  summary = "The request reference for the current notification write lists no Content-MD5 header, unlike the retired operation it replaced and unlike the six other writes in this band."

[[quirk]]
id      = "q-ntf-0004"
kind    = "element_name"
classification = "mutable"
mutation_dimension = "element_rename"
mutation_sources = [
  "GetBucketNotificationConfiguration.output.LambdaFunctionConfigurations.wire_name",
  "GetBucketNotificationConfiguration.shapes.LambdaFunctionConfiguration.fields.LambdaFunctionArn.wire_name",
  "GetBucketNotificationConfiguration.shapes.QueueConfiguration.fields.QueueArn.wire_name",
  "GetBucketNotificationConfiguration.shapes.TopicConfiguration.fields.TopicArn.wire_name",
  "GetBucketNotificationConfiguration.shapes.NotificationConfigurationFilter.fields.Key.wire_name",
  "PutBucketNotificationConfiguration.shapes.NotificationConfiguration.fields.LambdaFunctionConfigurations.wire_name",
  "PutBucketNotificationConfiguration.shapes.LambdaFunctionConfiguration.fields.LambdaFunctionArn.wire_name",
  "PutBucketNotificationConfiguration.shapes.QueueConfiguration.fields.QueueArn.wire_name",
  "PutBucketNotificationConfiguration.shapes.TopicConfiguration.fields.TopicArn.wire_name",
  "PutBucketNotificationConfiguration.shapes.NotificationConfigurationFilter.fields.Key.wire_name",
]
target  = "NotificationConfiguration.LambdaFunctionConfigurations"
summary = "Five members of this document are spelled differently on the wire than in the model: the function configuration is CloudFunctionConfiguration, its ARN is CloudFunction, the queue and topic ARNs are Queue and Topic, and the key filter is S3Key."
cases   = ["c-bucketconfig-0011"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutBucketNotificationConfiguration.html"
  summary = "The documented request syntax uses the historical element names throughout, which the pinned model records as xmlName overrides on those five members."

[[quirk]]
id      = "q-ntf-0005"
kind    = "lenient_enum"
classification = "contract"
target  = "NotificationConfiguration"
summary = "An event name this build has no constant for is stored and echoed as sent rather than refused, because AWS adds event types continuously and a gateway that refused unknown ones would reject configurations AWS accepts until it was rebuilt."
cases   = ["c-bucketconfig-0048"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/userguide/notification-how-to-event-types-and-destinations.html"
  summary = "The event-type list has grown repeatedly since the operation was introduced, which is what makes a closed set here a promise that expires."
