[[quirk]]
id      = "q-select-0006"
kind    = "closed_value_set"
classification = "contract"
mutation_dimension = "select_expression_type_values"
contract_value = "sql_only"
target  = "SelectObjectContent.ExpressionType"
summary = "ExpressionType accepts exactly SQL."
cases   = ["c-select-restore-0030"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_SelectObjectContent.html"
  summary = "The operation documents SQL as the only expression type and publishes InvalidExpressionType and InvalidCompressionFormat as the answers for the two closed sets."

[[quirk]]
id      = "q-select-0007"
kind    = "lenient_unknown_elements"
classification = "mutable"
mutation_dimension = "unknown_element_policy"
codec_value = "skip"
target  = "SelectObjectContent.SelectObjectContentRequest"
summary = "Unknown elements inside a SelectObjectContentRequest are skipped."
cases   = ["c-select-restore-0009"]

  [[quirk.evidence]]
  kind    = "s3s-issue"
  ref     = "https://github.com/s3s-project/s3s/issues/613"
  summary = "AWS ignores unknown elements in request XML, and upstream had to relax its decoder to match after strict parsing broke real clients."

[[quirk]]
id      = "q-select-0008"
kind    = "xml_root"
classification = "mutable"
mutation_dimension = "element_rename"
mutation_sources = ["SelectObjectContent.xml.request_root"]
target  = "SelectObjectContent"
summary = "This is the only request in the supported surface whose XML members sit at operation level rather than inside a payload structure, so the body root is the input shape's own name, SelectObjectContentRequest; MinIO's SelectRequest is accepted as an exact alias of it, decoding into the same DTO under the same member rules, and a body rooted at anything else is 400 MalformedXML."
cases   = ["c-select-restore-0032", "c-select-restore-0033", "c-select-restore-0034", "c-select-restore-0049", "c-select-restore-0055", "c-select-restore-0057"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_SelectObjectContent.html"
  summary = "The documented request syntax roots the body at a SelectObjectContentRequest element carrying the expression and the serialization descriptions directly."

  [[quirk.evidence]]
  kind    = "s3s-pr"
  ref     = "743"
  summary = "Upstream accepts SelectRequest as an exact root alias of SelectObjectContentRequest for the MinIO-shaped clients RustFS serves (rustfs/backlog#1626); MinIO's own select.go roots the request at SelectRequest and reads the AWS root as the legacy form."

[[quirk]]
id      = "q-select-0009"
kind    = "event_stream_response"
classification = "contract"
mutation_dimension = "select_response_shape"
contract_value = "event_stream"
target  = "SelectObjectContent"
summary = "SelectObjectContent returns the event-stream answer shape and bypasses the document encoder."
cases   = ["c-select-restore-0035", "c-select-restore-0054"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/RESTSelectObjectAppendix.html"
  summary = "The response is a sequence of self-framed messages, each a prelude with its own CRC, a header block, a payload and a message CRC, rather than one document."

  [[quirk.evidence]]
  kind    = "s3s-issue"
  ref     = "https://github.com/s3s-project/s3s/issues/350"
  summary = "Upstream shipped responses that ended without completing, which hangs a client — the failure a partly-wired stream produces and a refusal does not."

  [[quirk.evidence]]
  kind    = "rfc"
  ref     = "https://www.rfc-editor.org/rfc/rfc1952#section-8"
  summary = "The framing digest is CRC-32/ISO-HDLC, whose published check value over the nine ASCII digits is what pins this implementation to the same parameterisation as everybody else's."

[[quirk]]
id      = "q-restore-0008"
kind    = "version_selector"
classification = "contract"
mutation_dimension = "restore_version_selector"
contract_value = "preserve"
target  = "RestoreObject.VersionId"
summary = "versionId selects which version of the object is retrieved, so it is decoded and carried to the handler rather than dropped: a backend that ignored it would retrieve the current version and report success for a request about another one, which is indistinguishable from having honoured it."
cases   = ["c-select-restore-0018", "c-select-restore-0050", "c-select-restore-0051"]

  [[quirk.evidence]]
  kind    = "aws-doc"
  ref     = "https://docs.aws.amazon.com/AmazonS3/latest/API/API_RestoreObject.html"
  summary = "The operation documents versionId as the query parameter naming which version of the object the retrieval applies to."

