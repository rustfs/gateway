cases = ["c-cors-0028"]
  [[quirk.evidence]]
  kind = "rfc"
  ref = "https://fetch.spec.whatwg.org/#http-cors-protocol"
  summary = "The CORS protocol defines the preflight max-age response field."

[[quirk]]
id = "q-cors-0023"
kind = "preflight_header_policy"
classification = "contract"
mutation_dimension = "cors_preflight_expose_policy"
contract_value = "include"
target = "CORSRule.ExposeHeaders"
summary = "A matched rule's exposed headers are emitted on this runtime's preflight response."
