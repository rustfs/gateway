# The scalar vocabulary: Smithy shape name -> IR scalar. The one cross-family overlay file.
#
# This is what keeps `ETag`, `ObjectKey` and the opaque pagination tokens out of the generic
# `String` bucket without a per-field override at every use site. An `ETag` takes its rendering
# from its binding position; there is no default.
#
# It is deliberately NOT sharded per family. A shape name means the same thing whichever family
# reads it, so two families holding two answers for `ETag` is not a merge to resolve — it is a
# contradiction, and a single file is the cheapest way to make it impossible. Everything
# per-operation lives in `ops/<family>.toml`; loading fails if this file carries any of it.

[scalar]
AccountId = "String"
BucketName = "BucketName"
ETag = "ETag"
Expiration = "OpaqueString"
Expires = "OpaqueString"
NextToken = "OpaqueString"
ObjectKey = "ObjectKey"
# A byte range is parsed, never round-tripped: RFC 9110 requires an unusable one to be ignored,
# and that rule has to live in the type or every read operation writes it again.
Range = "Range"
Token = "OpaqueString"
