[package]
name = "rustfs-gateway-compat-sut"
description = "Client-matrix system under test: the filesystem backend behind a real listener"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "compat-sut"
path = "src/main.rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[features]
# Test-only corpus recording (rustfs/backlog#1763): `--corpus-record <file> --corpus-src <src>`
# writes every served S3 request as corpus JSONL. Never add this to `default`; a build without it
# has no recorder at all. scripts/check_recorder_not_default.sh.
corpus-record = ["dep:rustfs-gateway-corpus-recorder"]

[dependencies]
rustfs-gateway-corpus-recorder = { workspace = true, optional = true, features = ["corpus-record"] }
rustfs-gateway = { workspace = true }
# Path-only: the reference backend is not a workspace dependency of anything else, and this
# launcher is repository tooling rather than a ring member, so it does not open a new shared edge.
rustfs-gateway-fs = { path = "../../crates/fs" }
rustfs-gateway-server = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
http-body = { workspace = true }
# The optional encrypted listener (rustfs/gateway#719): rcgen generates the throwaway authority for
# `--tls-self-signed`, and rustls' re-exported PEM reader loads `--tls-cert`/`--tls-key`. Both are
# already workspace dependencies of the server crate's own TLS tests.
rcgen = { workspace = true }
rustls = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tower = { workspace = true, features = ["util"] }
# The launcher's own log (`src/logging.rs`): the gateway reports through `tracing`.
tracing = { workspace = true }

[dev-dependencies]
# The launcher's own tests drive signed requests through the very service `main` serves, so they
# need the signer any SDK would use and the digest it puts in `x-amz-content-sha256`.
sha2 = { workspace = true }
# An independent SigV4 signer for requests the gateway's own signer will not mint: presigned
# `X-Amz-Expires` spellings legacy RustFS accepts (`0`, a leading `+`) and hand-framed aws-chunked
# uploads whose trailers disagree with their head.
hmac = { workspace = true }
# `tests/tls.rs` dials the real binary over both listeners, as a client would.
tokio = { workspace = true, features = ["io-util", "net"] }
tokio-rustls = { workspace = true }
