# Nightly client compatibility matrix.
#
# Deliberately NOT a pull-request check. A full run is tens of minutes and the gate budget is ten
# (AGENTS.md, "CI budget"); `scripts/check_compat_matrix.sh` fails if anyone attaches it to
# `pull_request`. What the gate does check is cheap and static: that the pins are exact, that the
# known-failure list only shrank, and that the README table still matches the manifest.
#
# `sut: external` measures an S3 endpoint started elsewhere (a RustFS candidate, rustfs/backlog#2776)
# instead of the launcher: ci/compat/run_matrix.sh --external puts `compat-sut --external` in front of
# it, so the wire evidence is still the server side's, and the manifest records `measured_against`.
# The endpoint's credentials come from the COMPAT_EXTERNAL_ACCESS_KEY / COMPAT_EXTERNAL_SECRET_KEY
# secrets. Such a run never overwrites the published manifest; its artifact is checked with
# `scripts/check_compat_matrix.sh --matrix`, which requires sut-unregistered = 0 for RustFS.
name: Client matrix

on:
  schedule:
    # 03:20 UTC, after the daily suite, so a matrix failure is not competing with it for attention.
    - cron: "20 3 * * *"
  workflow_dispatch:
    inputs:
      clients:
        description: "Comma-separated client subset (default: every pinned client)"
        required: false
        default: ""
      scenarios:
        description: "Comma-separated scenario subset (default: every scenario)"
        required: false
        default: ""
      sut:
        description: >-
          `gateway-fs` measures the in-repository launcher. `external` measures the endpoint below
          through `compat-sut --external`, with the endpoint's own credentials from the
          COMPAT_EXTERNAL_ACCESS_KEY / COMPAT_EXTERNAL_SECRET_KEY secrets.
        type: choice
        default: gateway-fs
        options:
          - gateway-fs
          - external
      endpoint:
        description: "The external endpoint, http://host:port (sut: external only)"
        required: false
        default: ""
      product:
        description: "What the external endpoint is; rustfs requires sut-unregistered = 0 (sut: external only)"
        required: false
        default: rustfs

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: Client matrix
    # Release build plus the pinned clients. No Docker daemon, so the 4-vCPU pool.
    runs-on: sm-standard-4
    # A full run is 30-90 minutes by design. The ceiling is generous on purpose: a matrix killed by
    # its own clock reports exit 124, which reads exactly like a client failure.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install host tools
        run: bash scripts/ci_install_host_tools.sh
      # Every rust-toolchain.toml component up front, as the bootstrap job does: the aws-sdk-rust
      # driver builds under target/compat-clients, inside this checkout, so rustup honours the file
      # there and otherwise tries to add the components mid-install, which fails on this runner with
      # `detected conflict: 'bin/cargo-clippy'`.
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # pinned action revision
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy, rust-src, rust-analyzer
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: "1.26"
          cache: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      # Toolchains for the SDK driver programs under compat/drivers/ (the `program` install method).
      # The SDK versions come from each driver's own lock file, checked against compat/versions.toml.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      # The self-hosted image gives the runner no write access to /usr/share/dotnet, the action's
      # default, so the SDK goes into the job's temporary directory.
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      # Maven builds the two Java driver programs; it is a build tool, not a client under test, so it
      # is pinned here by release and digest rather than in compat/versions.toml. The digest is the
      # one Apache publishes beside the archive, and it matches the one Homebrew's formula pins.
      - name: Install Maven
        env:
          MAVEN_VERSION: "3.9.16"
          MAVEN_SHA512: "831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6"
        run: |
          archive="$RUNNER_TEMP/apache-maven.tar.gz"
          curl -sSfL -o "$archive" "https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          echo "${MAVEN_SHA512}  ${archive}" | sha512sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-${MAVEN_VERSION}/bin" >>"$GITHUB_PATH"

      # The pins are read from compat/versions.toml by the installer; nothing here names a version,
      # which is what scripts/check_client_versions_pinned.sh enforces.
      - name: Install pinned clients
        run: |
          python3 -m pip install --disable-pip-version-check "pyyaml==6.0.2"
          bash ci/compat/install_clients.sh

      - name: Build the system under test and the corpus CLI
        run: cargo build --release -p rustfs-gateway-compat-sut -p rustfs-gateway-corpus --bin compat-sut --bin corpus

      - name: Run the matrix
        id: matrix
        env:
          GATEWAY_COMPAT_SUT_BIN: target/release/compat-sut
          GATEWAY_COMPAT_RUN_DIR: target/compat
          # A partial run must not overwrite the published manifest; a full run writes it and the
          # artifact below is what a reviewer compares with the committed one.
          GATEWAY_COMPAT_MATRIX_OUT: target/compat/matrix.json
          # Inputs and secrets reach the runner as environment, never spliced into the script.
          MATRIX_SUT: ${{ inputs.sut || 'gateway-fs' }}
          MATRIX_ENDPOINT: ${{ inputs.endpoint || '' }}
          MATRIX_PRODUCT: ${{ inputs.product || 'rustfs' }}
          COMPAT_EXTERNAL_ACCESS_KEY: ${{ secrets.COMPAT_EXTERNAL_ACCESS_KEY }}
          COMPAT_EXTERNAL_SECRET_KEY: ${{ secrets.COMPAT_EXTERNAL_SECRET_KEY }}
        run: |
          if [ "$MATRIX_SUT" = external ]; then
            # The runner refuses an external run with no endpoint, product or credentials (exit 3).
            export GATEWAY_COMPAT_EXTERNAL_ENDPOINT="$MATRIX_ENDPOINT" GATEWAY_COMPAT_PRODUCT="$MATRIX_PRODUCT"
            export GATEWAY_COMPAT_ACCESS_KEY="$COMPAT_EXTERNAL_ACCESS_KEY" GATEWAY_COMPAT_SECRET_KEY="$COMPAT_EXTERNAL_SECRET_KEY"
            [ -n "$MATRIX_ENDPOINT" ] || { echo "::error title=matrix usage::sut=external needs the endpoint input"; exit 3; }
          fi
          bash ci/compat/run_matrix.sh \
            ${{ inputs.clients && format('--clients {0}', inputs.clients) || '' }} \
            ${{ inputs.scenarios && format('--scenarios {0}', inputs.scenarios) || '' }}

      # An external run is held to the manifest rules here, including sut-unregistered = 0 for a
      # RustFS endpoint (rustfs/backlog#2758); the launcher's own manifest is checked on every PR.
      - name: Check an external run's manifest
        if: (success() || failure()) && inputs.sut == 'external' && steps.matrix.outcome != 'skipped'
        run: bash scripts/check_compat_matrix.sh --matrix target/compat/matrix.json

      # The run's probe records become corpus material (rustfs/backlog#1765 a-cm-0008): converted,
      # sanitized, deduplicated and verified into target/compat/corpus, never into the repository's
      # corpus/. A full run must record at least one aws-chunked request; a filtered one may not.
      - name: Record the run as corpus
        if: (success() || failure()) && steps.matrix.outcome != 'skipped'
        run: |
          bash ci/compat/record_corpus.sh --run-dir target/compat --corpus-bin target/release/corpus \
            ${{ (inputs.clients || inputs.scenarios) && ' ' || '--require-chunked' }}

      - name: Probe report
        if: always()
        run: |
          echo "### Client matrix" >>"$GITHUB_STEP_SUMMARY"
          if [ -f target/compat/matrix.json ]; then
            python3 - <<'PY' >>"$GITHUB_STEP_SUMMARY"
          import json
          matrix = json.load(open("target/compat/matrix.json"))
          summary = matrix["summary"]
          print(f"- measured against {json.dumps(matrix.get('measured_against'), sort_keys=True)}")
          print(f"- pass {summary['pass']} / fail {summary['fail']} / client-unsupported {summary['client-unsupported']} / sut-unregistered {summary['sut-unregistered']}")
          print(f"- known {summary['known']} / regression {summary['regression']} / fixed {summary['fixed']}")
          streaming = matrix.get("streaming_signed_clients") or []
          print(f"- STREAMING-AWS4-HMAC-SHA256 observed from: {', '.join(streaming) or 'no client'}")
          PY
          else
            echo "- the run produced no manifest; see the job log" >>"$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload manifest and probe evidence
        if: always()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: client-matrix
          path: |
            target/compat/matrix.json
            target/compat/probe.jsonl
            target/compat/results/**
            target/compat/sut.log
            target/compat/corpus.jsonl
            target/compat/corpus/**
          if-no-files-found: warn
          retention-days: 14
