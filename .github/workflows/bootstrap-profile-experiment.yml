name: Cold bootstrap profile experiment

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# Temporary matched measurement; neither arm replaces any required CI job.
jobs:
  baseline:
    name: Cold bootstrap baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy, rust-src, rust-analyzer
      - name: Check experiment identities and failure propagation
        run: python3 scripts/test_cold_bootstrap_measurement.py
      - name: Measure the unchanged complete bootstrap
        run: scripts/ci_budget.sh 420 "cold bootstrap baseline" python3 scripts/measure_cold_bootstrap.py baseline

  no-debug:
    name: Cold bootstrap without workspace debug information
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy, rust-src, rust-analyzer
      - name: Check experiment identities and failure propagation
        run: python3 scripts/test_cold_bootstrap_measurement.py
      - name: Measure the unchanged complete bootstrap
        run: scripts/ci_budget.sh 420 "cold bootstrap no-debug" python3 scripts/measure_cold_bootstrap.py no-debug
