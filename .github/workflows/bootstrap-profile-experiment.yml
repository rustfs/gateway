name: Cold bootstrap profile diagnostic

on:
  push:
    branches: [p0/423-bootstrap-stage-diagnostics]

permissions:
  contents: read

# Outside the PR gate: two sequential 420-second commands plus setup, not a larger arm budget.
# Reverse the order on a second host to expose order effects; compare arms within each host.
jobs:
  baseline-first:
    name: Cold bootstrap diagnostic baseline-first
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy, rust-src, rust-analyzer
      - name: Check experiment identities and failure propagation
        run: python3 scripts/test_cold_bootstrap_measurement.py
      - name: Measure both complete cold builds and retain failures
        run: |
          failed=0
          for arm in baseline no-debug; do
            profile=()
            if [[ "$arm" == no-debug ]]; then
              profile=(CARGO_PROFILE_DEV_DEBUG=0 CARGO_PROFILE_TEST_DEBUG=0)
            fi
            if env "${profile[@]}" scripts/ci_budget.sh 420 "cold bootstrap $arm" python3 scripts/measure_cold_bootstrap.py "$arm"; then
              status=0
            else
              status=$?
              failed=1
            fi
            printf 'diagnostic arm=%s exit_code=%s\n' "$arm" "$status"
          done
          exit "$failed"

  candidate-first:
    name: Cold bootstrap diagnostic candidate-first
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy, rust-src, rust-analyzer
      - name: Check experiment identities and failure propagation
        run: python3 scripts/test_cold_bootstrap_measurement.py
      - name: Measure both complete cold builds and retain failures
        run: |
          failed=0
          for arm in no-debug baseline; do
            profile=()
            if [[ "$arm" == no-debug ]]; then
              profile=(CARGO_PROFILE_DEV_DEBUG=0 CARGO_PROFILE_TEST_DEBUG=0)
            fi
            if env "${profile[@]}" scripts/ci_budget.sh 420 "cold bootstrap $arm" python3 scripts/measure_cold_bootstrap.py "$arm"; then
              status=0
            else
              status=$?
              failed=1
            fi
            printf 'diagnostic arm=%s exit_code=%s\n' "$arm" "$status"
          done
          exit "$failed"
