name: e2e-mint

# ---------------------------------------------------------------------------
# WHAT THIS JOB DOES
#
#   Runs MinIO mint, a container of third-party SDK and CLI suites, against the
#   in-repository compatibility SUT, and judges each SDK's failure count
#   against ci/mint/baseline.txt. More failures than the baseline allows fails
#   the job and files one issue. Fewer is reported so the baseline can come
#   down. The whole ratchet lives in ci/mint/report.py.
#
# WHY IT IS ON CRON AND NOT IN THE PULL-REQUEST GATE
#
#   One run pulls a ~2 GB image and drives fifteen SDKs, which takes tens of
#   minutes. The pull-request gate has a hard ten-minute budget (AGENTS.md "CI
#   budget"). `scripts/check_suites_pinned.sh` asserts this workflow never
#   grows a `pull_request` or `push` trigger.
#
# WHY THE IMAGE IS PINNED BY DIGEST
#
#   minio/mint is archived, and its two remaining tags can still be re-pointed.
#   ci/mint/pins.env pins the linux/amd64 manifest digest and records how it
#   was resolved; THIRD-PARTY-NOTICES.md carries the licence review. The job
#   measures the image ci/mint/Dockerfile builds on that digest: every input
#   of the recipe is pinned by digest or SHA-256, and it only adds the .NET
#   runner and the mc diagnostics fix the pinned image lacks (#720).
#
# WHAT IS UPLOADED
#
#   Only the repository-owned aggregate: summary.md, report.json and, in
#   record mode, baseline.proposed.txt. The container console and the raw
#   per-SDK JSON stay in the runner's temporary storage and die with it, so
#   an Authorization header, a presigned query or a signature diagnostic in
#   upstream failure text never reaches an artifact or this log.
#
# AGAINST AN EXTERNAL ENDPOINT
#
#   `sut: external` with `endpoint: http://host:port` measures an S3 endpoint
#   started elsewhere, such as a RustFS binary (rustfs/gateway#1199), instead
#   of the launcher: ci/mint/run.sh --external puts `compat-sut --external` in
#   front of it on the usual MINT_SUT_* host and ports, and the report records
#   `measured_against` with the endpoint's own Server header. The endpoint's
#   credentials come from the MINT_EXTERNAL_ACCESS_KEY / MINT_EXTERNAL_SECRET_KEY
#   secrets. The run is judged against the same, unchanged ci/mint/baseline.txt.
#   The same shape as client-matrix.yml's `sut` / `endpoint` inputs.
#
# WHO READS A RED RUN
#
#   A regression files an issue against this repository, one per run. An
#   incomplete run (exit 3) is red but files nothing: it measured nothing.
# ---------------------------------------------------------------------------

on:
  schedule:
    # Tuesdays, 04:00 UTC — a day after the s3-tests run, so the two never contend.
    - cron: "0 4 * * 2"
  workflow_dispatch:
    inputs:
      mode:
        description: >-
          `ratchet` judges the run against ci/mint/baseline.txt and fails on a
          regression. `record` writes a proposed baseline as an artifact and does
          not fail on a regression; that is how a new baseline is produced for
          review. It commits nothing, and an incomplete run proposes nothing.
        type: choice
        default: ratchet
        options:
          - ratchet
          - record
      sut:
        description: >-
          `gateway-fs` measures the in-repository launcher. `external` measures the
          endpoint below through `compat-sut --external`, with the endpoint's own
          credentials from the MINT_EXTERNAL_ACCESS_KEY / MINT_EXTERNAL_SECRET_KEY secrets.
        type: choice
        default: gateway-fs
        options:
          - gateway-fs
          - external
      endpoint:
        description: "The external endpoint, http://host:port (sut: external only)"
        required: false
        default: ""

permissions:
  contents: read
  issues: write

concurrency:
  # A second run must never race the first into filing the same issue.
  group: e2e-mint
  cancel-in-progress: false

jobs:
  mint:
    name: MinIO mint
    # Builds and runs the pinned mint image, so this job needs a Docker daemon.
    runs-on: dind-sm-standard-2
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Install host tools
        run: bash scripts/ci_install_host_tools.sh --with-gh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable

      - name: Build the compatibility SUT
        run: cargo build --release -p rustfs-gateway-compat-sut

      # Every run, scheduled or manual, measures the image the reviewed recipe in ci/mint builds
      # on top of the pinned digest: the pinned image alone cannot produce attributable
      # .minio-dotnet or mc records (rustfs/gateway#720). Nothing is published.
      # The digest is fetched through mirror.gcr.io: anonymous Docker Hub pulls from this runner
      # pool hit 429 (run 36520382963). Same digest, same bytes; see ci/mint/Dockerfile.
      - name: Build the mint image from the reviewed recipe
        run: |
          set -euo pipefail
          scripts/ci_budget.sh 1800 "mint recipe build" \
            docker build --platform linux/amd64 --progress plain \
            --build-arg MINT_REGISTRY=mirror.gcr.io \
            --iidfile "${RUNNER_TEMP}/mint-candidate.id" ci/mint
          image="$(cat "${RUNNER_TEMP}/mint-candidate.id")"
          if [[ ! "$image" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "The recipe build did not return a complete local image identity." >&2
            exit 2
          fi

      - name: Run the suite
        id: suite
        # Inputs and secrets reach the script as environment, never spliced into it.
        env:
          MINT_SUT: ${{ inputs.sut || 'gateway-fs' }}
          MINT_SUT_ENDPOINT_INPUT: ${{ inputs.endpoint || '' }}
          MINT_EXTERNAL_ACCESS_KEY: ${{ secrets.MINT_EXTERNAL_ACCESS_KEY }}
          MINT_EXTERNAL_SECRET_KEY: ${{ secrets.MINT_EXTERNAL_SECRET_KEY }}
        run: |
          set -uo pipefail
          mode="${{ inputs.mode || 'ratchet' }}"
          work="${RUNNER_TEMP}/mint-work"
          out="${RUNNER_TEMP}/mint-out"
          mkdir -p "$work" "$out"
          image="$(cat "${RUNNER_TEMP}/mint-candidate.id")" || exit 2
          set -- --local-image "$image"
          # `external` without an endpoint is refused rather than quietly measuring the launcher.
          case "${MINT_SUT:-gateway-fs}" in
            gateway-fs) ;;
            external)
              if [ -z "${MINT_SUT_ENDPOINT_INPUT:-}" ]; then
                echo "::error title=mint usage::sut=external needs the endpoint input"
                echo "status=2" >>"$GITHUB_OUTPUT"
                exit 2
              fi
              set -- "$@" --external "$MINT_SUT_ENDPOINT_INPUT"
              export MINT_ACCESS_KEY="${MINT_EXTERNAL_ACCESS_KEY:-}" MINT_SECRET_KEY="${MINT_EXTERNAL_SECRET_KEY:-}"
              ;;
            *)
              echo "::error title=mint usage::unknown sut ${MINT_SUT}"
              echo "status=2" >>"$GITHUB_OUTPUT"
              exit 2
              ;;
          esac
          # 90 minutes. The wrapper reports the margin on every run, so the cliff
          # announces itself before it is hit.
          # Capture failures explicitly: the runner invokes this script with -e.
          if scripts/ci_budget.sh 5400 "minio mint" \
            ci/mint/run.sh --mode "$mode" --work "$work" --out "$out" "$@"; then
            status=0
          else
            status=$?
          fi
          echo "status=$status" >>"$GITHUB_OUTPUT"
          echo "out=$out" >>"$GITHUB_OUTPUT"
          if [ -f "$out/summary.md" ]; then
            cat "$out/summary.md" >>"$GITHUB_STEP_SUMMARY"
          fi
          case "$status" in
            0) echo "no regression against ci/mint/baseline.txt" ;;
            1) echo "::error title=mint regression::An SDK failed more often than ci/mint/baseline.txt allows. See the job summary." ;;
            3)
              {
                echo "## MinIO mint did not complete"
                echo
                echo "The environment failed or the run was incomplete, so it measured"
                echo "nothing that may be compared with the baseline. It is NOT a regression."
              } >>"$GITHUB_STEP_SUMMARY"
              echo "::error title=mint environment failure::The run is incomplete. This is not an implementation result."
              ;;
            *) echo "::error title=mint runner failure::The runner exited $status." ;;
          esac
          exit "$status"

      - name: Upload the aggregate report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mint-${{ github.run_id }}
          path: ${{ runner.temp }}/mint-out
          if-no-files-found: warn
          retention-days: 30

      # A regression that only exists in a job log is a regression nobody acts on.
      # An incomplete run deliberately does NOT file one: nothing was measured.
      - name: File a regression issue
        if: failure() && steps.suite.outputs.status == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # The launcher or an external endpoint; the report's measured_against says which build.
          MEASURED: ${{ inputs.sut || 'gateway-fs' }}
        run: |
          set -euo pipefail
          title="ci(mint): regression against the pinned image on ${MEASURED} (run ${{ github.run_id }})"
          body="${RUNNER_TEMP}/issue.md"
          {
            echo "The scheduled MinIO mint run found at least one SDK failing more often"
            echo "than \`ci/mint/baseline.txt\` allows."
            echo
            echo "- Run: $RUN_URL"
            echo "- Measured against: $MEASURED"
            echo
            head -c 55000 "${{ steps.suite.outputs.out }}/summary.md"
            echo
            echo "---"
            echo
            echo "Fix the implementation. Raising a count in \`ci/mint/baseline.txt\` needs a"
            echo "pull request that attributes each failure and raises the file's generation;"
            echo "\`scripts/check_mint_baseline.sh\` refuses every other increase."
            echo
            echo "_Filed automatically by \`.github/workflows/e2e-mint.yml\`._"
          } >"$body"
          gh issue create --title "$title" --body-file "$body" >/dev/null
          echo "filed a regression issue"
