name: CI

# ---------------------------------------------------------------------------
# CI TIME BUDGET — HARD CONSTRAINT
#
#   Total PR gate wall-clock time MUST stay <= 10 minutes.
#
# Why this matters more than any individual job: the concrete mechanism by
# which build infrastructure kills a project is that the PR gate gets slow,
# so humans and agents start batching commits and skipping local verification,
# at which point the gate stops meaning anything.
#
# Rules for adding a job:
#   1. Every PR that adds a CI job MUST report its impact on total wall-clock
#      time in the PR description (measured, not estimated).
#   2. If the total exceeds 10 minutes, the slowest job moves to a merge queue
#      or a cron schedule. It does NOT stay in the PR gate.
#   3. Jobs that are inherently slow (client matrices, Ceph s3-tests, mint,
#      full fuzz runs) never belong in the PR gate at all.
#   4. No "observation mode" jobs. A job that is allowed to fail without
#      blocking the merge is not a gate: either a job blocks merge, or it is
#      not added at all.
# ---------------------------------------------------------------------------
#
# DEFERRED JOBS — do NOT add these here "while you are in the file".
# Each line records where the job belongs and why it is not here yet.
#
#   advisories (cargo-deny)         -> Week-1, together with deny.toml
#   arch checks                     -> task P0-07
#   SemVer / cargo public-api       -> before the first release; no baseline yet
#   role-verdict / ct-eq checks     -> task P0-10
#   3-OS matrix                     -> once platform-specific code exists
#   cargo hack --feature-powerset   -> once the workspace has >= 5 features
#   fuzz                            -> alongside the rustfs-gateway-sig / rustfs-gateway-http parsers
#   client matrix / s3-tests / mint -> P8 at the earliest, and on cron, never on PRs
#
# CONFORMANCE BASELINE — it is here, and it is required.
#
# rustfs/gateway#192 was filed because the word `baseline` appeared nowhere in
# this directory: `cargo xtask conformance run --baseline conformance/baseline.json`
# was treated everywhere as the no-regression gate and CI never executed it, so
# six real regressions from fb06bbd lived fifteen days behind four green merges.
#
# The whole corpus now runs against conformance/baseline.json inside
# `cargo test --workspace` — `corpus::the_whole_corpus_holds_the_verdicts_the_baseline_records`
# in crates/conformance/tests/corpus.rs — which is the `workspace-tests-2` job
# below, inside its 480-second ci_budget.sh budget, behind the branch-protected
# `Test` check. Deliberately not a separate job: rule 4 above says a job that
# does not block the merge is not a gate, and the suite this one replaces went
# wrong exactly there (`e2e` was never a required check). A `#[test]` inherits
# the requiredness of the check it already sits behind.
#
# The jobs below cover the four-command gate in AGENTS.md. Formatting and
# clippy remain separate parallel jobs; workspace tests and guard mutations also
# use separate runners, then report through a one-minute branch-protected Test check.
# If they ever disagree, fix this file to match AGENTS.md — AGENTS.md is the
# source of truth.
#
# TOOLCHAIN — every job installs the compiler rust-toolchain.toml names.
#
# dtolnay/rust-toolchain does NOT read rust-toolchain.toml. Its `toolchain`
# input defaults to `stable`, so the pinned revision below installs whatever
# stable is on the day the job runs and makes it the rustup default. That was
# documented here as the opposite, and on 2026-08-20 the difference turned main
# red: rustc 1.98.0 shipped, `rustup default stable` moved to it, and every
# cargo invocation that does not resolve this repository's directory override
# (the signing suite runs one) compiled 1.98.0 objects into a target/ directory
# full of 1.97.1 ones -- error[E0514]. Installing a second toolchain also
# changed the rustc set Swatinem/rust-cache hashes into its restore key, so
# every cache missed at once and the cold rebuilds blew their ci_budget.sh
# budgets at exit 124.
#
# So every job names the compiler, and rust-toolchain.toml stays the one
# authority: scripts/check_rust_toolchain_msrv.sh fails the build unless every
# `toolchain:` below is byte-identical to that file's channel. A job that omits
# `with:` and takes the action's `stable` default is the shape that broke, and
# the guard rejects it by name. The one deliberate exception is the
# ThreadSanitizer job, which needs the unstable -Zbuild-std and pins a dated
# nightly.
#
# The version is written out per job rather than held in a workflow `env:` var
# on purpose. Swatinem/rust-cache hashes every environment variable whose name
# begins with CARGO, CC, CFLAGS, CXX, CMAKE or RUST into its restore key, so a
# `RUST_TOOLCHAIN: 1.97.1` here would change that key for every job at once --
# measured, and it costs a full cold rebuild. A job that then exceeds its
# ci_budget.sh budget fails, and a failed job does not save a cache, so the
# miss never heals. Do not add a workflow env var under those prefixes.
#
# Swatinem/rust-cache already keys on the compiler too: it hashes `rustc -vV`
# of every installed toolchain into the same restore key, which is why the
# extra 1.98.0 toolchain caused a miss rather than a poisoned hit.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A superseded pull-request run is cancelled; a main push always runs to completion, because
# with frequent merges a cancelled main run means nobody can ever confirm main is green.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Central registry for tools introduced by later release, coverage, audit and
  # fuzz jobs. Keeping all six pins here makes an upgrade one reviewable diff.
  # The first four install through taiki-e/install-action; cargo-public-api uses
  # `cargo install --locked`, and cargo-fuzz uses dtolnay/install.
  CARGO_SEMVER_CHECKS_TOOL: cargo-semver-checks@0.50.0
  CARGO_HACK_TOOL: cargo-hack@0.6.45
  CARGO_LLVM_COV_TOOL: cargo-llvm-cov@0.8.7
  CARGO_DENY_TOOL: cargo-deny@0.20.2
  CARGO_PUBLIC_API_TOOL: cargo-public-api@0.52.0
  CARGO_FUZZ_TOOL: cargo-fuzz@0.13.2

jobs:
  gateway-tsan:
    name: Gateway ThreadSanitizer
    runs-on: sm-standard-4
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        copy: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: nightly-2026-06-18
          components: rust-src
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install host tools
        run: bash scripts/ci_install_host_tools.sh
      - name: TSAN host facts
        run: |
          echo "runner=$RUNNER_NAME"; uname -a; nproc
          cat /proc/sys/vm/mmap_rnd_bits /proc/sys/kernel/randomize_va_space 2>/dev/null || true
          ulimit -a
          cat /sys/fs/cgroup/pids.max /sys/fs/cgroup/cpu.max /sys/fs/cgroup/memory.max 2>/dev/null || true
          grep -m1 'model name' /proc/cpuinfo || true
          grep -iE 'seccomp|NoNewPrivs' /proc/self/status || true
          (sudo -n apt-get install -y gdb >/dev/null 2>&1 && echo gdb-ok) || echo gdb-missing
      - name: Same test without TSAN, pinned and unpinned
        run: |
          timeout 300 cargo test -p rustfs-gateway --test integration service_concurrency::one_hundred_clones_answer_concurrently -- --exact --nocapture 2>&1 | grep -E 'DIAG|test result|panicked' || true
          timeout 120 taskset -c 0-14 cargo test -p rustfs-gateway --test integration service_concurrency::one_hundred_clones_answer_concurrently -- --exact --nocapture 2>&1 | grep -E 'DIAG|test result|panicked' || true
      - name: One hundred OS threads under TSAN
        run: |
          set +e
          cat /sys/fs/cgroup/cpu.stat
          scripts/run_gateway_tsan.sh &
          runner=$!
          export TSAN_OPTIONS=verbosity=1
          for i in $(seq 1 240); do kill -0 "$runner" 2>/dev/null || break; sleep 1; done
          if kill -0 "$runner" 2>/dev/null; then
            pid="$(pgrep -f 'deps/integration-' | head -1)"
            echo "HANG after 240s; pid=$pid"
            ps -o pid,stat,nlwp,pcpu,etime,cmd -p "$pid"
            grep -E 'Threads|State|VmRSS|voluntary' "/proc/$pid/status"
            for t in /proc/$pid/task/*; do printf '%s %s %s\n' "$(awk '{print $3}' "$t/stat")" "$(cat "$t/wchan" 2>/dev/null)" "$(cat "$t/comm")"; done | sort | uniq -c | sort -rn | head -20
            sudo -n gdb -p "$pid" -batch -ex 'info threads' -ex 'thread apply all bt 14' 2>&1 | head -900
            sudo -n kill -9 "$pid"
            exit 1
          fi
          wait "$runner"; rc=$?
          cat /sys/fs/cgroup/cpu.stat
          exit $rc

