    name: Guard self-test
    runs-on: sm-standard-4
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # pinned action revision
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install host tools
        run: bash scripts/ci_install_host_tools.sh
      - name: Guard mutations 1 of 6 (maximum 5 minutes after setup)
        run: |
          scripts/ci_budget.sh 300 "guard mutations 1/6" env GATEWAY_GUARD_BUDGET_SECONDS=300 GATEWAY_GUARD_SHARD_GROUPS=6 GATEWAY_GUARD_SHARD_GROUP=0 bash scripts/test_guard_scripts.sh

