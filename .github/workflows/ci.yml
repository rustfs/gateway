name: CI

# ---------------------------------------------------------------------------
# CI TIME BUDGET — HARD CONSTRAINT
#
#   Total PR gate wall-clock time MUST stay <= 10 minutes.
#
# Why this matters more than any individual job: the concrete mechanism by
# which build infrastructure kills a project is that the PR gate gets slow,
# so humans and agents start batching commits and skipping local verification,
# at which point the gate stops meaning anything.
#
# Rules for adding a job:
#   1. Every PR that adds a CI job MUST report its impact on total wall-clock
#      time in the PR description (measured, not estimated).
#   2. If the total exceeds 10 minutes, the slowest job moves to a merge queue
#      or a cron schedule. It does NOT stay in the PR gate.
#   3. Jobs that are inherently slow (client matrices, Ceph s3-tests, mint,
#      full fuzz runs) never belong in the PR gate at all.
#   4. No "observation mode" jobs. A job that is allowed to fail without
#      blocking the merge is not a gate: either a job blocks merge, or it is
#      not added at all.
# ---------------------------------------------------------------------------
#
# DEFERRED JOBS — do NOT add these here "while you are in the file".
# Each line records where the job belongs and why it is not here yet.
#
#   advisories (cargo-deny)         -> Week-1, together with deny.toml
#   arch checks                     -> task P0-07
#   SemVer / cargo public-api       -> before the first release; no baseline yet
#   role-verdict / ct-eq checks     -> task P0-10
#   3-OS matrix                     -> once platform-specific code exists
#   cargo hack --feature-powerset   -> once the workspace has >= 5 features
#   fuzz                            -> alongside the rustfs-gateway-sig / rustfs-gateway-http parsers
#   client matrix / s3-tests / mint -> P8 at the earliest, and on cron, never on PRs
#
# CONFORMANCE BASELINE — it is here, and it is required.
#
# rustfs/gateway#192 was filed because the word `baseline` appeared nowhere in
# this directory: `cargo xtask conformance run --baseline conformance/baseline.json`
# was treated everywhere as the no-regression gate and CI never executed it, so
# six real regressions from fb06bbd lived fifteen days behind four green merges.
#
# The whole corpus now runs against conformance/baseline.json inside
# `cargo test --workspace` — `corpus::the_whole_corpus_holds_the_verdicts_the_baseline_records`
# in crates/conformance/tests/corpus.rs — which is the `workspace-tests-2` job
# below, inside its 480-second ci_budget.sh budget, behind the branch-protected
# `Test` check. Deliberately not a separate job: rule 4 above says a job that
# does not block the merge is not a gate, and the suite this one replaces went
# wrong exactly there (`e2e` was never a required check). A `#[test]` inherits
# the requiredness of the check it already sits behind.
#
# The jobs below cover the four-command gate in AGENTS.md. Formatting and
# clippy remain separate parallel jobs; workspace tests and guard mutations also
# use separate runners, then report through a one-minute branch-protected Test check.
# If they ever disagree, fix this file to match AGENTS.md — AGENTS.md is the
# source of truth.
#
# TOOLCHAIN — every job installs the compiler rust-toolchain.toml names.
#
# dtolnay/rust-toolchain does NOT read rust-toolchain.toml. Its `toolchain`
# input defaults to `stable`, so the pinned revision below installs whatever
# stable is on the day the job runs and makes it the rustup default. That was
# documented here as the opposite, and on 2026-08-20 the difference turned main
# red: rustc 1.98.0 shipped, `rustup default stable` moved to it, and every
# cargo invocation that does not resolve this repository's directory override
# (the signing suite runs one) compiled 1.98.0 objects into a target/ directory
# full of 1.97.1 ones -- error[E0514]. Installing a second toolchain also
# changed the rustc set Swatinem/rust-cache hashes into its restore key, so
# every cache missed at once and the cold rebuilds blew their ci_budget.sh
# budgets at exit 124.
#
# So every job names the compiler, and rust-toolchain.toml stays the one
# authority: scripts/check_rust_toolchain_msrv.sh fails the build unless every
# `toolchain:` below is byte-identical to that file's channel. A job that omits
# `with:` and takes the action's `stable` default is the shape that broke, and
# the guard rejects it by name. The one deliberate exception is the
# ThreadSanitizer job, which needs the unstable -Zbuild-std and pins a dated
# nightly.
#
# The version is written out per job rather than held in a workflow `env:` var
# on purpose. Swatinem/rust-cache hashes every environment variable whose name
# begins with CARGO, CC, CFLAGS, CXX, CMAKE or RUST into its restore key, so a
# `RUST_TOOLCHAIN: 1.97.1` here would change that key for every job at once --
# measured, and it costs a full cold rebuild. A job that then exceeds its
# ci_budget.sh budget fails, and a failed job does not save a cache, so the
# miss never heals. Do not add a workflow env var under those prefixes.
#
# Swatinem/rust-cache already keys on the compiler too: it hashes `rustc -vV`
# of every installed toolchain into the same restore key, which is why the
# extra 1.98.0 toolchain caused a miss rather than a poisoned hit.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Central registry for tools introduced by later release, coverage, audit and
  # fuzz jobs. Keeping all six pins here makes an upgrade one reviewable diff.
  # The first four install through taiki-e/install-action; cargo-public-api uses
  # `cargo install --locked`, and cargo-fuzz uses dtolnay/install.
  CARGO_SEMVER_CHECKS_TOOL: cargo-semver-checks@0.50.0
  CARGO_HACK_TOOL: cargo-hack@0.6.45
  CARGO_LLVM_COV_TOOL: cargo-llvm-cov@0.8.7
  CARGO_DENY_TOOL: cargo-deny@0.20.2
  CARGO_PUBLIC_API_TOOL: cargo-public-api@0.52.0
  CARGO_FUZZ_TOOL: cargo-fuzz@0.13.2

jobs:
  # Everything deterministic and sub-second lives here rather than in jobs of its own:
  # a runner spin-up costs ~20s, which is more than all of these put together.
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      # Baseline ratchets resolve origin/main and the pull-request merge base,
      # so the static job needs the full branch graph locally.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # pinned action revision
        with:
          toolchain: 1.97.1
      - run: cargo fmt --all --check
      # Pinned models must match their recorded checksums before anything is generated from them.
      - name: Model integrity
        run: python3 model/tools/verify.py
      # Architecture guards. A guard that does not run in CI is decoration.
      #
      # A guard that declares REQUIRES-BUILD compiles the workspace, so it runs in
      # the guard-self-test job instead — this job has no cargo cache and exists to be fast.
      # The split is read from the guards themselves rather than listed here, so a
      # guard that starts needing a build cannot silently make this job slow, and
      # the two loops cannot drift apart.
      - name: Repository guards
        env:
          GATEWAY_ADR_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          ran=0
          slowest=0
          slowest_guard=none
          loop_started="$(date +%s)"
          for guard in scripts/check_*.sh; do
            if grep -q '^# REQUIRES-PR$' "$guard"; then
              echo "deferred to the pull-request step: $guard"
              continue
            fi
            if grep -q '^# REQUIRES-BUILD$' "$guard"; then
              echo "deferred to the guard-self-test job: $guard"
              continue
            fi
            echo "::group::$guard"
            guard_started="$(date +%s)"
            scripts/ci_budget.sh 120 "$guard" bash "$guard"
            guard_elapsed="$(( $(date +%s) - guard_started ))"
            echo "::endgroup::"
            if [ "$guard_elapsed" -gt "$slowest" ]; then
              slowest="$guard_elapsed"
              slowest_guard="$guard"
            fi
            ran=$((ran + 1))
          done
          loop_elapsed="$(( $(date +%s) - loop_started ))"
          echo "ran $ran guard(s) in ${loop_elapsed}s; slowest was $slowest_guard at ${slowest}s"
      - name: Protected files
        env:
          GATEWAY_PROTECTED_BASE: ${{ github.event.pull_request.base.sha }}
          GATEWAY_PROTECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          GATEWAY_PR_BODY_JSON: ${{ toJSON(github.event.pull_request.body) }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            bash scripts/check_protected_files.sh
          fi
      - name: Role verdicts
        env:
          GATEWAY_ROLE_BASE: ${{ github.event.pull_request.base.sha }}
          GATEWAY_ROLE_HEAD: ${{ github.event.pull_request.head.sha }}
          GATEWAY_PR_BODY_JSON: ${{ toJSON(github.event.pull_request.body) }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            bash scripts/check_role_verdicts.sh
          fi
      # Generated artefacts are a pure function of (model, overlays). If regenerating moves a
      # byte, the checked-in output and the generator disagree, and every review that read the
      # output was reading something the generator no longer produces.
      - name: Generated output is up to date
        run: cargo xtask spec verify

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # pinned action revision
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo check --workspace --all-targets

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # pinned action revision
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # pinned action revision
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Build documentation without warnings
        run: scripts/ci_budget.sh 240 "documentation build" env RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps
      - name: Run README and API examples
        run: |
          scripts/ci_budget.sh 240 "README and API examples" bash -c '
            set -euo pipefail
            cargo test --doc --workspace
            cargo build --examples --workspace
            cargo test -p rustfs-gateway --example minimal
            bash scripts/run_minimal_listener_smoke.sh
          '

  bootstrap:
    name: Cold bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # pinned action revision
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy, rust-src, rust-analyzer
      # No cargo cache: the five-minute measurement includes compiling xtask itself.
      - name: Bootstrap from a cold checkout (maximum 5 minutes)
        run: |
          started="$(date +%s)"
          timeout 300s cargo xtask bootstrap
          elapsed="$(( $(date +%s) - started ))"
          echo "cold bootstrap completed in ${elapsed}s"

  feedback-loop:
    name: Operation feedback loop
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # pinned action revision
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Prebuild operation verification targets
        run: |
          cargo test -p xtask --no-default-features --features operation --bin xtask --no-run
          cargo build -p xtask-launcher
          cargo build -p xtask --no-default-features --features operation
      - name: Three operation samples (maximum 30 seconds each)
        run: |
          timeout 30s cargo xtask verify --op GetObject
          timeout 30s cargo xtask verify --op PutObject
          timeout 30s cargo xtask verify --op ListObjectsV2

  workspace-tests:
    name: Workspace tests 1
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # pinned action revision
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Workspace tests 1/3 (maximum 8 minutes after setup)
        run: |
          scripts/ci_budget.sh 480 "workspace tests 1/3" cargo test --workspace --exclude rustfs-gateway-conformance --exclude rustfs-gateway --exclude rustfs-gateway-goldens --exclude rustfs-gateway-types

  workspace-tests-2:
    name: Workspace tests 2
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # pinned action revision
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Workspace tests 2/3 (maximum 8 minutes after setup)
        run: |
          scripts/ci_budget.sh 480 "workspace tests 2/3" bash -c 'cargo test --package rustfs-gateway-conformance --package rustfs-gateway && cargo check --package rustfs-gateway'
          scripts/ci_budget.sh 30 "handlers facade fixture" scripts/test_handlers_facade_fixture.sh

  workspace-tests-3:
    name: Workspace tests 3
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # pinned action revision
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Workspace tests 3/3 (maximum 8 minutes after setup)
        run: |
          scripts/ci_budget.sh 480 "workspace tests 3/3" cargo test --package rustfs-gateway-goldens --package rustfs-gateway-types --features rustfs-gateway-types/compat-s3s

  transport-parity:
    name: Production transport parity
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # pinned action revision
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Compare production transports (maximum 8 minutes after setup)
        run: |
          scripts/ci_budget.sh 480 "production transport parity" cargo run --package rustfs-gateway-conformance --bin rustfs-gateway-conformance -- diff-transports --exclude-slow

  # The corpus is embedded in family providers rather than stored under a corpus/ directory.
  # corpus-report derives this byte total from the concrete accepted and rejected sample inputs.
  persistence-goldens:
    name: Persistence goldens
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # pinned action revision
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Run persisted XML goldens (maximum 3.5 minutes after setup)
        run: |
          report="$(
            scripts/ci_budget.sh 105 "persistence corpus report" \
              cargo run --quiet --package rustfs-gateway-goldens --bin corpus-report
          )"
          printf '%s\n' "$report"
          corpus_bytes="$(
            printf '%s\n' "$report" |
              sed -n 's/^total: families=13 accepted=[0-9][0-9]* rejected=[0-9][0-9]* bytes=\([0-9][0-9]*\)$/\1/p'
          )"
          test -n "$corpus_bytes"
          test "$corpus_bytes" -le 20971520
          scripts/ci_budget.sh 105 "four-way persistence goldens" \
            cargo run --quiet --package rustfs-gateway-goldens --bin four-way -- --all

  signing-suite:
    name: Official signing suite
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # pinned action revision
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Pinned smithy-rs signing suite
        run: |
          scripts/ci_budget.sh 90 "signing suite build" cargo build --package xtask --bin xtask
          scripts/ci_budget.sh 60 "signing suite fetch" target/debug/xtask sigsuite fetch
          scripts/ci_budget.sh 60 "signing suite run" target/debug/xtask sigsuite run

  gateway-tsan:
    name: Gateway ThreadSanitizer
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: nightly-2026-06-18
          components: rust-src
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: One hundred OS threads under TSAN
        run: scripts/ci_budget.sh 480 "gateway TSAN" scripts/run_gateway_tsan.sh

  # The guard self-test is split over four runners because it grows with every merge:
  # AGENTS.md requires a mutation per new assertion, so its case count only ever goes
  # up. On one runner it reached 479s of a 480s timeout and started dying at exit 124
  # with every case still printing ok — on pull requests that had nothing to do with
  # it, and on pristine main's own scheduled runs (32097529045, 32197900452).
  # Each runner takes every fourth case ordinal and splits its share again across
  # worker processes, and each proves it executed exactly its own share, so the four
  # green jobs together are a complete run. Adding a fifth runner is this block plus
  # the shard count in scripts/check_ci_test_split.sh. GATEWAY_GUARD_BUDGET_SECONDS
  # matches the timeout so the suite can stop and say "out of time" instead of being
  # killed with an unexplained 124.

  guard-self-test:
    name: Guard self-test
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # pinned action revision
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Guard mutations 1 of 4 (maximum 5 minutes after setup)
        run: |
          scripts/ci_budget.sh 300 "guard mutations 1/4" env GATEWAY_GUARD_BUDGET_SECONDS=300 GATEWAY_GUARD_SHARD_GROUPS=4 GATEWAY_GUARD_SHARD_GROUP=0 bash scripts/test_guard_scripts.sh

  guard-self-test-2:
    name: Guard self-test 2
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # pinned action revision
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Guard mutations 2 of 4 (maximum 5 minutes after setup)
        run: |
          scripts/ci_budget.sh 300 "guard mutations 2/4" env GATEWAY_GUARD_BUDGET_SECONDS=300 GATEWAY_GUARD_SHARD_GROUPS=4 GATEWAY_GUARD_SHARD_GROUP=1 bash scripts/test_guard_scripts.sh

  guard-self-test-3:
    name: Guard self-test 3
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # pinned action revision
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Guard mutations 3 of 4 (maximum 5 minutes after setup)
        run: |
          scripts/ci_budget.sh 300 "guard mutations 3/4" env GATEWAY_GUARD_BUDGET_SECONDS=300 GATEWAY_GUARD_SHARD_GROUPS=4 GATEWAY_GUARD_SHARD_GROUP=2 bash scripts/test_guard_scripts.sh

  guard-self-test-4:
    name: Guard self-test 4
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # pinned action revision
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Guard mutations 4 of 4 (maximum 5 minutes after setup)
        run: |
          scripts/ci_budget.sh 300 "guard mutations 4/4" env GATEWAY_GUARD_BUDGET_SECONDS=300 GATEWAY_GUARD_SHARD_GROUPS=4 GATEWAY_GUARD_SHARD_GROUP=3 bash scripts/test_guard_scripts.sh

  target-consolidation-self-test:
    name: Target consolidation self-test
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Target consolidation mutations (maximum 2 minutes after setup)
        run: |
          scripts/ci_budget.sh 120 "target consolidation self-test" bash scripts/test_test_target_consolidation.sh
          scripts/ci_budget.sh 45 "test target coverage self-test" bash scripts/test_test_target_coverage.sh

  quirk-ledger-self-test:
    name: Quirk ledger self-test 1
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Quirk ledger mutations 1/3 (maximum 1 minute after setup)
        run: |
          scripts/ci_budget.sh 60 "quirk ledger mutations 1/3" env GATEWAY_GUARD_BUDGET_SECONDS=60 GATEWAY_GUARD_QUIRK_LEDGER_ONLY=1 GATEWAY_GUARD_SHARD_GROUPS=3 GATEWAY_GUARD_SHARD_GROUP=0 bash scripts/test_guard_scripts.sh

  quirk-ledger-self-test-2:
    name: Quirk ledger self-test 2
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
