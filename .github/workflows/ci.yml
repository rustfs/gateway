  # Read scripts/test_guard_scripts.sh before changing any budget below. The suite stops itself
  # at `budget - 30`, a FLAT reserve, not a fraction: at the 60s these three shards used to carry
  # it had 30s of working time and spent 22-31s of it, so two of the three stopped themselves on
  # 33641327259 and 33646920592 with every case still printing ok. Adding a fourth shard could not
  # have fixed that — the reserve is absolute, so a 60s budget buys 30s of work no matter how thin
  # the shards are sliced. 150s buys 120s. The suite now refuses a budget whose reserve is more
  # than a quarter of it, so this trap cannot be re-set by writing a smaller number here.
