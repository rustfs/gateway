      - name: Install host tools
        run: bash scripts/ci_install_host_tools.sh
      - name: One hundred OS threads under TSAN
        run: scripts/ci_budget.sh 480 "gateway TSAN" scripts/run_gateway_tsan.sh

  # The guard self-test is split over five runners because it grows with every merge:
  # AGENTS.md requires a mutation per new assertion, so its case count only ever goes
  # up. On one runner it reached 479s of a 480s timeout and started dying at exit 124
  # with every case still printing ok — on pull requests that had nothing to do with
  # it, and on pristine main's own scheduled runs (32097529045, 32197900452).
  # Each runner takes every sixth case ordinal and splits its share again across
  # worker processes, and each proves it executed exactly its own share, so the six
  # green jobs together are a complete run. Four runners lasted from 2026-08 until the
  # third of them stopped itself at 270s of its 300s slice on main (2026-09-10) with
  # every case still printing ok; five lasted until the first of them did the same on
  # every pull request of 2026-09-18 (runs 35292973579 and 35293671982); adding the
  # next runner is this block plus the shard count in scripts/check_ci_test_split.sh
  # and the subjects in test_guard_scripts.sh. GATEWAY_GUARD_BUDGET_SECONDS
  # matches the timeout so the suite can stop and say "out of time" instead of being
  # killed with an unexplained 124.

