name: CI

# ---------------------------------------------------------------------------
# CI TIME BUDGET — HARD CONSTRAINT
#
#   Total PR gate wall-clock time MUST stay <= 10 minutes.
#
# Why this matters more than any individual job: the concrete mechanism by
# which build infrastructure kills a project is that the PR gate gets slow,
# so humans and agents start batching commits and skipping local verification,
# at which point the gate stops meaning anything.
#
# Rules for adding a job:
#   1. Every PR that adds a CI job MUST report its impact on total wall-clock
#      time in the PR description (measured, not estimated).
#   2. If the total exceeds 10 minutes, the slowest job moves to a merge queue
#      or a cron schedule. It does NOT stay in the PR gate.
#   3. Jobs that are inherently slow (client matrices, Ceph s3-tests, mint,
#      full fuzz runs) never belong in the PR gate at all.
#   4. No "observation mode" jobs. A job that is allowed to fail without
#      blocking the merge is not a gate: either a job blocks merge, or it is
#      not added at all.
# ---------------------------------------------------------------------------
#
# DEFERRED JOBS — do NOT add these here "while you are in the file".
# Each line records where the job belongs and why it is not here yet.
#
#   arch checks                     -> task P0-07
#   SemVer / cargo public-api       -> before the first release; no baseline yet
#   role-verdict / ct-eq checks     -> task P0-10
#   3-OS matrix                     -> once platform-specific code exists
#   cargo hack --feature-powerset   -> once the workspace has >= 5 features
#   fuzz                            -> alongside the rustfs-gateway-sig / rustfs-gateway-http parsers
#   client matrix / s3-tests / mint -> P8 at the earliest, and on cron, never on PRs
#
# CONFORMANCE BASELINE — it is here, and it is required.
#
# rustfs/gateway#192 was filed because the word `baseline` appeared nowhere in
# this directory: `cargo xtask conformance run --baseline conformance/baseline.json`
# was treated everywhere as the no-regression gate and CI never executed it, so
# six real regressions from fb06bbd lived fifteen days behind four green merges.
#
# The whole corpus now runs against conformance/baseline.json inside
# `cargo test --workspace` — `corpus::the_whole_corpus_holds_the_verdicts_the_baseline_records`
# in crates/conformance/tests/corpus.rs — which is the `workspace-tests-2` job
# below, inside its 480-second ci_budget.sh budget, behind the branch-protected
# `Test` check. Deliberately not a separate job: rule 4 above says a job that
# does not block the merge is not a gate, and the suite this one replaces went
# wrong exactly there (`e2e` was never a required check). A `#[test]` inherits
# the requiredness of the check it already sits behind.
#
# The jobs below cover the four-command gate in AGENTS.md. Formatting and
# clippy remain separate parallel jobs; workspace tests and guard mutations also
# use separate runners, then report through a one-minute branch-protected Test check.
# If they ever disagree, fix this file to match AGENTS.md — AGENTS.md is the
# source of truth.
#
# TOOLCHAIN — every job installs the compiler rust-toolchain.toml names.
#
# dtolnay/rust-toolchain does NOT read rust-toolchain.toml. Its `toolchain`
# input defaults to `stable`, so the pinned revision below installs whatever
# stable is on the day the job runs and makes it the rustup default. That was
# documented here as the opposite, and on 2026-08-20 the difference turned main
# red: rustc 1.98.0 shipped, `rustup default stable` moved to it, and every
# cargo invocation that does not resolve this repository's directory override
# (the signing suite runs one) compiled 1.98.0 objects into a target/ directory
# full of 1.97.1 ones -- error[E0514]. Installing a second toolchain also
# changed the rustc set Swatinem/rust-cache hashes into its restore key, so
# every cache missed at once and the cold rebuilds blew their ci_budget.sh
# budgets at exit 124.
#
# So every job names the compiler, and rust-toolchain.toml stays the one
# authority: scripts/check_rust_toolchain_msrv.sh fails the build unless every
# `toolchain:` below is byte-identical to that file's channel. A job that omits
# `with:` and takes the action's `stable` default is the shape that broke, and
# the guard rejects it by name. The one deliberate exception is the
# ThreadSanitizer job, which needs the unstable -Zbuild-std and pins a dated
# nightly.
#
# The version is written out per job rather than held in a workflow `env:` var
# on purpose. Swatinem/rust-cache hashes every environment variable whose name
# begins with CARGO, CC, CFLAGS, CXX, CMAKE or RUST into its restore key, so a
# `RUST_TOOLCHAIN: 1.97.1` here would change that key for every job at once --
# measured, and it costs a full cold rebuild. A job that then exceeds its
# ci_budget.sh budget fails, and a failed job does not save a cache, so the
# miss never heals. Do not add a workflow env var under those prefixes.
#
# Swatinem/rust-cache already keys on the compiler too: it hashes `rustc -vV`
# of every installed toolchain into the same restore key, which is why the
# extra 1.98.0 toolchain caused a miss rather than a poisoned hit.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A superseded pull-request run is cancelled; a main push always runs to completion, because
# with frequent merges a cancelled main run means nobody can ever confirm main is green.
#
# `cancel-in-progress: false` alone does not deliver that. A concurrency group holds one running
# and one pending run, and GitHub cancels the pending one whenever a newer run joins the group,
# whatever cancel-in-progress says. With main pushes sharing one group per ref, every merge wave
# cancelled all but the last push: fifteen consecutive main commits on 2026-09-28 ended
# `cancelled`, none verified. Each main push therefore gets a group of its own (its commit SHA);
# pull requests keep one group per ref so a new push still supersedes the old run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Central registry for the Cargo tools CI installs: cargo-deny in Static checks
  # today, and the release, coverage and fuzz jobs that follow. Keeping all six
  # pins here makes an upgrade one reviewable diff. The first four install
  # through taiki-e/install-action; cargo-public-api uses `cargo install --locked`,
  # and cargo-fuzz uses dtolnay/install.
  CARGO_SEMVER_CHECKS_TOOL: cargo-semver-checks@0.50.0
  CARGO_HACK_TOOL: cargo-hack@0.6.45
  CARGO_LLVM_COV_TOOL: cargo-llvm-cov@0.8.7
  CARGO_DENY_TOOL: cargo-deny@0.20.2
  CARGO_PUBLIC_API_TOOL: cargo-public-api@0.52.0
  CARGO_FUZZ_TOOL: cargo-fuzz@0.13.2

jobs:
  # Org self-hosted pool. sm-standard-4 is the 4-vCPU label the ten-minute budgets
  # were measured against; the Test aggregate only compares results, so it uses
  # sm-standard-2. scripts/check_no_github_hosted_runners.sh rejects any other label.
  # The runner group must include this repository, or every job queues.

  # Everything deterministic and sub-second lives here rather than in jobs of its own:
  # a runner spin-up costs ~20s, which is more than all of these put together.
  static:
    name: Static checks
    runs-on: sm-standard-4
    timeout-minutes: 9
    steps:
      # Baseline ratchets resolve origin/main and the pull-request merge base,
      # so the static job needs the full branch graph locally.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # pinned action revision
        with:
          toolchain: 1.97.1
      - name: Install host tools
        run: bash scripts/ci_install_host_tools.sh
      - run: cargo fmt --all --check
      # Pinned models must match their recorded checksums before anything is generated from them.
      - name: Model integrity
        run: python3 model/tools/verify.py
      - name: Admin inventory reader tests
        run: python3 scripts/test_admin_route_variants.py
      # Dependency policy against deny.toml: RustSec advisories, bans, licences and sources.
      # `--locked` judges the committed Cargo.lock, not one cargo would rewrite first, and
      # `--all-features` takes in the compat-s3s oracles, the repository's only git source.
      # An advisory published against a locked version turns every pull request red until the
      # lock moves; that is the gate doing its job. `fallback: none` makes a missing prebuilt
      # binary fail the install instead of compiling or fetching an unpinned installer.
      - name: Install cargo-deny
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: ${{ env.CARGO_DENY_TOOL }}
          fallback: none
      - name: Dependency policy
        run: cargo deny --locked --workspace --all-features check advisories bans licenses sources
      # The aws-sdk-rust client-matrix driver is a workspace of its own with its own lock
      # (compat/drivers/aws-sdk-rust), which the step above never reads. Its advisories are
      # judged against the same deny.toml. The driver never ships and its dependency tree is the
      # pinned SDK's, so advisories are the one section judged here (rustfs/gateway#1073).
      - name: Dependency advisories of the aws-sdk-rust driver
        run: cargo deny --locked --manifest-path compat/drivers/aws-sdk-rust/Cargo.toml --config deny.toml check advisories
      # Architecture guards. A guard that does not run in CI is decoration.
      #
      # A guard that declares REQUIRES-BUILD compiles the workspace, so it runs in
      # the guard-self-test job instead — this job has no cargo cache and exists to be fast.
      # The split is read from the guards themselves rather than listed here, so a
      # guard that starts needing a build cannot silently make this job slow, and
      # the two loops cannot drift apart.
      - name: Repository guards
        env:
          GATEWAY_ADR_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          ran=0
          slowest=0
          slowest_guard=none
          loop_started="$(date +%s)"
          for guard in scripts/check_*.sh; do
            if grep -q '^# REQUIRES-PR$' "$guard"; then
              echo "deferred to the pull-request step: $guard"
              continue
            fi
            if grep -q '^# REQUIRES-BUILD$' "$guard"; then
              echo "deferred to the guard-self-test job: $guard"
              continue
            fi
            echo "::group::$guard"
            guard_started="$(date +%s)"
            scripts/ci_budget.sh 120 "$guard" bash "$guard"
            guard_elapsed="$(( $(date +%s) - guard_started ))"
            echo "::endgroup::"
            if [ "$guard_elapsed" -gt "$slowest" ]; then
              slowest="$guard_elapsed"
              slowest_guard="$guard"
            fi
            ran=$((ran + 1))
          done
          loop_elapsed="$(( $(date +%s) - loop_started ))"
          echo "ran $ran guard(s) in ${loop_elapsed}s; slowest was $slowest_guard at ${slowest}s"
      - name: Protected files
        env:
          GATEWAY_PROTECTED_BASE: ${{ github.event.pull_request.base.sha }}
          GATEWAY_PROTECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          GATEWAY_PR_BODY_JSON: ${{ toJSON(github.event.pull_request.body) }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            bash scripts/check_protected_files.sh
          fi
      # rustfs/backlog#1763 a-cp-0017: a corpus change lands as a reviewed pull request that states
      # its census, and a corpus commit pushed straight to main turns main red.
      - name: Corpus change review
        env:
          GATEWAY_CORPUS_BASE: ${{ github.event.pull_request.base.sha }}
          GATEWAY_CORPUS_HEAD: ${{ github.event.pull_request.head.sha }}
          GATEWAY_PR_BODY_JSON: ${{ toJSON(github.event.pull_request.body) }}
          GATEWAY_PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            bash scripts/check_corpus_change_reviewed.sh
          elif [[ -n "$GATEWAY_PUSH_BEFORE" && "$GATEWAY_PUSH_BEFORE" != 0000000000000000000000000000000000000000 ]]; then
            GATEWAY_CORPUS_PUSH_RANGE="${GATEWAY_PUSH_BEFORE}..${GITHUB_SHA}" bash scripts/check_corpus_change_reviewed.sh
          fi
      - name: Role verdicts
        env:
          GATEWAY_ROLE_BASE: ${{ github.event.pull_request.base.sha }}
          GATEWAY_ROLE_HEAD: ${{ github.event.pull_request.head.sha }}
          GATEWAY_PR_BODY_JSON: ${{ toJSON(github.event.pull_request.body) }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            bash scripts/check_role_verdicts.sh
          fi
      # The differential's register only grows with an argument in the description, and the
      # differential never changes alongside gateway source silently (rustfs/backlog#1762).
      - name: Known-diffs ratchet
        env:
          GATEWAY_KNOWN_DIFFS_BASE: ${{ github.event.pull_request.base.sha }}
          GATEWAY_KNOWN_DIFFS_HEAD: ${{ github.event.pull_request.head.sha }}
          GATEWAY_PR_BODY_JSON: ${{ toJSON(github.event.pull_request.body) }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            bash scripts/check_known_diffs_ratchet.sh
          fi
      - name: Differential stays read-only
        env:
          GATEWAY_DIFFTEST_BASE: ${{ github.event.pull_request.base.sha }}
          GATEWAY_DIFFTEST_HEAD: ${{ github.event.pull_request.head.sha }}
          GATEWAY_PR_BODY_JSON: ${{ toJSON(github.event.pull_request.body) }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            bash scripts/check_difftest_readonly.sh
          fi
      # Generated artefacts are a pure function of (model, overlays). If regenerating moves a
      # byte, the checked-in output and the generator disagree, and every review that read the
      # output was reading something the generator no longer produces.
      - name: Generated output is up to date
        run: cargo xtask spec verify

  msrv:
    name: MSRV
    runs-on: sm-standard-4
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # pinned action revision
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install host tools
        run: bash scripts/ci_install_host_tools.sh
      - run: cargo check --workspace --all-targets

  clippy:
    name: Clippy
    runs-on: sm-standard-4
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # pinned action revision
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install host tools
        run: bash scripts/ci_install_host_tools.sh
      - run: cargo clippy --workspace --all-targets -- -D warnings

  docs:
    name: Documentation
    runs-on: sm-standard-4
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # pinned action revision
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install host tools
        run: bash scripts/ci_install_host_tools.sh
      - name: Build documentation without warnings
        run: scripts/ci_budget.sh 240 "documentation build" env RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps

  # The README and API examples used to be a second step of the documentation job, sharing its
  # runner and its cache. `cargo test --doc --workspace` compiles the whole workspace in the test
  # profile, which the `cargo doc` step ahead of it does not produce, so on a cache miss the two
  # compiles stacked inside one 240-second slice and the step was stopped with no assertion
  # failed (rustfs/gateway#670: run 34269757915, and every PR that missed the cache after it).
  # Splitting across runners is the remedy AGENTS.md names for an overrun; the examples now get
  # their own runner, their own cache key, and a slice sized for a cold test-profile compile plus
  # the examples themselves, the same shape as Cold bootstrap's. The documentation job keeps the
  # 240 seconds it needs for `cargo doc` alone.
  examples:
    name: README and API examples
    runs-on: sm-standard-4
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # pinned action revision
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install host tools
        run: bash scripts/ci_install_host_tools.sh
      - name: Run README and API examples (maximum 7 minutes after setup)
        run: |
          scripts/ci_budget.sh 420 "README and API examples" bash -c '
            set -euo pipefail
            cargo test --doc --workspace
            cargo build --examples --workspace
            cargo test -p rustfs-gateway --example minimal
            bash scripts/run_minimal_listener_smoke.sh
          '

  # The five-minute promise lives in xtask/src/bootstrap.rs, which times itself and returns
  # FAILURE naming the seconds it took. The old wrapper here was `timeout 300s`, the same number,
  # so on every run that crossed the line the kill arrived first and the job printed exit 124
  # with nothing naming the clock — measured 282s green once and 318-326s at 124 five times in
  # nine runs of main. The wrapper is now a strictly larger ci_budget.sh budget, so the
  # five-minute contract is the thing that speaks and its verdict carries the measurement.
  # Raising this number does not relax that contract; only bootstrap.rs can.
  bootstrap:
    name: Cold bootstrap
    runs-on: sm-standard-4
    timeout-minutes: 8
    # Same-host AB/BA runs reduced cold build time; keep developer profiles unchanged.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # pinned action revision
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy, rust-src, rust-analyzer
      - name: Install host tools
        run: bash scripts/ci_install_host_tools.sh
      # No cargo cache: the five-minute measurement includes compiling xtask itself.
      - name: Bootstrap from a cold checkout (maximum 5 minutes)
        run: |
          scripts/ci_budget.sh 420 "cold bootstrap" cargo xtask bootstrap

  feedback-loop:
    name: Operation feedback loop
    runs-on: sm-standard-4
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # pinned action revision
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install host tools
        run: bash scripts/ci_install_host_tools.sh
      - name: Prebuild operation verification targets
        run: |
          cargo test -p xtask --no-default-features --features operation --bin xtask --no-run
          cargo build -p xtask-launcher
          cargo build -p xtask --no-default-features --features operation
      - name: Three operation samples (maximum 30 seconds each)
        run: |
          scripts/ci_budget.sh 30 "verify --op GetObject" cargo xtask verify --op GetObject
          scripts/ci_budget.sh 30 "verify --op PutObject" cargo xtask verify --op PutObject
          scripts/ci_budget.sh 30 "verify --op ListObjectsV2" cargo xtask verify --op ListObjectsV2

  # The three workspace shards are balanced by measurement, not by package count. Nine runs of
  # main on 2026-09-01/02 read 237-295s, 266-480s and 15-23s of the same 480s budget: shard 2 was
  # over the line twice at exit 124 while shard 3 was never above 4% of its clock. The imbalance,
  # not the total, was the merge blocker, so `cargo test --package rustfs-gateway` moved from
  # shard 2 to shard 3 rather than the budget moving anywhere. Shard 2 keeps the conformance
  # corpus and the `cargo check` that the facade fixture reads; shard 3 pays the gateway build it
  # did not have. Re-measure before moving another package: the numbers, not the shape, decide.
  #
  # Re-measured 2026-09-13 after #783: shard 1 read 488-503s of its 480s on every run (it spends
  # about 200s compiling, and the sig integration binary alone runs about 48s), while shards 2 and 3
  # read 221-305s and 214-257s. `rustfs-gateway-sig` therefore moved from shard 1 to shard 3, which
  # already compiles it as a gateway dependency; again the split moved and the budgets did not.
  workspace-tests:
    name: Workspace tests 1
    runs-on: sm-standard-4
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # pinned action revision
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install host tools
        run: bash scripts/ci_install_host_tools.sh
      - name: Workspace tests 1/3 (maximum 8 minutes after setup)
        run: |
          scripts/ci_budget.sh 480 "workspace tests 1/3" cargo test --workspace --exclude rustfs-gateway-conformance --exclude rustfs-gateway --exclude rustfs-gateway-goldens --exclude rustfs-gateway-difftest --exclude rustfs-gateway-types --exclude rustfs-gateway-sig

  workspace-tests-2:
    name: Workspace tests 2
    runs-on: sm-standard-4
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # pinned action revision
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install host tools
        run: bash scripts/ci_install_host_tools.sh
      - name: Workspace tests 2/3 (maximum 8 minutes after setup)
        run: |
          scripts/ci_budget.sh 480 "workspace tests 2/3" bash -c 'cargo test --package rustfs-gateway-conformance && cargo check --package rustfs-gateway'
          scripts/ci_budget.sh 60 "handlers facade fixture" scripts/test_handlers_facade_fixture.sh

  workspace-tests-3:
    name: Workspace tests 3
    runs-on: sm-standard-4
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # pinned action revision
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install host tools
        run: bash scripts/ci_install_host_tools.sh
      - name: Workspace tests 3/3 (maximum 8 minutes after setup)
        run: |
          scripts/ci_budget.sh 480 "workspace tests 3/3" bash -c 'cargo test --package rustfs-gateway-goldens --package rustfs-gateway-difftest --package rustfs-gateway-types --features rustfs-gateway-types/compat-s3s && cargo test --package rustfs-gateway --package rustfs-gateway-sig'
          scripts/ci_budget.sh 120 "difftest runners build" cargo build --quiet --package rustfs-gateway-difftest --bins
          scripts/ci_budget.sh 200 "difftest runners" bash -c 'target/debug/decode-diff --corpus corpus --budget-seconds 180 && target/debug/encode-diff --builtin --budget-seconds 180'

  # Transport parity runs the whole corpus twice (once per production driver) and compares.
  # On one runner it sat at 413-471s of a 480s budget for nine consecutive main runs and hit
  # exit 124 twice in one day (rustfs/gateway#641), and its job is already at nine minutes
  # against the ten-minute ceiling, so no budget can help it. The corpus is now cut in two by
  # `--shard`, which numbers the selected cases in corpus order and hands each runner every
  # second one; the two green jobs together are the complete comparison, and each child pair
  # reports how many cases it left to the other shard.
  transport-parity:
    name: Production transport parity
    runs-on: sm-standard-4
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # pinned action revision
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install host tools
        run: bash scripts/ci_install_host_tools.sh
      - name: Compare production transports 1 of 2 (maximum 8 minutes after setup)
        run: |
          scripts/ci_budget.sh 480 "production transport parity 1/2" cargo run --package rustfs-gateway-conformance --bin rustfs-gateway-conformance -- diff-transports --exclude-slow --shard 0/2

  transport-parity-2:
    name: Production transport parity 2
    runs-on: sm-standard-4
