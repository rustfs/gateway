name: Fuzz nightly

# ---------------------------------------------------------------------------
# WHAT THIS JOB DOES
#
#   Runs every registered fuzz target under libFuzzer for a fixed wall-clock
#   budget, seeded from its committed seeds and from a corpus cached between
#   runs (rustfs/backlog#1766 a-pf-0008, the long-run lane the PR-side seed
#   replays deliberately leave out).
#
#   A second job (`rustfs-endpoint-replay`, rustfs/backlog#2781) checks out,
#   builds, and starts a live RustFS candidate out-of-process and replays the
#   `decode_diff` and `encode_diff` seed and cached corpora over real HTTP/1.1
#   via `fuzz-endpoint-replay --endpoint http://127.0.0.1:19000`.
#
#   A crash fails the job. The crashing input and its `cargo fuzz tmin`
#   minimisation (or endpoint replay crash input and candidate log) are
#   uploaded as an artifact. Per the 2026-08-12 Decision on
#   rustfs/backlog#1766 (a-pf-0018), a crash becomes a committed regression
#   seed under fuzz/seeds/<target>/ in the fix PR, and a conformance case only
#   when a human has tied the behaviour to protocol evidence; nothing here
#   writes to the repository.
#
# WHY NOT THE PR GATE
#
#   Twenty-three targets for five minutes each plus a live RustFS candidate
#   build is well past the ten-minute PR budget, and libFuzzer's coverage
#   search is not reproducible run to run. The PR gate replays the committed
#   seeds instead.
# ---------------------------------------------------------------------------

on:
  schedule:
    # Daily, 02:00 UTC, clear of the 04:00 perf-evidence run.
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Fuzzing budget per target, in seconds."
        default: "300"
      rustfs_ref:
        description: "RustFS candidate ref (branch, tag, or commit) to replay against."
        default: "main"
      endpoint:
        description: "Optional external http://host:port candidate endpoint; leave empty to build and launch rustfs/rustfs."
        default: ""

permissions:
  contents: read

concurrency:
  group: fuzz-nightly
  cancel-in-progress: false

env:
  # The same pins ci.yml names (CARGO_FUZZ_TOOL and the TSAN nightly);
  # check_fuzz_nightly.sh keeps them equal and the matrix equal to fuzz/Cargo.toml.
  CARGO_FUZZ_VERSION: 0.13.2
  FUZZ_TOOLCHAIN: nightly-2026-06-18

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: sm-standard-4
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        target:
          - credential_header_parse
          - chunked_eof
          - chunked_decode
          - copy_source_parse
          - etag_parse
          - range_parse
          - cors_match
          - route_disjoint
          - route_compiled_equiv
          - opaque_token
          - wire_accept
          - host_resolve
          - xml_parse
          - header_accept
          - policy_json
          - post_form
          - restore_header
          - event_stream_frame
          - decode_diff
          - encode_diff
          - sigv2_parse
          - presigned_query_parse
          - self_held_http1
          - dialect_admin_routes
          - s3vectors_auth
          - sig_token_and_sts
          - server_http_conn
          - http_metadata_query
          - sse_context_json
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: ${{ env.FUZZ_TOOLCHAIN }}
      # libfuzzer-sys builds libFuzzer from C++ with cc-rs, and the runner image has no c++.
      - name: Install host tools
        run: bash scripts/ci_install_host_tools.sh --with-cxx
      - name: Install cargo-fuzz
        run: cargo +"$FUZZ_TOOLCHAIN" install cargo-fuzz --version "$CARGO_FUZZ_VERSION" --locked
      - name: Restore the corpus
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Fuzz
        env:
          TARGET: ${{ matrix.target }}
          SECONDS_PER_TARGET: ${{ inputs.seconds || '300' }}
        run: |
          set -euo pipefail
          mkdir -p "fuzz/corpus/$TARGET" "fuzz/artifacts/$TARGET"
          cd fuzz
          # libFuzzer reads every directory it is given and writes new inputs to the first.
          inputs=("corpus/$TARGET")
          if [ -d "seeds/$TARGET" ]; then
            inputs+=("seeds/$TARGET")
          fi
          cargo +"$FUZZ_TOOLCHAIN" fuzz run "$TARGET" "${inputs[@]}" -- \
            -max_total_time="$SECONDS_PER_TARGET" -rss_limit_mb=2048 -timeout=10 -print_final_stats=1 \
            2>&1 | tee "$RUNNER_TEMP/fuzz.log"
      - name: Minimise a crash
        if: failure()
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -uo pipefail
          cd fuzz
          for crash in artifacts/"$TARGET"/*; do
            [ -f "$crash" ] || continue
            cargo +"$FUZZ_TOOLCHAIN" fuzz tmin "$TARGET" "$crash" -- -runs=10000 2>&1 | tail -20 || true
          done
          {
            echo "## $TARGET crashed"
            echo '```'
            grep -E 'panicked|ERROR: libFuzzer|SUMMARY' "$RUNNER_TEMP/fuzz.log" | head -20 || true
            echo '```'
            echo "Commit the minimised input as fuzz/seeds/$TARGET/<name> in the fix PR."
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Record the run
        if: always()
        run: |
          {
            echo "## ${{ matrix.target }}"
            echo '```'
            grep -E '^stat::|Done [0-9]+ runs' "$RUNNER_TEMP/fuzz.log" 2>/dev/null || echo "no libFuzzer statistics were printed"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-crash-${{ matrix.target }}-${{ github.run_id }}
          path: |
            fuzz/artifacts/${{ matrix.target }}
            ${{ runner.temp }}/fuzz.log
          if-no-files-found: warn

  rustfs-endpoint-replay:
    name: Replay decode_diff/encode_diff against RustFS candidate
    needs: [fuzz]
    if: ${{ !cancelled() }}
    runs-on: sm-standard-4
    timeout-minutes: 60
    env:
      CANDIDATE_ENDPOINT: http://127.0.0.1:19000
      ACCESS_KEY: AKIAIOSFODNN7EXAMPLE
      SECRET_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Install host tools
        run: bash scripts/ci_install_host_tools.sh
      - name: Checkout RustFS candidate
        if: ${{ !inputs.endpoint }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: rustfs/rustfs
          ref: ${{ inputs.rustfs_ref || 'main' }}
          path: candidate/rustfs
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # pinned action revision
        with:
          toolchain: 1.97.1
      - name: Cache gateway replay build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: fuzz-endpoint-replay-gateway
      - name: Cache RustFS candidate build
        if: ${{ !inputs.endpoint }}
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: candidate/rustfs -> target
          shared-key: fuzz-endpoint-replay-rustfs
      - name: Install RustFS build dependencies
        if: ${{ !inputs.endpoint }}
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          pkgs=(build-essential cmake pkg-config libssl-dev protobuf-compiler flatbuffers-compiler)
          if [ "$(id -u)" -eq 0 ]; then
            apt-get update && apt-get install -y --no-install-recommends "${pkgs[@]}"
          else
            sudo -n apt-get update && sudo -n apt-get install -y --no-install-recommends "${pkgs[@]}"
          fi
          protoc --version
      - name: Build fuzz-endpoint-replay
        run: cargo build --locked --release -p rustfs-gateway-difftest --bin fuzz-endpoint-replay
      - name: Build RustFS candidate
        if: ${{ !inputs.endpoint }}
        working-directory: candidate/rustfs
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/candidate-rev.txt"
          cargo build --locked -p rustfs --bin rustfs
      - name: Restore decode_diff corpus
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: fuzz/corpus/decode_diff
          key: fuzz-corpus-decode_diff-${{ github.run_id }}
          restore-keys: fuzz-corpus-decode_diff-
      - name: Restore encode_diff corpus
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: fuzz/corpus/encode_diff
          key: fuzz-corpus-encode_diff-${{ github.run_id }}
          restore-keys: fuzz-corpus-encode_diff-
      - name: Start RustFS candidate
        if: ${{ !inputs.endpoint }}
        id: candidate
        env:
          RUSTFS_UNSAFE_BYPASS_DISK_CHECK: "true"
          RUSTFS_CONSOLE_ENABLE: "false"
          RUSTFS_SERVER_DOMAINS: s3.example.com,s3.us-east-1.example.com
          RUST_LOG: info
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/endpoint-replay"
          host="$RUNNER_TEMP/rustfs-candidate"
          mkdir -p "$out" "$host"/data/rustfs{0..3}
          candidate/rustfs/target/debug/rustfs --version | tee "$out/candidate-version.txt"
          candidate/rustfs/target/debug/rustfs \
            --address "${CANDIDATE_ENDPOINT#http://}" \
            --access-key "$ACCESS_KEY" \
            --secret-key "$SECRET_KEY" \
            "$host"/data/rustfs{0..3} \
            > "$out/rustfs.log" 2>&1 &
          pid=$!
          echo "$pid" > "$host/rustfs.pid"
          for _ in $(seq 120); do
            if ! kill -0 "$pid" 2>/dev/null; then
              status=0
              wait "$pid" || status=$?
              echo "did not start: exit ${status}: $(grep -v '^[[:space:]]*$' "$out/rustfs.log" | tail -n 1)" | tee "$out/startup.txt"
              exit 1
            fi
            if curl -sf "$CANDIDATE_ENDPOINT/health/ready" >/dev/null; then
              echo ready > "$out/startup.txt"
              exit 0
            fi
            sleep 1
          done
          echo "did not start: /health/ready did not answer within 120 seconds" | tee "$out/startup.txt"
          exit 1
      - name: Replay decode_diff and encode_diff corpora against endpoint
        env:
          EXTERNAL_ENDPOINT: ${{ inputs.endpoint }}
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/endpoint-replay"
          mkdir -p "$out/artifacts/decode_diff" "$out/artifacts/encode_diff" \
            fuzz/corpus/decode_diff fuzz/corpus/encode_diff
          if [ -n "${EXTERNAL_ENDPOINT:-}" ]; then
            endpoint="$EXTERNAL_ENDPOINT"
            auth_args=()
          else
            endpoint="$CANDIDATE_ENDPOINT"
            auth_args=(--access-key "$ACCESS_KEY" --secret-key "$SECRET_KEY")
          fi
          status=0
          target/release/fuzz-endpoint-replay \
            --endpoint "$endpoint" \
            --target decode_diff \
            --corpus-dir fuzz/corpus/decode_diff \
            --corpus-dir fuzz/seeds/decode_diff \
            "${auth_args[@]}" \
            --health-path /health/ready \
            --artifacts-dir "$out/artifacts/decode_diff" \
            2>&1 | tee "$out/decode_diff.log"
          decode_status=${PIPESTATUS[0]}
          if [ "$decode_status" -ne 0 ]; then
            status=1
          fi
          target/release/fuzz-endpoint-replay \
            --endpoint "$endpoint" \
            --target encode_diff \
            --corpus-dir fuzz/corpus/encode_diff \
            --corpus-dir fuzz/seeds/encode_diff \
            "${auth_args[@]}" \
            --health-path /health/ready \
            --artifacts-dir "$out/artifacts/encode_diff" \
            2>&1 | tee "$out/encode_diff.log"
          encode_status=${PIPESTATUS[0]}
          if [ "$encode_status" -ne 0 ]; then
            status=1
          fi
          pid_file="$RUNNER_TEMP/rustfs-candidate/rustfs.pid"
          if [ -f "$pid_file" ]; then
            if kill -0 "$(cat "$pid_file")" 2>/dev/null; then
              echo alive > "$out/candidate-alive.txt"
            else
              echo exited > "$out/candidate-alive.txt"
              status=1
            fi
          fi
          exit "$status"
      - name: Stop RustFS candidate
        if: always()
        run: |
          pid_file="$RUNNER_TEMP/rustfs-candidate/rustfs.pid"
          if [ -f "$pid_file" ]; then
            kill "$(cat "$pid_file")" 2>/dev/null || true
          fi
      - name: Record endpoint replay summary
        if: always()
        run: |
          out="$RUNNER_TEMP/endpoint-replay"
          {
            echo "## RustFS candidate endpoint replay"
            if [ -f "$RUNNER_TEMP/candidate-rev.txt" ]; then
              echo "- Candidate commit: \`$(cat "$RUNNER_TEMP/candidate-rev.txt")\`"
            fi
            if [ -f "$out/candidate-alive.txt" ]; then
              echo "- Candidate after replay: \`$(cat "$out/candidate-alive.txt")\`"
            fi
            echo '```'
            head -n 20 "$out/decode_diff.log" 2>/dev/null || echo "no decode_diff replay output"
            head -n 20 "$out/encode_diff.log" 2>/dev/null || echo "no encode_diff replay output"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Upload endpoint replay crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-endpoint-replay-crash-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/endpoint-replay
          if-no-files-found: warn
          retention-days: 30
