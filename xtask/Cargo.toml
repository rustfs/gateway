[package]
name = "xtask"
description = "Repository automation entry point"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["ir-validation"]
ir-validation = ["dep:jsonschema"]

[dependencies]
jsonschema = { workspace = true, optional = true }
rustfs-gateway = { workspace = true }
rustfs-gateway-codegen = { workspace = true }
rustfs-gateway-conformance = { workspace = true }
rustfs-gateway-core = { workspace = true }
rustfs-gateway-model = { workspace = true }
http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
