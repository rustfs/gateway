[package]
name = "rustfs-gateway-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
bytes = "1"
http = "1"
libfuzzer-sys = "0.4"
rustfs-gateway = { path = "../crates/gateway" }
rustfs-gateway-conformance = { path = "../crates/conformance" }
rustfs-gateway-core = { path = "../crates/core" }
# The migration-only differential (rustfs/backlog#1762): the decode_diff and encode_diff properties.
rustfs-gateway-difftest = { path = "../crates/difftest" }
rustfs-gateway-http = { path = "../crates/http" }
rustfs-gateway-server = { path = "../crates/server" }
rustfs-gateway-sig = { path = "../crates/sig" }
rustfs-gateway-stream = { path = "../crates/stream" }
rustfs-gateway-types = { path = "../crates/types" }
rustfs-gateway-xml = { path = "../crates/xml" }
# The `policy_json` property's reference reader: the JSON reader RustFS loads a stored policy with.
serde = "1"
serde_json = "1"
# The `self_held_http1` property drives the production driver over a real loopback socket.
http-body-util = "0.1"
tokio = { version = "1", features = ["io-util", "net", "rt-multi-thread", "time"] }
tower = { version = "0.5", features = ["util"] }

[workspace]
members = ["."]

[[bin]]
name = "credential_header_parse"
path = "fuzz_targets/credential_header_parse.rs"
test = false
doc = false
bench = false

