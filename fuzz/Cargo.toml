[package]
name = "rustfs-gateway-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
bytes = "1"
libfuzzer-sys = "0.4"
rustfs-gateway-sig = { path = "../crates/sig" }
rustfs-gateway-stream = { path = "../crates/stream" }

[workspace]
members = ["."]

[[bin]]
name = "credential_header_parse"
path = "fuzz_targets/credential_header_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "chunked_eof"
path = "fuzz_targets/chunked_eof.rs"
test = false
doc = false
bench = false
