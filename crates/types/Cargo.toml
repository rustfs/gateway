[package]
name = "rustfs-gateway-types"
description = "S3 scalar types, operation inputs/outputs and their generated codecs"
# Not `version.workspace = true`: ADR-0004 P8 requires the crate that carries the generated dto to
# name the AWS model snapshot it was generated from, so a consumer can tell which model their build
# corresponds to. The suffix is SemVer build metadata and takes no part in version precedence, so
# the root `rustfs-gateway-types` dependency requirement still matches it. Keep the numeric part
# equal to that requirement, and move the date whenever `model/s3.json` is re-pinned — the value is
# `model/PROVENANCE.md`'s "Pinned commit date".
version = "0.32.0+aws.2026-10-02"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Not published. rustfs consumes this repository as a git dependency, exactly as it
# consumed s3s. Publishing would buy nothing and cost a cross-repository version
# lockstep on every change to a ring-0 type.
publish = false

[package.metadata.gateway]
ring = 0
# Ring 0 and 1 must not depend on any rustfs-* business crate or on a ring-2 crate.
# This is what keeps the cross-repository graph acyclic: ring-0 types are consumed by
# rustfs crates, which ring-2 then depends on. Enforced by check_ring_boundaries.sh.

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
rustfs-gateway-xml = { workspace = true }
rustfs-gateway-stream = { workspace = true }
bytes = { workspace = true }
hex = { workspace = true }
http = { workspace = true }
percent-encoding = { workspace = true }
sha2 = { workspace = true }
unicode-normalization = { workspace = true }
# The three s3s revisions persistence migration is admitted against, each read from the
# `Cargo.lock` of the RustFS build named beside it and each listed in `compat::OracleRevision`,
# and the fourth, `s3s_rustfs`, that RustFS main links today. Every alias is renamed so no crate
# is called `s3s`: a forgotten `super::` in an adapter then fails to compile instead of silently
# measuring the baseline twice.
# Baseline: RustFS 1.0.0-rc.5-preview.2; the original P9-01 oracle every golden was measured against.
s3s_baseline = { package = "s3s", git = "https://github.com/rustfs/s3s.git", rev = "9c4690d8e73fc8d184031a19b2c4539ebc77d180", version = "0.15.0", features = ["minio"], optional = true }
# Rollback: RustFS 1.0.0-rc.6, the latest release and the build an operator rolls back to.
s3s_rollback = { package = "s3s", git = "https://github.com/rustfs/s3s.git", rev = "bdcb6259339c41369f9f1c60e3a42b5ab8da607b", version = "0.15.0", features = ["minio"], optional = true }
# Candidate: RustFS main at 528a3681, the production build persistence migration is a candidate
# for, and the s3s release every persistence golden's candidate measurement was taken against.
s3s_candidate = { package = "s3s", version = "0.17.0", features = ["minio"], optional = true }
# RustFS main today (rustfs/rustfs@6b155400 `Cargo.toml:324`), the crate `impl s3s::S3 for FS`
# links while its use cases are ported to gateway types (rustfs/backlog#2749). Everything after
# `package = "s3s", ` MUST stay byte-identical to RustFS main's own `s3s = { ... }` line: Cargo
# unifies the two only when source and revision agree, and the seam compiled against this alias
# (`compat::s3s_5761ddfe`) is useless to RustFS if its s3s types are a second copy of the crate.
# The crate is s3s 0.17.0 plus fixes; its DTO facts are byte-identical to the release's.
# DELETE BY: rustfs/backlog#2734 T4.2 removes the last s3s link from RustFS, and this alias with it.
s3s_rustfs = { package = "s3s", git = "https://github.com/s3s-project/s3s", rev = "5761ddfe4c509fcac87e3b99fd5bd9e176b442c0", features = ["minio"], optional = true }
# Only for the seam's `put_object`: the s3s streaming body is a `futures_core::Stream`, so moving
# the live gateway body into it without buffering needs the trait. Never enabled without a
# `compat-s3s*` feature.
futures-core = { workspace = true, optional = true }

# Pinned here rather than inherited, and each line states why. Hoisting them into
# `[workspace.dependencies]` is a root-manifest change and belongs to whoever owns that file.
#
# `crc-fast` MUST keep `default-features = false`: the default set pulls in `ffi` (C bindings for
# building a cdylib, which a server does not need) and `panic-handler` (which upstream advises
# against when building a binary). Workspace inheritance cannot express the override, because a
# member may not turn off default features that the workspace entry left on.
crc-fast = { workspace = true }
md-5 = { workspace = true }
sha1 = { workspace = true }
twox-hash = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
serde_json = { workspace = true }

[features]
# The ONLY place a ring-0 crate may ever depend on s3s. Reason (measured, E0117): the orphan
# rule forbids a third-party crate from writing `impl From<s3s::X> for rustfs-gateway::X`, so the
# migration conversions must live here. The exact revision is the old persistence oracle; allowing
# it to float would make a golden compare two moving targets.
# DELETE BY: P9-09 removes this dependency and compatibility module after the last migration.
# see ADR-0004: version carries +aws.<model-date> once the model is pinned
compat-s3s = ["compat-s3s-0-17-0", "compat-s3s-rustfs", "dep:s3s_baseline", "dep:s3s_rollback", "dep:s3s_candidate", "dep:s3s_rustfs", "dep:futures-core"]
# One seam revision of `compat-s3s` and nothing else: the migration seam (`compat::s3s_0_17_0`)
# compiled against the s3s release RustFS main linked at 528a3681, for the goldens and difftest
# runners, which must not pay for the two oracle revisions. The suffix names that revision (the
# eight-character git rev, or the crates.io release version with dashes): after a RustFS s3s bump
# the adapter stops compiling (its s3s and this seam's are two crates) until a seam for the new
# revision exists here, instead of converting to a revision RustFS no longer runs.
# DELETE BY: P9-09 removes this feature together with `compat-s3s`.
compat-s3s-0-17-0 = ["dep:s3s_candidate", "dep:futures-core"]
# The seam revision RustFS main links today (`compat::s3s_5761ddfe`, the `s3s_rustfs` alias above),
# for the RustFS ring-2 adapter and the ported use cases (rustfs/backlog#2749, #2759). Named for
# its consumer rather than its revision, the one such exception `check_layer_dependencies.sh`
# admits: the alias moves with RustFS's own pin, and the seam module it mounts is still named for
# the revision, so a RustFS bump renames the module and the adapter stops compiling until the
# seam is re-pinned here.
# DELETE BY: rustfs/backlog#2734 T4.2 removes the last s3s link from RustFS, and this feature with it.
compat-s3s-rustfs = ["dep:s3s_rustfs", "dep:futures-core"]

[[bench]]
name = "checksum"
harness = false
