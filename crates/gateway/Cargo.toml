[package]
name = "rustfs-gateway"
description = "A protocol-exact, security-first S3 server framework for Rust"
version = "0.46.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Not published. rustfs consumes this repository as a git dependency, exactly as it
# consumed s3s. Publishing would buy nothing and cost a cross-repository version
# lockstep on every change to a ring-0 type.
publish = false
autotests = false

[package.metadata.gateway]
ring = 1
# Ring 0 and 1 must not depend on any rustfs-* business crate or on a ring-2 crate.
# This is what keeps the cross-repository graph acyclic: ring-0 types are consumed by
# rustfs crates, which ring-2 then depends on. Enforced by check_ring_boundaries.sh.

[features]
default = ["server"]
server = ["dep:rustfs-gateway-server"]
dangerous-allow-all-authorizer = []
dangerous-replace-signature-verifier = ["rustfs-gateway-sig/dangerous-replace-signature-verifier"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
rustfs-gateway-core = { workspace = true }
rustfs-gateway-http = { workspace = true }
rustfs-gateway-macros = { workspace = true }
rustfs-gateway-server = { workspace = true, optional = true }
rustfs-gateway-sig = { workspace = true }
rustfs-gateway-stream = { workspace = true }
rustfs-gateway-types = { workspace = true }
rustfs-gateway-xml = { workspace = true }

arc-swap = { workspace = true }
bytes = { workspace = true }
futures-timer = { workspace = true }
futures-util = { workspace = true }
http = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
httparse = { workspace = true }
hyper = { workspace = true }
sha2 = { workspace = true }
tower = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "net", "sync", "time"] }

[dev-dependencies]
dhat = { workspace = true }
md-5 = { workspace = true }
# `tests/replica_put.rs`: the replication dialect's replica write, assembled through this facade.
rustfs-gateway-dialect-minio = { path = "../dialect-minio" }
socket2 = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "signal", "test-util"] }
trybuild = { workspace = true }

[[test]]
name = "integration"
path = "tests/integration.rs"

[[example]]
name = "minimal"

[[example]]
name = "custom_authorizer"

[[example]]
name = "custom_credential_provider"
