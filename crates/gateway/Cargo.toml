[package]
name = "rustfs-gateway"
description = "A protocol-exact, security-first S3 server framework for Rust"
version = "0.57.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Not published. rustfs consumes this repository as a git dependency, exactly as it
# consumed s3s. Publishing would buy nothing and cost a cross-repository version
# lockstep on every change to a ring-0 type.
publish = false
autotests = false

[package.metadata.gateway]
ring = 1
# Ring 0 and 1 must not depend on any rustfs-* business crate or on a ring-2 crate.
# This is what keeps the cross-repository graph acyclic: ring-0 types are consumed by
# rustfs crates, which ring-2 then depends on. Enforced by check_ring_boundaries.sh.

[features]
default = ["server"]
server = ["dep:rustfs-gateway-server"]
dangerous-allow-all-authorizer = []
dangerous-replace-signature-verifier = ["rustfs-gateway-sig/dangerous-replace-signature-verifier"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
rustfs-gateway-core = { workspace = true }
rustfs-gateway-http = { workspace = true }
rustfs-gateway-macros = { workspace = true }
rustfs-gateway-server = { workspace = true, optional = true }
rustfs-gateway-sig = { workspace = true }
rustfs-gateway-stream = { workspace = true }
rustfs-gateway-types = { workspace = true }
rustfs-gateway-xml = { workspace = true }

arc-swap = { workspace = true }
bytes = { workspace = true }
form_urlencoded = { workspace = true }
futures-timer = { workspace = true }
futures-util = { workspace = true }
http = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
httparse = { workspace = true }
hyper = { workspace = true }
pin-project-lite = { workspace = true }
sha2 = { workspace = true }
tower = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "net", "sync", "time"] }
# `Instrument` and `Span::current` only: committed work keeps the span of the request that
# started it. The gateway records nothing through it.
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
dhat = { workspace = true }
# `tests/unread_body_drain.rs` hosts the service on a plain Hyper HTTP/1 connection, as RustFS does.
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true, features = ["tokio"] }
md-5 = { workspace = true }
# `tests/authz_context_facts.rs` drives the authorizer over a real TLS listener (rustfs/backlog#2752).
rcgen = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
# `tests/replica_put.rs`: the replication dialect's replica write, assembled through this facade.
rustfs-gateway-dialect-minio = { path = "../dialect-minio" }
# `tests/host_request_id.rs`: RustFS's admin paths, where the RustFS profile leaves the identifier to the host.
rustfs-gateway-dialect-rustfs-admin = { path = "../dialect-rustfs-admin" }
# `tests/rustfs_profile.rs`: the RustFS profile's posture golden is rendered over the reference
# backend the client-matrix launcher runs, so the launcher's own assembly can be held to it.
rustfs-gateway-fs = { path = "../fs" }
socket2 = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "signal", "test-util"] }
trybuild = { workspace = true }
# `commit_task`'s span test implements a subscriber's `current_span`.
tracing-core = { workspace = true }

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "socket_timing"
path = "tests/socket_timing.rs"

[[bench]]
name = "post_object"
harness = false

[[example]]
name = "minimal"

[[example]]
name = "custom_authorizer"

[[example]]
name = "custom_credential_provider"
