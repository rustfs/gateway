[package]
name = "rustfs-gateway-conformance"
description = "Data-driven S3 conformance suite runnable against any implementation"
version = "0.1.0"   # independent version: this is a product other S3 implementations run against themselves
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Not published. rustfs consumes this repository as a git dependency, exactly as it
# consumed s3s. Publishing would buy nothing and cost a cross-repository version
# lockstep on every change to a ring-0 type.
publish = false

[package.metadata.gateway]
ring = 1
# Ring 0 and 1 must not depend on any rustfs-* business crate or on a ring-2 crate.
# This is what keeps the cross-repository graph acyclic: ring-0 types are consumed by
# rustfs crates, which ring-2 then depends on. Enforced by check_ring_boundaries.sh.

[lints]
workspace = true

[dependencies]
rustfs-gateway = { workspace = true }

# The two crates whose types appear in the signature of the facade's own entry point:
# `S3Service::call_bytes(http::Request<bytes::Bytes>)`. A caller cannot name that call without
# them, so they are not a dependency this crate chose — they are the facade's public surface.
# Everything else this crate needs (TOML, JSON, schema, patterns, digests) is still hand-written
# here, so a foreign implementation running this suite inherits nothing else.
bytes = { workspace = true }
http = { workspace = true }
