[package]
name = "rustfs-gateway-conformance"
description = "Data-driven S3 conformance suite runnable against any implementation"
version = "0.13.0"  # independent version: this is a product other S3 implementations run against themselves
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Not published. rustfs consumes this repository as a git dependency, exactly as it
# consumed s3s. Publishing would buy nothing and cost a cross-repository version
# lockstep on every change to a ring-0 type.
publish = false
autotests = false

[package.metadata.gateway]
ring = 1
# Ring 0 and 1 must not depend on any rustfs-* business crate or on a ring-2 crate.
# This is what keeps the cross-repository graph acyclic: ring-0 types are consumed by
# rustfs crates, which ring-2 then depends on. Enforced by check_ring_boundaries.sh.

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[features]
default = ["production-transports"]
production-transports = ["rustfs-gateway/server"]

[[test]]
name = "integration"
path = "tests/integration.rs"

# Ahead of `[dependencies]`, and not at the end of the file where it would naturally go.
# `scripts/test_guard_scripts.sh` proves `check_layer_dependencies.sh` can fail by appending
# `rustfs-gateway-core = { workspace = true }` to this file — a line that means "conformance
# reached past the facade" only if it lands in `[dependencies]`. A `[dev-dependencies]` table at
# the end catches that append instead, the guard correctly permits it, and a negative case that
# has proved this guard could fail since P0 quietly stops proving anything. Keep `[dependencies]`
# last.
[dev-dependencies]
# The Select transport regression supplies a fallible producer to the facade's ByteStream.
# The producer trait is not re-exported by the facade and stays test-only here.
rustfs-gateway-stream = { workspace = true }
# The allocation instrument. `src/fixture/list_allocations.rs` installs `dhat::Alloc` as the
# global allocator of the library's own test executable, under `#[cfg(test)]`, so nothing in the
# shipped library reaches it and a dev-dependency is not inherited by an implementation that runs
# this suite against itself.
dhat = { workspace = true }
# The pagination property test's generator. Same reasoning: dev-only, and the properties it states
# are about the reference backend rather than about the corpus.
proptest = { workspace = true }
rcgen = { workspace = true }

[dependencies]
rustfs-gateway.workspace = true
rustls.workspace = true
webpki-roots.workspace = true

# The two crates whose types appear in the signature of the facade's own entry point:
# `S3Service::call_bytes(http::Request<bytes::Bytes>)`. A caller cannot name that call without
# them, so they are not a dependency this crate chose — they are the facade's public surface.
# Everything else this crate needs (TOML, JSON, schema, patterns, digests) is still hand-written
# here, so a foreign implementation running this suite inherits nothing else.
bytes = { workspace = true }
http = { workspace = true }
# The request-body trait `S3Service::call` is generic over. The socket target must hand the service
# a body it pulls from the socket one block at a time -- a body buffered in advance cannot show
# that the service stopped asking, which is the whole subject of `expect.request_progress`. So this
# is the facade's public surface too, for the same reason as the two above, and not a dependency
# this crate chose for its own convenience.
http-body = { workspace = true }
# A committed response captures the caller's Tokio runtime before it returns its frozen head. The
# in-process and socket targets therefore keep one current-thread runtime alive while they call the
# facade and drain that response; no work-stealing scheduler or I/O driver is enabled.
tokio = { workspace = true, features = ["time"] }
