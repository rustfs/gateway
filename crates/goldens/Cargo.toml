[package]
name = "rustfs-gateway-goldens"
description = "Persistence compatibility goldens for RustFS gateway migrations"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[package.metadata.gateway]
ring = 1

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
rustfs-gateway-types = { path = "../types", features = ["compat-s3s"] }
# The persisted-metadata corpus and the recorded-request corpus share one provenance
# vocabulary on purpose: two allowlists of "what produced these bytes" would drift, and the
# one that drifted would be the one nobody read. See crates/corpus/src/store.rs.
rustfs-gateway-corpus = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
zip = { version = "8.6.0", default-features = false }
