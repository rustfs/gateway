[package]
name = "rustfs-gateway-goldens"
description = "Persistence compatibility goldens for RustFS gateway migrations"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
autotests = false

[package.metadata.gateway]
ring = 1

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
rustfs-gateway-types = { path = "../types", features = ["compat-s3s"] }
# The persisted-metadata corpus and the recorded-request corpus share one provenance
# vocabulary on purpose: two allowlists of "what produced these bytes" would drift, and the
# one that drifted would be the one nobody read. See crates/corpus/src/store.rs.
rustfs-gateway-corpus = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
zip = { version = "8.6.0", default-features = false }
# The operation decode/encode diff (rustfs/backlog#1762) runs the real gateway route and codec
# against the pinned s3s oracle. Dev-only: the goldens library itself never links the runtime.
rustfs-gateway-core = { workspace = true }
rustfs-gateway-http = { workspace = true }
rustfs-gateway-stream = { workspace = true }
bytes = { workspace = true }
futures-core = { workspace = true }
http = { workspace = true }
proptest = { workspace = true }

[[test]]
name = "cli"
path = "tests/cli.rs"
