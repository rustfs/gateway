[package]
name = "rustfs-gateway-goldens"
description = "Persistence compatibility goldens for RustFS gateway migrations"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
autotests = false

[package.metadata.gateway]
ring = 1

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
rustfs-gateway-types = { path = "../types", features = ["compat-s3s"] }
# The persisted-metadata corpus and the recorded-request corpus share one provenance
# vocabulary on purpose: two allowlists of "what produced these bytes" would drift, and the
# one that drifted would be the one nobody read. See crates/corpus/src/store.rs.
rustfs-gateway-corpus = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
zip = { version = "8.6.0", default-features = false }
# The operation decode/encode diff (rustfs/backlog#1762) runs the real gateway route and codec
# against the pinned s3s oracle. Dev-only: the goldens library itself never links the runtime.
rustfs-gateway-core = { workspace = true }
rustfs-gateway-http = { workspace = true }
rustfs-gateway-stream = { workspace = true }
# The request-document parity proof (rustfs/gateway#1078) reads each baseline as a tree to perturb it.
rustfs-gateway-xml = { workspace = true }
# The request-context diff authenticates and resolves the same raw request the way the gateway
# does: the facade's SigV4 authenticator and virtual-host resolver, the signature crate's floor,
# scope check and client signer. Dev-only, for the same reason as the three above.
rustfs-gateway = { workspace = true, features = ["server"] }
rustfs-gateway-sig = { workspace = true }
# The RustFS profile of rd-put-0007: the replica write decoded through the replication dialect.
rustfs-gateway-dialect-minio = { path = "../dialect-minio" }
# The generated RustFS admin dialect, bound back to the recorded inventory it was generated from
# and driven through the assembled service (rustfs/backlog#1744).
rustfs-gateway-dialect-rustfs-admin = { path = "../dialect-rustfs-admin" }
bytes = { workspace = true }
futures-core = { workspace = true }
http = { workspace = true }
# The rd-loc pins read a whole gateway response body, which is an `http_body::Body`.
http-body-util = { workspace = true }
proptest = { workspace = true }
# Real loopback admin fallback and body-ordering controls.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }

[[test]]
name = "cli"
path = "tests/cli.rs"
