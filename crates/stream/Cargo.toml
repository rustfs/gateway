[package]
name = "rustfs-gateway-stream"
description = "Payload and body primitives, free of S3 semantics"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Not published. rustfs consumes this repository as a git dependency, exactly as it
# consumed s3s. Publishing would buy nothing and cost a cross-repository version
# lockstep on every change to a ring-0 type.
publish = false

[package.metadata.gateway]
ring = 0
# Ring 0 and 1 must not depend on any rustfs-* business crate or on a ring-2 crate.
# This is what keeps the cross-repository graph acyclic: ring-0 types are consumed by
# rustfs crates, which ring-2 then depends on. Enforced by check_ring_boundaries.sh.

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[features]
# Bridges to `tokio::io::AsyncRead` in both directions (`TokioReadPayload`, `PayloadReader`).
# Off by default, and the only door to the optional dependency below: with the default feature
# set `cargo tree -p rustfs-gateway-stream -e normal` shows the four crates and nothing else.
tokio-io = ["dep:tokio"]

# `[dependencies]` stays the last table in this file: the guard suite appends a line to the file
# to plant a forbidden dependency, and an append lands in whichever table is last.
[dependencies]
# Deliberately four unconditional dependencies, none of them internal. This crate sits below
# `rustfs-gateway-types` so that it is reachable from both `rustfs-gateway-types` and
# `rustfs-gateway-http`; every extra edge declared here becomes an edge in every downstream
# dependency tree.
bitflags = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
http-body = { workspace = true }
# The one optional fifth, declared here rather than inherited: the workspace entry carries `rt`
# and `macros`, and a task can only be spawned under `rt`. With `io-util` alone there is no
# `tokio::spawn`, no `JoinHandle` and no `JoinSet`, so a read-ahead task is not merely forbidden
# in this crate, it is unwritable. scripts/check_no_spawn_in_stream.sh checks every word of this
# declaration instead of listing it.
tokio = { version = "1.53", default-features = false, features = ["io-util"], optional = true }
