gateway = "* then an error"
reason = "The gateway verifies a Content-MD5 or x-amz-checksum-* digest while the handler reads and fails the body at its end when it does not match; s3s hands every byte to RustFS, which verifies the same digest in its own reader and refuses with BadDigest (https://github.com/rustfs/rustfs/blob/719000460b231792b52314df321f0d385d03dff4/rustfs/src/app/object/extract.rs#L1208). Neither stack commits the object."
expires = "2026-12-31"

