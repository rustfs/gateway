[[diff]]
id = "kd-decode-0078"
kind = "decode"
operation = "PutObject"
item = "PutObjectInput.content_length"
gateway = '"5"'
reason = "An anonymous STREAMING-UNSIGNED-PAYLOAD-TRAILER upload (a public-write bucket): the gateway de-frames it before the handler as it does a signed one (rustfs/gateway#1060); the legacy stack de-frames only header-signed requests, so its handler gets the framed length and bytes. Legacy RustFS then sizes the object by x-amz-decoded-content-length (https://github.com/rustfs/rustfs/blob/1e7065101d7de4ebacabd249db5b4debbf5baa68/rustfs/src/app/object/put.rs#L91-L108) and refuses the surplus framing bytes: 400 UnexpectedContent for a small body (https://github.com/rustfs/rustfs/blob/1e7065101d7de4ebacabd249db5b4debbf5baa68/rustfs/src/app/object/put.rs#L651-L678) and 500 InternalError for a streamed one (https://github.com/rustfs/rustfs/blob/1e7065101d7de4ebacabd249db5b4debbf5baa68/crates/rio/src/hardlimit_reader.rs#L44-L63). A local legacy run stored nothing in either case. The gateway accepts a request legacy RustFS refused."
expires = "2027-03-31"

