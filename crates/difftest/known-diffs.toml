# The known-diffs register of the gateway/s3s differential (rustfs/backlog#1762).
#
# Every difference the decode or encode diff reports must match an entry here or it fails. An
# entry says what differs (operation, item, and optionally the exact rendered values on each side),
# why that is accepted, and the date by which it must be reviewed again. Entries are removed when
# the difference is gone; adding one needs the justification spelled out in the pull request.
#
# Keys: id (kd-<decode|encode>-NNNN), kind, operation, item, gateway?, s3s?, reason, expires,
# ruling? (rd-… in crates/goldens/src/migration_inventory/request_divergences.rs), adr?.

# ── Decode: members the gateway reads differently ────────────────────────────────────────────

[[diff]]
id = "kd-decode-0001"
kind = "decode"
operation = "PutObject"
item = "PutObjectInput.checksum_algorithm"
gateway = "\"*\""
s3s = "<unset>"
reason = "The gateway reads the algorithm from x-amz-sdk-checksum-algorithm, the header the S3 model binds; the pinned s3s reads x-amz-checksum-algorithm, so each stack leaves the member unset for the other header."
expires = "2026-12-31"
ruling = "rd-put-0002"

[[diff]]
id = "kd-decode-0002"
kind = "decode"
operation = "PutObject"
item = "PutObjectInput.version_id"
gateway = "<no member>"
reason = "MinIO's ?versionId= on a PUT has no member in the gateway's PutObject; only the replication dialect's replica write reads it, after s3:ReplicateObject authorization."
expires = "2026-12-31"
ruling = "rd-put-0007"

[[diff]]
id = "kd-decode-0003"
kind = "decode"
operation = "GetObject"
item = "GetObjectInput.if_range"
s3s = "<no member>"
reason = "The pinned s3s GetObjectInput has no If-Range member, so RustFS never sees the validator and serves the range of whatever object is current; the gateway binds it (q-range-0058). A follow-up for the RustFS adapter, not a gateway change."
expires = "2026-12-31"

[[diff]]
id = "kd-decode-0004"
kind = "decode"
operation = "UploadPart"
item = "UploadPartInput.upload_id"
gateway = "\"<an id the gateway could never have minted>\""
reason = "The gateway hands an upload id out only through its resolver, which refuses a shape no server mints (a leading slash, a dot-dot segment, control bytes) as NoSuchUpload; s3s hands the text to RustFS, whose lookup answers NoSuchUpload for it too."
expires = "2026-12-31"

