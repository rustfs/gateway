reason = "A trailing checksum declared by x-amz-trailer without x-amz-sdk-checksum-algorithm: s3s fills checksum_algorithm from the trailer name, the gateway only from the header the S3 model binds (see kd-decode-0001 for the other direction). The trailer's value itself is verified by both."
