# ── Decode: signed aws-chunked uploads, seen once replays are signed again ──────────────────

[[diff]]
id = "kd-decode-0075"
kind = "decode"
operation = "PutObject"
item = "PutObjectInput.content_encoding"
gateway = "<unset>"
s3s = '"aws-chunked"'
reason = "A signed aws-chunked upload declares Content-Encoding: aws-chunked. The gateway removes that coding once it has decoded the framing, as S3 does (https://docs.aws.amazon.com/AmazonS3/latest/API/sigv4-streaming.html: aws-chunked is a transfer of the payload, not a coding of the stored object); the pinned s3s hands it to the handler, so RustFS today may store an object whose Content-Encoding says aws-chunked. The adapter must not rely on seeing it."
expires = "2027-03-31"

[[diff]]
