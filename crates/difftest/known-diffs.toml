[[diff]]
id = "kd-decode-0080"
kind = "decode"
operation = "PutObject"
item = "outcome"
gateway = "400 InvalidRequest: a chunk-signed streaming payload needs a signed request"
s3s = "handled"
reason = "An anonymous request that declares STREAMING-AWS4-HMAC-SHA256-PAYLOAD has no seed signature to verify its chunk signatures against, so the gateway refuses it before authorization and before the handler (rustfs/gateway#1060). The legacy stack hands the framed body to the handler, and legacy RustFS refuses it either with AccessDenied from its bucket-policy check or, on a public-write bucket, with 400 UnexpectedContent once the framing overruns the decoded length, as in kd-decode-0078. Both refuse; the code differs, and nothing is stored on either."
expires = "2027-03-31"

