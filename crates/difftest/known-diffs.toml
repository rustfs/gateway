# ── Encode: a listing member with a control character, found by the encode_diff fuzz target ──

[[diff]]
id = "kd-encode-0051"
kind = "encode"
operation = "ListObjectsV2"
item = 'body ListBucketResult/EncodingType'
gateway = '<EncodingType>'
s3s = '<absent>'
reason = "A listing member holding a C0 control character or DEL makes the gateway percent-encode every key-shaped member of the answer and echo EncodingType=url although the request did not ask for it: one flag covers the whole document, and a raw control character is a hazard for XML parsers (line-ending normalisation, rejected characters). s3s writes the character raw. An SDK decodes the members when it reads the echo, so it sees the same keys; a hand-rolled client that ignores EncodingType sees percent-encoded ones. Found by the encode_diff fuzz target; pinned to the one matrix sample."
expires = "2027-03-31"

