# ── Encode: a long non-ASCII metadata value, found by the encode_diff fuzz target ────────────

[[diff]]
id = "kd-encode-0058"
kind = "encode"
operation = "HeadObject"
item = 'header x-amz-meta-note'
gateway = '=?UTF-8?B?77+977+977+977+977+977+977+977+977+977+977+977+977+977+977+9?= =?UTF-8?B?OTE=?='
s3s = '=?UTF-8?B?77+977+977+977+977+977+977+977+977+977+977+977+977+977+977+9OTE=?='
reason = "A metadata value whose RFC 2047 encoded word would pass 75 characters is written by the gateway as two encoded words, as RFC 2047 section 2 requires (https://www.rfc-editor.org/rfc/rfc2047#section-2); s3s writes one longer word. Both decode to the same value; a strict decoder refuses the longer word. Found by the encode_diff fuzz target; pinned to the one matrix sample."
expires = "2027-03-31"


[[diff]]
id = "kd-encode-0060"
kind = "encode"
operation = "HeadObject"
item = 'header x-amz-meta-w'
gateway = '=?UTF-8?B?YT0/Yg==?='
s3s = 'a=?b'
reason = "An ASCII metadata value holding the encoded-word opener =? is written by the gateway as an RFC 2047 encoded word, so a client that decodes encoded words reads back the value that was stored; s3s writes it raw, which such a client may misread. Both carry the same value to a client that decodes as S3 SDKs do. Found by the encode_diff fuzz target; pinned to the one matrix sample."
expires = "2027-03-31"

