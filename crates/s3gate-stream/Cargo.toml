[package]
name = "s3gate-stream"
description = "Payload and body primitives, free of S3 semantics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
# Deliberately three dependencies, none of them internal. This crate sits below `s3gate-types`
# so that it is reachable from both `s3gate-types` and `s3gate-http`; every extra edge declared
# here becomes an edge in every downstream dependency tree.
bitflags = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
