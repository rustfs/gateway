[package]
name = "rustfs-gateway-core"
description = "Operations, routing table, typed pipeline and extension points"
version = "0.45.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Not published. rustfs consumes this repository as a git dependency, exactly as it
# consumed s3s. Publishing would buy nothing and cost a cross-repository version
# lockstep on every change to a ring-0 type.
publish = false
autotests = false

[package.metadata.gateway]
ring = 1
# Ring 0 and 1 must not depend on any rustfs-* business crate or on a ring-2 crate.
# This is what keeps the cross-repository graph acyclic: ring-0 types are consumed by
# rustfs crates, which ring-2 then depends on. Enforced by check_ring_boundaries.sh.

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
rustfs-gateway-sig = { workspace = true }
rustfs-gateway-http = { workspace = true }
rustfs-gateway-types = { workspace = true }
# The generated codecs live here (orphan rule; see `src/codec/mod.rs`), so the writer and the
# bounded reader they use are a dependency of this crate rather than of `rustfs-gateway-types`.
rustfs-gateway-xml = { workspace = true }
rustfs-gateway-stream = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
percent-encoding = { workspace = true }
# The SSE-C key digest. MD5 is not a choice this crate makes: it is the digest
# `x-amz-server-side-encryption-customer-key-MD5` is defined over.
md-5 = { workspace = true }
# The constant-time comparison of a value derived from key material; see `src/sse/key.rs`.
subtle = { workspace = true }
# Wipes the decoded customer key when the stack frame that hashed it returns.
zeroize = { workspace = true }

# ADR-0019: bounded, duplicate-aware JSON context validation.
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
# Differential testing between the readable route table and its compiled form. The compiled
# router is only allowed to exist because a generator can be pointed at both and told to find a
# request they disagree about.
proptest = { workspace = true }
trybuild = { workspace = true }
# The route benchmark uses the same safe external allocation instrument as the HTTP and facade
# probes. The measured lookup itself contains no allocator implementation in this repository.
dhat = { workspace = true }

[[bench]]
name = "route"
harness = false

[[test]]
name = "integration"
path = "tests/integration.rs"

[[example]]
name = "dialect_overlay"
