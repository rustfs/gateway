[package]
name = "rustfs-gateway-sig"
description = "SigV2/SigV4 verification state machine"
version = "0.11.1"
autotests = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Not published. rustfs consumes this repository as a git dependency, exactly as it
# consumed s3s. Publishing would buy nothing and cost a cross-repository version
# lockstep on every change to a ring-0 type.
publish = false

[[test]]
name = "integration"
path = "tests/integration.rs"

[package.metadata.gateway]
ring = 0
# Ring 0 and 1 must not depend on any rustfs-* business crate or on a ring-2 crate.
# This is what keeps the cross-repository graph acyclic: ring-0 types are consumed by
# rustfs crates, which ring-2 then depends on. Enforced by check_ring_boundaries.sh.

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[features]
# Replaces the built-in SigV4 computation. The name is the warning, and it is not a default.
#
# What it turns off is the *computation*: `SecurityFloor::admit` still runs H1..H7 and still
# produces the `SealedAws` a replacement is handed, so a replacement that authenticates everything
# never sees a skewed timestamp, an expired presigned URL, a duplicated signature parameter or a
# presigned request aimed at a privileged operation. `DangerAck` and `AwsSignatureVerifier` exist
# only under this feature, so a build that does not enable it cannot name the replacement point.
dangerous-replace-signature-verifier = []

[dependencies]
# Exactly one internal edge, added when the two `effective_host` drafts were merged into one.
#
# `rustfs-gateway-http` owns the effective-host determination; this crate consumes it and no longer
# has its own. The edge points the way the layer matrix allows (sig -> http), and it is what makes
# "which host did this request address" have one answer: the canonical request builder here and the
# router there read the same `RawHost`, produced by the same function, once per request.
#
# P2-01 recorded the opposite — no edge — on the grounds that the framing mode is decided here and
# consumed there. That reasoning is unaffected: it constrains the http -> sig direction, which stays
# absent, and nothing in this crate reads `Framing`, `Content-Encoding` or any other wire framing
# input. `PayloadMode` is still frozen here and is still the only source of the framing decision.
rustfs-gateway-http = { workspace = true }

# `rustfs-gateway-types` is absent because the frozen dimensions do not use a single S3 type. The layer
# matrix permits the edge, so a later P2 task may add it the moment it needs one.
#
# `aws-sigv4` is absent permanently (ADR-0001, docs/msrv.md).
#
# `http` carries `Request`, `HeaderMap` and `HeaderName`. It stays a direct dependency even though
# `rustfs-gateway-http` re-exports nothing of it: the canonical request reads a `HeaderMap` and a
# `Method` of its own, and borrowing them through another crate's re-export would make a
# third-party version bump invisible here.
#
# `hmac` + `sha2` are the SigV4 primitives: four HMAC-SHA256 steps, and one SHA-256 over the
# canonical request. They are what makes porting the two `aws-sigv4` pure functions into
# `src/derive.rs` cheaper than depending on the crate they came from. `sha1` is SigV2's only
# primitive: one HMAC-SHA1 over the string-to-sign, in `src/sig_v2/`.
#
# `percent-encoding` is deliberately NOT here: its decoder is lossy on a malformed escape (`%zz`
# passes through unchanged), and a signature input may never have two spellings. `src/query.rs`
# hand-rolls a strict codec instead, in the same spirit as `src/codec.rs`.
hmac = { workspace = true }
http = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
smallvec = { workspace = true }
subtle = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
trybuild = { workspace = true }
