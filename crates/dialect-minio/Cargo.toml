[package]
name = "rustfs-gateway-dialect-minio"
description = "Clean-room MinIO protocol dialect extensions for RustFS Gateway"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
autotests = false

[package.metadata.gateway]
ring = 1

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
# The replica write (`src/replication.rs`) is a dialect operation: its route row, spec and codec
# are core's dialect mechanism, its floor is the signature crate's, and its route predicate names
# an `http::Method`.
http = { workspace = true }
rustfs-gateway-core = { workspace = true }
rustfs-gateway-sig = { workspace = true }
rustfs-gateway-types = { workspace = true }
rustfs-gateway-xml = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
rustfs-gateway-http = { workspace = true }

[[test]]
name = "integration"
path = "tests/integration.rs"
