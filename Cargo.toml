[workspace]
resolver = "3"
members = ["crates/*", "spikes/ext-field", "xtask"]
default-members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
repository = "https://github.com/rustfs/gateway"
authors = ["RustFS Team"]

[workspace.dependencies]
# Internal crates. Path only: nothing here is published, so the version double-write
# that crates.io would require is just another thing to keep in sync.
rustfs-gateway = { path = "crates/gateway", version = "0.7.3" }
rustfs-gateway-codegen = { path = "crates/codegen", version = "0.2.1" }
rustfs-gateway-conformance = { path = "crates/conformance", version = "0.3.0" }
rustfs-gateway-core = { path = "crates/core", version = "0.4.0" }
rustfs-gateway-http = { path = "crates/http", version = "0.1.0" }
rustfs-gateway-macros = { path = "crates/macros", version = "0.1.0" }
rustfs-gateway-model = { path = "crates/model", version = "0.2.1" }
rustfs-gateway-sig = { path = "crates/sig", version = "0.5.3" }
rustfs-gateway-server = { path = "crates/server", version = "0.1.0" }
rustfs-gateway-stream = { path = "crates/stream", version = "0.1.0" }
rustfs-gateway-types = { path = "crates/types", version = "0.2.1" }
rustfs-gateway-xml = { path = "crates/xml", version = "0.1.0" }

# Third-party. Versions verified against crates.io on 2026-08-05; MSRV 1.97.1 constrains this set.
# `aws-sigv4` is deliberately absent: its server-side verification has measured defects; see
# docs/msrv.md and ADR-0001.
arc-swap = "1.8"
bitflags = "2.13"
bytes = "1.12"
command-group = "5.0.1"
# default-features off: the crate's default pulls in optional backends we do not use. Declared
# here rather than per-crate because a member cannot narrow features it inherits.
crc-fast = { version = "1.10", default-features = false, features = ["std"] }   # crc32 / crc32c / crc64nvme, SIMD
form_urlencoded = "1.2"
futures-core = "0.3"
futures-timer = "3.0"
hex = "0.4"
hmac = "0.13"
http = "1.5"
http-body = "1.1"                                   # the body trait every tower/hyper service is generic over
http-body-util = "0.1"                              # `Limited` and `collect`; the facade does not hand-roll a body reader
# default-features off: the facade only implements `hyper::service::Service`. It listens on
# nothing and speaks no protocol version itself, so http1/http2/client/server belong to P7-02.
hyper = { version = "1.11", default-features = false }
hyper-util = { version = "0.1.19", default-features = false }
# Build-time only: validates the frozen IR contract without network or file retrieval.
jsonschema = { version = "0.48.2", default-features = false }
md-5 = "0.11"                                       # entity tags, single-part and multipart alike
memchr = "2.8"
percent-encoding = "2.3"
pin-project-lite = "0.2"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
quick-xml = "0.41"                                  # never expands entities; DOCTYPE must be rejected by us
quote = "1.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal-hook = "0.4.4"
sha1 = "0.11"                                       # one of the five S3 checksum algorithms
sha2 = "0.11"
smallvec = "1.15"
socket2 = "0.6"
subtle = "2.6"                                      # constant-time comparison
syn = { version = "3.0", features = ["full", "extra-traits", "visit"] }
thiserror = "2.0"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
unicode-normalization = "0.1"
# default-features off: `tower::Service` and nothing else. The middleware stack is P6's and the
# server is P7-02's; pulling in the full `util` feature here would put layers on the facade's
# public surface before anything has decided what they are.
tower = { version = "0.5", default-features = false }
tower-http = { version = "0.6", default-features = false }
tracing = "0.1"
zeroize = { version = "1.9", features = ["zeroize_derive"] }

# Dev-only.
dhat = "0.3.3"
insta = "1.48"
prettyplease = "0.3"                                # renders the macro expansion goldens; no `cargo expand` needed
proptest = "1.11"
tokio = { version = "1.53", default-features = false, features = ["macros", "rt"] }
trybuild = "1.0"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
