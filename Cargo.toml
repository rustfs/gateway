[workspace]
resolver = "3"
members = ["compat/sut", "crates/*", "spikes/ext-field", "xtask", "xtask-launcher"]
default-members = ["crates/*", "xtask", "xtask-launcher"]

[workspace.package]
version = "0.1.4"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
repository = "https://github.com/rustfs/gateway"
authors = ["RustFS Team"]

[workspace.dependencies]
# Internal crates. Path only: nothing here is published, so the version double-write
# that crates.io would require is just another thing to keep in sync.
rustfs-gateway = { path = "crates/gateway", version = "0.51.0", default-features = false }
rustfs-gateway-codegen = { path = "crates/codegen", version = "0.18.0" }
rustfs-gateway-conformance = { path = "crates/conformance", version = "0.14.0", default-features = false }
rustfs-gateway-corpus = { path = "crates/corpus", version = "0.1.0" }
rustfs-gateway-corpus-recorder = { path = "crates/corpus-recorder", version = "0.1.0" }
rustfs-gateway-core = { path = "crates/core", version = "0.46.0" }
rustfs-gateway-http = { path = "crates/http", version = "0.1.4" }
rustfs-gateway-macros = { path = "crates/macros", version = "0.1.4" }
rustfs-gateway-model = { path = "crates/model", version = "0.14.0" }
rustfs-gateway-sig = { path = "crates/sig", version = "0.12.0" }
rustfs-gateway-server = { path = "crates/server", version = "0.3.0" }
rustfs-gateway-stream = { path = "crates/stream", version = "0.2.0" }
rustfs-gateway-types = { path = "crates/types", version = "0.29.0" }
rustfs-gateway-xml = { path = "crates/xml", version = "0.4.0" }

# Third-party. Versions verified against crates.io on 2026-08-05; MSRV 1.97.1 constrains this set.
# `aws-sigv4` is deliberately absent: its server-side verification has measured defects; see
# docs/msrv.md and ADR-0001.
arc-swap = "1.8"
bitflags = "2.13"
bytes = "1.12"
command-group = "5.0.1"
# default-features off: the crate's default pulls in optional backends we do not use. Declared
# here rather than per-crate because a member cannot narrow features it inherits.
crc-fast = { version = "1.10", default-features = false, features = ["std"] }   # crc32 / crc32c / crc64nvme, SIMD
form_urlencoded = "1.2"
futures-core = "0.3"
futures-timer = "3.0"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4"
hmac = "0.13"
http = "1.5"
http-body = "1.1"                                   # the body trait every tower/hyper service is generic over
http-body-util = "0.1"                              # `Limited` and `collect`; the facade does not hand-roll a body reader
httparse = "1.10"
# default-features off: the facade only implements `hyper::service::Service`. It listens on
# nothing and speaks no protocol version itself, so http1/http2/client/server belong to P7-02.
hyper = { version = "1.11", default-features = false }
hyper-util = { version = "0.1.19", default-features = false }
# Build-time only: validates the frozen IR contract without network or file retrieval.
jsonschema = { version = "0.48.2", default-features = false }
md-5 = "0.11"                                       # entity tags, single-part and multipart alike
memchr = "2.8"
nix = { version = "0.31", default-features = false, features = ["poll", "zerocopy"] }
percent-encoding = "2.3"
phf = { version = "0.14", features = ["macros"] }
pin-project-lite = "0.2"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
quick-xml = "0.41"                                  # never expands entities; DOCTYPE must be rejected by us
quote = "1.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal-hook = "0.4.4"
sha1 = "0.11"                                       # one of the ten S3 checksum algorithms
sha2 = "0.11"
smallvec = "1.15"
socket2 = "0.6"
subtle = "2.6"                                      # constant-time comparison
syn = { version = "3.0", features = ["full", "extra-traits", "visit"] }
thiserror = "2.0"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
unicode-normalization = "0.1"
# default-features off: `tower::Service` and nothing else. The middleware stack is P6's and the
# server is P7-02's; pulling in the full `util` feature here would put layers on the facade's
# public surface before anything has decided what they are.
tower = { version = "0.5", default-features = false }
tower-http = { version = "0.6", default-features = false }
tracing = "0.1"
# MIT. The three S3 XXHash checksum algorithms (XXH64, XXH3-64, XXH3-128); `alloc` is what the XXH3
# streaming constructors need, and nothing else is enabled.
twox-hash = { version = "2.1", default-features = false, features = ["alloc", "xxhash64", "xxhash3_64", "xxhash3_128"] }
zeroize = { version = "1.9", features = ["zeroize_derive"] }

# Dev-only.
dhat = "0.3.3"
insta = "1.48"
prettyplease = "0.3"                                # renders the macro expansion goldens; no `cargo expand` needed
proptest = "1.11"
tokio = { version = "1.53", default-features = false, features = ["macros", "rt"] }
trybuild = "1.0"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }

[workspace.lints.rust]
unsafe_code = "forbid"
# `gateway_tsan` is set only by scripts/run_gateway_tsan.sh: it compiles the gateway test binary's
# `dhat::Alloc` global allocator out, so ThreadSanitizer observes the system allocator (#958).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(gateway_tsan)"] }
missing_docs = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Development and test builds keep line tables for the workspace's own crates — enough for a
# panic location and a readable backtrace — and no debug information for dependencies, whose
# frames nobody in this repository steps into. Cold bootstrap (`cargo test --workspace --no-run`
# on a two-core runner) spent 421 CPU-seconds with full debug info and 19% less without it, and
# the target directory shrinks with it (rustfs/gateway#423, rustfs/gateway#464). No check is
# removed or sampled: every test still compiles and runs, with the same code.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# The persistence goldens hash and parse their whole corpus in every report, and the corpus
# report runs once per CLI contract. Unoptimized, `sha2`'s compression loop — still carrying its
# `ub_checks` preconditions — plus `serde_json`'s and `memchr`'s scanners were the top of the
# profile: `corpus-report` spent 2.9 CPU-seconds, the goldens library suite 39. Optimizing these
# three crates alone cut that to 1.6 and 32 and costs about a second of cold build. Every test
# still compiles and runs the same assertions (rustfs/gateway#897).
[profile.dev.package.sha2]
opt-level = 3
debug-assertions = false

[profile.dev.package.serde_json]
opt-level = 3
debug-assertions = false

[profile.dev.package.memchr]
opt-level = 3
debug-assertions = false

[profile.release]
lto = true
codegen-units = 1
strip = true
